name: "Phase Lattice Valley Separator"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Isolated Field", slot: 0, required: true }

parameters:
  - name: lobe_scale
    display: "Live Aperture Scale"
    type: float
    min: 0.22
    max: 0.92
    default: 0.58
    group: "Geometry"

  - name: valley_gate
    display: "Valley Selectivity"
    type: float
    min: 0.0
    max: 0.88
    default: 0.46
    group: "Separation"

  - name: valley_sharpness
    display: "Valley Focus"
    type: float
    min: 0.6
    max: 4.0
    default: 1.45
    group: "Separation"

  - name: valley_depth
    display: "Valley Depth"
    type: float
    min: 0.0
    max: 1.0
    default: 0.74
    group: "Separation"

  - name: inner_radius
    display: "Nucleus Clearance"
    type: float
    min: 0.06
    max: 0.24
    default: 0.115
    group: "Extent"

  - name: valley_reach
    display: "Valley Reach"
    type: float
    min: -0.06
    max: 0.14
    default: 0.038
    group: "Extent"

  - name: edge_feather
    display: "Cut Transition"
    type: float
    min: 0.004
    max: 0.08
    default: 0.024
    group: "Extent"

  - name: preserve_warm
    display: "Warm Preservation"
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Discipline"

  - name: separator_core
    display: "Separation Center"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Placement"

passes:
  - name: separate_valleys
    shader: separate.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
