name: "07 / SIGNAL CUT FEATURE CONSOLE"
version: "3.0"
mode: filter
resolution: [1280, 720]

panel:
  mode: canvas
  output: UI
  resolution: follow_panel

inputs:
  - { name: "Instrument Program", slot: 0, required: true }

parameters:
  - { name: network_tension, display: "Network Tension", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Performance" }
  - { name: ascii_density, display: "ASCII Density", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Performance" }
  - { name: ascii_mode, display: "ASCII / Vector Mode", type: bool, default: true, group: "Performance" }

viewport:
  hint: "Passive live feature analysis. The strongest real corner is selected automatically."
  # ui-label: title = SIGNAL CUT / FEATURE ANALYSIS
  # ui-label: analysis = FEATURE ANALYSIS
  # ui-label: tension = NETWORK TENSION
  # ui-label: density = ASCII CELL DENSITY
  # ui-label: mode = ASCII / VECTOR MODE
  # ui-label: ascii_on = ASCII LENS ON
  # ui-label: vector = VECTOR ONLY
  # ui-label: auto = STRONGEST RESPONSE SELECTED AUTOMATICALLY
  # ui-label: direct = R / X / Y VALUES COME FROM THE LIVE CORNER BUFFER
  controls:
    - { id: tension, kind: slider, param: network_tension, rect: [0.653, 0.290, 0.928, 0.360], label: "Network Tension" }
    - { id: density, kind: slider, param: ascii_density, rect: [0.653, 0.462, 0.928, 0.532], label: "ASCII Density" }
    - { id: mode, kind: toggle, param: ascii_mode, rect: [0.653, 0.634, 0.928, 0.704], label: "ASCII Mode" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "UI", pass: render }
