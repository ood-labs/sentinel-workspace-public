name: "HUD Panels"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }
  - { name: body_color, display: "Body Color", type: color, default: [0.32, 0.80, 0.62], group: "Color" }
  - { name: core_color, display: "Core Color", type: color, default: [0.70, 1.0, 0.85], group: "Color" }

passes:
  - { name: panels, shader: panels.hlsl, target: cs_5_0 }

outputs:
  - { name: "Panels", pass: panels }
