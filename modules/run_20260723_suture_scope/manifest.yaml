name: "Run 20260723 Suture Scope"
version: "1.0"
mode: filter

inputs:
  - { name: "Indexed Program", slot: 0 }

buffers:
  - name: suture_records
    structured: true
    element_size: 16
    element_count: 12

data_outputs:
  - name: "Suture Records"
    buffer: suture_records
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: strength, type: float }
      - { name: polarity, type: float }

parameters:
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.08, group: "Performance" }
  - { name: energy, display: "Energy", type: float, min: 0.0, max: 1.0, default: 0.5, group: "Performance" }
  - { name: render_mode, display: "Suture Form", type: enum, default: 0, options: [Suture, Needles, Constellation], flags: button_grid, group: "Structure" }
  - { name: scan_count, display: "Anchor Count", type: int, min: 4, max: 12, default: 7, group: "Structure" }
  - { name: scan_center, display: "Analysis Center", type: point2D, min: [0.25, 0.2], max: [0.75, 0.8], default: [0.53, 0.51], group: "Structure" }
  - { name: scan_span, display: "Analysis Span", type: point2D, min: [0.2, 0.2], max: [0.7, 0.85], default: [0.46, 0.60], group: "Structure" }
  - { name: roam, display: "Probe Roam", type: float, min: 0.0, max: 1.0, default: 0.50, group: "Analysis" }
  - { name: edge_floor, display: "Edge Floor", type: float, min: 0.0, max: 0.35, default: 0.05, group: "Analysis" }
  - { name: signal_gain, display: "Signal Gain", type: float, min: 0.5, max: 12.0, default: 7.0, group: "Analysis" }
  - { name: anchor_sharpness, display: "Anchor Sharpness", type: float, min: 0.5, max: 5.0, default: 2.6, group: "Analysis" }
  - { name: record_threshold, display: "Record Threshold", type: float, min: 0.0, max: 0.4, default: 0.04, group: "Render" }
  - { name: scope_mix, display: "Scope Mix", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Render" }
  - { name: path_width, display: "Path Width", type: float, min: 0.5, max: 5.0, default: 1.65, group: "Render" }
  - { name: marker_radius, display: "Marker Radius", type: float, min: 2.0, max: 14.0, default: 6.5, group: "Render" }
  - { name: wire_weight, display: "Wire Weight", type: float, min: 0.0, max: 1.0, default: 0.55, group: "Render" }
  - { name: marker_weight, display: "Marker Weight", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Render" }
  - { name: accent_weight, display: "Signal Accent", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Render" }
  - { name: wire_color, display: "Wire", type: color, default: [0.72, 0.74, 0.70], group: "Palette" }
  - { name: accent_color, display: "Live Signal", type: color, default: [1.0, 0.12, 0.01], group: "Palette" }

passes:
  - name: analyze
    shader: suture_analyze.hlsl
    target: cs_5_0
    dispatch: [12, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "input:0" }
    output: "buffer:suture_records"

  - name: render
    shader: suture_render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:suture_records" }
    output: output
