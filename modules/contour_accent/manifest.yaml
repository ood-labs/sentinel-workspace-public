name: "Contour Accent"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Field", slot: 0, required: true }

parameters:
  - name: accent_mode
    display: "Accent Mode"
    type: enum
    options: [Band, EveryN, Region, Ridge]
    default: 0
    flags: button_grid
    group: "Accent"
  - { name: line_count, display: "Line Count", type: float, min: 4.0, max: 120.0, default: 52.0, group: "Accent" }
  - { name: accent_level, display: "Accent Level", type: float, min: 0.0, max: 1.0, default: 0.6, group: "Accent" }
  - { name: band_width, display: "Band Width", type: float, min: 0.01, max: 0.4, default: 0.09, group: "Accent" }
  - { name: accent_count, display: "Every Nth", type: int, min: 2, max: 16, default: 6, group: "Accent" }
  - { name: line_width, display: "Line Width", type: float, min: 0.002, max: 0.06, default: 0.015, group: "Accent" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 3.0, default: 1.2, group: "Output" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.4, group: "Output" }
  - { name: index_ticks, display: "Index Ticks", type: bool, default: false, flags: button, group: "Output" }
  - { name: phase_speed, display: "Phase Speed", type: float, min: -2.0, max: 2.0, default: 0.03, group: "Motion" }
  - { name: accent_color, display: "Accent Color", type: color, default: [1.0, 0.5, 0.16], group: "Color" }

passes:
  - { name: accent, shader: accent.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "input:0" } ] }

outputs:
  - { name: "Accent Contours", pass: accent }
