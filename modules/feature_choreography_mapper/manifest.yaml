name: "04 / FLUID REGION CHOREOGRAPHY"
version: "2.0"
mode: generator
resolution: [640, 360]

viewport:
  hint: "Live blob centroids, area-weighted site rings, and stable region directions"
  interactions: [mouse]

data_inputs:
  - name: "Blobs 480×270"
    slot: 0
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

buffers:
  - name: glyph_records
    structured: true
    element_size: 32
    element_count: 64
  - name: previous_glyphs
    structured: true
    element_size: 32
    element_count: 64
    persistent: true

parameters:
  - { name: tracking_response, display: "Tracking Response", type: float, min: 1.0, max: 24.0, default: 7.0, group: "Stabilization" }
  - { name: match_radius, display: "Identity Match Radius", type: float, min: 0.03, max: 0.6, default: 0.24, group: "Stabilization" }
  - { name: attack_rate, display: "Region Attack", type: float, min: 0.5, max: 12.0, default: 4.0, group: "Stabilization" }
  - { name: release_rate, display: "Region Release", type: float, min: 0.2, max: 8.0, default: 1.35, group: "Stabilization" }
  - { name: blob_area_gain, display: "Area Response", type: float, min: 0.5, max: 8.0, default: 3.2, group: "Mapping" }
  - { name: radial_twist, display: "Radial ↔ Tangent", type: float, min: -1.0, max: 1.0, default: 0.35, group: "Mapping" }
  - { name: shape_direction, display: "Shape Direction Mix", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Mapping" }
  - { name: group_count, display: "Region Groups", type: int, min: 2, max: 8, default: 4, group: "Mapping" }
  - { name: composition_bias, display: "Composition Bias", type: point2D, min: [-0.2, -0.2], max: [0.2, 0.2], default: [0.0, 0.0], group: "Mapping" }
  - { name: blob_ink, display: "Region Ink", type: color, default: [0.92, 0.92, 0.90], group: "Preview" }
  - { name: marker_size, display: "Site Ring Size", type: float, min: 2.0, max: 22.0, default: 7.5, group: "Preview" }
  - { name: direction_gain, display: "Direction Visibility", type: float, min: 0.0, max: 2.5, default: 1.25, group: "Preview" }
  - { name: preview_exposure, display: "Preview Exposure", type: float, min: 0.4, max: 3.0, default: 1.0, group: "Preview" }

passes:
  - name: map_features
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "buffer:previous_glyphs" }
    output: "buffer:glyph_records"

  - name: commit_tracks
    shader: commit.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:glyph_records" }
    output: "buffer:previous_glyphs"

  - name: record_preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:glyph_records" }
    output: output

data_outputs:
  - name: "Feature Glyphs"
    buffer: "glyph_records"
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: weight, type: float }
      - { name: kind, type: float }
      - { name: group_id, type: float }
      - { name: active, type: float }

outputs:
  - { name: "Region Map", pass: record_preview }
