name: "Phase Lattice Asymmetric Mount"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Depth Specimen", slot: 0, required: true }

parameters:
  - name: main_center
    display: "Specimen Center"
    type: point2D
    min: [0.38, 0.38]
    max: [0.72, 0.62]
    default: [0.60, 0.50]
    group: "Asymmetric Mount"

  - name: main_scale
    display: "Specimen Scale"
    type: float
    min: 0.62
    max: 1.25
    default: 1.10
    group: "Asymmetric Mount"

passes:
  - name: compose_plate
    shader: plate.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
