name: "Industrial Greeble Pack"
version: "1.0"
mode: generator
resolution: [512, 256]
working_format: RGBA8

data_inputs:
  - name: "Greebles A"
    slot: 0
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: size, type: float3 }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
  - name: "Greebles B"
    slot: 1
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: size, type: float3 }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
  - name: "Greebles C"
    slot: 2
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: size, type: float3 }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
  - name: "Greebles D"
    slot: 3
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: size, type: float3 }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }

buffers:
  - name: packed
    structured: true
    element_size: 80
    element_count: 4096

parameters:
  - { name: max_greebles, display: "Max Greebles", type: int, min: 0, max: 4096, default: 0, group: "Pack" }
  - { name: debug_greeble_kind, display: "Debug Kind", type: int, min: -1, max: 16, default: -1, group: "Debug" }
  - { name: enable_bolts, display: "Bolts", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_panels, display: "Panels/Ribs", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_conduit, display: "Conduit/Clamps", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_welds, display: "Welds", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_stains, display: "Stains", type: bool, default: true, flags: button, group: "Enable" }
  - { name: preview_scale, display: "Preview Scale", type: float, min: 0.01, max: 0.25, default: 0.06, group: "Preview" }
  - { name: preview_offset, display: "Preview Offset", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.0, 0.0], group: "Preview" }

passes:
  - name: compute
    shader: pack.hlsl
    target: cs_5_0
    dispatch: [64, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:packed"
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "data:2" }
      - { slot: 3, source: "data:3" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:packed" }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Greebles"
    buffer: "packed"
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: size, type: float3 }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
