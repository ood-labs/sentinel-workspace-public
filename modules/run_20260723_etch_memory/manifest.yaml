name: "Run 20260723 Etch Memory"
version: "1.0"
mode: filter

inputs:
  - { name: "Current Plate", slot: 0 }

buffers:
  - name: memory
    format: RGBA16F
    scale: 1.0
    persistent: true

parameters:
  - { name: scan_phase, display: "Scan Phase", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Performance" }
  - { name: clear_memory, display: "Clear / Re-seed", type: bool, default: false, flags: button, group: "Performance" }
  - { name: memory_decay, display: "Memory Decay", type: float, min: 0.75, max: 0.999, default: 0.965, group: "Memory" }
  - { name: injection, display: "Present Injection", type: float, min: 0.05, max: 1.0, default: 0.78, group: "Memory" }
  - { name: additive_memory, display: "Additive Memory", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Memory" }
  - { name: etch_threshold, display: "Etch Threshold", type: float, min: 0.0, max: 1.0, default: 0.31, group: "Memory" }
  - { name: present_floor, display: "Present Floor", type: float, min: 0.0, max: 1.0, default: 0.34, group: "Memory" }
  - { name: rotational_drag, display: "Rotational Drag", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Transport" }
  - { name: directional_drag, display: "Directional Drag", type: float, min: 0.0, max: 1.0, default: 0.64, group: "Transport" }
  - { name: memory_anchor, display: "Memory Anchor", type: point2D, min: [0.1, 0.1], max: [0.9, 0.9], default: [0.5, 0.5], group: "Transport" }
  - { name: scan_density, display: "Scan Density", type: float, min: 2.0, max: 36.0, default: 17.0, group: "Scan" }
  - { name: scan_depth, display: "Scan Depth", type: float, min: 0.0, max: 0.4, default: 0.08, group: "Scan" }
  - { name: tone_steps, display: "Tone Steps", type: int, min: 2, max: 12, default: 6, group: "Print" }
  - { name: monochrome_pull, display: "Monochrome Pull", type: float, min: 0.0, max: 1.0, default: 0.38, group: "Print" }
  - { name: accent_persistence, display: "Accent Persistence", type: float, min: 0.0, max: 1.0, default: 0.76, group: "Print" }
  - { name: accent_recovery, display: "Accent Recovery", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Print" }
  - { name: phase_marker, display: "Phase Marker", type: float, min: 0.0, max: 1.0, default: 0.54, group: "Print" }
  - { name: border_weight, display: "Border Weight", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Print" }
  - { name: paper_tint, display: "Paper", type: color, default: [0.91, 0.92, 0.88], group: "Palette" }
  - { name: accent_memory_color, display: "Memory Accent", type: color, default: [1.0, 0.12, 0.01], group: "Palette" }
  - { name: accent_color, display: "Recovered Accent", type: color, default: [1.0, 0.21, 0.025], group: "Palette" }

passes:
  - name: accumulate
    shader: etch_accumulate.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:memory" }
    output: "buffer:memory"

  - name: present
    shader: etch_present.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:memory" }
    output: output
