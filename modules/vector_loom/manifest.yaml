name: "Vector Loom"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Program", slot: 0, required: true }

data_inputs:
  - name: "Lines"
    slot: 0
    schema:
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: angle, type: float }
      - { name: length, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

parameters:
  - { name: substrate_gain, display: "Substrate", group: "Composition", type: float, min: 0.0, max: 0.6, default: 0.12 }
  - { name: beam_width, display: "Beam Width", group: "Geometry", type: float, min: 0.4, max: 4.0, default: 1.15 }
  - { name: extension, display: "Beam Extension", group: "Geometry", type: float, min: 0.0, max: 1.0, default: 0.78 }
  - { name: dash_density, display: "Dash Density", group: "Geometry", type: float, min: 2.0, max: 28.0, default: 12.0 }
  - { name: tension_gain, display: "Tension Gain", group: "Balance", type: float, min: 0.1, max: 2.0, default: 0.82 }
  - { name: void_cut, display: "Intersection Void", group: "Balance", type: float, min: 0.0, max: 1.0, default: 0.55 }
  - { name: signal_gain, display: "Signal Gain", group: "Signal", type: float, min: 0.0, max: 2.0, default: 1.0 }
  - { name: warm_signal, display: "Warm Signal", group: "Signal", type: color, default: [1.0, 0.16, 0.02] }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: output

outputs:
  - { name: "Loom", pass: render }
