name: "Impossible Debris Weather"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Corridor Program", slot: 0, required: true }

parameters:
  - { name: storm_mix, display: "Storm Mix", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Weather" }
  - { name: storm_phase, display: "Storm Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: fall_speed, display: "Fall Speed", type: float, min: -2.0, max: 2.0, default: 0.64, group: "Motion" }
  - { name: wind, display: "Wind", type: float, min: -1.0, max: 1.0, default: 0.18, group: "Motion" }
  - { name: shard_density, display: "Shard Density", type: float, min: 4.0, max: 40.0, default: 20.0, group: "Weather" }
  - { name: shard_length, display: "Shard Length", type: float, min: 0.004, max: 0.12, default: 0.032, group: "Weather" }
  - { name: vapor_gain, display: "Vapor Gain", type: float, min: 0.0, max: 1.2, default: 0.46, group: "Atmosphere" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002,0.004,0.008], group: "Atmosphere" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.96,0.24,0.035], group: "Atmosphere" }

passes:
  - name: weather
    shader: weather.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Weather Program", pass: weather }
