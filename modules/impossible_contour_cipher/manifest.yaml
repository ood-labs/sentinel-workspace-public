name: "Impossible Contour Cipher"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Ruptured Program", slot: 0, required: true }

parameters:
  - { name: cipher_mix, display: "Cipher Mix", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Cipher" }
  - { name: cipher_phase, display: "Cipher Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: cipher_rate, display: "Cipher Rate", type: float, min: -2.0, max: 2.0, default: 0.30, group: "Motion" }
  - { name: contour_steps, display: "Contour Steps", type: float, min: 3.0, max: 12.0, default: 7.0, group: "Cipher" }
  - { name: contour_gain, display: "Contour Gain", type: float, min: 0.0, max: 1.5, default: 0.92, group: "Ink" }
  - { name: cell_scale, display: "Cell Scale", type: float, min: 3.0, max: 22.0, default: 9.0, group: "Cipher" }
  - { name: scan_angle, display: "Scan Angle", type: float, min: -1.0, max: 1.0, default: 0.34, group: "Motion" }
  - { name: paper_color, display: "Paper Color", type: color, default: [0.80,0.80,0.74], group: "Ink" }
  - { name: cipher_color, display: "Cipher Color", type: color, default: [0.12,0.14,0.16], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.92,0.12,0.03], group: "Ink" }

passes:
  - name: contour_cipher
    shader: contour_cipher.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Cipher Program", pass: contour_cipher }
