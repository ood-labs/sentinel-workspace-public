name: "Impossible Mirror Array"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Tunnel Program", slot: 0, required: true }
parameters:
  - { name: array_mix, display: "Array Mix", type: float, min: 0, max: 1, default: 0.82, group: "Array" }
  - { name: array_phase, display: "Array Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: spin_speed, display: "Spin Speed", type: float, min: -2, max: 2, default: 0.36, group: "Motion" }
  - { name: sector_count, display: "Sector Count", type: float, min: 3, max: 12, default: 7, group: "Array" }
  - { name: radius, display: "Mirror Radius", type: float, min: 0.12, max: 0.7, default: 0.42, group: "Array" }
  - { name: seam_gain, display: "Seam Gain", type: float, min: 0, max: 1.5, default: 0.7, group: "Structure" }
  - { name: occlusion, display: "Core Occlusion", type: float, min: 0, max: 0.5, default: 0.12, group: "Structure" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002, 0.002, 0.005], group: "Ink" }
  - { name: metal_color, display: "Metal Color", type: color, default: [0.62, 0.56, 0.46], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.10, 0.02], group: "Ink" }
passes:
  - name: array
    shader: array.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Array Program", pass: array }
