name: "Territory B - Relay Shutters"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_play, display: "Master Play", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Clock" }
  - { name: mechanism_family, display: "Mechanism Family", type: enum, default: 1, options: [Columns, Diagonal Relay, Radial Relay], flags: button_grid, group: "Structure" }
  - { name: cell_columns, display: "Cell Columns", type: int, min: 6, max: 28, default: 16, group: "Structure" }
  - { name: aperture, display: "Aperture", type: float, min: 0.05, max: 0.75, default: 0.56, group: "Structure" }
  - { name: wave_span, display: "Relay Span", type: float, min: 0.25, max: 1.8, default: 0.92, group: "Motion" }
  - { name: accent_gain, display: "Signal Accent", type: float, min: 0.0, max: 2.0, default: 1.1, group: "Rendering" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output
