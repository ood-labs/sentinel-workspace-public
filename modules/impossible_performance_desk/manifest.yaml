name: "Impossible Performance Desk"
version: "1.0"
mode: generator
resolution: [1280, 720]

panel:
  mode: canvas
  output: "Performance Desk"
  resolution: follow_panel

inputs:
  - { name: "Program Preview", slot: 0, required: true }

buffers:
  - { name: desk_state, structured: true, element_size: 32, element_count: 1 }

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, hidden: true, group: "Performance" }
  - { name: pressure, display: "Structural Pressure", type: float, min: 0.0, max: 1.0, default: 0.18, hidden: true, group: "Performance" }
  - { name: reindex_amount, display: "Re-index Amount", type: float, min: 0.0, max: 1.0, default: 0.0, hidden: true, group: "Performance" }
  - { name: strike, display: "Plate Strike", type: button, hidden: true, group: "Performance" }
  - { name: focus_pad, display: "Stage Focus", type: point2D, min: [0.0,0.0], max: [1.0,1.0], default: [0.57,0.46], hidden: true, group: "Performance" }
  - { name: rupture_pad, display: "Rupture Direction", type: point2D, min: [-1.0,-1.0], max: [1.0,1.0], default: [0.18,-0.12], hidden: true, group: "Performance" }

viewport:
  hint: "Shape focus and rupture spatially; ride pressure and re-index; strike the plate for a momentary print cut."
  # ui-label: title = INDEX OF IMPOSSIBLE ROOMS / PERFORMANCE DESK
  # ui-label: macros = LIVE STRUCTURAL MACROS
  # ui-label: program = ASPECT CORRECT PROGRAM MONITOR
  # ui-label: live = LIVE CONTROL BUS / FOCUS + RUPTURE + PRESSURE + REINDEX + STRIKE
  controls:
    - { id: phase, kind: slider, param: master_phase, rect: [0.055,0.205,0.295,0.270], label: "Shared Phase" }
    - { id: pressure, kind: slider, param: pressure, rect: [0.055,0.315,0.295,0.380], label: "Structural Pressure" }
    - { id: reindex, kind: slider, param: reindex_amount, rect: [0.055,0.425,0.295,0.490], label: "Kinetic Re-index" }
    - { id: strike, kind: button, param: strike, rect: [0.055,0.535,0.295,0.605], label: "Plate Strike" }
    - { id: focus, kind: xypad, param: focus_pad, rect: [0.055,0.675,0.168,0.890], label: "Stage Focus" }
    - { id: rupture, kind: xypad, param: rupture_pad, rect: [0.182,0.675,0.295,0.890], label: "Rupture Direction" }

passes:
  - { name: compute, shader: compute.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, output: "buffer:desk_state" }
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:desk_state" }
    output: output

outputs:
  - { name: "Performance Desk", pass: render }

control_outputs:
  - { name: focus_x, buffer: desk_state, element: 0, field_offset: 0, description: "Architectural focus X" }
  - { name: focus_y, buffer: desk_state, element: 0, field_offset: 4, description: "Architectural focus Y" }
  - { name: rupture_x, buffer: desk_state, element: 0, field_offset: 8, description: "Signed rupture X" }
  - { name: rupture_y, buffer: desk_state, element: 0, field_offset: 12, description: "Signed rupture Y" }
  - { name: pressure, buffer: desk_state, element: 0, field_offset: 16, description: "Structural pressure macro" }
  - { name: reindex, buffer: desk_state, element: 0, field_offset: 20, description: "Kinetic re-index macro" }
  - { name: phase, buffer: desk_state, element: 0, field_offset: 28, description: "Shared normalized phase" }
