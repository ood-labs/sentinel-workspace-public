name: "Territory 3 - Registry Towers"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: tower_scale, display: "Tower Scale", type: float, min: 0.45, max: 1.75, default: 1.0, group: "Structure" }
  - { name: slab_gap, display: "Slab Pitch", type: float, min: 0.10, max: 0.34, default: 0.18, group: "Structure" }
  - { name: accent, display: "Accent", type: color, default: [1.0, 0.18, 0.03], group: "Palette" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output
