name: "Forensic Analysis Proxy"
version: "1.0"
mode: generator
resolution: [480, 270]

inputs:
  - { name: "Specimen", slot: 0, required: true }

viewport:
  hint: "480x270 Features proxy. Every downstream feature coordinate is normalized against this exact extent."

parameters:
  - { name: analysis_gain, display: "Analysis Gain", type: float, min: 0.5, max: 3.0, default: 1.25, group: "Signal" }
  - { name: black_point, display: "Black Point", type: float, min: 0.0, max: 0.4, default: 0.035, group: "Signal" }
  - { name: detail_gain, display: "Detail Gain", type: float, min: 0.0, max: 8.0, default: 3.2, group: "Signal" }
  - { name: detail_mix, display: "Detail Mix", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Signal" }
  - { name: posterize_steps, display: "Luma Bands", type: float, min: 2.0, max: 12.0, default: 5.0, group: "Discipline" }
  - { name: binary_threshold, display: "Binary Threshold", type: float, min: 0.05, max: 0.95, default: 0.34, group: "Discipline" }
  - { name: binary_softness, display: "Binary Softness", type: float, min: 0.001, max: 0.2, default: 0.035, group: "Discipline" }
  - { name: binary_mix, display: "Binary Mix", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Discipline" }
  - { name: preserve_current, display: "Preserve Current", type: float, min: 0.0, max: 1.0, default: 0.65, group: "Discipline" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Analysis Image", pass: render }
