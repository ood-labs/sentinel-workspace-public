name: "Impossible Halftone Cells"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Barcode Program", slot: 0, required: true }

parameters:
  - { name: halftone_mix, display: "Halftone Mix", type: float, min: 0.0, max: 1.0, default: 0.84, group: "Cells" }
  - { name: halftone_phase, display: "Halftone Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: pulse_speed, display: "Pulse Speed", type: float, min: -2.0, max: 2.0, default: 0.48, group: "Motion" }
  - { name: grid_x, display: "Grid X", type: float, min: 18.0, max: 120.0, default: 58.0, group: "Cells" }
  - { name: grid_y, display: "Grid Y", type: float, min: 12.0, max: 80.0, default: 34.0, group: "Cells" }
  - { name: dot_scale, display: "Dot Scale", type: float, min: 0.08, max: 0.95, default: 0.58, group: "Cells" }
  - { name: cell_shear, display: "Cell Shear", type: float, min: -0.4, max: 0.4, default: 0.08, group: "Cells" }
  - { name: scan_gain, display: "Scan Gain", type: float, min: 0.0, max: 1.2, default: 0.52, group: "Instrument" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.003,0.004,0.007], group: "Ink" }
  - { name: dot_color, display: "Dot Color", type: color, default: [0.76,0.69,0.58], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98,0.18,0.025], group: "Ink" }

passes:
  - name: halftone
    shader: halftone.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Halftone Program", pass: halftone }
