name: "Discovery Master Clock"
version: "1.0"
mode: generator
resolution: [1000, 420]

panel:
  mode: canvas
  output: UI
  resolution: follow_panel

parameters:
  - { name: play, display: "Play", type: bool, default: true, flags: button, group: "Transport" }
  - { name: rate, display: "Rate (cycles/sec)", type: float, min: 0.01, max: 1.5, default: 0.18, group: "Transport" }
  - { name: reset_transport, display: "Reset", type: button, group: "Transport" }
  - { name: scrub_mode, display: "Scrub Mode", type: bool, default: false, flags: button, group: "Comparison" }
  - { name: scrub_position, display: "Scrub Position", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Comparison" }

buffers:
  - name: clock_state
    structured: true
    element_size: 36
    element_count: 1
    persistent: true

state_buffers:
  - name: clock_state
    max_elements: 1
    schema:
      - { name: phase01, type: float }
      - { name: phase_unwrapped, type: float }
      - { name: transport_seconds, type: float }
      - { name: envelope, type: float }
      - { name: pulse, type: float }
      - { name: tri_wave, type: float }
      - { name: play_gate, type: float }
      - { name: scrub_gate, type: float }
      - { name: reset_latch, type: float }

# ui-label: title = DISCOVERY MASTER CLOCK
# ui-label: subtitle = INTEGRATED PHASE / ENVELOPE AUTHORITY
viewport:
  hint: "Play is free-running by default. Enable Scrub Mode for deterministic comparisons."
  controls:
    - { id: play, kind: toggle, param: play, rect: [0.055, 0.82, 0.205, 0.925], label: "PLAY" }
    - { id: reset_transport, kind: button, param: reset_transport, rect: [0.225, 0.82, 0.375, 0.925], label: "RESET" }
    - { id: scrub_mode, kind: toggle, param: scrub_mode, rect: [0.395, 0.82, 0.585, 0.925], label: "SCRUB" }
    - { id: scrub_position, kind: slider, param: scrub_position, rect: [0.605, 0.82, 0.945, 0.925], label: "POSITION" }
passes:
  - name: integrate
    shader: integrate.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:clock_state"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:clock_state" }

outputs:
  - { name: UI, pass: render }

control_outputs:
  - { name: phase01, buffer: clock_state, element: 0, field_offset: 0, description: "Integrated master phase, wrapped 0-1" }
  - { name: phase_unwrapped, buffer: clock_state, element: 0, field_offset: 4, description: "Persistent integrated phase" }
  - { name: transport_seconds, buffer: clock_state, element: 0, field_offset: 8, description: "Integrated transport seconds" }
  - { name: envelope, buffer: clock_state, element: 0, field_offset: 12, description: "Master asymmetric envelope" }
  - { name: pulse, buffer: clock_state, element: 0, field_offset: 16, description: "Quarter-cycle master pulse" }
  - { name: tri_wave, buffer: clock_state, element: 0, field_offset: 20, description: "Master triangle waveform" }
  - { name: play_gate, buffer: clock_state, element: 0, field_offset: 24, description: "1 while free-running playback is active" }
  - { name: scrub_gate, buffer: clock_state, element: 0, field_offset: 28, description: "1 while deterministic scrub mode is active" }
