name: "KidPix UI"
version: "0.1"
mode: generator
resolution: [1200, 960]

# Static Kid Pix window chrome (procedural stylized): top menu bar + crown + File/Edit/Goodies,
# left tool palette icon grid, bottom rainbow color strip + pattern swatches, window border.
# Premultiplied RGBA, drawn last over the canvas.

parameters:
  - { name: intensity,       display: "Intensity",     type: float, min: 0.0, max: 1.5, default: 1.0, group: "Look" }
  - { name: menu_text_scale, display: "Menu Text Scale", type: float, min: 1.0, max: 6.0, default: 3.0, group: "Look" }

passes:
  - name: ui
    shader: ui.hlsl
    target: cs_5_0

outputs:
  - { name: "UI", pass: ui }
