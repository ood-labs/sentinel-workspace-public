name: "Impossible Shutter Gate"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Counterfield Program", slot: 0, required: true }

parameters:
  - { name: gate_mix, display: "Gate Mix", type: float, min: 0.0, max: 1.0, default: 0.34, group: "Gate" }
  - { name: gate_angle, display: "Gate Angle", type: float, min: -1.0, max: 1.0, default: 0.24, group: "Gate" }
  - { name: gate_offset, display: "Gate Offset", type: float, min: -1.0, max: 1.0, default: 0.08, group: "Gate" }
  - { name: gate_width, display: "Gate Width", type: float, min: 0.02, max: 0.5, default: 0.16, group: "Gate" }
  - { name: gate_phase, display: "Gate Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: gate_rate, display: "Gate Rate", type: float, min: -2.0, max: 2.0, default: 0.52, group: "Motion" }
  - { name: slat_depth, display: "Slat Depth", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Motion" }
  - { name: seam_gain, display: "Seam Gain", type: float, min: 0.0, max: 1.5, default: 0.84, group: "Ink" }
  - { name: slit_color, display: "Slit Color", type: color, default: [0.02,0.025,0.03], group: "Ink" }
  - { name: seam_color, display: "Seam Color", type: color, default: [0.96,0.06,0.02], group: "Ink" }

passes:
  - name: shutter
    shader: shutter.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Shutter Program", pass: shutter }
