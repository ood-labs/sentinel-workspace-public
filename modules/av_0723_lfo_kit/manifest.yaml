name: "AV 0723 LFO Kit"
version: "1.0"
mode: generator
resolution: [960, 540]

panel:
  mode: canvas
  output: UI
  resolution: follow_panel

parameters:
  - { name: transport_run, type: bool, default: true, flags: button, group: "Transport" }
  - { name: reset_phase, type: button, group: "Transport" }
  - { name: scrub_phase, type: float, min: 0.0, max: 1.0, default: 0.0, group: "Transport" }
  - { name: period_seconds, type: float, min: 1.0, max: 32.0, default: 8.0, group: "Timing" }
  - { name: pulse_width, type: float, min: 0.05, max: 0.95, default: 0.25, group: "Signal Shape" }
  - { name: accent_sharpness, type: float, min: 1.0, max: 16.0, default: 7.0, group: "Signal Shape" }

buffers:
  - { name: lfo_state, structured: true, element_size: 32, element_count: 1, persistent: true }

state_buffers:
  - name: lfo_state
    max_elements: 1
    schema:
      - { name: phase, type: float }
      - { name: sine, type: float }
      - { name: triangle_value, type: float }
      - { name: pulse, type: float }
      - { name: ramp, type: float }
      - { name: orbit_x, type: float }
      - { name: accent, type: float }
      - { name: last_scrub, type: float }

viewport:
  hint: "Run / hold, reset, or drag the phase rail"
  interactions: [mouse]
  controls:
    - { id: transport_run, kind: toggle, param: transport_run, rect: [0.045, 0.865, 0.125, 0.952], label: "Run" }
    - { id: reset_phase, kind: button, param: reset_phase, rect: [0.135, 0.865, 0.215, 0.952], label: "Reset" }
    - { id: scrub_phase, kind: slider, param: scrub_phase, rect: [0.245, 0.865, 0.945, 0.952], label: "Phase" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:lfo_state"

  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:lfo_state" }

outputs:
  - { name: UI, pass: display }

control_outputs:
  - { name: phase, buffer: lfo_state, element: 0, field_offset: 0, description: "Loop phase, 0..1" }
  - { name: sine, buffer: lfo_state, element: 0, field_offset: 4, description: "Sine, 0..1" }
  - { name: triangle, buffer: lfo_state, element: 0, field_offset: 8, description: "Triangle, 0..1" }
  - { name: pulse, buffer: lfo_state, element: 0, field_offset: 12, description: "Pulse, 0 or 1" }
  - { name: ramp, buffer: lfo_state, element: 0, field_offset: 16, description: "Ramp, 0..1" }
  - { name: orbit_x, buffer: lfo_state, element: 0, field_offset: 20, description: "Cosine quadrature, 0..1" }
  - { name: accent, buffer: lfo_state, element: 0, field_offset: 24, description: "Loop-safe sharp accent, 0..1" }
