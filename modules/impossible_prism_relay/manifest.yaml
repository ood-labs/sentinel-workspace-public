name: "Impossible Prism Relay"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Riser Program", slot: 0, required: true }

parameters:
  - { name: prism_mix, display: "Prism Mix", type: float, min: 0.0, max: 1.0, default: 0.46, group: "Prism" }
  - { name: prism_phase, display: "Prism Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: relay_rate, display: "Relay Rate", type: float, min: -2.0, max: 2.0, default: 0.38, group: "Motion" }
  - { name: slice_width, display: "Slice Width", type: float, min: 0.08, max: 0.42, default: 0.24, group: "Prism" }
  - { name: separation, display: "Depth Separation", type: float, min: 0.0, max: 0.42, default: 0.17, group: "Prism" }
  - { name: prism_tilt, display: "Prism Tilt", type: float, min: -1.0, max: 1.0, default: 0.22, group: "Prism" }
  - { name: seam_gain, display: "Seam Gain", type: float, min: 0.0, max: 1.5, default: 0.86, group: "Ink" }
  - { name: prism_color, display: "Prism Color", type: color, default: [0.12,0.85,0.60], group: "Ink" }
  - { name: seam_color, display: "Seam Color", type: color, default: [0.95,0.10,0.03], group: "Ink" }

passes:
  - name: prism
    shader: prism.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Prism Program", pass: prism }
