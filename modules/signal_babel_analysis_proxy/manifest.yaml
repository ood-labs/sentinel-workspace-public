name: "Signal Babel / Analysis Proxy"
version: "1.0"
mode: generator
resolution: [480, 270]

inputs:
  - { name: "Archive", slot: 0, required: true }

parameters:
  - { name: sample_radius, display: "Sample Radius", type: float, min: 0.5, max: 4.0, default: 1.25, group: "Analysis" }
  - { name: edge_gain, display: "Edge Gain", type: float, min: 0.2, max: 6.0, default: 2.1, group: "Analysis" }
  - { name: edge_mix, display: "Edge / Plate", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Analysis" }
  - { name: luma_low, display: "Luma Low", type: float, min: 0.0, max: 1.0, default: 0.20, group: "Analysis" }
  - { name: luma_high, display: "Luma High", type: float, min: 0.0, max: 1.0, default: 0.74, group: "Analysis" }
  - { name: analysis_gamma, display: "Analysis Gamma", type: float, min: 0.35, max: 2.5, default: 0.82, group: "Analysis" }
  - { name: grid_preview, display: "Grid Preview", type: float, min: 0.0, max: 0.5, default: 0.08, group: "Preview" }

passes:
  - name: proxy
    shader: proxy.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Analysis", pass: proxy }
