name: "Run 20260723 Void Gate"
version: "1.0"
mode: filter

inputs:
  - { name: "Program", slot: 0 }
  - { name: "Fault Mask", slot: 1 }

parameters:
  - { name: gate_phase, display: "Gate Phase", type: float, min: 0.0, max: 1.0, default: 0.23, group: "Performance" }
  - { name: aperture, display: "Aperture", type: float, min: 0.08, max: 0.8, default: 0.31, group: "Performance" }
  - { name: dislocation, display: "Dislocation", type: float, min: 0.0, max: 1.0, default: 0.54, group: "Performance" }
  - { name: slice_count, display: "Slice Count", type: int, min: 3, max: 24, default: 11, group: "Structure" }
  - { name: stagger, display: "Stagger", type: float, min: 0.0, max: 0.9, default: 0.36, group: "Structure" }
  - { name: gate_center, display: "Gate Center", type: point2D, min: [-0.4, -0.4], max: [0.4, 0.4], default: [0.04, 0.03], group: "Structure" }
  - { name: mirror_fragments, display: "Mirror Fragments", type: bool, default: true, flags: button, group: "Structure" }
  - { name: void_bias, display: "Mask Bias", type: float, min: 0.0, max: 1.0, default: 0.47, group: "Mask" }
  - { name: mask_pull, display: "Mask Pull", type: float, min: 0.0, max: 1.0, default: 0.76, group: "Mask" }
  - { name: mask_trace, display: "Mask Trace", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Mask" }
  - { name: edge_weight, display: "Gate Edge", type: float, min: 0.0, max: 1.0, default: 0.55, group: "Graphic" }
  - { name: accent_weight, display: "Accent Weight", type: float, min: 0.0, max: 1.0, default: 0.84, group: "Graphic" }
  - { name: rail_strength, display: "Registration Rail", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Graphic" }
  - { name: void_color, display: "Void", type: color, default: [0.002, 0.003, 0.004], group: "Palette" }
  - { name: rail_color, display: "Rail", type: color, default: [0.78, 0.8, 0.76], group: "Palette" }
  - { name: accent_color, display: "Cut Edge", type: color, default: [1.0, 0.17, 0.02], group: "Palette" }

passes:
  - name: compose
    shader: void_gate.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
    output: output
