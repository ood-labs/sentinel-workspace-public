name: "Run 20260723 Specimen Index"
version: "1.0"
mode: filter

inputs:
  - { name: "Memory Plate", slot: 0 }

parameters:
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.08, group: "Performance" }
  - { name: layout_mode, display: "Layout Family", type: enum, default: 1, options: [Archive, Monolith, Collision], flags: button_grid, group: "Structure" }
  - { name: separation, display: "Chamber Separation", type: float, min: 0.0, max: 1.0, default: 0.30, group: "Structure" }
  - { name: panel_zoom, display: "Specimen Scale", type: float, min: 0.7, max: 2.4, default: 1.18, group: "Structure" }
  - { name: focus, display: "Field Focus", type: point2D, min: [-0.25, -0.25], max: [0.25, 0.25], default: [0.0, 0.0], group: "Structure" }
  - { name: drift_amount, display: "Crop Drift", type: float, min: 0.0, max: 0.35, default: 0.11, group: "Structure" }
  - { name: grid_density, display: "Index Density", type: int, min: 4, max: 18, default: 8, group: "Index" }
  - { name: tone_steps, display: "Tone Steps", type: int, min: 2, max: 12, default: 5, group: "Index" }
  - { name: monochrome_pull, display: "Monochrome Pull", type: float, min: 0.0, max: 1.0, default: 0.70, group: "Index" }
  - { name: contour_threshold, display: "Contour Threshold", type: float, min: 0.01, max: 0.5, default: 0.19, group: "Contour" }
  - { name: contour_weight, display: "Contour Weight", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Contour" }
  - { name: ghost_mix, display: "Offset Echo", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Contour" }
  - { name: border_weight, display: "Registration Weight", type: float, min: 0.0, max: 1.0, default: 0.68, group: "Graphic" }
  - { name: accent_weight, display: "Warm Accent", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Graphic" }
  - { name: void_color, display: "Void", type: color, default: [0.002, 0.003, 0.004], group: "Palette" }
  - { name: paper_color, display: "Indexed Paper", type: color, default: [0.91, 0.92, 0.88], group: "Palette" }
  - { name: rail_color, display: "Registration", type: color, default: [0.48, 0.50, 0.47], group: "Palette" }
  - { name: accent_color, display: "Contour Accent", type: color, default: [1.0, 0.14, 0.01], group: "Palette" }

passes:
  - name: index
    shader: specimen_index.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
