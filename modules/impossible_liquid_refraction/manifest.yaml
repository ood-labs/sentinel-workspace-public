name: "Impossible Liquid Refraction"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Accordion Program", slot: 0, required: true }
parameters:
  - { name: refraction_mix, display: "Refraction Mix", type: float, min: 0, max: 1, default: 0.86, group: "Lens" }
  - { name: refraction_phase, display: "Refraction Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: ripple_speed, display: "Ripple Speed", type: float, min: -2, max: 2, default: 0.34, group: "Motion" }
  - { name: ripple_scale, display: "Ripple Scale", type: float, min: 2, max: 24, default: 9, group: "Lens" }
  - { name: distortion, display: "Distortion", type: float, min: 0, max: 0.35, default: 0.12, group: "Lens" }
  - { name: caustic_gain, display: "Caustic Gain", type: float, min: 0, max: 1.5, default: 0.74, group: "Structure" }
  - { name: droplet_scale, display: "Droplet Scale", type: float, min: 0.2, max: 2.0, default: 0.8, group: "Structure" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002, 0.003, 0.005], group: "Ink" }
  - { name: liquid_color, display: "Liquid Color", type: color, default: [0.56, 0.52, 0.46], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.14, 0.02], group: "Ink" }
passes:
  - name: refraction
    shader: refraction.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Refraction Program", pass: refraction }
