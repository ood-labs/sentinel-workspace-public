name: "Shard Aperture"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Lens Scene", slot: 0, required: true }

parameters:
  - { name: fold, display: "Angular Fold", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Aperture" }
  - { name: shards, display: "Shard Gain", type: float, min: 0.0, max: 1.5, default: 0.48, group: "Aperture" }
  - { name: rotation, display: "Aperture Rotation", type: float, min: -3.14, max: 3.14, default: 0.18, group: "Aperture" }
  - { name: seam, display: "Seam Width", type: float, min: 0.0, max: 0.25, default: 0.06, group: "Aperture" }
  - { name: drift, display: "Shard Drift", type: float, min: 0.0, max: 1.0, default: 0.08, group: "Motion" }
  - { name: edge_glint, display: "Edge Glint", type: float, min: 0.0, max: 1.0, default: 0.36, group: "Material" }
  - { name: output_mix, display: "Output Mix", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Output" }

passes:
  - name: fold
    shader: fold.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Shard Scene", pass: fold }
