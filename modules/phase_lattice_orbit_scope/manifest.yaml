name: "Phase Lattice Orbital Scope"
version: "1.0"
mode: filter
resolution_source: "match:input"

inputs:
  - { name: "Registered Specimen", slot: 0, required: true }

parameters:
  - name: scope_mix
    display: "Scope Mix"
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Orbital Scope"

  - name: strip_height
    display: "Scope Height"
    type: float
    min: 0.06
    max: 0.28
    default: 0.13
    group: "Orbital Scope"

  - name: sample_radius
    display: "Sample Radius"
    type: float
    min: 0.18
    max: 0.72
    default: 0.46
    group: "Sampling"

  - name: radial_span
    display: "Radial Span"
    type: float
    min: 0.02
    max: 0.30
    default: 0.11
    group: "Sampling"

  - name: angular_offset
    display: "Angular Offset"
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    group: "Sampling"

  - name: scope_gain
    display: "Scope Gain"
    type: float
    min: 0.25
    max: 2.4
    default: 1.1
    group: "Scope Styling"

  - name: division_count
    display: "Angular Divisions"
    type: float
    min: 4.0
    max: 36.0
    default: 16.0
    group: "Scope Styling"

  - name: separator_gain
    display: "Separator Gain"
    type: float
    min: 0.0
    max: 1.0
    default: 0.42
    group: "Scope Styling"

  - name: scope_core
    display: "Scope Core"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Placement"

passes:
  - name: orbital_scope
    shader: orbit_scope.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
