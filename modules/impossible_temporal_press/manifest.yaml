name: "Impossible Temporal Press"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Woven Program", slot: 0, required: true }

buffers:
  - { name: press_memory, format: RGBA16F, scale: 1.0, persistent: true }

parameters:
  - { name: press_phase, display: "Press Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Performance" }
  - { name: strike, display: "Plate Strike", type: float, min: 0.0, max: 1.0, default: 0.04, group: "Performance" }
  - { name: step_count, display: "Index Steps", type: float, min: 2.0, max: 32.0, default: 12.0, group: "Timing" }
  - { name: scan_position, display: "Scan Position", type: float, min: 0.0, max: 1.0, default: 0.48, group: "Timing" }
  - { name: scan_slope, display: "Scan Slope", type: float, min: -2.0, max: 2.0, default: 0.36, group: "Timing" }
  - { name: cut_width, display: "Cut Width", type: float, min: 0.005, max: 0.25, default: 0.075, group: "Misregistration" }
  - { name: cut_strength, display: "Cut Displacement", type: float, min: 0.0, max: 160.0, default: 38.0, group: "Misregistration" }
  - { name: channel_split, display: "Plate Separation", type: float, min: 0.0, max: 24.0, default: 0.65, group: "Misregistration" }
  - { name: memory_decay, display: "Print Memory", type: float, min: 0.0, max: 0.995, default: 0.22, group: "Memory" }
  - { name: memory_drift, display: "Memory Drift", type: float, min: 0.0, max: 12.0, default: 0.18, group: "Memory" }
  - { name: memory_cutout, display: "Memory Cutout", type: float, min: 0.0, max: 1.0, default: 0.76, group: "Memory" }
  - { name: ink_crush, display: "Ink Crush", type: float, min: 0.0, max: 2.0, default: 0.22, group: "Finish" }
  - { name: flash_gain, display: "Plate Flash", type: float, min: 0.0, max: 1.0, default: 0.24, group: "Finish" }
  - { name: press_contrast, display: "Press Contrast", type: float, min: 0.7, max: 1.6, default: 1.06, group: "Finish" }

passes:
  - name: press
    shader: press.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:press_memory" }
    output: "buffer:press_memory"
  - name: present
    shader: present.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "buffer:press_memory" }
    output: output

outputs:
  - { name: "Pressed Program", pass: present }
