name: "Impossible Hinge Fold"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Monolith Program", slot: 0, required: true }

parameters:
  - { name: hinge_mix, display: "Hinge Mix", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Hinge" }
  - { name: hinge_phase, display: "Hinge Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: hinge_rate, display: "Hinge Rate", type: float, min: -2.0, max: 2.0, default: 0.28, group: "Motion" }
  - { name: fold_angle, display: "Fold Angle", type: float, min: -1.0, max: 1.0, default: 0.40, group: "Hinge" }
  - { name: fold_amount, display: "Fold Amount", type: float, min: 0.0, max: 0.85, default: 0.46, group: "Hinge" }
  - { name: hinge_offset, display: "Hinge Offset", type: float, min: -0.30, max: 0.30, default: 0.04, group: "Motion" }
  - { name: crease_width, display: "Crease Width", type: float, min: 0.004, max: 0.08, default: 0.018, group: "Ink" }
  - { name: seam_gain, display: "Seam Gain", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Ink" }
  - { name: seam_color, display: "Seam Color", type: color, default: [0.94,0.80,0.58], group: "Ink" }
  - { name: shadow_color, display: "Shadow Color", type: color, default: [0.006,0.008,0.012], group: "Ink" }

passes:
  - name: hinge
    shader: hinge.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Hinged Program", pass: hinge }
