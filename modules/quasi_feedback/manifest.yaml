name: "Quasicrystal Spectral Memory"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
inputs:
  - { name: "Portal Scene", slot: 0, required: true }
buffers:
  - { name: trail, format: RGBA16F, scale: 1.0, persistent: true }
parameters:
  - { name: feedback_decay, display: "Memory", type: float, min: 0.0, max: 0.995, default: 0.86, group: "Feedback" }
  - { name: feedback_zoom, display: "Recursive Zoom", type: float, min: -3.0, max: 3.0, default: 0.55, group: "Feedback" }
  - { name: feedback_rotation, display: "Recursive Rotation", type: float, min: -3.0, max: 3.0, default: 0.35, group: "Feedback" }
  - { name: feedback_threshold, display: "Memory Gate", type: float, min: 0.0, max: 2.0, default: 0.42, group: "Feedback" }
  - { name: color_decay, display: "Spectral Decay", type: float, min: 0.0, max: 0.2, default: 0.028, group: "Feedback" }
  - { name: chroma, display: "Prismatic Split", type: float, min: 0.0, max: 3.0, default: 0.72, group: "Lens" }
  - { name: bloom_radius, display: "Bloom Radius", type: float, min: 0.0, max: 0.08, default: 0.018, group: "Lens" }
  - { name: bloom_threshold, display: "Bloom Threshold", type: float, min: 0.0, max: 2.0, default: 0.55, group: "Lens" }
  - { name: bloom_gain, display: "Bloom Gain", type: float, min: 0.0, max: 5.0, default: 0.68, group: "Lens" }
  - { name: exposure, display: "Exposure", type: float, min: 0.1, max: 4.0, default: 0.88, group: "Grade" }
  - { name: saturation, display: "Saturation", type: float, min: 0.0, max: 3.0, default: 1.3, group: "Grade" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 1.5, default: 0.62, group: "Grade" }
passes:
  - { name: feedback, shader: feedback.hlsl, target: cs_5_0, format: RGBA16F, inputs: [ { slot: 0, source: "input:0" }, { slot: 1, source: "buffer:trail" } ], output: "buffer:trail" }
  - { name: present, shader: present.hlsl, target: cs_5_0, format: RGBA8, inputs: [ { slot: 0, source: "buffer:trail" } ], output: output }
