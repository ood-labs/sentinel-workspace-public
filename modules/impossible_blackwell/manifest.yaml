name: "Impossible Blackwell"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Shutter Program", slot: 0, required: true }

parameters:
  - { name: well_mix, display: "Blackwell Mix", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Well" }
  - { name: well_center, display: "Well Center", type: point2D, default: [0.86,0.48], group: "Well" }
  - { name: well_radius, display: "Well Radius", type: float, min: 0.12, max: 0.72, default: 0.48, group: "Well" }
  - { name: well_phase, display: "Well Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: pull_rate, display: "Pull Rate", type: float, min: -2.0, max: 2.0, default: 0.46, group: "Motion" }
  - { name: trace_density, display: "Trace Density", type: float, min: 3.0, max: 30.0, default: 12.0, group: "Motion" }
  - { name: ring_gain, display: "Ring Gain", type: float, min: 0.0, max: 1.5, default: 0.78, group: "Ink" }
  - { name: void_color, display: "Void Color", type: color, default: [0.012,0.016,0.023], group: "Ink" }
  - { name: tracer_color, display: "Tracer Color", type: color, default: [0.88,0.84,0.66], group: "Ink" }

passes:
  - name: blackwell
    shader: blackwell.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Blackwell Program", pass: blackwell }
