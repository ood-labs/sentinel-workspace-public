name: "MIDI Controller Post"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Scene", slot: 0, required: true }

parameters:
  - { name: bloom_gain, display: "Bloom", type: float, min: 0.0, max: 3.0, default: 1.35, group: "Finish" }
  - { name: bloom_radius, display: "Bloom Radius", type: float, min: 1.0, max: 12.0, default: 5.0, group: "Finish" }
  - { name: bloom_threshold, display: "Bloom Threshold", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Finish" }
  - { name: saturation, display: "Saturation", type: float, min: 0.0, max: 2.0, default: 1.18, group: "Finish" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 1.5, default: 0.34, group: "Finish" }
  - { name: scanlines, display: "Scanlines", type: float, min: 0.0, max: 0.35, default: 0.045, group: "Finish" }

passes:
  - name: post
    shader: post.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Final", pass: post }
