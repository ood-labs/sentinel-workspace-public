name: "Impossible Riser Slice"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Blackwell Program", slot: 0, required: true }

parameters:
  - { name: riser_mix, display: "Riser Mix", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Riser" }
  - { name: riser_center, display: "Riser Center", type: point2D, default: [0.53,0.77], group: "Riser" }
  - { name: riser_width, display: "Riser Width", type: float, min: 0.2, max: 0.9, default: 0.62, group: "Riser" }
  - { name: riser_height, display: "Riser Height", type: float, min: 0.12, max: 0.58, default: 0.34, group: "Riser" }
  - { name: riser_phase, display: "Riser Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: relief_depth, display: "Relief Depth", type: float, min: 0.0, max: 1.0, default: 0.56, group: "Motion" }
  - { name: drift_rate, display: "Drift Rate", type: float, min: -2.0, max: 2.0, default: 0.34, group: "Motion" }
  - { name: layer_count, display: "Layer Count", type: float, min: 3.0, max: 18.0, default: 11.0, group: "Motion" }
  - { name: relief_gain, display: "Relief Gain", type: float, min: 0.0, max: 1.5, default: 0.82, group: "Ink" }
  - { name: plate_color, display: "Plate Color", type: color, default: [0.07,0.10,0.12], group: "Ink" }
  - { name: bevel_color, display: "Bevel Color", type: color, default: [0.94,0.72,0.26], group: "Ink" }

passes:
  - name: riser
    shader: riser.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Riser Program", pass: riser }
