name: "Phase Lattice Quantized Energy Levels"
version: "1.0"
mode: filter
resolution_source: "match:input"

inputs:
  - { name: "Engraved Field", slot: 0, required: true }

parameters:
  - name: level_count
    display: "Energy Levels"
    type: float
    min: 3.0
    max: 16.0
    default: 7.0
    group: "Level Sets"

  - name: quantize_strength
    display: "Quantization"
    type: float
    min: 0.0
    max: 1.0
    default: 0.78
    group: "Level Sets"

  - name: contour_width
    display: "Shell Width"
    type: float
    min: 0.012
    max: 0.22
    default: 0.065
    group: "Level Sets"

  - name: shell_gain
    display: "Shell Relief"
    type: float
    min: 0.0
    max: 0.9
    default: 0.42
    group: "Level Sets"

  - name: underlay
    display: "Continuous Underlay"
    type: float
    min: 0.0
    max: 0.8
    default: 0.32
    group: "Preservation"

  - name: core_preserve
    display: "Core Preservation"
    type: float
    min: 0.0
    max: 1.0
    default: 0.86
    group: "Preservation"

  - name: hot_level
    display: "Warm Energy Level"
    type: float
    min: 0.1
    max: 0.9
    default: 0.58
    group: "Warm Band"

  - name: hot_strength
    display: "Warm Band Gain"
    type: float
    min: 0.0
    max: 1.0
    default: 0.72
    group: "Warm Band"

  - name: level_core
    display: "Level-Set Core"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Placement"

passes:
  - name: quantized_levels
    shader: levels.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
