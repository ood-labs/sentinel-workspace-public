name: "Forensic Memory Geology"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Program", slot: 0, required: true }
  - { name: "Pressure Field", slot: 1, required: true }

viewport:
  hint: "Paint=deposit memory, E=toggle erase, wheel=brush size, X=clear strata"
  interactions: [events]
  input:
    pointer: [left, wheel]
    keyboard: [e, x]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: deposit_or_erase, label: "Deposit / Erase" }
    - { gesture: left_drag, action: paint_strata, label: "Paint Strata" }
    - { gesture: wheel, action: brush_size, label: "Brush Size" }
    - { key: e, action: toggle_erase, label: "Toggle Erase" }
    - { key: x, action: clear_memory, label: "Clear Memory" }

parameters:
  - { name: retention, display: "Strata Retention", type: float, min: 0.90, max: 0.9999, default: 0.97808, group: "Memory" }
  - { name: scar_retention, display: "Scar Retention", type: float, min: 0.90, max: 0.9999, default: 0.992, group: "Memory" }
  - { name: age_rate, display: "Age Rate", type: float, min: 0.0, max: 0.5, default: 0.045, group: "Memory" }
  - { name: advection, display: "Directional Drift", type: float, min: 0.0, max: 0.3, default: 0.0319, group: "Motion" }
  - { name: deposit_threshold, display: "Deposit Threshold", type: float, min: 0.0, max: 0.9, default: 0.34, group: "Deposition" }
  - { name: deposition_gain, display: "Live Deposition", type: float, min: 0.0, max: 0.3, default: 0.0065, group: "Deposition" }
  - { name: pressure_deposition, display: "Pressure Deposit", type: float, min: 0.0, max: 0.2, default: 0.003, group: "Deposition" }
  - { name: scar_gain, display: "Scar Formation", type: float, min: 0.0, max: 2.0, default: 0.35, group: "Deposition" }
  - { name: gesture_gain, display: "Gesture Deposit", type: float, min: 0.1, max: 4.0, default: 1.4, group: "Gesture" }
  - { name: erase_gain, display: "Gesture Erase", type: float, min: 0.1, max: 1.0, default: 0.86, group: "Gesture" }
  - { name: strata_density, display: "Strata Density", type: float, min: 1.0, max: 24.0, default: 8.0, group: "Display" }
  - { name: age_drift, display: "Age Drift", type: float, min: 0.0, max: 12.0, default: 3.5, group: "Display" }
  - { name: memory_gain, display: "Memory Body", type: float, min: 0.0, max: 2.0, default: 0.6016, group: "Display" }
  - { name: strata_gain, display: "Strata Lines", type: float, min: 0.0, max: 2.5, default: 0.856, group: "Display" }
  - { name: live_gain, display: "Live Choir", type: float, min: 0.0, max: 2.0, default: 0.8265, group: "Display" }
  - { name: scar_display_gain, display: "Current Scars", type: float, min: 0.0, max: 3.0, default: 0.5898, group: "Display" }
  - { name: pressure_erosion, display: "Pressure Erosion", type: float, min: 0.0, max: 1.0, default: 0.329, group: "Display" }
  - { name: current_color, display: "Current Color", type: color, default: [1.0, 0.28, 0.035], group: "Display" }

buffers:
  - { name: event_state, format: RGBA32F, persistent: true }
  - { name: memory_field, format: RGBA16F, persistent: true }

passes:
  - name: events
    shader: events.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:event_state" }
    output: "buffer:event_state"
  - name: field
    shader: field.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:memory_field" }
      - { slot: 1, source: "input:0" }
      - { slot: 2, source: "input:1" }
      - { slot: 3, source: "buffer:event_state" }
    output: "buffer:memory_field"
  - name: render
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:memory_field" }
      - { slot: 1, source: "input:0" }
      - { slot: 2, source: "input:1" }
      - { slot: 3, source: "buffer:event_state" }
    output: output

outputs:
  - { name: "Memory Program", pass: render }
