name: "Impossible Depth Fold"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Woven Program", slot: 0, required: true }

parameters:
  - { name: fold_center, display: "Fold Center", type: point2D, min: [0.0,0.0], max: [1.0,1.0], default: [0.56,0.48], group: "Performance" }
  - { name: fold_amount, display: "Fold Mix", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Performance" }
  - { name: fold_strength, display: "Fold Displacement", type: float, min: 0.0, max: 180.0, default: 36.0, group: "Geometry" }
  - { name: fold_mode, display: "Fold Grammar", type: enum, options: [Forward Diagonal, Reverse Diagonal, Chamber Cells, Crossed Plates], flags: button_grid, default: 2, group: "Geometry" }
  - { name: cell_count, display: "Cell Count", type: float, min: 3.0, max: 18.0, default: 8.0, group: "Geometry" }
  - { name: field_radius, display: "Field Radius", type: float, min: 0.1, max: 1.4, default: 0.72, group: "Geometry" }
  - { name: perspective, display: "Perspective Fold", type: float, min: 0.0, max: 0.35, default: 0.075, group: "Geometry" }
  - { name: seam_width, display: "Seam Width", type: float, min: 0.4, max: 5.0, default: 1.25, group: "Ink" }
  - { name: seam_gain, display: "Seam Gain", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Ink" }
  - { name: fold_lighting, display: "Fold Lighting", type: float, min: 0.0, max: 0.5, default: 0.12, group: "Ink" }
  - { name: fold_seed, display: "Fold Seed", type: int, min: 0, max: 999, default: 53, group: "Variation" }

passes:
  - name: fold
    shader: fold.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Folded Program", pass: fold }
