name: "Impossible Orbital Loom"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Avalanche Program", slot: 0, required: true }

parameters:
  - { name: loom_mix, display: "Loom Mix", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Loom" }
  - { name: loom_phase, display: "Loom Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: orbit_speed, display: "Orbit Speed", type: float, min: -2.0, max: 2.0, default: 0.62, group: "Motion" }
  - { name: aperture, display: "Aperture", type: float, min: 0.12, max: 0.72, default: 0.42, group: "Loom" }
  - { name: ring_count, display: "Ring Count", type: float, min: 3.0, max: 32.0, default: 14.0, group: "Loom" }
  - { name: radial_warp, display: "Radial Warp", type: float, min: 0.0, max: 0.55, default: 0.22, group: "Loom" }
  - { name: stitch_gain, display: "Stitch Gain", type: float, min: 0.0, max: 1.2, default: 0.58, group: "Marks" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.006,0.008,0.012], group: "Marks" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.96,0.20,0.035], group: "Marks" }

passes:
  - name: loom
    shader: loom.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Orbital Program", pass: loom }
