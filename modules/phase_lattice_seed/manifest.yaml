name: "Phase Lattice Seed"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - name: topology
    display: "Topology"
    type: enum
    default: 0
    options: [Orbital, Shear, Fold]
    flags: button_grid
    group: "Structure"

  - name: density
    display: "Field Density"
    type: float
    min: 8.0
    max: 42.0
    default: 23.0
    group: "Structure"

  - name: contour_count
    display: "Contour Count"
    type: float
    min: 5.0
    max: 28.0
    default: 10.0
    group: "Structure"

  - name: fracture
    display: "Fracture"
    type: float
    min: 0.0
    max: 1.0
    default: 0.62
    group: "Structure"

  - name: core
    display: "Registration Core"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Composition"

  - name: line_weight
    display: "Line Weight"
    type: float
    min: 0.45
    max: 2.4
    default: 0.95
    group: "Composition"

  - name: accent_gate
    display: "Accent Threshold"
    type: float
    min: 0.35
    max: 0.86
    default: 0.63
    group: "Composition"

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output
