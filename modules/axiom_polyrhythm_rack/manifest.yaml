name: "AXIOM 06 / POLYRHYTHM RACK"
version: "1.0"
mode: generator
resolution: [960, 540]

panel:
  mode: canvas
  output: "Polyrhythm Rack"
  resolution: follow_panel

parameters:
  - { name: transport_run, display: "Run Clock", type: bool, default: true, flags: button, group: "Transport" }
  - { name: reset_phase, display: "Reset Clock", type: button, group: "Transport" }
  - { name: scrub_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Transport" }
  - { name: period_seconds, display: "Master Period", type: float, min: 1.0, max: 32.0, default: 7.5, group: "Timing" }
  - { name: ratio_b, display: "Slow Ratio", type: float, min: 0.125, max: 4.0, default: 0.5, group: "Timing" }
  - { name: ratio_c, display: "Odd Ratio", type: float, min: 0.125, max: 4.0, default: 1.5, group: "Timing" }
  - { name: phase_offset_b, display: "Slow Offset", type: float, min: 0.0, max: 1.0, default: 0.125, group: "Timing" }
  - { name: phase_offset_c, display: "Odd Offset", type: float, min: 0.0, max: 1.0, default: 0.37, group: "Timing" }
  - { name: pulse_width, display: "Pulse Width", type: float, min: 0.05, max: 0.95, default: 0.22, group: "Signal Shape" }
  - { name: accent_sharpness, display: "Accent Sharpness", type: float, min: 1.0, max: 20.0, default: 9.0, group: "Signal Shape" }
  - { name: drift_coupling, display: "Drift Coupling", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Signal Shape" }

buffers:
  - { name: lfo_state, structured: true, element_size: 64, element_count: 1, persistent: true }

state_buffers:
  - name: lfo_state
    max_elements: 1
    schema:
      - { name: master_phase, type: float }
      - { name: sine, type: float }
      - { name: triangle_value, type: float }
      - { name: pulse, type: float }
      - { name: ramp, type: float }
      - { name: orbit_x, type: float }
      - { name: orbit_y, type: float }
      - { name: accent, type: float }
      - { name: slow_phase, type: float }
      - { name: slow_sine, type: float }
      - { name: odd_phase, type: float }
      - { name: odd_triangle, type: float }
      - { name: envelope, type: float }
      - { name: drift, type: float }
      - { name: last_scrub, type: float }
      - { name: initialized, type: float }

viewport:
  hint: "Shared loop-safe modulation rack: master, half-rate, and 3:2 clocks with sine, triangle, pulse, orbit, accent, envelope, and drift lanes."
  interactions: [mouse]
  controls:
    - { id: transport_run, kind: toggle, param: transport_run, rect: [0.045, 0.865, 0.125, 0.952], label: "Run" }
    - { id: reset_phase, kind: button, param: reset_phase, rect: [0.135, 0.865, 0.215, 0.952], label: "Reset" }
    - { id: scrub_phase, kind: slider, param: scrub_phase, rect: [0.245, 0.865, 0.945, 0.952], label: "Phase" }

passes:
  - name: clock
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:lfo_state"

  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:lfo_state" }
    output: output

control_outputs:
  - { name: master_phase, buffer: lfo_state, element: 0, field_offset: 0, description: "Master loop phase 0-1" }
  - { name: sine, buffer: lfo_state, element: 0, field_offset: 4, description: "Master sine 0-1" }
  - { name: triangle, buffer: lfo_state, element: 0, field_offset: 8, description: "Master triangle 0-1" }
  - { name: pulse, buffer: lfo_state, element: 0, field_offset: 12, description: "Master pulse 0 or 1" }
  - { name: ramp, buffer: lfo_state, element: 0, field_offset: 16, description: "Master ramp 0-1" }
  - { name: orbit_x, buffer: lfo_state, element: 0, field_offset: 20, description: "Cosine quadrature 0-1" }
  - { name: orbit_y, buffer: lfo_state, element: 0, field_offset: 24, description: "Sine quadrature 0-1" }
  - { name: accent, buffer: lfo_state, element: 0, field_offset: 28, description: "Sharp loop-safe accent 0-1" }
  - { name: slow_phase, buffer: lfo_state, element: 0, field_offset: 32, description: "Persistent slow-ratio phase 0-1" }
  - { name: slow_sine, buffer: lfo_state, element: 0, field_offset: 36, description: "Slow-ratio sine 0-1" }
  - { name: odd_phase, buffer: lfo_state, element: 0, field_offset: 40, description: "Persistent odd-ratio phase 0-1" }
  - { name: odd_triangle, buffer: lfo_state, element: 0, field_offset: 44, description: "Odd-ratio triangle 0-1" }
  - { name: envelope, buffer: lfo_state, element: 0, field_offset: 48, description: "Sine/accent performance envelope 0-1" }
  - { name: drift, buffer: lfo_state, element: 0, field_offset: 52, description: "Coupled quasi-periodic drift 0-1" }

outputs:
  - { name: "Polyrhythm Rack", pass: display }
