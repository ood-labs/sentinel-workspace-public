name: "Steel Lattice"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [camera]

parameters:
  # ---- structure (all real world-unit dimensions) ----
  - { name: cell,      display: "Grid Spacing (XZ)", type: float, min: 1.5, max: 12.0, default: 4.0,  group: "Structure" }
  - { name: floor_h,   display: "Floor Height (Y)",  type: float, min: 1.5, max: 12.0, default: 4.0,  group: "Structure" }
  - { name: col_thick, display: "Column Half-Width", type: float, min: 0.05, max: 1.5, default: 0.42, group: "Structure" }
  - { name: beam_w,    display: "Beam Half-Width",   type: float, min: 0.05, max: 1.0, default: 0.28, group: "Structure" }
  - { name: beam_h,    display: "Beam Half-Height",  type: float, min: 0.05, max: 1.2, default: 0.46, group: "Structure" }

  # ---- look ----
  - { name: steel_color, display: "Steel Color", type: color, default: [0.52, 0.51, 0.49], group: "Look" }
  - { name: bg_color,    display: "Background",   type: color, default: [0.02, 0.02, 0.025], group: "Look" }
  - { name: fog_density, display: "Fog / Depth Falloff", type: float, min: 0.0, max: 2.0, default: 0.5, group: "Look" }
  - { name: spec_amt,    display: "Specular",     type: float, min: 0.0, max: 1.0, default: 0.22, group: "Look" }
  - { name: desaturate,  display: "Desaturate",   type: float, min: 0.0, max: 1.0, default: 0.35, group: "Look" }
  - { name: exposure,    display: "Exposure",     type: float, min: 0.2, max: 3.0, default: 1.05, group: "Look" }
  - { name: shadows,     display: "Sun Shadows",  type: bool, default: true, flags: button, group: "Look" }
  - { name: march_dist,  display: "March Distance", type: float, min: 20.0, max: 200.0, default: 90.0, group: "Look" }

  # ---- panels (coffered formwork carved as REAL recessed grooves in the SDF) ----
  - name: panels_on
    display: "Panels"
    type: enum
    options: [Off, On]
    default: 1
    flags: button_grid
    group: "Panels"
  - { name: panel_w,      display: "Panel Div (X/Z)", type: float, min: 0.2,   max: 3.0, default: 0.9,  group: "Panels" }
  - { name: panel_h,      display: "Panel Div (Y)",   type: float, min: 0.2,   max: 4.0, default: 1.2,  group: "Panels" }
  - { name: panel_off_x,  display: "Offset X",        type: float, min: -6.0,  max: 6.0, default: 0.0,  group: "Panels" }
  - { name: panel_off_y,  display: "Offset Y",        type: float, min: -6.0,  max: 6.0, default: 0.0,  group: "Panels" }
  - { name: panel_off_z,  display: "Offset Z",        type: float, min: -6.0,  max: 6.0, default: 0.0,  group: "Panels" }
  - { name: flute_width,  display: "Flute Width (V)", type: float, min: 0.005, max: 0.25, default: 0.045, group: "Panels" }
  - { name: flute_depth,  display: "Flute Depth (V)", type: float, min: 0.0,   max: 0.4,  default: 0.10,  group: "Panels" }
  - { name: band_width,   display: "Band Width (H)",  type: float, min: 0.005, max: 0.3,  default: 0.06,  group: "Panels" }
  - { name: band_depth,   display: "Band Depth (H)",  type: float, min: 0.0,   max: 0.5,  default: 0.13,  group: "Panels" }
  - { name: member_round, display: "Edge Round",      type: float, min: 0.0,   max: 0.25, default: 0.03,  group: "Panels" }

  # ---- sun ----
  - { name: sun_azimuth,   display: "Sun Azimuth",   type: float, min: 0.0, max: 360.0, default: 55.0, group: "Sun" }
  - { name: sun_elevation, display: "Sun Elevation", type: float, min: 5.0, max: 89.0, default: 42.0, group: "Sun" }

  # ---- camera ----
  # Fly = WASD + right-drag in the viewport (default). Orbit = deterministic rig below,
  # for reproducible review/A-B captures. Explicit two-button selector so the active
  # mode is always visible (a bool checkbox was not latching reliably in the UI).
  - name: cam_mode
    display: "Camera Mode"
    type: enum
    options: [Fly, Orbit]
    default: 0
    flags: button_grid
    group: "Camera"
  - { name: cam_orbit,     display: "Camera Orbit",     type: float, min: 0.0, max: 360.0, default: 35.0, group: "Camera" }
  - { name: cam_elevation, display: "Camera Elevation", type: float, min: -30.0, max: 85.0, default: 8.0, group: "Camera" }
  - { name: cam_distance,  display: "Camera Distance",  type: float, min: 0.5, max: 30.0, default: 7.0, group: "Camera" }
  - { name: cam_target_y,  display: "Camera Target Y",  type: float, min: -4.0, max: 6.0, default: 1.0, group: "Camera" }
  - { name: cam_focal,     display: "Camera Focal",     type: float, min: 0.6, max: 4.0, default: 1.4, group: "Camera" }
  - { name: rotate_speed,  display: "Auto Rotate",      type: float, min: 0.0, max: 2.0, default: 0.0, group: "Camera" }

passes:
  - name: render
    shader: steel.hlsl
    target: cs_5_0

outputs:
  - { name: "Lattice", pass: render }
