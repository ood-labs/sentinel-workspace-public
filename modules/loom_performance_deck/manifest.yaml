name: "Loom Interaction Surface"
version: "2.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Program", slot: 0, required: true }

panel:
  mode: canvas
  output: "Interaction Surface"
  resolution: follow_panel

parameters:
  - { name: wave_decay, display: "Wave Memory", type: float, min: 0.90, max: 0.999, default: 0.982, group: "Interaction" }
  - { name: wave_speed, display: "Propagation", type: float, min: 0.05, max: 1.0, default: 0.42, group: "Interaction" }
  - { name: injection_gain, display: "Touch Energy", type: float, min: 0.1, max: 2.5, default: 0.82, group: "Interaction" }
  - { name: refraction, display: "Refraction", type: float, min: 0.0, max: 2.0, default: 0.58, group: "Rendering" }
  - { name: contour_gain, display: "Wave Trace", type: float, min: 0.0, max: 1.5, default: 0.22, group: "Rendering" }
  - { name: contour_color, display: "Trace Color", type: color, default: [0.18, 0.82, 0.94], group: "Rendering" }
  - { name: hud_opacity, display: "Telemetry", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Interface" }
  - { name: corner_count, type: float, min: 0.0, max: 512.0, default: 0.0, hidden: true }
  - { name: blob_count, type: float, min: 0.0, max: 256.0, default: 0.0, hidden: true }

viewport:
  hint: "Click or drag directly on the image to launch waves. Wheel changes touch radius. X clears."
  # ui-label: title = LOOM SIGNAL
  # ui-label: corners = CORNERS
  # ui-label: blobs = BLOBS
  # ui-label: touch = TOUCH FIELD
  # ui-label: live = LIVE
  interactions: [events]
  input:
    pointer: [left, wheel]
    keyboard: [x]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: launch_ripple, label: "Launch Ripple" }
    - { gesture: left_drag, action: paint_wave, label: "Paint Wave" }
    - { gesture: wheel, action: resize_touch, label: "Resize Touch" }
    - { key: x, action: clear_waves, label: "Clear Waves" }

buffers:
  - { name: state, format: RGBA32F, scale: 0.125, persistent: true }
  - { name: waves, format: RGBA16F, persistent: true }

passes:
  - name: events
    shader: events.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:state" }
    output: "buffer:state"

  - name: wave_update
    shader: wave.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:waves" }
      - { slot: 1, source: "buffer:state" }
    output: "buffer:waves"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:waves" }
      - { slot: 2, source: "buffer:state" }
    output: output

outputs:
  - { name: "Interaction Surface", pass: render }
