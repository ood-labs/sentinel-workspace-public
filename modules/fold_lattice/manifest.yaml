name: "Fold Lattice"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [noise]

parameters:
  - name: lattice_density
    display: "Lattice Density"
    type: float
    min: 4.0
    max: 18.0
    default: 9.0
    group: "Structure"
  - name: fold_amount
    display: "Fold Amount"
    type: float
    min: 0.0
    max: 2.5
    default: 1.3
    group: "Structure"
  - name: radial_bias
    display: "Radial Bias"
    type: float
    min: -1.0
    max: 1.0
    default: 0.15
    group: "Structure"
  - name: aperture
    display: "Contour Aperture"
    type: float
    min: 0.1
    max: 0.9
    default: 0.58
    group: "Contour"
  - name: line_weight
    display: "Line Weight"
    type: float
    min: 0.2
    max: 2.0
    default: 0.75
    group: "Contour"
  - name: accent_color
    display: "Signal Accent"
    type: color
    default: [1.0, 0.18, 0.025]
    group: "Palette"

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output

outputs:
  - { name: "Field", pass: render }
