name: "AXIOM 11 / RELIEF CHAMBER"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Master Program", slot: 0, required: true }
  - { name: "Organic Height", slot: 1, required: true }
  - { name: "Feature Ridges", slot: 2, required: true }

data_inputs:
  - name: "Kinetic Events"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: speed, type: float }
      - { name: energy, type: float }
      - { name: active, type: float }
      - { name: id, type: float }

buffers:
  - { name: relief_field, format: RGBA16F, scale: 0.5, persistent: true }

parameters:
  - { name: relief_mode, display: "Relief Grammar", type: enum, default: 0, options: ["Specimen Slab", "Excavated Grid", "Wire Relief"], flags: button_grid, group: "Relief" }
  - { name: chamber_center, display: "Specimen Position", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.74, 0.27], group: "Relief" }
  - { name: chamber_size, display: "Specimen Extent", type: point2D, min: [0.12, 0.12], max: [0.85, 0.85], default: [0.34, 0.34], group: "Relief" }
  - { name: specimen_gain, display: "Relief Authority", type: float, min: 0.0, max: 1.0, default: 0.74, group: "Relief" }
  - { name: chamber_dim, display: "Chamber Underprint", type: float, min: 0.0, max: 0.85, default: 0.28, group: "Relief" }
  - { name: height_gain, display: "Extrusion Height", type: float, min: 0.02, max: 1.25, default: 0.46, group: "Height Field" }
  - { name: base_depth, display: "Slab Datum", type: float, min: -0.25, max: 0.35, default: -0.04, group: "Height Field" }
  - { name: edge_ridge, display: "Feature Ridge Height", type: float, min: 0.0, max: 1.5, default: 0.42, group: "Height Field" }
  - { name: impact_height, display: "Kinetic Pin Height", type: float, min: 0.0, max: 1.5, default: 0.62, group: "Height Field" }
  - { name: impact_radius, display: "Kinetic Pin Radius", type: float, min: 0.004, max: 0.16, default: 0.034, group: "Height Field" }
  - { name: terrace_steps, display: "Relief Quantization", type: int, min: 3, max: 48, default: 18, group: "Height Field" }
  - { name: terrace_mix, display: "Terrace Authority", type: float, min: 0.0, max: 1.0, default: 0.44, group: "Height Field" }
  - { name: height_stability, display: "Height Stability", type: float, min: 0.0, max: 0.97, default: 0.86, group: "Height Field" }
  - { name: view_yaw, display: "Specimen Yaw", type: float, min: -0.75, max: 0.75, default: -0.18, group: "View" }
  - { name: view_pitch, display: "Specimen Pitch", type: float, min: 0.10, max: 1.15, default: 0.58, group: "View" }
  - { name: contour_count, display: "Elevation Contours", type: float, min: 2.0, max: 42.0, default: 17.0, group: "Surface" }
  - { name: contour_width, display: "Contour Hairline", type: float, min: 0.006, max: 0.20, default: 0.052, group: "Surface" }
  - { name: contour_gain, display: "Contour Ink", type: float, min: 0.0, max: 1.5, default: 0.34, group: "Surface" }
  - { name: grid_gain, display: "Survey Grid", type: float, min: 0.0, max: 1.0, default: 0.14, group: "Surface" }
  - { name: ridge_ink, display: "Feature Engraving", type: float, min: 0.0, max: 1.5, default: 0.38, group: "Surface" }
  - { name: impact_ink, display: "Kinetic Vermilion", type: float, min: 0.0, max: 2.0, default: 0.88, group: "Surface" }
  - { name: scan_gain, display: "Depth Scan", type: float, min: 0.0, max: 1.5, default: 0.32, group: "Surface" }
  - { name: relief_phase, display: "Relief Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: paper_color, display: "Instrument White", type: color, default: [0.91, 0.90, 0.86], group: "Palette" }
  - { name: accent_color, display: "Kinetic Vermilion", type: color, default: [1.0, 0.14, 0.02], group: "Palette" }

passes:
  - name: compile_heightfield
    shader: heightfield_stable.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "buffer:relief_field" }
      - { slot: 4, source: "data:0" }
    output: "buffer:relief_field"

  - name: march_relief
    shader: relief_march.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:relief_field" }
    output: output

outputs:
  - { name: "Relief Program", pass: march_relief }

viewport:
  hint: "Ray-marched live bas-relief. Organic luminance forms the terrain, Features engrave ridges, and real Kinetic Events raise vermilion impact pins. All motion is expression-driven; no mouse controls."
