name: "Orbit Contours"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Orbit Scene", slot: 0, required: true }

parameters:
  - { name: edge_gain, display: "Contour Gain", type: float, min: 0.0, max: 2.0, default: 0.92, group: "Geometry" }
  - { name: threshold, display: "Contour Threshold", type: float, min: 0.0, max: 0.4, default: 0.055, group: "Geometry" }
  - { name: quantize, display: "Band Quantization", type: float, min: 1.0, max: 12.0, default: 5.0, group: "Geometry" }
  - { name: scan, display: "Registration Scan", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Motion" }
  - { name: drift, display: "Contour Drift", type: float, min: 0.0, max: 1.0, default: 0.06, group: "Motion" }
  - { name: base_mix, display: "Base Mix", type: float, min: 0.0, max: 1.0, default: 0.46, group: "Output" }

passes:
  - name: contours
    shader: contours.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Contour Scene", pass: contours }
