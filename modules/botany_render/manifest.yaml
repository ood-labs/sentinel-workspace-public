name: "Botany Render"
version: "0.1"
mode: generator
resolution: [720, 1104]

# Bouquet SDF plate — consumes the BouquetPart buffer (data:0), toon-shaded with black outlines
# and hue-cycle, domain-warp toolkit wired for live manipulation. Premultiplied-alpha matte.

data_inputs:
  - name: "Parts"
    slot: 0
    schema:
      - { name: pos_xy, type: float2 }
      - { name: sc_xy, type: float2 }
      - { name: pos_z, type: float }
      - { name: sc_z, type: float }
      - { name: yaw, type: float }
      - { name: tilt, type: float }
      - { name: roll, type: float }
      - { name: kind, type: float }
      - { name: mat, type: float }
      - { name: group, type: float }
      - { name: colA, type: float }
      - { name: colB, type: float }
      - { name: grad, type: float }
      - { name: active, type: float }

parameters:
  # ---- look / toon ----
  - { name: blend_k,     display: "Blend (smin)", type: float, min: 0.005, max: 0.3, default: 0.02, group: "Look" }
  - { name: outline_amt, display: "Outline",      type: float, min: 0.0, max: 1.0,  default: 0.9,  group: "Look" }
  - { name: march_dist,  display: "March Dist",   type: float, min: 4.0, max: 20.0, default: 10.0, group: "Look" }

  # ---- hue cycle ----
  - { name: loop_period, display: "Loop Period", type: float, min: 3.0, max: 30.0, default: 8.0, group: "Hue" }
  - { name: hue_cycle,   display: "Hue Cycle",   type: float, min: 0.0, max: 1.0,  default: 1.0, group: "Hue" }
  - { name: hue_offset,  display: "Hue Offset",  type: float, min: -3.2, max: 3.2, default: 0.0, group: "Hue" }

  # ---- warp: master melt + 2 combinable layers (default OFF) ----
  - { name: melt_amt,   display: "Melt (Master)", type: float, min: 0.0, max: 3.0, default: 0.0, group: "Warp" }
  - { name: warp_speed, display: "Wave Speed",    type: float, min: 0.0, max: 3.0, default: 0.6, group: "Warp" }
  - { name: w1_amt,   display: "1 · Amount", type: float, min: 0.0, max: 3.0, default: 0.5, group: "Warp 1" }
  - name: w1_mode
    display: "1 · Mode"
    type: enum
    options: [Flow, Ripple, Turbulent, Fractal, Steps, Boxes, Shatter]
    default: 0
    flags: button_grid
    group: "Warp 1"
  - { name: w1_freq,  display: "1 · Freq",  type: float, min: 0.2, max: 4.0, default: 1.0, group: "Warp 1" }
  - { name: w1_speed, display: "1 · Speed", type: float, min: 0.0, max: 3.0, default: 0.6, group: "Warp 1" }
  - { name: w1_yaw,   display: "1 · Yaw",   type: float, min: -3.15, max: 3.15, default: 0.0, group: "Warp 1" }
  - { name: w1_pitch, display: "1 · Pitch", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Warp 1" }
  - { name: w1_ox,    display: "1 · Offset X", type: float, min: -5.0, max: 5.0, default: 0.0, group: "Warp 1" }
  - { name: w1_oy,    display: "1 · Offset Y", type: float, min: -5.0, max: 5.0, default: 0.0, group: "Warp 1" }
  - { name: w1_oz,    display: "1 · Offset Z", type: float, min: -5.0, max: 5.0, default: 0.0, group: "Warp 1" }
  - { name: w2_amt,   display: "2 · Amount", type: float, min: 0.0, max: 3.0, default: 0.0, group: "Warp 2" }
  - name: w2_mode
    display: "2 · Mode"
    type: enum
    options: [Flow, Ripple, Turbulent, Fractal, Steps, Boxes, Shatter]
    default: 2
    flags: button_grid
    group: "Warp 2"
  - { name: w2_freq,  display: "2 · Freq",  type: float, min: 0.2, max: 4.0, default: 1.8, group: "Warp 2" }
  - { name: w2_speed, display: "2 · Speed", type: float, min: 0.0, max: 3.0, default: 0.9, group: "Warp 2" }
  - { name: w2_yaw,   display: "2 · Yaw",   type: float, min: -3.15, max: 3.15, default: 1.57, group: "Warp 2" }
  - { name: w2_pitch, display: "2 · Pitch", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Warp 2" }
  - { name: w2_ox,    display: "2 · Offset X", type: float, min: -5.0, max: 5.0, default: 0.0, group: "Warp 2" }
  - { name: w2_oy,    display: "2 · Offset Y", type: float, min: -5.0, max: 5.0, default: 0.0, group: "Warp 2" }
  - { name: w2_oz,    display: "2 · Offset Z", type: float, min: -5.0, max: 5.0, default: 0.0, group: "Warp 2" }

  # ---- deform (geometric domain ops, default off) ----
  - { name: twist_amt, display: "Twist",   type: float, min: -2.0, max: 2.0, default: 0.0, group: "Deform" }
  - { name: bend_amt,  display: "Bend",    type: float, min: -1.5, max: 1.5, default: 0.0, group: "Deform" }
  - { name: swirl_amt, display: "Swirl",   type: float, min: -3.0, max: 3.0, default: 0.0, group: "Deform" }
  - { name: wave_amt,  display: "Wave",    type: float, min: 0.0,  max: 1.0, default: 0.0, group: "Deform" }
  - { name: wave_freq, display: "Wave Freq", type: float, min: 0.5, max: 8.0, default: 2.0, group: "Deform" }
  - { name: dist_cx, display: "Center X", type: float, min: -3.0, max: 3.0, default: 0.0,  group: "Deform" }
  - { name: dist_cy, display: "Center Y", type: float, min: -3.0, max: 3.0, default: 0.6,  group: "Deform" }
  - { name: dist_cz, display: "Center Z", type: float, min: -3.0, max: 3.0, default: 0.15, group: "Deform" }

  # ---- sun ----
  - { name: sun_azimuth,   display: "Sun Azimuth",   type: float, min: 0.0, max: 360.0, default: 55.0, group: "Sun" }
  - { name: sun_elevation, display: "Sun Elevation", type: float, min: 5.0, max: 89.0,  default: 55.0, group: "Sun" }

  # ---- camera (orbit; az 90 faces +Z front) ----
  - { name: cam_orbit,     display: "Camera Orbit",     type: float, min: 0.0,   max: 360.0, default: 90.0, group: "Camera" }
  - { name: cam_elevation, display: "Camera Elevation", type: float, min: -40.0, max: 60.0,  default: -3.0, group: "Camera" }
  - { name: cam_distance,  display: "Camera Distance",  type: float, min: 1.5,   max: 12.0,  default: 4.7,  group: "Camera" }
  - { name: cam_target_y,  display: "Camera Target Y",  type: float, min: -1.0,  max: 3.0,   default: 0.92, group: "Camera" }
  - { name: cam_focal,     display: "Camera Focal",     type: float, min: 0.8,   max: 4.0,   default: 2.6,  group: "Camera" }
  - { name: rotate_speed,  display: "Auto Rotate",      type: float, min: 0.0,   max: 2.0,   default: 0.0,  group: "Camera" }

passes:
  - name: render
    shader: scene.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }

outputs:
  - { name: "Render", pass: render }
