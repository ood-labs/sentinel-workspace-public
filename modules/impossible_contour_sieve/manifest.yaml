name: "Impossible Contour Sieve"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Weather Program", slot: 0, required: true }

parameters:
  - { name: sieve_mix, display: "Sieve Mix", type: float, min: 0.0, max: 1.0, default: 0.86, group: "Sieve" }
  - { name: sieve_phase, display: "Sieve Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: scan_rate, display: "Scan Rate", type: float, min: -2.0, max: 2.0, default: 0.54, group: "Motion" }
  - { name: edge_gain, display: "Edge Gain", type: float, min: 0.2, max: 3.0, default: 1.25, group: "Contour" }
  - { name: contour_threshold, display: "Contour Threshold", type: float, min: 0.01, max: 0.45, default: 0.13, group: "Contour" }
  - { name: quantize_bands, display: "Quantize Bands", type: float, min: 2.0, max: 18.0, default: 7.0, group: "Contour" }
  - { name: triangle_cut, display: "Triangle Cut", type: float, min: 0.0, max: 1.0, default: 0.68, group: "Occlusion" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.003,0.004,0.007], group: "Ink" }
  - { name: line_color, display: "Line Color", type: color, default: [0.74,0.68,0.56], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.96,0.16,0.025], group: "Ink" }

passes:
  - name: sieve
    shader: sieve.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Sieved Program", pass: sieve }
