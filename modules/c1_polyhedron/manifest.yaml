name: "C1 Polyhedron"
version: "0.1"
mode: generator
resolution: [864, 1080]

parameters:
  - { name: phase_manual, display: "Manual Phase", type: float, min: -1.0, max: 12.0, default: -1.0, group: "Motion" }
  - { name: phase_offset, display: "Phase Offset", type: float, min: 0.0, max: 12.0, default: 0.0, group: "Motion" }
  - { name: loop_seconds, display: "Loop Seconds", type: float, min: 1.0, max: 24.0, default: 12.0, group: "Motion" }
  - { name: cycle_seconds, display: "Cycle Seconds", type: float, min: 0.5, max: 8.0, default: 3.0, group: "Motion" }
  - { name: pulse_shape, display: "Pulse Shape", type: float, min: 0.4, max: 3.0, default: 0.88, group: "Motion" }
  - { name: yaw_turns, display: "Yaw Turns", type: float, min: -4.0, max: 4.0, default: 1.0, group: "Motion" }
  - { name: pitch_turns, display: "Pitch Turns", type: float, min: -4.0, max: 4.0, default: 1.0, group: "Motion" }
  - { name: roll_turns, display: "Roll Turns", type: float, min: -4.0, max: 4.0, default: 2.0, group: "Motion" }
  - { name: pitch_amp, display: "Pitch Amp", type: float, min: 0.0, max: 1.2, default: 0.20, group: "Motion" }
  - { name: roll_amp, display: "Roll Amp", type: float, min: 0.0, max: 1.2, default: 0.18, group: "Motion" }
  - { name: yaw_offset, display: "Yaw Offset", type: float, min: -6.283, max: 6.283, default: -0.42, group: "Camera" }
  - { name: center_x, display: "Center X", type: float, min: -0.5, max: 0.5, default: -0.025, group: "Camera" }
  - { name: center_y, display: "Center Y", type: float, min: -0.5, max: 0.5, default: 0.015, group: "Camera" }
  - { name: focal, display: "Focal", type: float, min: 0.8, max: 4.0, default: 1.25, group: "Camera" }
  - { name: cam_dist, display: "Camera Distance", type: float, min: 2.0, max: 8.0, default: 4.0, group: "Camera" }
  - { name: object_scale, display: "Object Scale", type: float, min: 0.2, max: 2.0, default: 0.52, group: "Geometry" }
  - { name: compact_extrude, display: "Compact Stellation", type: float, min: 0.0, max: 0.8, default: 0.22, group: "Geometry" }
  - { name: max_extrude, display: "Max Stellation", type: float, min: 0.0, max: 2.0, default: 1.08, group: "Geometry" }
  - { name: aa_samples, display: "AA Samples", type: int, min: 1, max: 2, default: 2, group: "Quality" }
  - { name: gloss, display: "Gloss", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Material" }
  - { name: exposure, display: "Exposure", type: float, min: 0.2, max: 2.5, default: 1.04, group: "Material" }
  - { name: edge_brightness, display: "Edge Brightness", type: float, min: 0.0, max: 2.0, default: 0.28, group: "Material" }

passes:
  - name: render
    shader: polyhedron.hlsl
    target: cs_5_0

outputs:
  - { name: "Hero", pass: render }
