name: "Living Tableau Primitive Render"
version: "1.0"
mode: generator
resolution: [1080,1080]
output_format: RGBA16F
data_inputs:
  - { name: "Primitives", slot: 0, schema: [ { name: p0, type: float2 }, { name: p1, type: float2 }, { name: color, type: float3 }, { name: width, type: float }, { name: kind, type: float }, { name: group_id, type: float }, { name: route_t, type: float }, { name: active, type: float } ] }
parameters:
  - { name: width_scale, display: "Line Width", type: float, min: 0.4, max: 3.0, default: 1.0, group: "Style" }
  - { name: intensity, type: float, min: 0.0, max: 3.0, default: 1.0, group: "Style" }
  - { name: glow, type: float, min: 0.0, max: 1.5, default: 0.45, group: "Glow" }
  - { name: glow_radius, display: "Glow Radius", type: float, min: 0.0, max: 3.0, default: 0.8, group: "Glow" }
  - { name: glyph_scale, display: "Glyph Scale", type: float, min: 1.0, max: 4.0, default: 1.0, group: "Glyphs" }
passes:
  - { name: render, shader: render.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }
outputs: [ { name: "Layer", pass: render } ]
