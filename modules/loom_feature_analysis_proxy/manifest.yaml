name: "Feature Analysis Proxy"
version: "1.0"
mode: generator
resolution: [480, 270]

inputs:
  - { name: "Full Resolution Loom", slot: 0, required: true }

viewport:
  hint: "Internal 480x270 analysis branch; the creative image path remains 1280x720."

parameters:
  - { name: analysis_contrast, display: "Analysis Contrast", type: float, min: 0.7, max: 1.6, default: 1.08, group: "Analysis" }
  - { name: luma_bias, display: "Luma Bias", type: float, min: -0.2, max: 0.2, default: 0.0, group: "Analysis" }
  - { name: color_retention, display: "Color Retention", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Analysis" }

passes:
  - name: downsample
    shader: downsample.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Analysis Feed", pass: downsample }
