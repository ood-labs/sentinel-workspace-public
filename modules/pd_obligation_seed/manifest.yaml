name: "PD / Obligation Seed"
version: "1.0"
mode: generator
resolution: [1280, 720]

viewport:
  hint: "Bespoke semantic source: folded obligations, counterparty voids, hinges, rails, and phase-locked liability."

parameters:
  - { name: phase, display: "Ledger Phase", type: float, min: 0.0, max: 1.0, default: 0.13, group: "Time" }

  - { name: world_scale, display: "World Scale", type: float, min: 0.55, max: 1.45, default: 1.0, group: "Composition" }
  - { name: leverage_point, display: "Leverage Origin", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.16, -0.09], group: "Composition" }
  - { name: orbit_radius, display: "Obligation Radius", type: float, min: 0.15, max: 0.74, default: 0.44, group: "Composition" }
  - { name: plate_count, display: "Obligation Count", type: int, min: 3, max: 12, default: 9, group: "Composition" }

  - { name: plate_scale, display: "Plate Scale", type: float, min: 0.45, max: 2.0, default: 1.0, group: "Obligations" }
  - { name: torsion, display: "Contract Torsion", type: float, min: -2.0, max: 2.0, default: 0.72, group: "Obligations" }
  - { name: fold_bias, display: "Fold Bias", type: float, min: -1.5, max: 1.5, default: 0.65, group: "Obligations" }
  - { name: plate_opacity, display: "Substrate", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Obligations" }
  - { name: fold_shade, display: "Fold Shade", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Obligations" }
  - { name: void_gain, display: "Counterparty Voids", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Obligations" }
  - { name: edge_gain, display: "Plate Edges", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Obligations" }
  - { name: hinge_gain, display: "Hinges", type: float, min: 0.0, max: 2.0, default: 1.25, group: "Obligations" }
  - { name: bar_gain, display: "Debt Bars", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Obligations" }

  - { name: ledger_gain, display: "Perspective Ledger", type: float, min: 0.0, max: 1.5, default: 0.27, group: "Registration" }
  - { name: aperture_gain, display: "Liability Aperture", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Registration" }
  - { name: tick_gain, display: "Aperture Ticks", type: float, min: 0.0, max: 2.0, default: 0.72, group: "Registration" }
  - { name: frame_gain, display: "Contract Frame", type: float, min: 0.0, max: 1.5, default: 0.55, group: "Registration" }

  - { name: liability_gain, display: "Margin Call", type: float, min: 0.0, max: 3.0, default: 1.3, group: "Liability" }
  - { name: liability_color, display: "Liability Color", type: color, default: [1.0, 0.33, 0.035], group: "Liability" }

  - { name: binary_threshold, display: "Binary Threshold", type: float, min: 0.02, max: 0.75, default: 0.18, group: "Image Discipline" }
  - { name: binary_snap, display: "Binary Snap", type: float, min: 0.0, max: 1.0, default: 0.46, group: "Image Discipline" }
  - { name: exposure, display: "Exposure", type: float, min: 0.25, max: 2.0, default: 1.0, group: "Image Discipline" }

passes:
  - name: obligation_seed
    shader: obligation_seed.hlsl
    target: cs_5_0
    time_dependent: true
    output: output

outputs:
  - { name: "Obligation Field", pass: obligation_seed }
