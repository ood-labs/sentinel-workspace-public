name: "PD / Portal Relay"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Program", slot: 0, required: true }

data_inputs:
  - name: "Particle Records"
    slot: 0
    schema:
      - { name: position, type: float3 }
      - { name: age, type: float }
      - { name: origin, type: float3 }
      - { name: life, type: float }
      - { name: axis, type: float2 }
      - { name: mass, type: float }
      - { name: seed, type: float }
      - { name: kind, type: uint }
      - { name: emitterId, type: uint }
      - { name: active, type: uint }
      - { name: serial, type: uint }

viewport:
  hint: "Portal Relay: a live aperture cut from the Particle Records lane, with depth rings and kind-specific spokes."

parameters:
  - { name: portal_mix, display: "Portal Mix", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Portal" }
  - { name: portal_radius, display: "Portal Radius", type: float, min: 0.16, max: 0.48, default: 0.30, group: "Portal" }
  - { name: portal_gain, display: "Portal Ink", type: float, min: 0.0, max: 2.0, default: 0.76, group: "Portal" }
  - { name: portal_drift, display: "Portal Drift", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Motion" }
  - { name: portal_phase, display: "Portal Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: liability_color, display: "Liability Signal", type: color, default: [1.0, 0.31, 0.025], group: "Look" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: output

outputs:
  - { name: "Program", pass: render }
