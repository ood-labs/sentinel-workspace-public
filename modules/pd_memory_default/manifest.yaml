name: "PD / Memory Default"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Program", slot: 0, required: true }
  - { name: "Emission Field", slot: 1, required: true }

buffers:
  - { name: default_memory, format: RGBA16F, scale: 0.5, persistent: true }

viewport:
  hint: "Persistent receding liabilities: the current 3D emission field is deposited into a half-resolution memory volume and advected toward the live vanishing point."

parameters:
  - { name: phase, display: "Memory Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Transport" }
  - { name: retention, display: "Debt Retention", type: float, min: 0.85, max: 0.9995, default: 0.982, group: "Memory" }
  - { name: advection, display: "Depth Advection", type: float, min: -2.0, max: 4.0, default: 1.15, group: "Memory" }
  - { name: twist, display: "Receivership Twist", type: float, min: -2.0, max: 2.0, default: 0.16, group: "Memory" }
  - { name: deposit, display: "Liability Deposit", type: float, min: 0.0, max: 2.5, default: 0.72, group: "Memory" }
  - { name: default_impulse, display: "Default Impulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Memory" }
  - { name: clear_memory, display: "Clear Memory", type: button, group: "Memory" }

  - { name: vanishing_point, display: "Memory Vanishing Point", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.18, -0.10], group: "Camera Contract" }
  - { name: memory_gain, display: "Remembered Liability", type: float, min: 0.0, max: 2.5, default: 0.58, group: "Compositor" }
  - { name: current_gain, display: "Current Program", type: float, min: 0.0, max: 1.5, default: 0.82, group: "Compositor" }
  - { name: etch_gain, display: "Memory Etch", type: float, min: 0.0, max: 2.0, default: 0.44, group: "Compositor" }
  - { name: liability_color, display: "Liability Signal", type: color, default: [1.0, 0.31, 0.025], group: "Compositor" }

passes:
  - name: accumulate
    shader: accumulate.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:default_memory" }
      - { slot: 1, source: "input:1" }
    output: "buffer:default_memory"

  - name: remembered_program
    shader: remembered_program.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:default_memory" }
      - { slot: 2, source: "input:1" }
    output: output

  - name: memory_preview
    shader: memory_preview.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:default_memory" }

outputs:
  - { name: "Remembered Program", pass: remembered_program }
  - { name: "Memory Field", pass: memory_preview }
