name: "Industrial Mono Post"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Scene", slot: 0, required: true }

parameters:
  - { name: exposure, display: "Exposure", type: float, min: 0.1, max: 4.0, default: 1.15, group: "Tone" }
  - { name: contrast, display: "Contrast", type: float, min: 0.2, max: 3.0, default: 1.18, group: "Tone" }
  - { name: crush_blacks, display: "Crush Blacks", type: float, min: 0.0, max: 0.6, default: 0.02, group: "Tone" }
  - { name: lift_highlights, display: "Lift Highlights", type: float, min: 0.35, max: 2.0, default: 1.0, group: "Tone" }
  - { name: gamma_lift, display: "Gamma", type: float, min: 0.3, max: 2.5, default: 0.88, group: "Tone" }
  - { name: saturation, display: "Saturation", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Tone" }
  - { name: split_tone_amount, display: "Split Tone", type: float, min: -1.0, max: 1.0, default: 0.08, group: "Tone" }
  - { name: bloom_threshold, display: "Bloom Threshold", type: float, min: 0.0, max: 2.0, default: 0.72, group: "Bloom" }
  - { name: bloom_intensity, display: "Bloom Intensity", type: float, min: 0.0, max: 3.0, default: 0.55, group: "Bloom" }
  - { name: bloom_radius, display: "Bloom Radius", type: float, min: 0.002, max: 0.12, default: 0.026, group: "Bloom" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 2.0, default: 0.92, group: "Lens" }
  - { name: grain_amount, display: "Film Grain", type: float, min: 0.0, max: 0.25, default: 0.025, group: "Lens" }

passes:
  - name: post
    shader: post.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Out", pass: post }
