name: "Interactive Building Massing"
version: "2.0"
mode: generator
resolution: [1280, 720]

panel:
  mode: canvas
  output: "Building Plan"
  resolution: follow_panel

parameters:
  - { name: tool_mode, display: "Tool", type: enum, options: [Move, Rotate], flags: button_grid, default: 0, group: "Plan Editor" }
  - { name: move_tool, display: "Move", type: button, hidden: true, group: "Plan Editor" }
  - { name: rotate_tool, display: "Rotate", type: button, hidden: true, group: "Plan Editor" }
  - { name: snap_enabled, display: "Snap", type: bool, default: true, group: "Plan Editor" }
  - { name: snap_step, display: "Move Snap", type: float, min: 0.05, max: 1.0, default: 0.25, group: "Plan Editor" }
  - { name: reset_selected, display: "Reset Selected", type: button, hidden: true, group: "Plan Editor" }
  - { name: reset_all, display: "Reset All", type: button, hidden: true, group: "Plan Editor" }
  - { name: fit_view, display: "Fit View", type: button, hidden: true, group: "Plan Editor" }
  - { name: composition, display: "Composition", type: int, min: 0, max: 3, default: 0, group: "Massing" }
  - { name: tower_height, display: "Tower Height", type: float, min: 5.0, max: 15.0, default: 8.8, group: "Massing" }
  - { name: tower_width, display: "Tower Width", type: float, min: 5.0, max: 15.0, default: 10.4, group: "Massing" }
  - { name: tower_depth, display: "Tower Depth", type: float, min: 3.0, max: 11.0, default: 6.8, group: "Massing" }
  - { name: podium_width, display: "Podium Width", type: float, min: 8.0, max: 18.0, default: 12.0, group: "Podium" }
  - { name: podium_depth, display: "Podium Depth", type: float, min: 5.0, max: 14.0, default: 8.4, group: "Podium" }
  - { name: crown_scale, display: "Crown Scale", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Details" }
  - { name: secondary_scale, display: "Secondary Mass", type: float, min: 0.0, max: 1.0, default: 0.34, group: "Details" }
  - { name: canopy_scale, display: "Canopy Scale", type: float, min: 0.0, max: 1.0, default: 0.45, group: "Details" }

viewport:
  hint: "Select a mass, then drag to move or rotate. Middle-drag pans; wheel zooms. M/T tools, S snap, F fit."
  interactions: [events, selection]
  selection: { mode: single, provider: ray_query, result_buffer: pick_result, object_buffer: viewport_objects }
  input:
    pointer: [left, middle, wheel]
    keyboard: [m, t, s, f, backspace, escape, shift]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: select_mass, label: "Select Mass" }
    - { gesture: left_drag, action: transform_mass, label: "Transform Mass" }
    - { gesture: middle_drag, action: pan_plan, label: "Pan Plan" }
    - { gesture: wheel, action: zoom_plan, label: "Zoom Plan" }
    - { key: m, action: move_mode, label: "Move Tool" }
    - { key: t, action: rotate_mode, label: "Rotate Tool" }
    - { key: s, action: toggle_snap, label: "Toggle Snap" }
    - { key: f, action: fit_view, label: "Fit Plan" }
  # ui-label: title = MASSING WORKBENCH
  # ui-label: plan = LIVE BLUEPRINT / 18M SITE GRID
  # ui-label: move = MOVE
  # ui-label: rotate = ROTATE
  # ui-label: snap = SNAP
  # ui-label: fit = FIT
  # ui-label: reset = RST
  # ui-label: reset_all = RST ALL
  controls:
    - { id: move, kind: button, param: move_tool, rect: [0.430,0.032,0.515,0.078], label: "Move Tool" }
    - { id: rotate, kind: button, param: rotate_tool, rect: [0.522,0.032,0.615,0.078], label: "Rotate Tool" }
    - { id: snap, kind: toggle, param: snap_enabled, rect: [0.622,0.032,0.695,0.078], label: "Snap" }
    - { id: fit, kind: button, param: fit_view, rect: [0.702,0.032,0.765,0.078], label: "Fit Plan" }
    - { id: reset, kind: button, param: reset_selected, rect: [0.772,0.032,0.855,0.078], label: "Reset Selected" }
    - { id: reset_all, kind: button, param: reset_all, rect: [0.862,0.032,0.970,0.078], label: "Reset All" }

buffers:
  - { name: editor_state, structured: true, element_size: 80, element_count: 1, persistent: true }
  - { name: drag_snapshot, structured: true, element_size: 32, element_count: 5, persistent: true }
  - { name: massing_state, structured: true, element_size: 32, element_count: 5, persistent: true }
  - { name: base_pnodes, structured: true, element_size: 48, element_count: 12 }
  - { name: pnodes, structured: true, element_size: 48, element_count: 12 }
  - { name: viewport_objects, structured: true, element_size: 120, element_count: 5, persistent: true }
  - { name: pick_result, structured: true, element_size: 40, element_count: 1, persistent: true }

state_buffers:
  - name: massing_state
    max_elements: 5
    schema:
      - { name: offset, type: float2 }
      - { name: yaw_offset, type: float }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
      - { name: pad, type: float3 }

passes:
  - { name: base, shader: emit_records.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 64, thread_group_y: 1, output: "buffer:base_pnodes" }
  - { name: interaction, shader: interaction.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:massing_state" }, { slot: 1, source: "buffer:pnodes" } ], output: "buffer:editor_state" }
  - { name: snapshot, shader: snapshot.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:massing_state" } ], output: "buffer:drag_snapshot" }
  - { name: update, shader: update.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:drag_snapshot" } ], output: "buffer:massing_state" }
  - { name: apply_state, shader: apply_state.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 64, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:base_pnodes" }, { slot: 1, source: "buffer:massing_state" } ], output: "buffer:pnodes" }
  - { name: descriptors, shader: descriptors.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 8, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:pnodes" } ], output: "buffer:viewport_objects" }
  - { name: pick, shader: pick.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:pnodes" }, { slot: 1, source: "buffer:editor_state" } ], output: "buffer:pick_result" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:pnodes" }, { slot: 1, source: "buffer:editor_state" } ], output: output }

outputs:
  - { name: "Building Plan", pass: preview }

data_outputs:
  - name: PNodes
    buffer: pnodes
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float, count: 1 }
      - { name: kind_id, type: float, count: 1 }
      - { name: seed, type: float, count: 1 }
      - { name: yaw, type: float, count: 1 }
      - { name: height, type: float, count: 1 }
      - { name: width, type: float, count: 1 }
      - { name: depth, type: float, count: 1 }
      - { name: dir, type: float, count: 2 }
