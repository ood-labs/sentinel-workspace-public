name: "Impossible Portal Plan"
version: "1.0"
mode: generator
resolution: [640, 360]
inputs:
  - { name: "Mirror Material", slot: 0, required: true }
buffers:
  - { name: portals, structured: true, element_size: 64, element_count: 16 }
parameters:
  - { name: portal_seed, display: "Portal Seed", type: int, min: 0, max: 999, default: 613, group: "Grammar" }
  - { name: portal_count, display: "Portal Count", type: int, min: 3, max: 16, default: 9, group: "Grammar" }
  - { name: master_phase, display: "Master Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: spread, display: "Orbital Spread", type: float, min: 0.2, max: 1.8, default: 0.92, group: "Structure" }
  - { name: radius_scale, display: "Portal Scale", type: float, min: 0.35, max: 2.0, default: 1.0, group: "Structure" }
  - { name: depth_spread, display: "Depth Spread", type: float, min: 0, max: 1.5, default: 0.82, group: "Structure" }
  - { name: focus, display: "Orbital Focus", type: point2D, min: [-1, -1], max: [1, 1], default: [0, 0], group: "Structure" }
passes:
  - { name: emit_portals, shader: emit_portals.hlsl, target: cs_5_0, dispatch: [1, 1, 1], thread_group_x: 16, thread_group_y: 1, output: "buffer:portals" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:portals" }
    output: output
outputs:
  - { name: "Portal Preview", pass: preview }
data_outputs:
  - name: "Portal Records"
    buffer: portals
    schema:
      - { name: center, type: float2 }
      - { name: radius, type: float }
      - { name: thickness, type: float }
      - { name: rotation, type: float }
      - { name: sector_count, type: float }
      - { name: depth, type: float }
      - { name: material, type: float }
      - { name: phase, type: float }
      - { name: speed, type: float }
      - { name: eccentricity, type: float2 }
      - { name: opacity, type: float }
      - { name: scale, type: float }
      - { name: active, type: float }
      - { name: reserved, type: float }
