name: "Fractal Field Render"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F

data_inputs:
  - name: "Seeds"
    slot: 0
    schema:
      - { name: orbit, type: float4 }
      - { name: color, type: float4 }
      - { name: rule, type: float4 }
      - { name: warp, type: float4 }

parameters:
  - { name: iterations, display: "Iterations", type: int, min: 2, max: 14, default: 8, group: "Fractal" }
  - { name: zoom, display: "Zoom", type: float, min: 0.25, max: 4.0, default: 1.05, group: "Fractal" }
  - { name: fold, display: "Fold", type: float, min: 0.0, max: 3.0, default: 1.25, group: "Fractal" }
  - { name: morph, display: "Morph", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Fractal" }
  - { name: fractal_power, display: "Power", type: float, min: -1.0, max: 4.0, default: 0.65, group: "Fractal" }
  - { name: kaleidoscope, display: "Kaleidoscope", type: int, min: 1, max: 12, default: 7, group: "Fractal" }
  - { name: line_density, display: "Line Density", type: float, min: 4.0, max: 90.0, default: 58.000000, group: "Render" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 4.0, default: 1.35, group: "Render" }
  - { name: intensity, display: "Intensity", type: float, min: 0.2, max: 4.0, default: 1.05, group: "Render" }
  - { name: circuit, display: "Circuit Lines", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Render" }
  - { name: motion, display: "Motion", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Animation" }
  - { name: palette_spin, display: "Palette Spin", type: float, min: -3.14, max: 3.14, default: 0.45, group: "Animation" }
  - { name: designer_center, display: "Center", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.0, 0.0], group: "View" }

passes:
  - name: render
    shader: fractal_render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }

outputs:
  - { name: "Fractal Field", pass: render }

