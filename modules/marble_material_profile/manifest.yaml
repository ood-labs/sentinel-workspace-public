name: "Marble Material Profile"
version: "0.1"
mode: generator
resolution: [640, 360]

buffers:
  - name: profile
    structured: true
    element_size: 64
    element_count: 1

parameters:
  - { name: stone_color, display: "Stone", type: color, default: [0.045,0.052,0.062], group: "Marble" }
  - { name: vein_color, display: "Veins", type: color, default: [0.46,0.50,0.56], group: "Marble" }
  - { name: vein_scale, display: "Vein Scale", type: float, min: 2.0, max: 24.0, default: 8.5, group: "Marble" }
  - { name: vein_contrast, display: "Vein Contrast", type: float, min: 0.4, max: 5.0, default: 2.2, group: "Marble" }
  - { name: pore_scale, display: "Pore Scale", type: float, min: 0.0, max: 1.0, default: 0.65, group: "Marble" }
  - { name: roughness, display: "Roughness", type: float, min: 0.08, max: 1.0, default: 0.24, group: "Response" }
  - { name: cavity_depth, display: "Cavity Depth", type: float, min: 0.0, max: 1.0, default: 0.84, group: "Response" }
  - { name: subsurface, display: "Subsurface Lift", type: float, min: 0.0, max: 1.0, default: 0.05, group: "Response" }
  - { name: micro_normal, display: "Micro Normal", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Response" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1,1,1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:profile"
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:profile" }

data_outputs:
  - name: "Marble Profile"
    buffer: profile
    schema:
      - { name: stone_color_roughness, type: float4 }
      - { name: vein_color_scale, type: float4 }
      - { name: vein_contrast_pore_scale, type: float4 }
      - { name: cavity_subsurface_micro_normal, type: float4 }

outputs:
  - name: "Material Preview"
    pass: preview
