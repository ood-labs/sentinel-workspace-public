name: "Interleave Gate"
version: "1.0"
mode: filter
resolution_source: "match:input"

inputs:
  - { name: "Echo Volume", slot: 0, required: true }
  - { name: "Lattice Key", slot: 1, required: true }

parameters:
  - name: dissolve
    display: "Grid Dissolve"
    type: float
    min: 0.0
    max: 1.0
    default: 0.72
    group: "Interleave"
  - name: cut_width
    display: "Cut Width"
    type: float
    min: 1.0
    max: 24.0
    default: 9.0
    group: "Interleave"
  - name: tonal_steps
    display: "Tonal Steps"
    type: float
    min: 2.0
    max: 12.0
    default: 5.0
    group: "Interleave"
  - name: echo_gain
    display: "Echo Gain"
    type: float
    min: 0.2
    max: 1.6
    default: 0.88
    group: "Balance"
  - name: source_trace
    display: "Source Trace"
    type: float
    min: 0.0
    max: 1.0
    default: 0.22
    group: "Balance"
  - name: signal_rescue
    display: "Signal Rescue"
    type: float
    min: 0.0
    max: 2.0
    default: 1.15
    group: "Balance"

passes:
  - name: interleave
    shader: interleave.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
    output: output

outputs:
  - { name: "Interleaved", pass: interleave }
