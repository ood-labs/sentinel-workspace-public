name: "AXIOM 12 / FRAME REFINERY"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Relief Program", slot: 0, required: true }

parameters:
  - { name: frame_mode, display: "Frame Grammar", type: enum, default: 1, options: ["Quiet Instrument", "Asymmetric Rails", "Archival Gate"], flags: button_grid, group: "Frame" }
  - { name: cleanup_strength, display: "Perimeter Quieting", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Cleanup" }
  - { name: left_quiet_width, display: "Left Quiet Zone", type: float, min: 0.0, max: 0.22, default: 0.105, group: "Cleanup" }
  - { name: right_quiet_width, display: "Right Quiet Zone", type: float, min: 0.0, max: 0.18, default: 0.052, group: "Cleanup" }
  - { name: bottom_quiet_height, display: "Bottom Quiet Zone", type: float, min: 0.0, max: 0.18, default: 0.065, group: "Cleanup" }
  - { name: top_quiet_height, display: "Top Quiet Zone", type: float, min: 0.0, max: 0.14, default: 0.038, group: "Cleanup" }
  - { name: frame_inset, display: "Frame Inset", type: float, min: 0.008, max: 0.10, default: 0.022, group: "Frame" }
  - { name: frame_gain, display: "Frame Hairline", type: float, min: 0.0, max: 1.5, default: 0.72, group: "Frame" }
  - { name: tick_count, display: "Horizontal Divisions", type: int, min: 5, max: 24, default: 13, group: "Frame" }
  - { name: tick_gain, display: "Calibration Ticks", type: float, min: 0.0, max: 1.5, default: 0.48, group: "Frame" }
  - { name: datum_gain, display: "Left Datum", type: float, min: 0.0, max: 1.5, default: 0.52, group: "Frame" }
  - { name: activity, display: "Live Activity", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Live Accent" }
  - { name: accent_gain, display: "Activity Notch", type: float, min: 0.0, max: 1.5, default: 0.72, group: "Live Accent" }
  - { name: frame_phase, display: "Frame Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: paper_color, display: "Instrument White", type: color, default: [0.91, 0.90, 0.86], group: "Palette" }
  - { name: accent_color, display: "Kinetic Vermilion", type: color, default: [1.0, 0.14, 0.02], group: "Palette" }

passes:
  - name: refine_frame
    shader: frame_refinery.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Master Program", pass: refine_frame }

viewport:
  hint: "Passive final presentation layer. Preserves the real top-left telemetry, suppresses noisy perimeter debris, and redraws the whole composition with sparse one-pixel datum rails and calibration ticks. No mouse controls."
