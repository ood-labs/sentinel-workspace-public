name: "Living Room Architecture Controls"
version: "1.0"
mode: generator
resolution: [480, 270]

parameters:
  - { name: room_offset, display: "Room Offset X/Z", type: point2D, min: [-2.0, -2.0], max: [2.0, 2.0], default: [0.0, 0.0], group: "Room" }
  - { name: room_width, display: "Room Width", type: float, min: 6.0, max: 12.0, default: 8.8, group: "Room" }
  - { name: room_depth, display: "Room Depth", type: float, min: 5.0, max: 10.0, default: 7.2, group: "Room" }
  - { name: ceiling_height, display: "Ceiling Height", type: float, min: 2.6, max: 5.0, default: 3.6, group: "Room" }
  - { name: window_position, display: "Window X/Height", type: point2D, min: [-3.5, 0.15], max: [3.5, 1.5], default: [-1.25, 0.78], group: "Back Wall" }
  - { name: window_scale, display: "Window Scale", type: float, min: 0.5, max: 1.5, default: 1.0, group: "Back Wall" }
  - { name: door_x, display: "Door X", type: float, min: -3.8, max: 3.8, default: 3.35, group: "Back Wall" }
  - { name: rug_position, display: "Rug Position X/Z", type: point2D, min: [-3.0, -2.5], max: [3.0, 2.5], default: [-0.2, 0.2], group: "Floor" }
  - { name: rug_size, display: "Rug Size", type: float, min: 0.55, max: 1.35, default: 1.0, group: "Floor" }
  - { name: pendant_spread, display: "Pendant Spread", type: float, min: 0.4, max: 5.0, default: 2.4, group: "Ceiling" }
  - { name: pendant_drop, display: "Pendant Drop", type: float, min: 0.25, max: 1.6, default: 0.65, group: "Ceiling" }
  - { name: pendant_z, display: "Pendant Z", type: float, min: -2.5, max: 2.5, default: 0.15, group: "Ceiling" }
  - { name: art_center_x, display: "Art Center X", type: float, min: -2.5, max: 2.5, default: -0.375, group: "Back Wall/Art" }
  - { name: art_spread, display: "Art Spread", type: float, min: 1.0, max: 7.0, default: 4.75, group: "Back Wall/Art" }
  - { name: art_height, display: "Art Height", type: float, min: 0.4, max: 2.4, default: 1.45, group: "Back Wall/Art" }

buffers:
  - name: pnodes
    structured: true
    element_size: 48
    element_count: 12

passes:
  - name: emit
    shader: emit_records.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:pnodes"
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:pnodes" }

outputs:
  - { name: "Architecture Preview", pass: preview }

data_outputs:
  - name: PNodes
    buffer: pnodes
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float, count: 1 }
      - { name: kind_id, type: float, count: 1 }
      - { name: seed, type: float, count: 1 }
      - { name: yaw, type: float, count: 1 }
      - { name: height, type: float, count: 1 }
      - { name: width, type: float, count: 1 }
      - { name: depth, type: float, count: 1 }
      - { name: dir, type: float, count: 2 }
