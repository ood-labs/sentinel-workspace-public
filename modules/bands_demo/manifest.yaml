name: "Bands Demo"
version: "1.0"
mode: generator
resolution: [1280, 720]

# A consumer of audio_bands, and a demonstration of what its outputs are good
# for. There is no data link: everything arrives through expressions onto the
# six parameters below, which is how a control output reaches a parameter.
#
#   sentinel_expression set /sentinel/pipelines/bands_demo/parameters/kick_env
#     expression: ref("audio_bands/control_outputs/kick")
#
# The split that matters is envelope versus counter. An envelope multiplies into
# a size or a brightness and needs no state. A counter is a monotonic number, so
# a CHANGE in it is a discrete trigger, and a trigger can seed an object with its
# own lifetime. Both are used here, side by side, so the difference is visible.

parameters:
  # Envelopes, 0..1, decaying at the analyser's Output Decay.
  - { name: kick_env,  display: "Kick Env",  group: "Signals", type: float, min: 0.0, max: 1.0, default: 0.0 }
  - { name: snare_env, display: "Snare Env", group: "Signals", type: float, min: 0.0, max: 1.0, default: 0.0 }
  - { name: hat_env,   display: "Hat Env",   group: "Signals", type: float, min: 0.0, max: 1.0, default: 0.0 }

  # Lifetime hit counts. Monotonic, so the DELTA is the trigger. The range has
  # to cover a long session: at 2 hits a second a set runs into six figures.
  - { name: kick_hits,  display: "Kick Count",  group: "Signals", type: float, min: 0.0, max: 100000000.0, default: 0.0 }
  - { name: snare_hits, display: "Snare Count", group: "Signals", type: float, min: 0.0, max: 100000000.0, default: 0.0 }
  - { name: hat_hits,   display: "Hat Count",   group: "Signals", type: float, min: 0.0, max: 100000000.0, default: 0.0 }

  - { name: ring_speed, display: "Ring Speed (px/s)", group: "Look", type: float, min: 40.0, max: 900.0, default: 260.0 }
  - { name: ring_life,  display: "Ring Life (s)",     group: "Look", type: float, min: 0.3,  max: 4.0,   default: 1.7 }

buffers:
  # [0..31] kick rings (birth_time, seed, active, spare)
  # [32]    counters    (last_kick, last_snare, last_hat, ring_write)
  # [33]    snare state (y_target, y_prev, jump_time, spare)
  # [34]    init flag   (initialised, spare, spare, spare)
  - { name: pool, structured: true, element_size: 16, element_count: 35, persistent: true }

passes:
  - name: spawn
    shader: spawn.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:pool"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:pool" }
    output: output

outputs:
  - { name: "Demo", pass: render }
