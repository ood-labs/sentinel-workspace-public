name: "Forensic Evidence Planner"
version: "1.0"
mode: generator
resolution: [1280, 720]

data_inputs:
  - name: "Blobs"
    slot: 0
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }
  - name: "Corners"
    slot: 1
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }
  - name: "Lines"
    slot: 2
    schema:
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: angle, type: float }
      - { name: length, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

buffers:
  - { name: evidence_agents, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: evidence_stats, structured: true, element_size: 16, element_count: 1 }

data_outputs:
  - name: "Evidence Agents"
    buffer: "evidence_agents"
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: weight, type: float }
      - { name: radius, type: float }
      - { name: kind, type: uint }
      - { name: sourceIndex, type: uint }
      - { name: groupId, type: uint }
      - { name: active, type: uint }
      - { name: phase, type: float }
      - { name: pad, type: float }

control_outputs:
  - { name: active_agents, buffer: evidence_stats, element: 0, field_offset: 0, description: "Active Evidence Agents" }
  - { name: mean_weight, buffer: evidence_stats, element: 0, field_offset: 4, description: "Mean Agent Weight" }
  - { name: blob_agents, buffer: evidence_stats, element: 0, field_offset: 8, description: "Macro Blob Agents" }
  - { name: line_agents, buffer: evidence_stats, element: 0, field_offset: 12, description: "Directional Line Agents" }

viewport:
  hint: "Planner preview: amber macro regions, white corner agents, gray line constraints, live telemetry at bottom."

parameters:
  - { name: analysis_width, display: "Analysis Width", type: float, min: 64.0, max: 2048.0, default: 480.0, group: "Contract" }
  - { name: analysis_height, display: "Analysis Height", type: float, min: 64.0, max: 2048.0, default: 270.0, group: "Contract" }
  - { name: max_blob_agents, display: "Blob Agents", type: int, min: 0, max: 12, default: 4, group: "Ranking" }
  - { name: max_corner_agents, display: "Corner Agents", type: int, min: 0, max: 48, default: 24, group: "Ranking" }
  - { name: max_line_agents, display: "Line Agents", type: int, min: 0, max: 12, default: 8, group: "Ranking" }
  - { name: blob_weight_gain, display: "Blob Weight", type: float, min: 0.1, max: 12.0, default: 4.0, group: "Mapping" }
  - { name: blob_radius_gain, display: "Blob Radius", type: float, min: 0.1, max: 3.0, default: 1.15, group: "Mapping" }
  - { name: corner_response_scale, display: "Corner Weight", type: float, min: 0.01, max: 0.5, default: 0.11, group: "Mapping" }
  - { name: line_weight_gain, display: "Line Weight", type: float, min: 0.1, max: 8.0, default: 2.25, group: "Mapping" }
  - { name: temporal_follow, display: "Temporal Follow", type: float, min: 0.05, max: 2.0, default: 0.42, group: "Motion" }
  - { name: phase_rate, display: "Agent Phase", type: float, min: 0.0, max: 2.0, default: 0.18, group: "Motion" }
  - { name: current_color, display: "Current Color", type: color, default: [1.0, 0.30, 0.045], group: "Preview" }

passes:
  - name: plan
    shader: plan.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "data:2" }
      - { slot: 3, source: "buffer:evidence_agents" }
    output: "buffer:evidence_agents"
  - name: stats
    shader: stats.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:evidence_agents" }
    output: "buffer:evidence_stats"
  - name: preview
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:evidence_agents" }
      - { slot: 1, source: "buffer:evidence_stats" }
    output: output

outputs:
  - { name: "Planner Preview", pass: preview }
