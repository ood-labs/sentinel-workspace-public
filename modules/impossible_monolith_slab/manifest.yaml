name: "Impossible Monolith Slab"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Cipher Program", slot: 0, required: true }

parameters:
  - { name: slab_mix, display: "Slab Mix", type: float, min: 0.0, max: 1.0, default: 0.84, group: "Monolith" }
  - { name: slab_phase, display: "Slab Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: slab_rate, display: "Slab Rate", type: float, min: -2.0, max: 2.0, default: 0.34, group: "Motion" }
  - { name: slab_center_x, display: "Slab Center X", type: float, min: 0.0, max: 1.0, default: 0.60, group: "Monolith" }
  - { name: slab_center_y, display: "Slab Center Y", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Monolith" }
  - { name: slab_width, display: "Slab Width", type: float, min: 0.14, max: 0.64, default: 0.38, group: "Monolith" }
  - { name: slab_height, display: "Slab Height", type: float, min: 0.18, max: 0.82, default: 0.56, group: "Monolith" }
  - { name: slab_tilt, display: "Slab Tilt", type: float, min: -1.0, max: 1.0, default: 0.26, group: "Motion" }
  - { name: edge_gain, display: "Edge Gain", type: float, min: 0.0, max: 1.5, default: 0.96, group: "Ink" }
  - { name: slab_color, display: "Slab Color", type: color, default: [0.66,0.68,0.67], group: "Ink" }
  - { name: edge_color, display: "Edge Color", type: color, default: [0.96,0.18,0.04], group: "Ink" }

passes:
  - name: monolith
    shader: monolith.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Monolith Program", pass: monolith }
