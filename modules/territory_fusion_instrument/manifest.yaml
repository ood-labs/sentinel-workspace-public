name: "Fusion Instrument"
version: "1.0"
mode: filter

inputs:
  - { name: "Loom", slot: 0 }
  - { name: "Seismic", slot: 1 }
  - { name: "Towers", slot: 2 }

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: warp_strength, display: "Loom Warp", type: float, min: 0.0, max: 4.0, default: 1.35, group: "Fusion" }
  - { name: aperture_gain, display: "Seismic Aperture", type: float, min: 0.25, max: 4.0, default: 1.45, group: "Fusion" }
  - { name: loom_gain, display: "Registry Gain", type: float, min: 0.0, max: 2.0, default: 0.78, group: "Fusion" }
  - { name: tower_contrast, display: "Terrain Contrast", type: float, min: 0.65, max: 2.2, default: 1.18, group: "Fusion" }
  - { name: accent, display: "Accent", type: color, default: [1.0, 0.19, 0.03], group: "Palette" }

passes:
  - name: compose
    shader: compose.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
    output: output
