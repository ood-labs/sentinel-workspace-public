name: "Impossible Floor Archive"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Observatory Program", slot: 0, required: true }

parameters:
  - { name: archive_mix, display: "Archive Mix", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Floor" }
  - { name: floor_y, display: "Floor Horizon", type: float, min: 0.52, max: 0.9, default: 0.72, group: "Floor" }
  - { name: floor_height, display: "Floor Depth", type: float, min: 0.08, max: 0.5, default: 0.28, group: "Floor" }
  - { name: archive_phase, display: "Archive Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: card_rate, display: "Card Rate", type: float, min: -2.0, max: 2.0, default: 0.44, group: "Motion" }
  - { name: fold_angle, display: "Fold Angle", type: float, min: -1.0, max: 1.0, default: 0.18, group: "Motion" }
  - { name: archive_gain, display: "Archive Gain", type: float, min: 0.0, max: 1.4, default: 0.72, group: "Ink" }
  - { name: paper_color, display: "Paper Color", type: color, default: [0.86,0.84,0.76], group: "Ink" }
  - { name: line_color, display: "Line Color", type: color, default: [0.02,0.03,0.04], group: "Ink" }

passes:
  - name: archive
    shader: archive.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Archived Floor Program", pass: archive }
