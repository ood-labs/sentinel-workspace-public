    group: "Geodesic"

  - name: geodesic_width
    display: "Path Stroke"
    type: float
    min: 0.45
    max: 4.0
    default: 1.20
    group: "Geodesic"

  - name: groove_width
    display: "Incision Reach"
    type: float
    min: 0.5
    max: 8.0
    default: 2.8
    group: "Geodesic"

  - name: groove_depth
    display: "Incision Depth"
    type: float
    min: 0.0
