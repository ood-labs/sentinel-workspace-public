    group: "Structural Hush"

  - name: asymmetry_rate
    display: "Unfold Rate"
    type: float
    min: 0.0
    max: 0.12
    default: 0.031
    group: "Asymmetric Unfold"

  - name: asymmetry_amount
    display: "Unfold Reach"
    type: float
    min: 0.0
    max: 0.12
    default: 0.055
    group: "Asymmetric Unfold"

  - name: asymmetry_lobe
    display: "Unfolded Lobe"
    type: enum
