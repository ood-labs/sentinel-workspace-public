name: "Phase Lattice Depth Tilt"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Separated Field", slot: 0, required: true }

buffers:
  - { name: geodesic_target, structured: true, element_size: 16, element_count: 24 }
  - { name: geodesic_points, structured: true, element_size: 16, element_count: 24 }
  - { name: geodesic_previous, structured: true, element_size: 16, element_count: 24, persistent: true }
  - { name: breath_current, structured: true, element_size: 32, element_count: 1 }
  - { name: breath_previous, structured: true, element_size: 32, element_count: 1, persistent: true }

parameters:
  - name: breath_rate
    display: "Macro Breath Rate"
    type: float
    min: 0.0
    max: 0.20
    default: 0.050
    group: "Macro Rhythm"

  - name: breath_amount
    display: "Macro Breath Depth"
    type: float
    min: 0.0
    max: 0.10
    default: 0.034
    group: "Macro Rhythm"

  - name: drift_rate
    display: "Barycenter Rate"
    type: float
    min: 0.0
    max: 0.06
    default: 0.011
    group: "Compositional Drift"

  - name: drift_amount
    display: "Barycenter Reach"
    type: float
    min: 0.0
    max: 0.14
    default: 0.10
    group: "Compositional Drift"

  - name: drift_phase_offset
    display: "Barycenter Phase"
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    group: "Compositional Drift"

  - name: eclipse_rate
    display: "Umbra Cycle"
    type: float
    min: 0.0
    max: 0.04
    default: 0.007
    group: "Umbra Migration"

  - name: eclipse_phase_offset
    display: "Umbra Phase"
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    group: "Umbra Migration"

  - name: eclipse_lobe
    display: "Umbra Lobe"
    type: enum
    default: 3
    options: [I, II, III, IV, V]
    flags: button_grid
    group: "Umbra Migration"

  - name: eclipse_reach
    display: "Umbra Reach"
    type: float
    min: 0.04
    max: 0.34
    default: 0.28
    group: "Umbra Migration"

  - name: eclipse_retraction
    display: "Lobe Retraction"
    type: float
    min: 0.0
    max: 0.24
    default: 0.16
    group: "Umbra Migration"

  - name: eclipse_softness
    display: "Penumbral Edge"
    type: float
    min: 0.015
    max: 0.12
    default: 0.055
    group: "Umbra Migration"

  - name: eclipse_depth
    display: "Umbra Depth"
    type: float
    min: 0.0
    max: 1.0
    default: 0.92
    group: "Umbra Migration"

  - name: eclipse_dissolution
    display: "Lobe Dissolution"
    type: float
    min: 0.0
    max: 1.0
    default: 0.74
    group: "Umbra Migration"

  - name: eclipse_filament_occlusion
    display: "Filament Occlusion"
    type: float
