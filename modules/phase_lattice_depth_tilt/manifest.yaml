    default: 0.0125
    group: "Geodesic"

  - name: gradient_gate
    display: "Contour Gate"
    type: float
    min: 0.0
    max: 0.20
    default: 0.012
    group: "Geodesic"

  - name: contour_follow
    display: "Contour Following"
    type: float
    min: 0.0
