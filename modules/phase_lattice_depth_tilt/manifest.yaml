    default: 0.46
    group: "Geodesic"

  - name: groove_bevel
    display: "Incision Bevel"
    type: float
    min: 0.0
    max: 0.50
    default: 0.18
    group: "Geodesic"

  - name: geodesic_gain
    display: "Path Presence"
    type: float
    min: 0.0
    max: 1.0
    default: 0.94
