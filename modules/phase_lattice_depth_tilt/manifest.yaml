    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Geodesic"

  - name: geodesic_far_soften
    display: "Far-Plane Softening"
    type: float
    min: 0.0
    max: 4.0
    default: 1.65
    group: "Geodesic"

  - name: ridge_occlusion
    display: "Contour Occlusion"
    type: float
    min: 0.0
    max: 1.0
    default: 0.58
    group: "Geodesic"

  - name: geodesic_substrate_floor
    display: "Substrate Floor"
    type: float
    min: 0.0
    max: 0.24
    default: 0.025
    group: "Geodesic Material"

  - name: geodesic_substrate_softness
    display: "Substrate Transition"
    type: float
    min: 0.01
    max: 0.30
    default: 0.10
    group: "Geodesic Material"

  - name: geodesic_substrate_minimum
    display: "Void Continuity"
    type: float
    min: 0.0
    max: 0.50
    default: 0.12
    group: "Geodesic Material"

  - name: accent_repair_pixels
    display: "Straight-Line Repair"
    type: float
    min: 1.0
    max: 9.0
    default: 4.2
    group: "Accent"

  - name: accent_repair
    display: "Legacy Accent Removal"
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Accent"

  - name: azimuth_x
    display: "Live Azimuth X"
    type: float
    min: -1.0
    max: 1.0
    default: 0.0
    group: "Live Driver"

  - name: azimuth_y
    display: "Live Azimuth Y"
    type: float
    min: -1.0
    max: 1.0
    default: 1.0
    group: "Live Driver"

  - name: azimuth_confidence
    display: "Live Confidence"
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    group: "Live Driver"

  - name: tilt_core
    display: "Tilt Origin"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Placement"

passes:
  - name: integrate_breath
    shader: integrate_breath.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:breath_previous" }
    output: "buffer:breath_current"

  - name: commit_breath
    shader: commit_breath.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:breath_current" }
    output: "buffer:breath_previous"

  - name: trace_geodesic
    shader: trace_geodesic.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "input:0" }
    output: "buffer:geodesic_target"

  - name: smooth_geodesic
    shader: smooth_geodesic.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:geodesic_target" }
      - { slot: 1, source: "buffer:geodesic_previous" }
    output: "buffer:geodesic_points"

  - name: commit_geodesic
    shader: commit_geodesic.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:geodesic_points" }
    output: "buffer:geodesic_previous"

  - name: project_depth
    shader: tilt.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:geodesic_points" }
      - { slot: 2, source: "buffer:breath_current" }
    output: output
