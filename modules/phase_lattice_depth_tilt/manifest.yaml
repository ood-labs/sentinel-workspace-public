  - name: hush_amount
    display: "Structural Hush"
    type: float
    min: 0.0
    max: 0.80
    default: 0.42
    group: "Structural Hush"

  - name: hush_floor
    display: "Retained Ridge Floor"
    type: float
    min: 0.02
    max: 0.40
    default: 0.16
    group: "Structural Hush"

  - name: hush_softness
    display: "Ridge Transition"
