name: "PD / Performance Exchange"
version: "1.0"
mode: generator
resolution: [960, 540]

inputs:
  - { name: "Program", slot: 0, required: true }

data_inputs:
  - name: "Debt Quanta"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: axis, type: float2 }
      - { name: mass, type: float }
      - { name: radius, type: float }
      - { name: kind, type: uint }
      - { name: sourceIndex, type: uint }
      - { name: ledgerId, type: uint }
      - { name: active, type: uint }
      - { name: phase, type: float }
      - { name: age, type: float }

buffers:
  - { name: event_state, format: RGBA32F, scale: 0.02, persistent: true }
  - { name: exchange_state, structured: true, element_size: 48, element_count: 1, persistent: true }

state_buffers:
  - name: exchange_state
    max_elements: 1
    schema:
      - { name: focus, type: float2 }
      - { name: divergence, type: float }
      - { name: cameraFollow, type: float }
      - { name: printPressure, type: float }
      - { name: marginCall, type: float }
      - { name: activeDebt, type: float }
      - { name: macroMass, type: float }
      - { name: generation, type: float }
      - { name: initialized, type: float }
      - { name: owner, type: float }
      - { name: pad, type: float }

control_outputs:
  - { name: focus_x, buffer: exchange_state, element: 0, field_offset: 0, description: "Stage-remapped vanishing point X" }
  - { name: focus_y, buffer: exchange_state, element: 0, field_offset: 4, description: "Stage-remapped vanishing point Y" }
  - { name: divergence, buffer: exchange_state, element: 0, field_offset: 8, description: "Directional split of Debt Quanta" }
  - { name: camera_follow, buffer: exchange_state, element: 0, field_offset: 12, description: "Depth-follow zoom strength" }
  - { name: print_pressure, buffer: exchange_state, element: 0, field_offset: 16, description: "Emitter density performance macro" }
  - { name: margin_call, buffer: exchange_state, element: 0, field_offset: 20, description: "Decaying momentary performance impulse" }
  - { name: active_debt, buffer: exchange_state, element: 0, field_offset: 24, description: "Real active Debt Quanta count" }
  - { name: macro_mass, buffer: exchange_state, element: 0, field_offset: 28, description: "Real aggregate blob liability mass" }
  - { name: interaction_generation, buffer: exchange_state, element: 0, field_offset: 32, description: "Durable gesture mutation sequence" }
  - { name: interaction_owner, buffer: exchange_state, element: 0, field_offset: 40, description: "Current captured interaction region" }
  - { name: raw_event_probe, buffer: exchange_state, element: 0, field_offset: 44, description: "Last delivered event encoded as type.phase.code" }

panel:
  mode: canvas
  output: UI
  resolution: follow_panel

viewport:
  hint: "Drag anywhere on the fitted Program to move its vanishing point. The right spatial pad splits record trajectories and increases camera follow. The lower rail controls print pressure."
  interactions: [events]
  input:
    pointer: [left]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: place_focus_or_trigger, label: "Place Focus / Trigger" }
    - { gesture: left_drag, action: perform_spatial_control, label: "Perform Spatial Control" }
  # ui-label: title = PERFORMANCE EXCHANGE
  # ui-label: stage = LEDGER VOLUME / DIRECT FOCUS
  # ui-label: flow = DIVERGENCE / CAMERA FOLLOW
  # ui-label: pressure = PRINT PRESSURE
  # ui-label: margin = MARGIN CALL
  # ui-label: active = ACTIVE DEBT
  # ui-label: macro = MACRO MASS
  # ui-label: instruction = DRAG STAGE OR RIGHT-HAND FIELDS

passes:
  - name: events
    shader: events.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:event_state" }
      - { slot: 1, source: "buffer:exchange_state" }
    output: "buffer:event_state"

  - name: compile_macros
    shader: macros.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:event_state" }
      - { slot: 1, source: "buffer:exchange_state" }
      - { slot: 2, source: "data:0" }
    output: "buffer:exchange_state"

  - name: render_ui
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:exchange_state" }
    output: output

outputs:
  - { name: "UI", pass: render_ui }
