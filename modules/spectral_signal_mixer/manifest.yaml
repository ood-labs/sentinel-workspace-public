name: "Spectral Signal Mixer"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Constellation", slot: 0, required: true }

viewport:
  hint: "Final performance look: switch topology, move the center, and tune spectral separation."

parameters:
  - { name: visual_mode, display: "Topology", type: enum, default: 0, options: [Prism, Radial Fold, Data Mosaic], flags: button_grid, group: "Performance" }
  - { name: performance_center, display: "Performance Center", type: point2D, min: [0.1,0.1], max: [0.9,0.9], default: [0.5,0.5], group: "Performance" }
  - { name: chroma_shift, display: "Spectral Separation", type: float, min: 0.0, max: 18.0, default: 3.8, group: "Performance" }
  - { name: symmetry, display: "Fold Symmetry", type: float, min: 2.0, max: 16.0, default: 7.0, group: "Topology" }
  - { name: mosaic_cells, display: "Mosaic Cells", type: float, min: 2.0, max: 24.0, default: 7.0, group: "Topology" }
  - { name: drift, display: "Topology Drift", type: float, min: -2.0, max: 2.0, default: 0.45, group: "Topology" }
  - { name: edge_gain, display: "Neon Edges", type: float, min: 0.0, max: 2.0, default: 0.42, group: "Signal" }
  - { name: bloom_gain, display: "Bloom", type: float, min: 0.0, max: 3.0, default: 0.72, group: "Signal" }
  - { name: bloom_radius, display: "Bloom Radius", type: float, min: 1.0, max: 12.0, default: 4.0, group: "Signal" }
  - { name: bloom_threshold, display: "Bloom Gate", type: float, min: 0.0, max: 1.0, default: 0.32, group: "Signal" }
  - { name: saturation, display: "Saturation", type: float, min: 0.0, max: 2.5, default: 1.32, group: "Grade" }
  - { name: contrast, display: "Contrast", type: float, min: 0.5, max: 2.5, default: 1.18, group: "Grade" }
  - { name: posterize, display: "Quantize", type: float, min: 0.0, max: 1.0, default: 0.08, group: "Grade" }
  - { name: poster_steps, display: "Quantize Steps", type: float, min: 4.0, max: 32.0, default: 12.0, group: "Grade" }
  - { name: scanlines, display: "Scan Matrix", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Grade" }
  - { name: vignette_strength, display: "Vignette", type: float, min: 0.0, max: 1.0, default: 0.34, group: "Grade" }
  - { name: exposure, display: "Master Exposure", type: float, min: 0.3, max: 2.5, default: 1.08, group: "Performance" }

passes:
  - name: prism
    shader: prism.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
  - name: bloom
    shader: bloom.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:prism" }
  - name: grade
    shader: grade.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "pass:prism" }
      - { slot: 1, source: "pass:bloom" }
    output: output

outputs:
  - { name: "Program", pass: grade }
