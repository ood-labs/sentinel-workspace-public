name: "AXIOM 14 / LEFT SLICE ATLAS"
version: "1.0"
mode: generator
resolution: [1280,720]
inputs:
  - { name: "Refined Program", slot: 0, required: true }
  - { name: "Relief Field", slot: 1, required: true }
  - { name: "Feature Ridges", slot: 2, required: true }
parameters:
  - { name: atlas_gain, display: "Atlas Ink", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Slice Atlas" }
  - { name: displacement, display: "Slice Displacement", type: float, min: 0.0, max: 0.08, default: 0.024, group: "Slice Atlas" }
  - { name: slice_phase, display: "Slice Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Slice Atlas" }
  - { name: ridge_gain, display: "Ridge Overprint", type: float, min: 0.0, max: 2.0, default: 0.85, group: "Slice Atlas" }
  - { name: paper_color, display: "Instrument White", type: color, default: [0.91,0.90,0.86], group: "Palette" }
  - { name: accent_color, display: "Slice Vermilion", type: color, default: [1.0,0.14,0.02], group: "Palette" }
passes:
  - name: render_atlas
    shader: slice_atlas.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
    output: output
outputs:
  - { name: "Master Program", pass: render_atlas }
viewport:
  hint: "Three live relief slices extracted from the height-map field, with displaced scanlines and Features ridge overprint. No mouse controls."
