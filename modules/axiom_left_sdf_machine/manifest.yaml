name: "AXIOM 15 / LEFT SDF MACHINE"
version: "1.0"
mode: generator
resolution: [1280,720]
inputs:
  - { name: "Refined Program", slot: 0, required: true }
  - { name: "Relief Field", slot: 1, required: true }
data_inputs:
  - name: "Choir Nodes"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: weight, type: float }
      - { name: kind, type: float }
      - { name: group_id, type: float }
      - { name: rank, type: float }
      - { name: response, type: float }
      - { name: radius, type: float }
      - { name: active, type: float }
      - { name: id, type: float }
  - name: "Kinetic Events"
    slot: 1
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: speed, type: float }
      - { name: energy, type: float }
      - { name: active, type: float }
      - { name: id, type: float }
parameters:
  - { name: machine_gain, display: "Machine Gain", type: float, min: 0.0, max: 2.0, default: 0.82, group: "SDF Machine" }
  - { name: machine_phase, display: "Machine Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "SDF Machine" }
  - { name: relief_mix, display: "Relief Coupling", type: float, min: 0.0, max: 1.0, default: 0.48, group: "SDF Machine" }
  - { name: paper_color, display: "Instrument White", type: color, default: [0.91,0.90,0.86], group: "Palette" }
  - { name: accent_color, display: "Kinetic Vermilion", type: color, default: [1.0,0.14,0.02], group: "Palette" }
passes:
  - name: render_machine
    shader: sdf_machine.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "data:0" }
      - { slot: 3, source: "data:1" }
    output: output
outputs:
  - { name: "Master Program", pass: render_machine }
viewport:
  hint: "Live bounded SDF machine assembled from Choir Nodes and Kinetic Events over the Relief field. Five primitive families: boxes, capsules, rings, wedges, route filaments. No mouse controls."
