name: "Impossible Annotation Weave"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Program In", slot: 0, required: true }

data_inputs:
  - name: "Route Records"
    slot: 0
    element_size: 48
    element_count: 48
    schema:
      - { name: p0, type: float2 }
      - { name: p1, type: float2 }
      - { name: width, type: float }
      - { name: palette, type: float }
      - { name: group_id, type: float }
      - { name: phase, type: float }
      - { name: dash, type: float }
      - { name: elevation, type: float }
      - { name: active, type: float }
      - { name: reserved, type: float }

parameters:
  - { name: weave_phase, display: "Weave Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Performance" }
  - { name: elevation_gate, display: "Hero Elevation Gate", type: float, min: -0.2, max: 1.2, default: 0.42, group: "Routes" }
  - { name: hero_width, display: "Hero Route Width", type: float, min: 0.4, max: 3.0, default: 1.32, group: "Routes" }
  - { name: hero_gain, display: "Hero Route Gain", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Routes" }
  - { name: endpoint_radius, display: "Endpoint Radius", type: float, min: 0.002, max: 0.03, default: 0.009, group: "Routes" }
  - { name: endpoint_gain, display: "Endpoint Gain", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Routes" }
  - { name: trim_width, display: "Editorial Trim", type: float, min: 0.02, max: 0.16, default: 0.045, group: "Frame" }
  - { name: trim_color, display: "Trim Ink", type: color, default: [0.018,0.020,0.028], group: "Frame" }
  - { name: trim_opacity, display: "Trim Opacity", type: float, min: 0.0, max: 1.0, default: 0.86, group: "Frame" }
  - { name: index_strip_gain, display: "Index Strip", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Frame" }
  - { name: microbar_gain, display: "Microbar Gain", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Frame" }
  - { name: registration_gain, display: "Registration Gain", type: float, min: 0.0, max: 1.0, default: 0.68, group: "Frame" }

passes:
  - name: weave
    shader: weave.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: output

outputs:
  - { name: "Woven Program", pass: weave }
