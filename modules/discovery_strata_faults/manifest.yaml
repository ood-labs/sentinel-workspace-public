name: "Territory A - Strata Faults"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_play, display: "Master Play", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Clock" }
  - { name: layer_count, display: "Strata Count", type: int, min: 8, max: 42, default: 24, group: "Structure" }
  - { name: fault_offset, display: "Fault Offset", type: float, min: -0.55, max: 0.55, default: 0.08, group: "Structure" }
  - { name: section_warp, display: "Section Warp", type: float, min: 0.05, max: 1.0, default: 0.42, group: "Structure" }
  - { name: contour_width, display: "Contour Width", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Rendering" }
  - { name: accent_gain, display: "Fault Accent", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Rendering" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output
