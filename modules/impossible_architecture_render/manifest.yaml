name: "Impossible Architecture Render"
version: "1.0"
mode: generator
resolution: [1280, 720]

data_inputs:
  - name: "Face Records"
    slot: 0
    element_size: 64
    element_count: 288
    schema:
      - { name: center, type: float2 }
      - { name: size, type: float2 }
      - { name: axis_x, type: float2 }
      - { name: axis_y, type: float2 }
      - { name: depth, type: float }
      - { name: face_kind, type: float }
      - { name: palette, type: float }
      - { name: pattern, type: float }
      - { name: source_id, type: float }
      - { name: group_id, type: float }
      - { name: phase, type: float }
      - { name: active, type: float }
  - name: "Route Records"
    slot: 1
    element_size: 48
    element_count: 48
    schema:
      - { name: p0, type: float2 }
      - { name: p1, type: float2 }
      - { name: width, type: float }
      - { name: palette, type: float }
      - { name: group_id, type: float }
      - { name: phase, type: float }
      - { name: dash, type: float }
      - { name: elevation, type: float }
      - { name: active, type: float }
      - { name: reserved, type: float }

parameters:
  - { name: focus_point, display: "Architectural Focus", type: point2D, min: [0.0,0.0], max: [1.0,1.0], default: [0.57,0.46], group: "Performance" }
  - { name: rupture_vector, display: "Rupture Vector", type: point2D, min: [-0.4,-0.4], max: [0.4,0.4], default: [0.05,-0.025], group: "Performance" }
  - { name: rupture_strength, display: "Rupture Strength", type: float, min: 0.0, max: 2.0, default: 0.32, group: "Performance" }
  - { name: route_phase, display: "Route Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Performance" }
  - { name: paper_color, display: "Paper", type: color, default: [0.92,0.90,0.84], group: "Palette" }
  - { name: ink_color, display: "Ink", type: color, default: [0.025,0.027,0.035], group: "Palette" }
  - { name: pattern_density, display: "Pattern Density", type: float, min: 0.0, max: 1.0, default: 0.68, group: "Print Language" }
  - { name: pattern_scale, display: "Pattern Scale", type: float, min: 2.0, max: 18.0, default: 7.0, group: "Print Language" }
  - { name: aperture_gain, display: "Aperture Ink", type: float, min: 0.0, max: 1.0, default: 0.74, group: "Print Language" }
  - { name: grid_ink, display: "Editorial Grid", type: float, min: 0.0, max: 1.0, default: 0.13, group: "Print Language" }
  - { name: outline_width, display: "Outline Width", type: float, min: 0.5, max: 5.0, default: 1.8, group: "Edges" }
  - { name: shadow_opacity, display: "Shadow Opacity", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Edges" }
  - { name: route_width, display: "Route Width", type: float, min: 0.25, max: 2.5, default: 0.82, group: "Routes" }
  - { name: route_intensity, display: "Route Prominence", type: float, min: 0.0, max: 1.5, default: 0.88, group: "Routes" }
  - { name: dash_mix, display: "Route Dash Mix", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Routes" }
  - { name: focus_marker, display: "Focus Reticle", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Overlay" }
  - { name: print_grain, display: "Print Grain", type: float, min: 0.0, max: 0.05, default: 0.008, group: "Finish" }
  - { name: vignette_amount, display: "Vignette", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Finish" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
    output: output

outputs:
  - { name: "Program", pass: render }
