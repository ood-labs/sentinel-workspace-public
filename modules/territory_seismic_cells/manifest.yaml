name: "Territory 2 - Seismic Cells"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: propagation, display: "Propagation", type: float, min: 0.02, max: 0.45, default: 0.16, group: "Field" }
  - { name: damping, display: "Damping", type: float, min: 0.80, max: 0.999, default: 0.965, group: "Field" }
  - { name: contour_density, display: "Contour Density", type: float, min: 2.0, max: 24.0, default: 9.0, group: "Display" }
  - { name: accent, display: "Accent", type: color, default: [1.0, 0.20, 0.035], group: "Display" }

buffers:
  - name: wave_field
    format: RGBA16F
    scale: 0.5
    persistent: true

passes:
  - name: evolve
    shader: evolve.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:wave_field" }
    output: "buffer:wave_field"

  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:wave_field" }
    output: output
