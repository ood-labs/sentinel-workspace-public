name: "Feature Constellation"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Source Image", slot: 0, required: true }

data_inputs:
  - name: "Corner Data"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }
  - name: "Blob Data"
    slot: 1
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

viewport:
  hint: "Feature coordinates generate the luminous network; tune the spatial bias and trail response."

parameters:
  - { name: palette_a, display: "Ion Color", group: "Performance/Palette", type: color, default: [0.06, 0.82, 1.0] }
  - { name: palette_b, display: "Arc Color", group: "Performance/Palette", type: color, default: [1.0, 0.12, 0.62] }
  - { name: center_bias, display: "Field Bias", group: "Performance/Shape", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.0, 0.0] }
  - { name: analysis_size, display: "Analysis Size", group: "Analysis", type: vec2, min: [64.0, 64.0], max: [4096.0, 2160.0], default: [480.0, 270.0], hidden: true }
  - { name: base_gain, display: "Source Presence", group: "Performance/Mix", type: float, min: 0.0, max: 1.5, default: 0.72 }
  - { name: response_gain, display: "Feature Sensitivity", group: "Performance/Shape", type: float, min: 0.2, max: 4.0, default: 1.45 }
  - { name: point_radius, display: "Node Radius", group: "Performance/Shape", type: float, min: 1.0, max: 18.0, default: 5.5 }
  - { name: point_gain, display: "Node Energy", group: "Performance/Mix", type: float, min: 0.0, max: 3.0, default: 1.35 }
  - { name: link_gain, display: "Link Energy", group: "Performance/Mix", type: float, min: 0.0, max: 3.0, default: 0.82 }
  - { name: orbit_gain, display: "Orbit Energy", group: "Performance/Mix", type: float, min: 0.0, max: 3.0, default: 0.74 }
  - { name: link_sharpness, display: "Link Focus", group: "Network", type: float, min: 40.0, max: 360.0, default: 185.0 }
  - { name: dash_density, display: "Signal Density", group: "Network", type: float, min: 0.2, max: 4.0, default: 1.3 }
  - { name: flow_speed, display: "Signal Rate", group: "Network", type: float, min: -3.0, max: 3.0, default: 0.72 }
  - { name: pulse_speed, display: "Node Pulse", group: "Network", type: float, min: 0.0, max: 4.0, default: 1.1 }
  - { name: trail_decay, display: "Trail Memory", group: "Trails", type: float, min: 0.86, max: 0.999, default: 0.965 }
  - { name: trail_zoom, display: "Trail Drift", group: "Trails", type: float, min: -3.0, max: 6.0, default: 1.1 }
  - { name: trail_chroma, display: "Spectral Echo", group: "Trails", type: float, min: 0.0, max: 3.0, default: 1.2 }
  - { name: exposure, display: "Exposure", group: "Performance/Mix", type: float, min: 0.4, max: 2.5, default: 1.15 }

buffers:
  - { name: trail, format: RGBA16F, persistent: true }

passes:
  - name: raster
    shader: raster.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
      - { slot: 2, source: "data:1" }
  - name: feedback
    shader: feedback.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:raster" }
      - { slot: 1, source: "buffer:trail" }
    output: "buffer:trail"
  - name: present
    shader: present.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:trail" }
    output: output

outputs:
  - { name: "Constellation", pass: present }
