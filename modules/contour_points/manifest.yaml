name: "Contour Points"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Contour Scene", slot: 0, required: true }

parameters:
  - { name: density, display: "Point Density", type: float, min: 0.0, max: 1.0, default: 0.48, group: "Field" }
  - { name: point_size, display: "Point Size", type: float, min: 0.001, max: 0.02, default: 0.0045, group: "Field" }
  - { name: jitter, display: "Point Jitter", type: float, min: 0.0, max: 0.04, default: 0.009, group: "Motion" }
  - { name: drift, display: "Point Drift", type: float, min: 0.0, max: 1.0, default: 0.09, group: "Motion" }
  - { name: base_mix, display: "Base Structure", type: float, min: 0.0, max: 1.0, default: 0.24, group: "Output" }
  - { name: point_gain, display: "Point Gain", type: float, min: 0.0, max: 2.0, default: 1.15, group: "Output" }

passes:
  - name: points
    shader: points.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Point Scene", pass: points }
