name: "CRYO / Pulse"
version: "1.0"
mode: generator
resolution: [1280, 480]
features: [audio]

viewport:
  hint: "Spectral-flux onset detection. Red line = adaptive threshold, amber ticks = accepted onsets."

data_inputs:
  - name: "Mel Bands"
    slot: 0
    schema:
      - { name: hop_index, type: uint }
      - { name: sample_position, type: uint }
      - { name: generation_counter, type: uint }
      - { name: qpc_ticks_lo, type: uint }
      - { name: qpc_ticks_hi, type: uint }
      - { name: sample_rate, type: uint }
      - { name: fft_size, type: uint }
      - { name: hop_size, type: uint }
      - { name: value_count, type: uint }
      - { name: energy, type: float }

buffers:
  - { name: pstate,      structured: true, element_size: 32, element_count: 654 }
  - { name: pstate_prev, structured: true, element_size: 32, element_count: 654, persistent: true }
  - { name: acorr,       structured: true, element_size: 16, element_count: 256 }

parameters:
  - { name: input_gain,       display: "Input Gain",        group: "Analysis", type: float, min: 1.0,   max: 4000.0, default: 600.0 }
  - { name: low_split,        display: "Low/Mid Band Split", group: "Analysis", type: float, min: 2.0,  max: 60.0,   default: 12.0 }
  - { name: mid_split,        display: "Mid/High Band Split", group: "Analysis", type: float, min: 8.0, max: 130.0,  default: 58.0 }
  - { name: energy_smooth,    display: "Energy Smoothing",  group: "Analysis", type: float, min: 0.005, max: 0.5,   default: 0.08 }
  - { name: level_gain,       display: "Level Gain",        group: "Analysis", type: float, min: 0.1,   max: 8.0,    default: 1.6 }

  - { name: threshold_adapt,  display: "Threshold Adapt",   group: "Detection", type: float, min: 0.002, max: 0.4,  default: 0.045 }
  - { name: threshold_floor,  display: "Threshold Floor",   group: "Detection", type: float, min: 0.0,   max: 4.0,   default: 0.12 }
  - { name: sensitivity_low,  display: "Kick Sensitivity",  group: "Detection", type: float, min: 0.3,   max: 8.0,   default: 2.1 }
  - { name: sensitivity_mid,  display: "Snare Sensitivity", group: "Detection", type: float, min: 0.3,   max: 8.0,   default: 2.4 }
  - { name: sensitivity_high, display: "Hat Sensitivity",   group: "Detection", type: float, min: 0.3,   max: 8.0,   default: 2.6 }
  - { name: refractory_low,   display: "Kick Refractory (s)",  group: "Detection", type: float, min: 0.02, max: 0.6, default: 0.115 }
  - { name: refractory_mid,   display: "Snare Refractory (s)", group: "Detection", type: float, min: 0.02, max: 0.6, default: 0.100 }
  - { name: refractory_high,  display: "Hat Refractory (s)",   group: "Detection", type: float, min: 0.01, max: 0.4, default: 0.045 }
  - { name: release_time,     display: "Envelope Release (s)", group: "Detection", type: float, min: 0.02, max: 1.5, default: 0.16 }

  - { name: bpm_min,          display: "Tempo Min BPM",     group: "Tempo", type: float, min: 40.0,  max: 140.0, default: 72.0 }
  - { name: bpm_max,          display: "Tempo Max BPM",     group: "Tempo", type: float, min: 90.0,  max: 220.0, default: 178.0 }
  - { name: tempo_interval,   display: "Tempo Interval (hops)", group: "Tempo", type: float, min: 8.0, max: 128.0, default: 24.0 }
  - { name: tempo_smooth,     display: "Tempo Smoothing",   group: "Tempo", type: float, min: 0.02,  max: 1.0,   default: 0.25 }
  - { name: half_time_bias,   display: "Half-Time Bias",    group: "Tempo", type: float, min: 0.3,   max: 1.5,   default: 0.80 }
  - { name: pll_gain,         display: "Beat PLL Gain",     group: "Tempo", type: float, min: 0.0,   max: 1.0,   default: 0.16 }
  - { name: tempo_lock_min,   display: "PLL Lock Threshold", group: "Tempo", type: float, min: 0.0,  max: 1.0,   default: 0.12 }
  - { name: pulse_shape,      display: "Beat Pulse Shape",  group: "Tempo", type: float, min: 0.5,   max: 12.0,  default: 4.0 }

  - { name: spectro_gain,     display: "Spectrogram Gain",  group: "Readout", type: float, min: 0.1, max: 6.0,  default: 1.1 }
  - { name: spectro_hops,     display: "Spectrogram Hops",  group: "Readout", type: float, min: 32.0, max: 480.0, default: 300.0 }
  - { name: trace_hops,       display: "Trace Hops",        group: "Readout", type: float, min: 32.0, max: 480.0, default: 220.0 }
  - { name: trace_scale,      display: "Trace Scale",       group: "Readout", type: float, min: 0.2, max: 20.0, default: 4.0 }

passes:
  # One thread per candidate lag, over last cook's committed history.
  - name: tempo
    shader: tempo.hlsl
    target: cs_5_0
    dispatch: [4, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:pstate_prev" }
    output: "buffer:acorr"

  - name: analyze
    shader: analyze.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "buffer:pstate_prev" }
      - { slot: 2, source: "buffer:acorr" }
    output: "buffer:pstate"

  - name: commit
    shader: commit.hlsl
    target: cs_5_0
    dispatch: [11, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:pstate" }
    output: "buffer:pstate_prev"

  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:pstate" }
    output: output

control_outputs:
  - { name: bpm,          buffer: pstate, element: 650, field_offset: 8,  description: "Estimated tempo" }
  - { name: beat_phase,   buffer: pstate, element: 650, field_offset: 12, description: "Beat phase 0..1" }
  - { name: tempo_conf,   buffer: pstate, element: 650, field_offset: 24, description: "Tempo confidence 0..1" }
  - { name: beat_pulse,   buffer: pstate, element: 650, field_offset: 28, description: "Beat pulse envelope 0..1" }
  - { name: kick,         buffer: pstate, element: 651, field_offset: 0,  description: "Kick envelope 0..1" }
  - { name: snare,        buffer: pstate, element: 651, field_offset: 4,  description: "Snare envelope 0..1" }
  - { name: hihat,        buffer: pstate, element: 651, field_offset: 8,  description: "Hi-hat envelope 0..1" }
  - { name: kick_count,   buffer: pstate, element: 651, field_offset: 12, description: "Accepted kick onsets" }
  - { name: snare_count,  buffer: pstate, element: 651, field_offset: 16, description: "Accepted snare onsets" }
  - { name: hihat_count,  buffer: pstate, element: 651, field_offset: 20, description: "Accepted hat onsets" }
  - { name: onset_count,  buffer: pstate, element: 651, field_offset: 24, description: "All accepted onsets" }
  - { name: level,        buffer: pstate, element: 651, field_offset: 28, description: "Smoothed level 0..1" }
  - { name: bass,         buffer: pstate, element: 652, field_offset: 0,  description: "Smoothed low energy" }
  - { name: mid,          buffer: pstate, element: 652, field_offset: 4,  description: "Smoothed mid energy" }
  - { name: treble,       buffer: pstate, element: 652, field_offset: 8,  description: "Smoothed high energy" }

outputs:
  - { name: "Pulse", pass: preview }
