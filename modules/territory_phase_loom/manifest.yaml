name: "Territory 1 - Phase Loom"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: thread_count, display: "Thread Count", type: int, min: 12, max: 48, default: 30, group: "Weave" }
  - { name: curvature, display: "Curvature", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Weave" }
  - { name: tension, display: "Tension", type: float, min: 0.2, max: 4.0, default: 1.25, group: "Weave" }
  - { name: line_weight, display: "Line Weight", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Weave" }
  - { name: accent, display: "Accent", type: color, default: [1.0, 0.22, 0.045], group: "Palette" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output
