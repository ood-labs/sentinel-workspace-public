name: "Impossible Circuit Tunnel"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Scope Program", slot: 0, required: true }
parameters:
  - { name: tunnel_mix, display: "Tunnel Mix", type: float, min: 0, max: 1, default: 0.88, group: "Tunnel" }
  - { name: tunnel_phase, display: "Tunnel Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: travel_speed, display: "Travel Speed", type: float, min: -2, max: 2, default: 0.42, group: "Motion" }
  - { name: horizon, display: "Horizon", type: float, min: 0.18, max: 0.62, default: 0.38, group: "Tunnel" }
  - { name: perspective, display: "Perspective", type: float, min: 0.25, max: 2.0, default: 1.0, group: "Tunnel" }
  - { name: rail_gain, display: "Rail Gain", type: float, min: 0, max: 1.5, default: 0.72, group: "Structure" }
  - { name: signal_gain, display: "Signal Gain", type: float, min: 0.2, max: 2.0, default: 1.1, group: "Structure" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002, 0.003, 0.006], group: "Ink" }
  - { name: metal_color, display: "Metal Color", type: color, default: [0.55, 0.50, 0.42], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.12, 0.018], group: "Ink" }
passes:
  - name: tunnel
    shader: tunnel.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Tunnel Program", pass: tunnel }
