name: "Impossible Recursive Pocket"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Excavated Program", slot: 0, required: true }

parameters:
  - { name: pocket_mix, display: "Pocket Mix", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Pocket" }
  - { name: pocket_phase, display: "Pocket Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: pocket_rate, display: "Pocket Rate", type: float, min: -2.0, max: 2.0, default: 0.42, group: "Motion" }
  - { name: pocket_center_x, display: "Pocket Center X", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Pocket" }
  - { name: pocket_center_y, display: "Pocket Center Y", type: float, min: 0.0, max: 1.0, default: 0.70, group: "Pocket" }
  - { name: pocket_size, display: "Pocket Size", type: float, min: 0.10, max: 0.52, default: 0.30, group: "Pocket" }
  - { name: recursion_zoom, display: "Recursion Zoom", type: float, min: 0.0, max: 0.45, default: 0.20, group: "Pocket" }
  - { name: orbit_amount, display: "Orbit Amount", type: float, min: 0.0, max: 0.30, default: 0.11, group: "Motion" }
  - { name: frame_gain, display: "Frame Gain", type: float, min: 0.0, max: 1.5, default: 0.92, group: "Ink" }
  - { name: pocket_color, display: "Pocket Color", type: color, default: [0.68,0.06,0.16], group: "Ink" }
  - { name: frame_color, display: "Frame Color", type: color, default: [0.95,0.84,0.62], group: "Ink" }

passes:
  - name: recursive_pocket
    shader: recursive_pocket.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Pocket Program", pass: recursive_pocket }
