name: "PL Render"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Atlas", slot: 0, required: true }

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

parameters:
  - name: kind_mode
    display: "Kind Mode"
    type: enum
    options: [FromNode, Fixed, Cycle, Hash, ByGroup]
    default: 2
    flags: button_grid
    group: "Kind"
  - { name: fixed_kind, display: "Fixed Kind", type: int, min: 0, max: 31, default: 0, group: "Kind" }
  - { name: set_size, display: "Set Size", type: int, min: 1, max: 4, default: 4, group: "Kind" }
  - { name: kind0, display: "Kind 0", type: int, min: 0, max: 31, default: 0, group: "Kind" }
  - { name: kind1, display: "Kind 1", type: int, min: 0, max: 31, default: 3, group: "Kind" }
  - { name: kind2, display: "Kind 2", type: int, min: 0, max: 31, default: 7, group: "Kind" }
  - { name: kind3, display: "Kind 3", type: int, min: 0, max: 31, default: 20, group: "Kind" }
  - name: scale_mode
    display: "Scale Mode"
    type: enum
    options: [Uniform, ByWeight, ByDepth, Hash]
    default: 0
    flags: button_grid
    group: "Scale"
  - { name: scale_base, display: "Scale Base", type: float, min: 0.005, max: 0.6, default: 0.06, group: "Scale" }
  - { name: scale_aspect, display: "Scale Aspect", type: float, min: 0.1, max: 8.0, default: 1.0, group: "Scale" }
  - { name: scale_var, display: "Scale Var", type: float, min: 0.0, max: 1.0, default: 0.3, group: "Scale" }
  - name: tier_mode
    display: "Tier Mode"
    type: enum
    options: [Fixed, ByWeight, GroupParity, Hash]
    default: 3
    flags: button_grid
    group: "Tier"
  - { name: fixed_tier, display: "Fixed Tier", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Tier" }
  - name: rot_mode
    display: "Rot Mode"
    type: enum
    options: [FromDir, Fixed, Hash]
    default: 1
    flags: button_grid
    group: "Rotation"
  - { name: fixed_rot, display: "Fixed Rot", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Rotation" }
  - { name: rot_offset, display: "Rot Offset", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Rotation" }
  - { name: density, display: "Density", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Style" }
  - { name: boundary, display: "Boundary Frame", type: bool, default: false, flags: button, group: "Boundary" }
  - { name: boundary_pad, display: "Boundary Pad", type: float, min: 0.0, max: 0.5, default: 0.14, group: "Boundary" }
  - { name: boundary_width, display: "Boundary Width", type: float, min: 0.001, max: 0.03, default: 0.006, group: "Boundary" }
  - { name: boundary_intensity, display: "Boundary Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Boundary" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.15, group: "Output" }
  - { name: body_gain, display: "Body Gain", type: float, min: 0.0, max: 2.0, default: 1.1, group: "Output" }
  - { name: body_color, display: "Body Color", type: color, default: [0.32, 0.80, 0.62], group: "Color" }
  - { name: core_color, display: "Core Color", type: color, default: [0.78, 1.0, 0.90], group: "Color" }
  - { name: cam_amp, display: "Camera Drift", type: float, min: 0.0, max: 0.3, default: 0.04, group: "Depth 3D" }
  - { name: cam_speed, display: "Camera Speed", type: float, min: 0.0, max: 2.0, default: 0.25, group: "Depth 3D" }
  - { name: parallax, display: "Parallax", type: float, min: 0.0, max: 2.0, default: 0.4, group: "Depth 3D" }
  - { name: depth_scale, display: "Depth Scale", type: float, min: 0.0, max: 0.6, default: 0.18, group: "Depth 3D" }
  - { name: depth_fog, display: "Depth Fog", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Depth 3D" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }

outputs:
  - { name: "Layer", pass: render }
