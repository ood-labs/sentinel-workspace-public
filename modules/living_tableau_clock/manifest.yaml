name: "Living Tableau Clock"
version: "1.0"
mode: generator
resolution: [1080, 1080]
buffers:
  - { name: scene, structured: true, element_size: 32, element_count: 1 }
parameters:
  - { name: phase, display: "Manual Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Transport" }
  - { name: animation_speed, display: "Speed", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Transport" }
  - { name: loop_seconds, display: "Loop Seconds", type: float, min: 2.0, max: 30.0, default: 12.0, group: "Transport" }
  - { name: paused, display: "Pause / Scrub", type: bool, default: false, flags: button, group: "Transport" }
  - { name: drift_amount, display: "Shared Drift", type: float, min: 0.0, max: 0.04, default: 0.006, group: "Composition" }
passes:
  - { name: clock, shader: clock.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, output: "buffer:scene" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:scene" } ] }
outputs:
  - { name: "Clock Preview", pass: preview }
data_outputs:
  - name: "Scene Globals"
    buffer: scene
    schema:
      - { name: phase, type: float }
      - { name: pulse_a, type: float }
      - { name: pulse_b, type: float }
      - { name: pulse_c, type: float }
      - { name: pulse_d, type: float }
      - { name: drift, type: float2 }
      - { name: active, type: float }
