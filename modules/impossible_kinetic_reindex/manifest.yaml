name: "Impossible Kinetic Reindex"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Folded Program", slot: 0, required: true }

parameters:
  - { name: index_phase, display: "Index Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Performance" }
  - { name: reindex_amount, display: "Reindex Amount", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Performance" }
  - { name: reindex_mode, display: "Reindex Grammar", type: enum, options: [Horizontal Archive, Vertical Archive, Diagonal Issue, Distributed Index], flags: button_grid, default: 2, group: "Motion" }
  - { name: index_steps, display: "Index Steps", type: float, min: 2.0, max: 24.0, default: 8.0, group: "Motion" }
  - { name: travel, display: "Tile Travel", type: float, min: 0.0, max: 4.0, default: 1.25, group: "Motion" }
  - { name: stagger_mix, display: "Stagger", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Motion" }
  - { name: columns, display: "Columns", type: float, min: 2.0, max: 16.0, default: 7.0, group: "Grid" }
  - { name: rows, display: "Rows", type: float, min: 2.0, max: 12.0, default: 5.0, group: "Grid" }
  - { name: gutter_width, display: "Gutter Width", type: float, min: 0.0, max: 0.08, default: 0.012, group: "Grid" }
  - { name: gutter_gain, display: "Gutter Gain", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Grid" }
  - { name: mirror_tiles, display: "Mirror Selected Tiles", type: bool, default: false, flags: button, group: "Variation" }
  - { name: index_seed, display: "Index Seed", type: int, min: 0, max: 999, default: 191, group: "Variation" }

passes:
  - name: reindex
    shader: reindex.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Reindexed Program", pass: reindex }
