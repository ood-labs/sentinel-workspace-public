name: "Phase Authority"
version: "1.0"
mode: generator
resolution: [900, 420]

panel:
  mode: canvas
  output: UI
  resolution: follow_panel

parameters:
  - { name: play, display: "Play", type: bool, default: true, flags: button, group: "Transport" }
  - { name: reset, display: "Reset Phase", type: bool, default: false, flags: button, group: "Transport" }
  - { name: rate, display: "Rate (cycles/sec)", type: float, min: 0.01, max: 2.0, default: 0.18, group: "Transport" }
  - { name: scrub_mode, display: "Scrub Mode", type: bool, default: false, flags: button, group: "Scrub" }
  - { name: scrub_phase, display: "Scrub Position", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Scrub" }

viewport:
  hint: "Play/pause, reset, or enable Scrub Mode for deterministic comparison."
  interactions: [mouse]
  controls:
    - { id: play, kind: toggle, param: play, rect: [0.055, 0.79, 0.205, 0.93], label: "Play" }
    - { id: reset, kind: toggle, param: reset, rect: [0.225, 0.79, 0.375, 0.93], label: "Reset" }
    - { id: scrub_mode, kind: toggle, param: scrub_mode, rect: [0.395, 0.79, 0.585, 0.93], label: "Scrub" }
    - { id: scrub_phase, kind: slider, param: scrub_phase, rect: [0.61, 0.79, 0.945, 0.93], label: "Position" }

buffers:
  - name: phase_state
    format: RGBA32F
    scale: 0.01
    persistent: true
  - name: control_buf
    structured: true
    element_size: 32
    element_count: 1

passes:
  - name: integrate
    shader: state.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:phase_state" }
    output: "buffer:phase_state"

  - name: publish
    shader: publish.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:phase_state" }
    output: "buffer:control_buf"

  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:control_buf" }

outputs:
  - { name: "UI", pass: display }

control_outputs:
  - { name: phase, buffer: control_buf, element: 0, field_offset: 0, description: "Persistent integrated phase, wrapped 0-1" }
  - { name: envelope, buffer: control_buf, element: 0, field_offset: 4, description: "Attack-release envelope derived from phase" }
  - { name: pulse, buffer: control_buf, element: 0, field_offset: 8, description: "Narrow cycle-boundary pulse" }
  - { name: playing, buffer: control_buf, element: 0, field_offset: 12, description: "1 only during free-running playback" }
  - { name: rate, buffer: control_buf, element: 0, field_offset: 16, description: "Current master rate in cycles per second" }
  - { name: scrub_active, buffer: control_buf, element: 0, field_offset: 20, description: "1 while deterministic scrub owns phase" }
  - { name: cycle_sin, buffer: control_buf, element: 0, field_offset: 24, description: "Sine of master phase" }
  - { name: cycle_cos, buffer: control_buf, element: 0, field_offset: 28, description: "Cosine of master phase" }
