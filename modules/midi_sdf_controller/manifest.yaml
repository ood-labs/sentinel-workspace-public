name: "MIDI SDF Controller"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [camera]

data_inputs:
  - name: "Motion Bus"
    slot: 0
    schema:
      - { name: phase, type: float }
      - { name: beat, type: float }
      - { name: pad_energy, type: float }
      - { name: knob_energy, type: float }
      - { name: sweep, type: float }
      - { name: palette, type: float }
      - { name: loop_seconds, type: float }
      - { name: reserved, type: float }

parameters:
  - { name: body_color, display: "Body", type: color, default: [0.055, 0.075, 0.12], group: "Look" }
  - { name: panel_color, display: "Panel", type: color, default: [0.11, 0.14, 0.20], group: "Look" }
  - { name: accent_color, display: "Accent", type: color, default: [0.02, 0.78, 1.0], group: "Look" }
  # Fly uses Sentinel's native right-drag + WASD camera. Orbit is deterministic for captures.
  - name: cam_mode
    display: "Camera Mode"
    type: enum
    options: [Fly, Orbit]
    default: 0
    flags: button_grid
    group: "Camera"
  - { name: cam_orbit, display: "Orbit Azimuth", type: float, min: -180.0, max: 180.0, default: 20.43, group: "Camera/Orbit" }
  - { name: cam_elevation, display: "Orbit Elevation", type: float, min: 5.0, max: 85.0, default: 37.06, group: "Camera/Orbit" }
  - { name: cam_distance, display: "Orbit Distance", type: float, min: 2.5, max: 12.0, default: 4.9, group: "Camera/Orbit" }
  - { name: cam_target_y, display: "Orbit Target Y", type: float, min: -1.0, max: 3.0, default: 0.34, group: "Camera/Orbit" }
  - { name: cam_focal, display: "Orbit Focal", type: float, min: 0.4, max: 2.5, default: 1.4, group: "Camera/Orbit" }
  - { name: rotate_speed, display: "Orbit Auto Rotate", type: float, min: 0.0, max: 2.0, default: 0.0, group: "Camera/Orbit" }
  - { name: ray_steps, display: "Ray Steps", type: int, min: 48, max: 128, default: 96, group: "Quality" }

passes:
  - name: controller
    shader: controller.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }

outputs:
  - { name: "Controller", pass: controller }
