name: "Industrial Struct Merge"
version: "1.0"
mode: generator
resolution: [512, 256]
working_format: RGBA8

data_inputs:
  - name: "Struct A"
    slot: 0
    schema:
      - { name: center, type: float3 }
      - { name: axis, type: float3 }
      - { name: up, type: float3 }
      - { name: half_extents, type: float3 }
      - { name: length, type: float }
      - { name: radius, type: float }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: seed, type: float }
      - { name: group, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
  - name: "Struct B"
    slot: 1
    schema:
      - { name: center, type: float3 }
      - { name: axis, type: float3 }
      - { name: up, type: float3 }
      - { name: half_extents, type: float3 }
      - { name: length, type: float }
      - { name: radius, type: float }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: seed, type: float }
      - { name: group, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
  - name: "Struct C"
    slot: 2
    schema:
      - { name: center, type: float3 }
      - { name: axis, type: float3 }
      - { name: up, type: float3 }
      - { name: half_extents, type: float3 }
      - { name: length, type: float }
      - { name: radius, type: float }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: seed, type: float }
      - { name: group, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
  - name: "Struct D"
    slot: 3
    schema:
      - { name: center, type: float3 }
      - { name: axis, type: float3 }
      - { name: up, type: float3 }
      - { name: half_extents, type: float3 }
      - { name: length, type: float }
      - { name: radius, type: float }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: seed, type: float }
      - { name: group, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }

buffers:
  - name: merged
    structured: true
    element_size: 80
    element_count: 1024

parameters:
  - { name: max_parts, display: "Max Parts", type: int, min: 1, max: 1024, default: 512, group: "Merge" }
  - { name: debug_kind_filter, display: "Debug Kind", type: int, min: -1, max: 16, default: -1, group: "Debug" }
  - { name: global_scale, display: "Global Scale", type: float, min: 0.1, max: 4.0, default: 1.0, group: "Transform" }
  - { name: global_offset, display: "Global Offset", type: vec3, min: [-10.0, -10.0, -10.0], max: [10.0, 10.0, 10.0], default: [0.0, 0.0, 0.0], group: "Transform" }
  - { name: global_yaw, display: "Global Yaw", type: float, min: -3.1416, max: 3.1416, default: 0.0, group: "Transform" }
  - { name: enable_columns, display: "Columns", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_beams, display: "Beams", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_braces, display: "Braces", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_decks, display: "Decks", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_pipes, display: "Pipes", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_ladders, display: "Ladders", type: bool, default: true, flags: button, group: "Enable" }
  - { name: enable_rooflights, display: "Rooflights", type: bool, default: true, flags: button, group: "Enable" }
  - { name: preview_scale, display: "Preview Scale", type: float, min: 0.01, max: 0.25, default: 0.06, group: "Preview" }
  - { name: preview_offset, display: "Preview Offset", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.0, 0.0], group: "Preview" }

passes:
  - name: compute
    shader: merge.hlsl
    target: cs_5_0
    dispatch: [16, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:merged"
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "data:2" }
      - { slot: 3, source: "data:3" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:merged" }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "StructParts"
    buffer: "merged"
    schema:
      - { name: center, type: float3 }
      - { name: axis, type: float3 }
      - { name: up, type: float3 }
      - { name: half_extents, type: float3 }
      - { name: length, type: float }
      - { name: radius, type: float }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: seed, type: float }
      - { name: group, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
