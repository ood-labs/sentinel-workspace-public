name: "Run 20260723 Fault Loom"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Performance" }
  - { name: rupture, display: "Rupture", type: float, min: 0.0, max: 1.0, default: 0.63, group: "Performance" }
  - { name: fold_angle, display: "Fold Angle", type: float, min: -1.2, max: 1.2, default: -0.31, group: "Structure" }
  - { name: shear, display: "Shear", type: float, min: -1.0, max: 1.0, default: 0.34, group: "Structure" }
  - { name: cell_scale, display: "Cell Scale", type: float, min: 2.0, max: 18.0, default: 7.4, group: "Structure" }
  - { name: plate_count, display: "Plate Count", type: int, min: 3, max: 18, default: 9, group: "Structure" }
  - { name: fault_tension, display: "Fault Tension", type: float, min: 0.0, max: 1.0, default: 0.71, group: "Structure" }
  - { name: symmetry_mode, display: "Symmetry", type: enum, default: 1, options: [Mirror, Offset, Quarter], flags: button_grid, group: "Structure" }
  - { name: scar_position, display: "Scar Position", type: point2D, min: [-0.45, -0.45], max: [0.45, 0.45], default: [0.08, -0.04], group: "Composition" }
  - { name: band_width, display: "Band Width", type: float, min: 0.05, max: 1.0, default: 0.58, group: "Composition" }
  - { name: stroke_width, display: "Stroke Width", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Composition" }
  - { name: grid_strength, display: "Registration Grid", type: float, min: 0.0, max: 1.0, default: 0.27, group: "Composition" }
  - { name: paper_gain, display: "Paper Gain", type: float, min: 0.2, max: 1.4, default: 0.94, group: "Palette" }
  - { name: accent_weight, display: "Accent Weight", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Palette" }
  - { name: mask_fault_weight, display: "Mask Fault Weight", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Outputs" }
  - { name: background_color, display: "Black Field", type: color, default: [0.004, 0.006, 0.007], group: "Palette" }
  - { name: paper_color, display: "Paper", type: color, default: [0.93, 0.94, 0.91], group: "Palette" }
  - { name: accent_color, display: "Incision", type: color, default: [1.0, 0.24, 0.035], group: "Palette" }

passes:
  - name: fault_field
    shader: fault_field.hlsl
    target: cs_5_0

  - name: program
    shader: fault_program.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:fault_field" }

  - name: fault_mask
    shader: fault_mask.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:fault_field" }

outputs:
  - { name: "Program", pass: program }
  - { name: "Fault Mask", pass: fault_mask }
