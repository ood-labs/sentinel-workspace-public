name: "Quasicrystal Reciprocal Field 2D"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
output_format: RGBA16F
parameters:
  - { name: symmetry_mode, display: "Symmetry", type: enum, options: [Penrose_5, Ammann_8, Dodecagonal_12], default: 0, flags: button_grid, group: "Crystal" }
  - { name: phase, display: "Phason Phase", type: float, min: 0.0, max: 1.0, default: 0.12, group: "Crystal" }
  - { name: zoom, display: "Zoom", type: float, min: 0.4, max: 8.0, default: 3.6, group: "Crystal" }
  - { name: frequency, display: "Reciprocal Frequency", type: float, min: 2.0, max: 40.0, default: 14.5, group: "Crystal" }
  - { name: rotation, display: "Rotation", type: float, min: -3.1416, max: 3.1416, default: 0.18, group: "Crystal" }
  - { name: phason_warp, display: "Phason Warp", type: float, min: 0.0, max: 0.6, default: 0.09, group: "Crystal" }
  - { name: auto_drift, display: "Legacy Drift", type: bool, default: false, flags: button, group: "Motion" }
  - { name: contour_level, display: "Contour Level", type: float, min: -1.0, max: 1.0, default: 0.18, group: "Structure" }
  - { name: contour_sharpness, display: "Contour Sharpness", type: float, min: 1.0, max: 30.0, default: 10.0, group: "Structure" }
  - { name: cell_density, display: "Cell Density", type: float, min: 1.0, max: 12.0, default: 4.5, group: "Structure" }
  - { name: edge_power, display: "Tile Edge Power", type: float, min: 1.0, max: 10.0, default: 5.0, group: "Structure" }
  - { name: field_gain, display: "Field Gain", type: float, min: 0.0, max: 4.0, default: 1.15, group: "Color" }
  - { name: ridge_gain, display: "Ridge Gain", type: float, min: 0.0, max: 4.0, default: 1.4, group: "Color" }
  - { name: edge_gain, display: "Edge Gain", type: float, min: 0.0, max: 4.0, default: 0.75, group: "Color" }
  - { name: hue, display: "Spectrum", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Color" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Color" }
passes:
  - { name: field, shader: field.hlsl, target: cs_5_0 }
outputs:
  - { name: "Quasicrystal Field", pass: field }
