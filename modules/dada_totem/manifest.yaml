name: "Dada Totem"
version: "0.1"
mode: generator
resolution: [900, 1350]
features: [camera]

# STAGE 1 — environment + camera + lighting shell. Groups below grow as later stages
# add the spine, the part-list of solids, and the hero pieces.

parameters:
  # ---- sky / desert ----
  - { name: sky_zenith,  display: "Sky Zenith",  type: color, default: [0.50, 0.64, 0.74], group: "Environment" }
  - { name: sky_horizon, display: "Sky Horizon", type: color, default: [0.86, 0.83, 0.75], group: "Environment" }
  - { name: fog_density, display: "Haze Density", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Environment" }
  - { name: exposure,    display: "Exposure",     type: float, min: 0.2, max: 3.0, default: 1.05, group: "Environment" }
  - { name: march_dist,  display: "March Distance", type: float, min: 20.0, max: 300.0, default: 120.0, group: "Environment" }

  # ---- sun / lighting ----
  - { name: sun_azimuth,   display: "Sun Azimuth",   type: float, min: 0.0, max: 360.0, default: 62.0, group: "Sun" }
  - { name: sun_elevation, display: "Sun Elevation", type: float, min: 5.0, max: 89.0, default: 48.0, group: "Sun" }
  - { name: shadows,       display: "Sun Shadows",   type: bool, default: true, flags: button, group: "Sun" }

  # ---- motion (self-animating + reactive-ready via the signal bus) ----
  - { name: anim_speed, display: "Anim Speed", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Motion" }
  - { name: sway,       display: "Sway Amount", type: float, min: 0.0, max: 1.0, default: 0.5, group: "Motion" }

  # ---- camera ----
  # Fly = WASD + right-drag in the viewport (default). Orbit = deterministic rig for
  # reproducible review/A-B captures (drivable from MCP). Enum button-grid, never a bool.
  - name: cam_mode
    display: "Camera Mode"
    type: enum
    options: [Fly, Orbit]
    default: 0
    flags: button_grid
    group: "Camera"
  - { name: cam_orbit,     display: "Camera Orbit",     type: float, min: 0.0, max: 360.0, default: 35.0, group: "Camera" }
  - { name: cam_elevation, display: "Camera Elevation", type: float, min: -30.0, max: 85.0, default: 2.0, group: "Camera" }
  - { name: cam_distance,  display: "Camera Distance",  type: float, min: 1.0, max: 40.0, default: 9.0, group: "Camera" }
  - { name: cam_target_y,  display: "Camera Target Y",  type: float, min: -2.0, max: 12.0, default: 1.5, group: "Camera" }
  - { name: cam_focal,     display: "Camera Focal",     type: float, min: 0.6, max: 4.0, default: 1.9, group: "Camera" }
  - { name: rotate_speed,  display: "Auto Rotate",      type: float, min: 0.0, max: 2.0, default: 0.0, group: "Camera" }

passes:
  - name: render
    shader: dada.hlsl
    target: cs_5_0

outputs:
  - { name: "Totem", pass: render }
