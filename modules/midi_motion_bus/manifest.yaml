name: "MIDI Motion Bus"
version: "1.0"
mode: generator
resolution: [512, 160]

buffers:
  - name: motion_bus
    structured: true
    element_size: 32
    element_count: 1

parameters:
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Transport" }
  - { name: animation_speed, display: "Speed", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Transport" }
  - { name: loop_seconds, display: "Loop Seconds", type: float, min: 0.5, max: 12.0, default: 4.0, group: "Transport" }
  - { name: pad_energy, display: "Pad Energy", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Performance" }
  - { name: knob_energy, display: "Knob Energy", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Performance" }
  - { name: sweep_amount, display: "Playhead Size", type: float, min: 0.0, max: 1.0, default: 0.75, group: "Performance" }
  - { name: palette_mode, display: "Palette", type: enum, options: [Cyan, Magenta, Acid], default: 0, flags: button_grid, group: "Performance" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:motion_bus"
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:motion_bus" }

outputs:
  - { name: "Transport Preview", pass: preview }

data_outputs:
  - name: "Motion Bus"
    buffer: motion_bus
    schema:
      - { name: phase, type: float }
      - { name: beat, type: float }
      - { name: pad_energy, type: float }
      - { name: knob_energy, type: float }
      - { name: sweep, type: float }
      - { name: palette, type: float }
      - { name: loop_seconds, type: float }
      - { name: reserved, type: float }
