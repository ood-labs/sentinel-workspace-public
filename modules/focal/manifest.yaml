name: "Focal"
version: "1.0"
mode: generator
resolution: [64, 64]
working_format: RGBA8

buffers:
  - name: foc
    structured: true
    element_size: 16
    element_count: 1

parameters:
  - { name: pos, display: "Focal Point", type: point2D, min: [-1.78, -1.0], max: [1.78, 1.0], default: [0.9, -0.02], group: "Focal" }

passes:
  - name: compute
    shader: focal_compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:foc"
  - { name: display, shader: focal_display.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:foc" } ] }

outputs:
  - { name: "Focal", pass: display }

control_outputs:
  - { name: x, buffer: foc, element: 0, field_offset: 0, description: "Focal X (world)" }
  - { name: y, buffer: foc, element: 0, field_offset: 4, description: "Focal Y (world)" }
