name: "Persist Proof"
version: "1.0"
mode: generator
resolution: [320, 120]

# Throwaway micro-proof for the phase doc's 2E1 step-0 question, pulled forward
# because pulse2_analyzer's whitening design depends on the same property:
# does a persistent structured buffer retain slots that a pass did NOT write?
#
# One pass writes ONLY slot (n % 800). If partial-write persistence holds, slots
# n-1 and n-2 still carry their own cook numbers. If the buffer is cleared or
# reallocated per cook, they read back as zero.
#
# Also compile-checks a 2D dispatch at the same time (2E1 keeps a 1D-flattened
# tau*160+theta fallback in reserve if this fails).

buffers:
  - { name: ring, structured: true, element_size: 16, element_count: 800, persistent: true }
  - { name: probe, structured: true, element_size: 16, element_count: 8 }
  - { name: grid2d, structured: true, element_size: 16, element_count: 16000 }

passes:
  # Writes exactly one slot per cook. Everything else must survive untouched.
  - name: poke
    shader: poke.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:ring"

  # 2D dispatch compile + execution check: 100 lags x 160 phases.
  - name: grid
    shader: grid.hlsl
    target: cs_5_0
    dispatch: [13, 20, 1]
    thread_group_x: 8
    thread_group_y: 8
    output: "buffer:grid2d"

  # Reads back the neighbourhood of the write cursor so capture_data_port can
  # see whether n-1 and n-2 survived.
  - name: readback
    shader: readback.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 8
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:ring" }
      - { slot: 1, source: "buffer:grid2d" }
    output: "buffer:probe"

  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:probe" }
    output: output

data_outputs:
  - name: "Probe"
    buffer: "probe"
    schema:
      - { name: slot,      type: uint }
      - { name: cook,      type: uint }
      - { name: magic,     type: uint }
      - { name: extra,     type: uint }

outputs:
  - { name: "Proof", pass: preview }
