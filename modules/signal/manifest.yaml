name: "Topographic Signal Bus"
version: "2.1"
mode: generator
resolution: [480, 270]
working_format: RGBA8

parameters:
  - { name: authority, display: "Signal Authority (0 Manual / 1 Auto / 2 Conductor)", type: int, min: 0, max: 2, default: 1, group: "Authority" }
  - { name: cue_mode, display: "Cue Mode (0 Survey / 1 Threat / 2 Night / 3 Minimal / 4 Performance)", type: int, min: 0, max: 4, default: 0, group: "Authority" }
  - { name: terrain, display: "Terrain (0 Basins / 1 Ridges / 2 Islands / 3 Flow)", type: int, min: 0, max: 3, default: 2, group: "Map" }
  - { name: node_density, display: "Node Density", type: int, min: 12, max: 112, default: 60, group: "Map" }
  - { name: palette, display: "Palette (0 Survey / 1 Threat / 2 Night / 3 Monochrome)", type: int, min: 0, max: 3, default: 0, group: "Map" }

  - { name: layer_blue, display: "Blue Contours", type: float, min: 0.0, max: 2.0, default: 0.90, group: "Layer Mix" }
  - { name: layer_accent, display: "Accent Contours", type: float, min: 0.0, max: 2.0, default: 1.00, group: "Layer Mix" }
  - { name: layer_nodes, display: "Nodes", type: float, min: 0.0, max: 2.0, default: 1.00, group: "Layer Mix" }
  - { name: layer_labels, display: "Labels", type: float, min: 0.0, max: 2.0, default: 0.90, group: "Layer Mix" }
  - { name: master_mix, display: "Master Mix", type: float, min: 0.25, max: 1.75, default: 1.00, group: "Layer Mix" }

  - { name: manual_energy, display: "Manual Energy", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Signal" }
  - { name: manual_sweep, display: "Manual Sweep", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Signal" }
  - { name: pulse_rate, display: "Pulse Rate", type: float, min: 0.0, max: 4.0, default: 0.80, group: "Signal" }
  - { name: sweep_rate, display: "Sweep Rate", type: float, min: 0.0, max: 2.0, default: 0.10, group: "Signal" }
  - { name: beat_rate, display: "Beat Rate", type: float, min: 0.0, max: 8.0, default: 2.00, group: "Signal" }
  - { name: beat_sharp, display: "Beat Sharpness", type: float, min: 0.1, max: 8.0, default: 3.00, group: "Signal" }
  - { name: conductor_phase, display: "Conductor Phase", type: float, min: 0.0, max: 1.0, default: 0.0, hidden: true, group: "Conductor" }
  - { name: conductor_energy, display: "Conductor Energy", type: float, min: 0.0, max: 1.0, default: 0.65, hidden: true, group: "Conductor" }

viewport:
  hint: "Passive signal-bus preview. Edit authority, map, layers, and rates in Properties."

buffers:
  - { name: sig, structured: true, element_size: 80, element_count: 1 }

passes:
  - name: compute
    shader: signal_compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:sig"
  - name: display
    shader: signal_display.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:sig" }
    output: output

outputs:
  - { name: "Operations Console", pass: display }

control_outputs:
  - { name: pulse, buffer: sig, element: 0, field_offset: 0, description: "Active pulse lane (0-1)" }
  - { name: sweep, buffer: sig, element: 0, field_offset: 4, description: "Active sweep lane (0-1)" }
  - { name: beat, buffer: sig, element: 0, field_offset: 8, description: "Active beat lane (0-1)" }
  - { name: slow, buffer: sig, element: 0, field_offset: 12, description: "Slow modulation lane (0-1)" }
  - { name: terrain, buffer: sig, element: 0, field_offset: 16, description: "Resolved terrain mode" }
  - { name: density, buffer: sig, element: 0, field_offset: 20, description: "Resolved node density" }
  - { name: blue_gain, buffer: sig, element: 0, field_offset: 24, description: "Blue contour layer gain" }
  - { name: accent_gain, buffer: sig, element: 0, field_offset: 28, description: "Accent contour layer gain" }
  - { name: nodes_gain, buffer: sig, element: 0, field_offset: 32, description: "Node layer gain" }
  - { name: labels_gain, buffer: sig, element: 0, field_offset: 36, description: "Label layer gain" }
  - { name: palette, buffer: sig, element: 0, field_offset: 40, description: "Resolved palette index" }
  - { name: energy, buffer: sig, element: 0, field_offset: 44, description: "Resolved motion energy (0-1)" }
  - { name: authority, buffer: sig, element: 0, field_offset: 48, description: "0 Manual, 1 Auto, 2 Conductor" }
  - { name: cue_mode, buffer: sig, element: 0, field_offset: 52, description: "Active cue mode index" }
  - { name: master_mix, buffer: sig, element: 0, field_offset: 56, description: "Resolved master layer mix" }
  - { name: phase, buffer: sig, element: 0, field_offset: 60, description: "Resolved continuous phase" }
