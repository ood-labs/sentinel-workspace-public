name: "Scientific Final Grade"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F

viewport:
  hint: "Final instrument print: local detail, black floor, highlight rolloff, and safe registration"

inputs:
  - { name: "Glyph Program", slot: 0, required: true }

parameters:
  - { name: exposure, display: "Print Exposure", type: float, min: 0.5, max: 2.0, default: 1.03, group: "Grade" }
  - { name: contrast, display: "Print Contrast", type: float, min: 0.5, max: 2.0, default: 1.12, group: "Grade" }
  - { name: black_lift, display: "Black Floor", type: float, min: 0.0, max: 0.2, default: 0.008, group: "Grade" }
  - { name: highlight_rolloff, display: "Highlight Rolloff", type: float, min: 0.2, max: 3.0, default: 1.15, group: "Grade" }
  - { name: saturation, display: "Ink Saturation", type: float, min: 0.0, max: 1.5, default: 0.72, group: "Grade" }
  - { name: accent_preservation, display: "Amber Preserve", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Grade" }
  - { name: sharpen, display: "Micro Detail", type: float, min: 0.0, max: 2.0, default: 0.18, group: "Detail" }
  - { name: dither, display: "Print Grain", type: float, min: 0.0, max: 0.04, default: 0.006, group: "Detail" }
  - { name: safe_frame_mix, display: "Safe Registration", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Instrument" }
  - { name: frame_ink, display: "Registration Ink", type: color, default: [0.82, 0.80, 0.72], group: "Instrument" }

passes:
  - name: grade
    shader: grade.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Final Program", pass: grade }
