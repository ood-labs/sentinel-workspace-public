name: "Contour Blue"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Field", slot: 0, required: true }

parameters:
  - { name: line_count, display: "Line Count", type: float, min: 4.0, max: 120.0, default: 52.0, group: "Contours" }
  - { name: line_width, display: "Line Width", type: float, min: 0.002, max: 0.08, default: 0.018, group: "Contours" }
  - { name: sharpness, display: "Sharpness", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Contours" }
  - { name: major_every, display: "Major Every", type: int, min: 2, max: 12, default: 5, group: "Contours" }
  - { name: major_boost, display: "Major Boost", type: float, min: 1.0, max: 4.0, default: 1.9, group: "Contours" }
  - { name: slope_warp, display: "Slope Widen", type: float, min: 0.0, max: 2.0, default: 0.6, group: "Contours" }
  - { name: elevation_fade, display: "Elevation Fade", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Contours" }
  - { name: min_level, display: "Min Level", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Gate" }
  - { name: max_level, display: "Max Level", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Gate" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }
  - { name: phase_speed, display: "Phase Speed", type: float, min: -2.0, max: 2.0, default: 0.04, group: "Motion" }
  - { name: blue_color, display: "Line Color", type: color, default: [0.22, 0.55, 0.95], group: "Color" }
  - { name: major_color, display: "Major Color", type: color, default: [0.65, 0.85, 1.0], group: "Color" }

passes:
  - { name: contour, shader: contour.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "input:0" } ] }

outputs:
  - { name: "Blue Contours", pass: contour }
