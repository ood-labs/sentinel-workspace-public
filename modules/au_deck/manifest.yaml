name: "AU Deck"
version: "1.0"
mode: generator
resolution: [1280, 400]

panel:
  mode: canvas
  output: "Deck"
  resolution: follow_panel

viewport:
  hint: "Drag the three macro pads. Buttons recall composite looks."
  interactions: [events]
  input:
    pointer: [left]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: select_look, label: "Select Look" }
  controls:
    - { id: pad_field,  kind: xypad,  param: pad_field,  rect: [0.040, 0.200, 0.320, 0.760], label: "Field Macro" }
    - { id: pad_relief, kind: xypad,  param: pad_relief, rect: [0.355, 0.200, 0.635, 0.760], label: "Relief Macro" }
    - { id: pad_print,  kind: xypad,  param: pad_print,  rect: [0.670, 0.200, 0.950, 0.760], label: "Print Macro" }

parameters:
  - { name: pad_field,  display: "Field Macro",  type: point2D, min: [0,0], max: [1,1], default: [0.56, 0.54], group: "Macros" }
  - { name: pad_relief, display: "Relief Macro", type: point2D, min: [0,0], max: [1,1], default: [0.46, 0.48], group: "Macros" }
  - { name: pad_print,  display: "Print Macro",  type: point2D, min: [0,0], max: [1,1], default: [0.3, 0.56], group: "Macros" }

  - { name: hold_field, display: "Hold Field", type: bool, default: false, group: "Looks" }

  - { name: accent_color, display: "Accent", type: color, default: [1.0, 0.42, 0.09], group: "Looks" }

buffers:
  - { name: deck, structured: true, element_size: 16, element_count: 4, persistent: true }

passes:
  - name: state
    shader: state.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:deck"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "buffer:deck" }
    output: output

control_outputs:
  - { name: field_x,  buffer: deck, element: 0, field_offset: 0,  description: "Field macro X: specimen spread" }
  - { name: field_y,  buffer: deck, element: 0, field_offset: 4,  description: "Field macro Y: cell density" }
  - { name: relief_x, buffer: deck, element: 0, field_offset: 8,  description: "Relief macro X: height" }
  - { name: relief_y, buffer: deck, element: 0, field_offset: 12, description: "Relief macro Y: contour density" }
  - { name: print_x,  buffer: deck, element: 1, field_offset: 0,  description: "Print macro X: ghost" }
  - { name: print_y,  buffer: deck, element: 1, field_offset: 4,  description: "Print macro Y: layer mix" }
  - { name: look,     buffer: deck, element: 1, field_offset: 8,  description: "Selected composite look 0-3" }
  - { name: hold,     buffer: deck, element: 1, field_offset: 12, description: "Hold field" }

data_outputs:
  - name: "Deck State"
    buffer: deck
    schema:
      - { name: a, type: float }
      - { name: b, type: float }
      - { name: c, type: float }
      - { name: d, type: float }

outputs:
  - { name: "Deck", pass: render }
