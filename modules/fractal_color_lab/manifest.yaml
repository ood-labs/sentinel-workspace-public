name: "Fractal Color Lab"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Fractal Field", slot: 0, required: true }

parameters:
  - { name: mix, display: "Mix", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Grade" }
  - { name: chroma, display: "Chromatic Prism", type: float, min: 0.0, max: 3.0, default: 1.45, group: "Grade" }
  - { name: posterize, display: "Posterize", type: float, min: 0.0, max: 1.0, default: 0.32, group: "Grade" }
  - { name: poster_steps, display: "Poster Steps", type: float, min: 4.0, max: 32.0, default: 16.0, group: "Grade" }
  - { name: accent, display: "Accent Rings", type: float, min: 0.0, max: 2.0, default: 1.15, group: "Grade" }

passes:
  - name: color_lab
    shader: color_lab.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Final Designer", pass: color_lab }
