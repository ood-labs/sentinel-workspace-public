name: "C1 Comp"
version: "0.1"
mode: generator
resolution: [864, 1080]

inputs:
  - { name: "BG", slot: 0, required: true }
  - { name: "Hero", slot: 1, required: true }

parameters:
  - { name: bg_gain, display: "BG Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: hero_gain, display: "Hero Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: exposure, display: "Exposure", type: float, min: 0.2, max: 2.0, default: 0.92, group: "Finish" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 2.0, default: 0.65, group: "Finish" }
  - { name: gamma_value, display: "Gamma", type: float, min: 1.0, max: 3.0, default: 1.75, group: "Finish" }

passes:
  - name: comp
    shader: comp.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }

outputs:
  - { name: "Comp", pass: comp }
