name: "Impossible Print Master"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Pressed Program", slot: 0, required: true }

parameters:
  - { name: edge_recovery, display: "Edge Recovery", type: float, min: 0.0, max: 1.5, default: 0.34, group: "Master" }
  - { name: contrast, display: "Print Contrast", type: float, min: 0.7, max: 1.5, default: 1.035, group: "Master" }
  - { name: saturation, display: "Ink Saturation", type: float, min: 0.0, max: 1.4, default: 0.96, group: "Master" }
  - { name: paper_lift, display: "Paper Lift", type: float, min: -0.1, max: 0.1, default: 0.006, group: "Master" }
  - { name: ink_limit, display: "Total Ink Limit", type: float, min: 0.8, max: 3.0, default: 2.56, group: "Ink" }
  - { name: screen_pitch, display: "Screen Pitch", type: float, min: 2.0, max: 12.0, default: 5.0, group: "Ink" }
  - { name: screen_gain, display: "Screen Gain", type: float, min: 0.0, max: 0.12, default: 0.018, group: "Ink" }
  - { name: master_grain, display: "Master Grain", type: float, min: 0.0, max: 0.04, default: 0.004, group: "Ink" }
  - { name: trim_width, display: "Output Trim", type: float, min: 0.0, max: 0.05, default: 0.004, group: "Output" }
  - { name: trim_color, display: "Trim Color", type: color, default: [0.012,0.014,0.020], group: "Output" }
  - { name: trim_gain, display: "Trim Gain", type: float, min: 0.0, max: 1.0, default: 0.92, group: "Output" }
  - { name: crop_inset, display: "Crop Inset", type: float, min: 0.004, max: 0.04, default: 0.014, group: "Output" }
  - { name: crop_length, display: "Crop Length", type: float, min: 0.01, max: 0.12, default: 0.054, group: "Output" }
  - { name: crop_color, display: "Crop Mark Color", type: color, default: [0.93,0.055,0.03], group: "Output" }
  - { name: crop_gain, display: "Crop Mark Gain", type: float, min: 0.0, max: 1.0, default: 0.74, group: "Output" }

passes:
  - name: master
    shader: master.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Master Program", pass: master }
