name: "Strata Control"
version: "0.1"
mode: generator
resolution: [300, 128]

# Master macro node — drive the whole strata system from one place. Wire control outputs to
# every plate's seed (blob_layout/marks/wire/marble) and the blob/marble warp via ref().

buffers:
  - name: ctrl
    structured: true
    element_size: 32
    element_count: 1

parameters:
  - { name: master_seed,       display: "Master Seed", type: float, min: 0.0, max: 50.0, default: 5.0, group: "Macros" }
  - { name: melt_macro,        display: "Melt",        type: float, min: 0.0, max: 1.0,  default: 0.5, group: "Macros" }
  - { name: twist_macro,       display: "Twist",       type: float, min: 0.0, max: 1.0,  default: 0.4, group: "Macros" }
  - { name: marble_warp_macro, display: "Marble Warp", type: float, min: 0.0, max: 2.5,  default: 1.0, group: "Macros" }
  - { name: spread_macro,      display: "Spread",      type: float, min: 0.4, max: 2.0,  default: 1.0, group: "Macros" }
  - { name: wire_scale_macro,  display: "Wire Scale",  type: float, min: 0.4, max: 2.0,  default: 0.82, group: "Macros" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:ctrl"
  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:ctrl" }

control_outputs:
  - { name: seed,        buffer: ctrl, element: 0, field_offset: 0,  description: "Master seed 0-50" }
  - { name: melt,        buffer: ctrl, element: 0, field_offset: 4,  description: "Melt macro 0-1" }
  - { name: twist,       buffer: ctrl, element: 0, field_offset: 8,  description: "Twist macro 0-1" }
  - { name: marble_warp, buffer: ctrl, element: 0, field_offset: 12, description: "Marble warp 0-2.5" }
  - { name: spread,      buffer: ctrl, element: 0, field_offset: 16, description: "Spread 0.4-2.0" }
  - { name: wire_scale,  buffer: ctrl, element: 0, field_offset: 20, description: "Wire scale 0.4-2.0" }

outputs:
  - { name: "Control", pass: display }
