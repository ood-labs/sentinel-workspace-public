name: "Living Tableau Neural Plan"
version: "1.0"
mode: generator
resolution: [1080, 1080]
data_inputs:
  - { name: "Scene Globals", slot: 0, schema: [ { name: phase, type: float }, { name: pulse_a, type: float }, { name: pulse_b, type: float }, { name: pulse_c, type: float }, { name: pulse_d, type: float }, { name: drift, type: float2 }, { name: active, type: float } ] }
buffers:
  - { name: primitives, structured: true, element_size: 48, element_count: 192 }
parameters:
  - { name: detail, display: "Detail (0 Low / 1 Medium / 2 High)", type: int, min: 0, max: 2, default: 1, group: "Structure" }
  - { name: seed, type: int, min: 0, max: 63, default: 11, group: "Structure" }
  - { name: composition_scale, display: "Scale", type: float, min: 0.6, max: 1.4, default: 1.0, group: "Composition" }
  - { name: composition_offset, display: "Offset", type: point2D, min: [-0.2,-0.2], max: [0.2,0.2], default: [0,0], group: "Composition" }
passes:
  - { name: compute, shader: compute.hlsl, target: cs_5_0, dispatch: [3,1,1], thread_group_x: 64, thread_group_y: 1, output: "buffer:primitives", inputs: [ { slot: 0, source: "data:0" } ] }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:primitives" } ] }
outputs: [ { name: "Neural Preview", pass: preview } ]
data_outputs:
  - { name: "Neural Primitives", buffer: primitives, schema: [ { name: p0, type: float2 }, { name: p1, type: float2 }, { name: color, type: float3 }, { name: width, type: float }, { name: kind, type: float }, { name: group_id, type: float }, { name: route_t, type: float }, { name: active, type: float } ] }
