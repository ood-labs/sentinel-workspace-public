name: "Impossible Contour Atlas"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Rupture Program", slot: 0, required: true }
parameters:
  - { name: atlas_mix, display: "Atlas Mix", type: float, min: 0, max: 1, default: 0.88, group: "Atlas" }
  - { name: atlas_phase, display: "Atlas Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: contour_speed, display: "Contour Speed", type: float, min: -2, max: 2, default: 0.3, group: "Motion" }
  - { name: contour_levels, display: "Contour Levels", type: float, min: 3, max: 24, default: 9, group: "Atlas" }
  - { name: contour_width, display: "Contour Width", type: float, min: 0.002, max: 0.08, default: 0.022, group: "Atlas" }
  - { name: hatch_scale, display: "Hatch Scale", type: float, min: 4, max: 40, default: 15, group: "Atlas" }
  - { name: edge_gain, display: "Edge Gain", type: float, min: 0, max: 1.5, default: 0.82, group: "Structure" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002, 0.002, 0.004], group: "Ink" }
  - { name: contour_color, display: "Contour Color", type: color, default: [0.72, 0.64, 0.51], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.12, 0.018], group: "Ink" }
passes:
  - name: atlas
    shader: atlas.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Atlas Program", pass: atlas }
