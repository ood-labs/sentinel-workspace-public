name: "Relay Plates"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Temporal Specimen", slot: 0, required: true }
  - { name: "Fold Signal", slot: 1, required: true }

parameters:
  - { name: relay_rate, display: "Relay Drift", type: float, min: 0.0, max: 0.30, default: 0.16, group: "Motion" }
  - { name: insert_gain, display: "Plate Signal", type: float, min: 0.2, max: 3.0, default: 1.45, group: "Material" }
  - { name: insert_scale, display: "Plate Magnification", type: float, min: 0.6, max: 2.4, default: 1.18, group: "Material" }
  - { name: border_gain, display: "Plate Edge", type: float, min: 0.0, max: 1.5, default: 0.32, group: "Structure" }

passes:
  - name: relay
    shader: relay.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }

outputs:
  - { name: "Relayed Specimen", pass: relay }
