name: "Phase Lattice Field Isolator"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Excised Field", slot: 0, required: true }

parameters:
  - name: specimen_radius
    display: "Specimen Reach"
    type: float
    min: 0.20
    max: 0.62
    default: 0.38
    group: "Isolation"

  - name: transition_width
    display: "Isolation Transition"
    type: float
    min: 0.015
    max: 0.20
    default: 0.085
    group: "Isolation"

  - name: outer_gain
    display: "Outer Field Gain"
    type: float
    min: 0.0
    max: 0.72
    default: 0.045
    group: "Isolation"

  - name: boundary_discipline
    display: "Boundary Discipline"
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Boundary"

  - name: boundary_floor
    display: "Contour Floor"
    type: float
    min: 0.0
    max: 0.30
    default: 0.18
    group: "Boundary"

  - name: boundary_softness
    display: "Contour Transition"
    type: float
    min: 0.005
    max: 0.16
    default: 0.025
    group: "Boundary"

  - name: measure_radius
    display: "Registration Radius"
    type: float
    min: 0.18
    max: 0.72
    default: 0.46
    group: "Registration"

  - name: registration_width
    display: "Registration Band"
    type: float
    min: 0.004
    max: 0.08
    default: 0.026
    group: "Registration"

  - name: registration_restore
    display: "Registration Presence"
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    group: "Registration"

  - name: isolator_core
    display: "Isolation Center"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Placement"

passes:
  - name: isolate_field
    shader: isolate.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
