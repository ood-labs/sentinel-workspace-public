name: "Quasicrystal Dimensional Portal"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F
inputs:
  - { name: "2D Reciprocal Field", slot: 0, required: true }
  - { name: "3D SDF Crystal", slot: 1, required: true }
parameters:
  - { name: phase, display: "Portal Phase", type: float, min: 0.0, max: 1.0, default: 0.12, group: "Portal" }
  - { name: portal_radius, display: "Portal Radius", type: float, min: 0.05, max: 0.8, default: 0.38, group: "Portal" }
  - { name: portal_softness, display: "Portal Softness", type: float, min: 0.005, max: 0.3, default: 0.055, group: "Portal" }
  - { name: portal_teeth, display: "Fivefold Teeth", type: float, min: 0.0, max: 0.2, default: 0.035, group: "Portal" }
  - { name: portal_mix, display: "3D Portal Mix", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Blend" }
  - { name: key_mix, display: "Reciprocal Key", type: float, min: 0.0, max: 2.0, default: 0.45, group: "Blend" }
  - { name: field_key, display: "Field Key Gain", type: float, min: 0.0, max: 5.0, default: 1.3, group: "Blend" }
  - { name: field_gain, display: "2D Gain", type: float, min: 0.0, max: 3.0, default: 0.7, group: "Blend" }
  - { name: sdf_gain, display: "3D Gain", type: float, min: 0.0, max: 3.0, default: 0.82, group: "Blend" }
  - { name: cross_gain, display: "Cross Modulation", type: float, min: 0.0, max: 3.0, default: 0.28, group: "Blend" }
  - { name: ring_gain, display: "Portal Ring", type: float, min: 0.0, max: 5.0, default: 0.72, group: "Portal" }
passes:
  - { name: composite, shader: composite.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "input:0" }, { slot: 1, source: "input:1" } ] }
outputs:
  - { name: "Dimensional Portal", pass: composite }
