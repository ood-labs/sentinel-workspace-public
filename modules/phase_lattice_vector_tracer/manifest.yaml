name: "Phase Lattice Vector Tracer"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

inputs:
  - { name: "Registered Field", slot: 0, required: true }
  - { name: "Engraved Field", slot: 1, required: true }

buffers:
  - { name: tracer_field, format: RGBA16F, scale: 0.5, persistent: true }

parameters:
  - name: flow_alignment
    display: "Boundary Following"
    type: float
    min: 0.0
    max: 1.0
    default: 0.72
    group: "Tracer Motion"

  - name: drift_speed
    display: "Tracer Drift"
    type: float
    min: 0.0
    max: 0.42
    default: 0.115
    group: "Tracer Motion"

  - name: retention
    display: "Tracer Memory"
    type: float
    min: 0.78
    max: 0.995
    default: 0.94
    group: "Tracer Motion"

  - name: deposit_gate
    display: "Warm Deposit Gate"
    type: float
    min: 0.02
    max: 0.50
    default: 0.14
    group: "Tracer Selection"

  - name: trace_radius
    display: "Trace Orbit"
    type: float
    min: 0.18
    max: 0.72
    default: 0.46
    group: "Tracer Selection"

  - name: orbit_width
    display: "Trace Band"
    type: float
    min: 0.035
    max: 0.32
    default: 0.115
    group: "Tracer Selection"

  - name: core_clear
    display: "Core Protection"
    type: float
    min: 0.04
    max: 0.42
    default: 0.18
    group: "Tracer Selection"

  - name: trail_gain
    display: "Tracer Gain"
    type: float
    min: 0.0
    max: 1.6
    default: 0.48
    group: "Presentation"

  - name: trail_floor
    display: "Tracer Threshold"
    type: float
    min: 0.0
    max: 0.72
    default: 0.08
    group: "Presentation"

  - name: needle_restore
    display: "Azimuth Restore"
    type: float
    min: 0.0
    max: 1.0
    default: 0.46
    group: "Presentation"

  - name: azimuth_x
    display: "Live Azimuth X"
    type: float
    min: -1.0
    max: 1.0
    default: 0.0
    group: "Live Driver"

  - name: azimuth_y
    display: "Live Azimuth Y"
    type: float
    min: -1.0
    max: 1.0
    default: 1.0
    group: "Live Driver"

  - name: azimuth_confidence
    display: "Live Confidence"
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    group: "Live Driver"

  - name: tracer_core
    display: "Tracer Core"
    type: point2D
    min: [-0.42, -0.38]
    max: [0.42, 0.38]
    default: [0.0, 0.0]
    group: "Placement"

passes:
  - name: advect_tracers
    shader: accumulate.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - { slot: 0, source: "input:1" }
      - { slot: 1, source: "buffer:tracer_field" }
    output: "buffer:tracer_field"

  - name: present
    shader: present.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:tracer_field" }
    output: output
