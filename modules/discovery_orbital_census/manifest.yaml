name: "Territory C - Orbital Census"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_play, display: "Master Play", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Clock" }
  - { name: layout_family, display: "Orbit Family", type: enum, default: 0, options: [Concentric, Offset Focus, Twisted Planes], flags: button_grid, group: "Structure" }
  - { name: ring_count, display: "Orbit Count", type: int, min: 4, max: 14, default: 10, group: "Structure" }
  - { name: orbit_eccentricity, display: "Eccentricity", type: float, min: 0.0, max: 0.48, default: 0.22, group: "Structure" }
  - { name: marker_scale, display: "Specimen Scale", type: float, min: 0.5, max: 2.6, default: 1.25, group: "Rendering" }
  - { name: accent_gain, display: "Active Accent", type: float, min: 0.0, max: 2.0, default: 1.15, group: "Rendering" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    output: output
