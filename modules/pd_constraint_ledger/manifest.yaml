name: "PD / Constraint Ledger"
version: "1.0"
mode: generator
resolution: [1280, 720]

data_inputs:
  - name: "Blobs"
    slot: 0
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }
  - name: "Corners"
    slot: 1
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }
  - name: "Lines"
    slot: 2
    schema:
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: angle, type: float }
      - { name: length, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

buffers:
  - { name: debt_quanta, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: ledger_stats, structured: true, element_size: 16, element_count: 1 }

data_outputs:
  - name: "Debt Quanta"
    buffer: "debt_quanta"
    schema:
      - { name: position, type: float2 }
      - { name: axis, type: float2 }
      - { name: mass, type: float }
      - { name: radius, type: float }
      - { name: kind, type: uint }
      - { name: sourceIndex, type: uint }
      - { name: ledgerId, type: uint }
      - { name: active, type: uint }
      - { name: phase, type: float }
      - { name: age, type: float }

control_outputs:
  - { name: active_debt, buffer: ledger_stats, element: 0, field_offset: 0, description: "Active debt quanta" }
  - { name: mean_mass, buffer: ledger_stats, element: 0, field_offset: 4, description: "Mean normalized quantum mass" }
  - { name: macro_mass, buffer: ledger_stats, element: 0, field_offset: 8, description: "Aggregate macro-liability mass" }
  - { name: mean_axis_angle, buffer: ledger_stats, element: 0, field_offset: 12, description: "Weighted mean constraint direction" }

viewport:
  hint: "Ledger preview: orange macro liabilities, white hinge quanta, graphite force rails, and real record-derived load bars."

parameters:
  - { name: analysis_width, display: "Analysis Width", type: float, min: 64.0, max: 2048.0, default: 480.0, group: "Data Contract" }
  - { name: analysis_height, display: "Analysis Height", type: float, min: 64.0, max: 2048.0, default: 270.0, group: "Data Contract" }
  - { name: max_blob_quanta, display: "Macro Quanta", type: int, min: 0, max: 8, default: 2, group: "Data Contract" }
  - { name: max_corner_quanta, display: "Hinge Quanta", type: int, min: 0, max: 40, default: 24, group: "Data Contract" }
  - { name: max_line_quanta, display: "Rail Quanta", type: int, min: 0, max: 16, default: 10, group: "Data Contract" }

  - { name: blob_mass_gain, display: "Macro Mass", type: float, min: 0.1, max: 12.0, default: 5.0, group: "Mass Mapping" }
  - { name: blob_radius_gain, display: "Macro Radius", type: float, min: 0.1, max: 3.0, default: 1.15, group: "Mass Mapping" }
  - { name: corner_response_reference, display: "Hinge Reference", type: float, min: 0.5, max: 40.0, default: 13.0, group: "Mass Mapping" }
  - { name: corner_radius_min, display: "Hinge Radius Min", type: float, min: 0.002, max: 0.08, default: 0.009, group: "Mass Mapping" }
  - { name: corner_radius_max, display: "Hinge Radius Max", type: float, min: 0.01, max: 0.15, default: 0.04, group: "Mass Mapping" }
  - { name: line_length_reference, display: "Rail Reference", type: float, min: 8.0, max: 400.0, default: 80.0, group: "Mass Mapping" }
  - { name: line_mass_gain, display: "Rail Mass", type: float, min: 0.1, max: 4.0, default: 1.3, group: "Mass Mapping" }

  - { name: temporal_follow, display: "Ledger Follow", type: float, min: 0.05, max: 4.0, default: 0.85, group: "Temporal Stability" }
  - { name: ledger_phase, display: "Debt Phase", type: float, min: 0.0, max: 1.0, default: 0.13, group: "Temporal Stability" }
  - { name: leverage_origin, display: "Leverage Origin", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.16, -0.09], group: "Temporal Stability" }

  - { name: relation_gain, display: "Ledger Relations", type: float, min: 0.0, max: 2.0, default: 0.72, group: "Preview" }
  - { name: current_gain, display: "Current Liability", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Preview" }
  - { name: liability_color, display: "Liability Color", type: color, default: [1.0, 0.32, 0.03], group: "Preview" }

passes:
  - name: compile_quanta
    shader: compile_quanta.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "data:2" }
      - { slot: 3, source: "buffer:debt_quanta" }
    output: "buffer:debt_quanta"
  - name: quanta_stats
    shader: quanta_stats.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:debt_quanta" }
    output: "buffer:ledger_stats"
  - name: ledger_preview
    shader: ledger_preview.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:debt_quanta" }
      - { slot: 1, source: "buffer:ledger_stats" }
    output: output

outputs:
  - { name: "Ledger Preview", pass: ledger_preview }
