name: "Impossible Debris Orbit"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Array Program", slot: 0, required: true }
parameters:
  - { name: particle_mix, display: "Particle Mix", type: float, min: 0, max: 1, default: 0.86, group: "Field" }
  - { name: orbit_phase, display: "Orbit Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: orbital_speed, display: "Orbital Speed", type: float, min: -2, max: 2, default: 0.44, group: "Motion" }
  - { name: particle_count, display: "Particle Count", type: float, min: 16, max: 96, default: 64, group: "Field" }
  - { name: shell_radius, display: "Shell Radius", type: float, min: 0.2, max: 0.9, default: 0.52, group: "Field" }
  - { name: depth_spread, display: "Depth Spread", type: float, min: 0.05, max: 0.8, default: 0.32, group: "Field" }
  - { name: shard_gain, display: "Shard Gain", type: float, min: 0.2, max: 2.0, default: 1.0, group: "Field" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002, 0.002, 0.004], group: "Ink" }
  - { name: shard_color, display: "Shard Color", type: color, default: [0.68, 0.59, 0.45], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.14, 0.018], group: "Ink" }
passes:
  - name: orbit
    shader: orbit.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Orbit Program", pass: orbit }
