name: "Quasicrystal Cut Project"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
buffers:
  - { name: quasi_records, structured: true, element_size: 48, element_count: 243 }
parameters:
  - { name: phase, display: "Phason Phase", type: float, min: 0.0, max: 1.0, default: 0.12, group: "Projection" }
  - { name: phason_shift, display: "Phason Shift", type: float, min: 0.0, max: 2.0, default: 0.52, group: "Projection" }
  - { name: window_radius, display: "Acceptance Window", type: float, min: 0.2, max: 4.0, default: 1.72, group: "Projection" }
  - { name: window_softness, display: "Window Softness", type: float, min: 0.01, max: 1.0, default: 0.16, group: "Projection" }
  - { name: acceptance_cut, display: "Acceptance Cut", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Projection" }
  - { name: lattice_scale, display: "Lattice Scale", type: float, min: 0.2, max: 2.0, default: 0.92, group: "Geometry" }
  - { name: lift_amount, display: "3D Lift", type: float, min: 0.0, max: 1.5, default: 0.52, group: "Geometry" }
  - { name: layer_spacing, display: "Layer Spacing", type: float, min: 0.0, max: 0.5, default: 0.07, group: "Geometry" }
  - { name: point_scale, display: "Point Scale", type: float, min: 0.2, max: 3.0, default: 1.0, group: "Geometry" }
  - { name: hue_offset, display: "Spectrum", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Color" }
passes:
  - { name: generate, shader: generate.hlsl, target: cs_5_0, dispatch: [4, 1, 1], thread_group_x: 64, thread_group_y: 1, output: "buffer:quasi_records" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:quasi_records" } ] }
outputs:
  - { name: "Projection Preview", pass: preview }
data_outputs:
  - name: "Quasi Records"
    buffer: "quasi_records"
    schema:
      - { name: position, type: float3 }
      - { name: scale, type: float }
      - { name: phase, type: float }
      - { name: family, type: float }
      - { name: hue, type: float }
      - { name: active, type: float }
      - { name: normal, type: float3 }
      - { name: pad, type: float }
