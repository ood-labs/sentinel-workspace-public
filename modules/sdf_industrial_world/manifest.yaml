name: "SDF Industrial World"
version: "0.1"
mode: generator
resolution: [640, 360]

buffers:
  - name: parts
    structured: true
    element_size: 64
    element_count: 24

parameters:
  - { name: world_scale, display: "World Scale", type: float, min: 0.5, max: 2.5, default: 1.0, group: "World" }
  - { name: tower_height, display: "Tower Height", type: float, min: 0.4, max: 3.5, default: 1.8, group: "World" }
  - { name: frame_gap, display: "Frame Gap", type: float, min: 0.1, max: 1.0, default: 0.42, group: "World" }
  - { name: industrial_density, display: "Industrial Density", type: float, min: 0.0, max: 1.0, default: 0.78, group: "World" }
  - { name: graphic_rate, display: "Graphic Rate", type: float, min: 0.0, max: 6.0, default: 1.7, group: "Graphic" }
  - { name: graphic_thickness, display: "Graphic Thickness", type: float, min: 0.01, max: 0.18, default: 0.045, group: "Graphic" }
  - { name: motion_rate, display: "Motion Rate", type: float, min: 0.0, max: 2.0, default: 0.18, group: "Motion" }
  - { name: pulse, display: "Sequencer Pulse", type: float, min: 0.0, max: 4.0, default: 0.0, group: "Motion" }
  - { name: seed, display: "World Seed", type: float, min: 0.0, max: 20.0, default: 6.2, group: "Motion" }

passes:
  - { name: compute, shader: compute.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, output: "buffer:parts" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:parts" } ] }

data_outputs:
  - name: "World Parts"
    buffer: parts
    schema:
      - { name: transform_a, type: float4 }
      - { name: transform_b, type: float4 }
      - { name: rotation, type: float4 }
      - { name: meta, type: float4 }

outputs:
  - name: "Industrial World Preview"
    pass: preview
