name: "Interactive Facade Composer"
version: "2.0"
mode: generator
resolution: [1280, 720]

panel:
  mode: canvas
  output: "Facade Elevation"
  resolution: follow_panel

data_inputs:
  - name: "Building PNodes"
    slot: 0
    element_size: 48
    element_count: 96
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float }
      - { name: kind_id, type: float }
      - { name: seed, type: float }
      - { name: yaw, type: float }
      - { name: height, type: float }
      - { name: width, type: float }
      - { name: depth, type: float }
      - { name: dir, type: float, count: 2 }

parameters:
  - { name: reset_selected, display: "Reset Selected", type: button, hidden: true, group: "Elevation Editor" }
  - { name: reset_all, display: "Reset All", type: button, hidden: true, group: "Elevation Editor" }
  - { name: floors, display: "Floor Count", type: int, min: 3, max: 8, default: 6, group: "Grid" }
  - { name: front_bays, display: "Front Bays", type: int, min: 4, max: 9, default: 7, group: "Grid" }
  - { name: side_bays, display: "Side Bays", type: int, min: 2, max: 4, default: 4, group: "Grid" }
  - { name: window_width, display: "Window Width", type: float, min: 0.28, max: 0.94, default: 0.62, group: "Openings" }
  - { name: window_height, display: "Window Height", type: float, min: 0.32, max: 0.90, default: 0.52, group: "Openings" }
  - { name: reveal_depth, display: "Reveal Depth", type: float, min: 0.01, max: 0.40, default: 0.10, group: "Openings" }
  - { name: facade_offset, display: "Facade Offset", type: float, min: 0.02, max: 0.35, default: 0.08, group: "Openings" }
  - name: style
    display: "Facade Language"
    type: enum
    options: [Curtain Wall, Ribbed Stone, Hybrid]
    default: 2
    flags: button_grid
    group: "Style"
  - { name: interior_glow, display: "Interior Glow", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Style" }
  - { name: rhythm_mode, display: "Rhythm Mode", type: int, min: 0, max: 3, default: 1, group: "Style" }
  - { name: variation, display: "Variation", type: float, min: 0, max: 1, default: 0.42, group: "Style" }

viewport:
  hint: "Select Rhythm or Feature, then drag it across the elevation. Backspace resets the selection."
  interactions: [events, selection]
  selection: { mode: single, provider: ray_query, result_buffer: pick_result, object_buffer: viewport_objects }
  input: { pointer: [left], keyboard: [backspace, escape, shift], gestures: [click, drag] }
  bindings:
    - { gesture: left_click, action: select_facade_control, label: "Select Facade Control" }
    - { gesture: left_drag, action: move_facade_control, label: "Move Facade Control" }
  # ui-label: title = FACADE COMPOSER
  # ui-label: rhythm = RHYTHM
  # ui-label: feature = FEATURE
  # ui-label: elevation = LIVE ELEVATION / STRUCTURAL WINDOWS
  # ui-label: reset = RST
  # ui-label: reset_all = RST ALL
  controls:
    - { id: reset, kind: button, param: reset_selected, rect: [0.790,0.032,0.875,0.078], label: "Reset Selected" }
    - { id: reset_all, kind: button, param: reset_all, rect: [0.882,0.032,0.970,0.078], label: "Reset All" }

buffers:
  - { name: editor_state, structured: true, element_size: 48, element_count: 1, persistent: true }
  - { name: drag_snapshot, structured: true, element_size: 32, element_count: 2, persistent: true }
  - { name: facade_state, structured: true, element_size: 32, element_count: 2, persistent: true }
  - { name: facade_elements, structured: true, element_size: 64, element_count: 160 }
  - { name: viewport_objects, structured: true, element_size: 120, element_count: 2, persistent: true }
  - { name: pick_result, structured: true, element_size: 40, element_count: 1, persistent: true }

state_buffers:
  - name: facade_state
    max_elements: 2
    schema:
      - { name: position, type: float2 }
      - { name: rotation, type: float }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
      - { name: pad, type: float3 }

passes:
  - { name: interaction, shader: interaction.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:facade_state" } ], output: "buffer:editor_state" }
  - { name: snapshot, shader: snapshot.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:facade_state" } ], output: "buffer:drag_snapshot" }
  - { name: update, shader: update.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:editor_state" }, { slot: 2, source: "buffer:drag_snapshot" } ], output: "buffer:facade_state" }
  - { name: emit, shader: emit_facade.hlsl, target: cs_5_0, dispatch: [3,1,1], thread_group_x: 64, thread_group_y: 1, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:facade_state" } ], output: "buffer:facade_elements" }
  - { name: descriptors, shader: descriptors.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 2, thread_group_y: 1, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:facade_state" } ], output: "buffer:viewport_objects" }
  - { name: pick, shader: pick.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:facade_state" } ], output: "buffer:pick_result" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:facade_elements" }, { slot: 2, source: "buffer:facade_state" } ], output: output }

outputs:
  - { name: "Facade Elevation", pass: preview }

data_outputs:
  - name: "Facade Elements"
    buffer: facade_elements
    schema:
      - { name: position, type: float, count: 3 }
      - { name: type_id, type: float }
      - { name: size, type: float, count: 3 }
      - { name: yaw, type: float }
      - { name: material_id, type: float }
      - { name: seed, type: float }
      - { name: emissive, type: float }
      - { name: active, type: float }
      - { name: uv, type: float, count: 2 }
      - { name: floor_index, type: float }
      - { name: bay_index, type: float }
