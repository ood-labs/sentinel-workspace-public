name: "Forensic Archive Grade"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Memory Program", slot: 0, required: true }

data_inputs:
  - name: "Evidence Agents"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: weight, type: float }
      - { name: radius, type: float }
      - { name: kind, type: uint }
      - { name: sourceIndex, type: uint }
      - { name: groupId, type: uint }
      - { name: active, type: uint }
      - { name: phase, type: float }
      - { name: pad, type: float }

viewport:
  hint: "Final print discipline. Bottom registration ticks and the target derive from live Evidence Agents."

parameters:
  - { name: print_mode, display: "Print Mode", type: enum, default: 0, options: [Archive, Carbon, Negative], flags: button_grid, group: "Print" }
  - { name: black_point, display: "Black Point", type: float, min: 0.0, max: 0.45, default: 0.035, group: "Print" }
  - { name: white_point, display: "White Point", type: float, min: 0.25, max: 1.0, default: 0.92, group: "Print" }
  - { name: contrast_curve, display: "Contrast Curve", type: float, min: 0.2, max: 2.5, default: 0.7272, group: "Print" }
  - { name: tone_steps, display: "Tone Steps", type: float, min: 2.0, max: 16.0, default: 8.0, group: "Print" }
  - { name: grain_amount, display: "Paper Grain", type: float, min: 0.0, max: 0.12, default: 0.018, group: "Texture" }
  - { name: halftone_frequency, display: "Halftone Frequency", type: float, min: 8.0, max: 180.0, default: 62.0, group: "Texture" }
  - { name: halftone_amount, display: "Halftone Amount", type: float, min: 0.0, max: 0.2, default: 0.008, group: "Texture" }
  - { name: accent_separation, display: "Accent Separation", type: float, min: 0.5, max: 2.5, default: 1.22, group: "Current" }
  - { name: accent_gain, display: "Current Gain", type: float, min: 0.0, max: 2.0, default: 0.9715, group: "Current" }
  - { name: current_color, display: "Current Color", type: color, default: [1.0, 0.27, 0.03], group: "Current" }
  - { name: telemetry_gain, display: "Record Ticks", type: float, min: 0.0, max: 2.0, default: 0.55, group: "Registration" }
  - { name: target_gain, display: "Strongest Target", type: float, min: 0.0, max: 2.0, default: 0.75, group: "Registration" }
  - { name: crop_extent, display: "Archive Crop", type: float, min: 0.35, max: 0.49, default: 0.472, group: "Registration" }
  - { name: frame_gain, display: "Frame Gain", type: float, min: 0.0, max: 2.0, default: 0.62, group: "Registration" }
  - { name: vignette_gain, display: "Edge Falloff", type: float, min: 0.0, max: 2.0, default: 0.42, group: "Registration" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: output

outputs:
  - { name: "Final Program", pass: render }
