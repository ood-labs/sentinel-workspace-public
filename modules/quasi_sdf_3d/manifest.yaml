name: "Icosahedral SDF Quasicrystal 3D"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
output_format: RGBA16F
data_inputs:
  - name: "Quasi Records"
    slot: 0
    schema:
      - { name: position, type: float3 }
      - { name: scale, type: float }
      - { name: phase, type: float }
      - { name: family, type: float }
      - { name: hue, type: float }
      - { name: active, type: float }
      - { name: normal, type: float3 }
      - { name: pad, type: float }
parameters:
  - { name: phase, display: "Phason Phase", type: float, min: 0.0, max: 1.0, default: 0.12, group: "Quasicrystal" }
  - { name: auto_drift, display: "Legacy Drift", type: bool, default: false, flags: button, group: "Motion" }
  - { name: wave_frequency, display: "Icosahedral Frequency", type: float, min: 2.0, max: 18.0, default: 7.4, group: "Quasicrystal" }
  - { name: iso_level, display: "Iso Level", type: float, min: -0.8, max: 0.8, default: 0.08, group: "Quasicrystal" }
  - { name: surface_thickness, display: "Surface Thickness", type: float, min: 0.005, max: 0.2, default: 0.055, group: "Quasicrystal" }
  - { name: shell_radius, display: "Shell Radius", type: float, min: 0.5, max: 3.0, default: 1.65, group: "SDF Carving" }
  - { name: shell_thickness, display: "Shell Thickness", type: float, min: 0.05, max: 1.0, default: 0.46, group: "SDF Carving" }
  - { name: core_radius, display: "Core Radius", type: float, min: 0.0, max: 1.5, default: 0.48, group: "SDF Carving" }
  - { name: tunnel_radius, display: "Axial Tunnel", type: float, min: 0.0, max: 1.0, default: 0.22, group: "SDF Carving" }
  - { name: camera_distance, display: "Camera Distance", type: float, min: 2.0, max: 8.0, default: 4.4, group: "Camera" }
  - { name: max_steps, display: "Ray Steps", type: int, min: 24, max: 160, default: 92, group: "Quality" }
  - { name: hue, display: "Spectrum", type: float, min: 0.0, max: 1.0, default: 0.60, group: "Light" }
  - { name: fresnel_gain, display: "Fresnel", type: float, min: 0.0, max: 5.0, default: 1.8, group: "Light" }
  - { name: emission, display: "Emission", type: float, min: 0.0, max: 5.0, default: 0.9, group: "Light" }
  - { name: exposure, display: "Exposure", type: float, min: 0.2, max: 4.0, default: 1.45, group: "Light" }
  - { name: data_cloud_scale, display: "Projection Cloud Scale", type: float, min: 0.02, max: 1.0, default: 0.19, group: "Data Overlay" }
  - { name: data_glow, display: "Projection Glow", type: float, min: 0.0, max: 5.0, default: 0.68, group: "Data Overlay" }
passes:
  - { name: render, shader: render.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }
outputs:
  - { name: "Icosahedral SDF", pass: render }
