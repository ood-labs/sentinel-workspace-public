name: "Scientific UI Style Tuner"
version: "1.0"
mode: generator
resolution: [1280, 720]

panel:
  mode: canvas
  output: "Style Tuner"
  resolution: follow_panel

parameters:
  - { name: title_scale, display: "Title Scale", type: float, min: 1.0, max: 4.0, default: 2.000000, group: "Typography/Title" }
  - { name: title_weight, display: "Title Weight", type: float, min: 0.0, max: 1.0, default: 0.2, group: "Typography/Title" }
  - { name: title_tracking, display: "Title Tracking", type: float, min: -6.0, max: 6.0, default: -2.5, group: "Typography/Title" }
  - { name: section_scale, display: "Section Scale", type: float, min: 0.75, max: 2.0, default: 1.75, group: "Typography/Section" }
  - { name: section_weight, display: "Section Weight", type: float, min: 0.0, max: 1.0, default: 0.000000, group: "Typography/Section" }
  - { name: section_tracking, display: "Section Tracking", type: float, min: -4.0, max: 4.0, default: -2.5, group: "Typography/Section" }
  - { name: body_scale, display: "Body Scale", type: float, min: 0.75, max: 2.0, default: 1.5, group: "Typography/Body" }
  - { name: body_weight, display: "Body Weight", type: float, min: 0.0, max: 1.0, default: 0.000000, group: "Typography/Body" }
  - { name: body_tracking, display: "Body Tracking", type: float, min: -4.0, max: 4.0, default: -2.5, group: "Typography/Body" }
  - { name: outer_padding, display: "Outer Padding", type: float, min: 12.0, max: 64.0, default: 15.000000, group: "Spacing" }
  - { name: section_gap, display: "Section Gap", type: float, min: 8.0, max: 48.0, default: 10.595863, group: "Spacing" }
  - { name: control_height, display: "Control Height", type: float, min: 28.0, max: 64.0, default: 32.000000, group: "Spacing" }
  - { name: control_gap, display: "Control Gap", type: float, min: 4.0, max: 24.0, default: 6.446163, group: "Spacing" }

viewport:
  hint: "Tune typography hierarchy and spacing here. The final values can be promoted into the shared UI defaults."
  # ui-label: title = UI STYLE TUNER
  # ui-label: instruction = TUNE LEFT, REVIEW RIGHT
  # ui-label: preview_title = SCIENTIFIC CONTROL DECK
  # ui-label: preview_section = SIGNAL PARAMETERS
  # ui-label: preview_body = Primary controls use the body style.
  # ui-label: preview_detail = Secondary readouts use muted body text.
  # ui-label: preview_slider = SIGNAL LEVEL
  # ui-label: preview_action = APPLY CONFIGURATION
  # ui-label: preview_toggle = MONITOR ENABLED
  controls:
    - { id: title_scale, kind: slider, param: title_scale, rect: [0.220, 0.145, 0.402, 0.195], label: "Title Scale" }
    - { id: title_weight, kind: slider, param: title_weight, rect: [0.220, 0.205, 0.402, 0.255], label: "Title Weight" }
    - { id: title_tracking, kind: slider, param: title_tracking, rect: [0.220, 0.265, 0.402, 0.315], label: "Title Tracking" }
    - { id: section_scale, kind: slider, param: section_scale, rect: [0.220, 0.335, 0.402, 0.385], label: "Section Scale" }
    - { id: section_weight, kind: slider, param: section_weight, rect: [0.220, 0.395, 0.402, 0.445], label: "Section Weight" }
    - { id: section_tracking, kind: slider, param: section_tracking, rect: [0.220, 0.455, 0.402, 0.505], label: "Section Tracking" }
    - { id: body_scale, kind: slider, param: body_scale, rect: [0.220, 0.525, 0.402, 0.575], label: "Body Scale" }
    - { id: body_weight, kind: slider, param: body_weight, rect: [0.220, 0.585, 0.402, 0.635], label: "Body Weight" }
    - { id: body_tracking, kind: slider, param: body_tracking, rect: [0.220, 0.645, 0.402, 0.695], label: "Body Tracking" }
    - { id: outer_padding, kind: slider, param: outer_padding, rect: [0.220, 0.715, 0.402, 0.765], label: "Outer Padding" }
    - { id: section_gap, kind: slider, param: section_gap, rect: [0.220, 0.775, 0.402, 0.825], label: "Section Gap" }
    - { id: control_height, kind: slider, param: control_height, rect: [0.220, 0.835, 0.402, 0.885], label: "Control Height" }
    - { id: control_gap, kind: slider, param: control_gap, rect: [0.220, 0.895, 0.402, 0.945], label: "Control Gap" }

passes:
  - { name: render, shader: render.hlsl, target: cs_5_0, output: output }

outputs:
  - { name: "Style Tuner", pass: render }
