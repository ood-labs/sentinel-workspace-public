name: "Particle Shell"
version: "1.0"
mode: generator
resolution:
  width: 1280
  height: 720
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: density, display: "Shell Density", type: float, min: 0.0, max: 2.0, default: 0.72, group: "Shell" }
  - { name: radius, display: "Shell Radius", type: float, min: 0.2, max: 1.2, default: 0.76, group: "Shell" }
  - { name: point_size, display: "Point Size", type: float, min: 0.001, max: 0.03, default: 0.008, group: "Shell" }
  - { name: orbit, display: "Orbit Rate", type: float, min: 0.0, max: 1.0, default: 0.08, group: "Motion" }
  - { name: depth, display: "Depth Modulation", type: float, min: 0.0, max: 1.0, default: 0.55, group: "Motion" }
  - { name: brightness, display: "Brightness", type: float, min: 0.0, max: 1.0, default: 0.24, group: "Output" }
  - { name: tint, display: "Particle Tint", type: color, default: [0.55, 0.66, 0.78], group: "Output" }

passes:
  - name: shell
    shader: shell.hlsl
    target: cs_5_0

outputs:
  - { name: "Shell", pass: shell }
