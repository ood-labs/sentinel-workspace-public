name: "Nocturne Light Rig"
version: "0.1"
mode: generator
resolution: [640, 360]

buffers:
  - name: lights
    structured: true
    element_size: 48
    element_count: 8

parameters:
  - { name: key_intensity, display: "Key", type: float, min: 0.0, max: 8.0, default: 3.2, group: "Rig" }
  - { name: fill_intensity, display: "Fill", type: float, min: 0.0, max: 4.0, default: 0.65, group: "Rig" }
  - { name: rim_intensity, display: "Rim", type: float, min: 0.0, max: 6.0, default: 2.0, group: "Rig" }
  - { name: slash_intensity, display: "Moving Slashes", type: float, min: 0.0, max: 5.0, default: 1.4, group: "Rig" }
  - { name: base_intensity, display: "Base Lift", type: float, min: 0.0, max: 3.0, default: 0.45, group: "Rig" }
  - { name: orbit_speed, display: "Motion Rate", type: float, min: 0.0, max: 2.0, default: 0.16, group: "Motion" }
  - { name: pulse_amount, display: "Sequencer Pulse", type: float, min: 0.0, max: 4.0, default: 0.0, group: "Motion" }

passes:
  - { name: compute, shader: compute.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, output: "buffer:lights" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:lights" } ] }

data_outputs:
  - name: "Light Records"
    buffer: lights
    schema:
      - { name: position_radius, type: float4 }
      - { name: color_intensity, type: float4 }
      - { name: direction_type, type: float4 }

outputs:
  - name: "Light Preview"
    pass: preview
