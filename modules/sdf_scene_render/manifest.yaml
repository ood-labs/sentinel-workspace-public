name: "SDF Scene Render"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [camera]

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

parameters:
  - { name: render_count, display: "Max Instances", type: int, min: 1, max: 96, default: 64, group: "Instances" }
  - { name: world_scale, display: "World Scale", type: float, min: 0.5, max: 8.0, default: 2.4, group: "Instances" }

  - name: kind_mode
    display: "Kind Mode"
    type: enum
    options: [FromNode, Fixed, Cycle, Hash]
    default: 2
    flags: button_grid
    group: "Kind"
  - { name: fixed_kind, display: "Fixed Kind", type: int, min: 0, max: 7, default: 2, group: "Kind" }
  - { name: set_size, display: "Set Size", type: int, min: 1, max: 4, default: 2, group: "Kind" }
  - { name: kind0, display: "Kind 0", type: int, min: 0, max: 7, default: 2, group: "Kind" }
  - { name: kind1, display: "Kind 1", type: int, min: 0, max: 7, default: 3, group: "Kind" }
  - { name: kind2, display: "Kind 2", type: int, min: 0, max: 7, default: 1, group: "Kind" }
  - { name: kind3, display: "Kind 3", type: int, min: 0, max: 7, default: 6, group: "Kind" }

  - name: scale_mode
    display: "Scale Mode"
    type: enum
    options: [Uniform, ByWeight, ByDepth, Hash]
    default: 3
    flags: button_grid
    group: "Scale"
  - { name: scale_base, display: "Scale Base", type: float, min: 0.05, max: 2.0, default: 0.42, group: "Scale" }
  - { name: scale_var, display: "Scale Var", type: float, min: 0.0, max: 1.0, default: 0.25, group: "Scale" }

  - name: rot_mode
    display: "Rot Mode"
    type: enum
    options: [FromDir, Fixed, Hash]
    default: 2
    flags: button_grid
    group: "Rotation"
  - { name: fixed_rot, display: "Fixed Rot", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Rotation" }

  - { name: base_color, display: "Body Color", type: color, default: [0.62, 0.57, 0.52], group: "Look" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.55, 0.16, 0.14], group: "Look" }
  - { name: emissive_color, display: "Emissive Color", type: color, default: [1.0, 0.72, 0.35], group: "Look" }
  - { name: ground_color, display: "Ground Color", type: color, default: [0.10, 0.10, 0.11], group: "Look" }
  - { name: fog_density, display: "Fog Density", type: float, min: 0.0, max: 1.0, default: 0.25, group: "Look" }
  - { name: grid_lines, display: "Ground Grid", type: bool, default: true, flags: button, group: "Look" }
  - { name: shadows, display: "Sun Shadows", type: bool, default: true, flags: button, group: "Look" }

  - { name: sun_azimuth, display: "Sun Azimuth", type: float, min: 0.0, max: 360.0, default: 35.0, group: "Sun" }
  - { name: sun_elevation, display: "Sun Elevation", type: float, min: 5.0, max: 89.0, default: 52.0, group: "Sun" }

  - { name: use_fly_cam, display: "Use Fly Camera", type: bool, default: false, flags: button, group: "Camera" }
  - { name: cam_orbit, display: "Camera Orbit", type: float, min: 0.0, max: 360.0, default: 30.0, group: "Camera" }
  - { name: cam_elevation, display: "Camera Elevation", type: float, min: -5.0, max: 89.0, default: 18.0, group: "Camera" }
  - { name: cam_distance, display: "Camera Distance", type: float, min: 0.5, max: 20.0, default: 5.5, group: "Camera" }
  - { name: cam_target_y, display: "Camera Target Y", type: float, min: 0.0, max: 3.0, default: 0.35, group: "Camera" }
  - { name: rotate_speed, display: "Auto Rotate", type: float, min: 0.0, max: 2.0, default: 0.0, group: "Camera" }

passes:
  - name: render
    shader: scene.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }

outputs:
  - { name: "Scene", pass: render }
