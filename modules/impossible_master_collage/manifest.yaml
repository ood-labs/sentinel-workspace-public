name: "Impossible Master Collage"
version: "2.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Architecture Material", slot: 0, required: true }
  - { name: "Blackout Material", slot: 1, required: true }
  - { name: "Orbital Material", slot: 2, required: true }
  - { name: "Corridor Material", slot: 3, required: true }
  - { name: "Mirror Material", slot: 4, required: true }
  - { name: "Contour Material", slot: 5, required: true }
data_inputs:
  - name: "Panel Records"
    slot: 0
    element_size: 64
    element_count: 96
    schema:
      - { name: center, type: float2 }
      - { name: size, type: float2 }
      - { name: angle, type: float }
      - { name: depth, type: float }
      - { name: kind, type: float }
      - { name: palette, type: float }
      - { name: group_id, type: float }
      - { name: order_id, type: float }
      - { name: fold, type: float }
      - { name: pattern, type: float }
      - { name: skew, type: float }
      - { name: phase, type: float }
      - { name: weight, type: float }
      - { name: active, type: float }
  - name: "Route Records"
    slot: 1
    element_size: 48
    element_count: 48
    schema:
      - { name: p0, type: float2 }
      - { name: p1, type: float2 }
      - { name: width, type: float }
      - { name: palette, type: float }
      - { name: group_id, type: float }
      - { name: phase, type: float }
      - { name: dash, type: float }
      - { name: elevation, type: float }
      - { name: active, type: float }
      - { name: reserved, type: float }
  - name: "Face Records"
    slot: 2
    element_size: 64
    element_count: 288
    schema:
      - { name: center, type: float2 }
      - { name: size, type: float2 }
      - { name: axis_x, type: float2 }
      - { name: axis_y, type: float2 }
      - { name: depth, type: float }
      - { name: face_kind, type: float }
      - { name: palette, type: float }
      - { name: pattern, type: float }
      - { name: source_id, type: float }
      - { name: group_id, type: float }
      - { name: phase, type: float }
      - { name: active, type: float }
  - name: "Ribbon Records"
    slot: 3
    element_size: 64
    element_count: 24
    schema:
      - { name: p0, type: float2 }
      - { name: p1, type: float2 }
      - { name: width, type: float }
      - { name: feather, type: float }
      - { name: material, type: float }
      - { name: layer, type: float }
      - { name: phase, type: float }
      - { name: speed, type: float }
      - { name: warp, type: float }
      - { name: opacity, type: float }
      - { name: uv_offset, type: float2 }
      - { name: active, type: float }
      - { name: reserved, type: float }
  - name: "Portal Records"
    slot: 4
    element_size: 64
    element_count: 16
    schema:
      - { name: center, type: float2 }
      - { name: radius, type: float }
      - { name: thickness, type: float }
      - { name: rotation, type: float }
      - { name: sector_count, type: float }
      - { name: depth, type: float }
      - { name: material, type: float }
      - { name: phase, type: float }
      - { name: speed, type: float }
      - { name: eccentricity, type: float2 }
      - { name: opacity, type: float }
      - { name: scale, type: float }
      - { name: active, type: float }
      - { name: reserved, type: float }
parameters:
  - { name: master_mix, display: "Master Mix", type: float, min: 0, max: 1, default: 1, group: "Composition" }
  - { name: master_phase, display: "Master Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: data_mix, display: "Data Material Mix", type: float, min: 0, max: 1.4, default: 1.0, group: "Composition" }
  - { name: black_coverage, display: "Black Coverage", type: float, min: 0, max: 1.5, default: 0.92, group: "Composition" }
  - { name: pressure, display: "Structural Pressure", type: float, min: 0, max: 1, default: 0.56, group: "Performance" }
  - { name: reindex, display: "Kinetic Re-index", type: float, min: 0, max: 1, default: 0.42, group: "Performance" }
  - { name: strike, display: "Plate Strike", type: float, min: 0, max: 1, default: 0.38, group: "Performance" }
  - { name: focus, display: "Stage Focus", type: point2D, min: [-1, -1], max: [1, 1], default: [0, 0], group: "Performance" }
  - { name: rupture, display: "Rupture Direction", type: point2D, min: [-1, -1], max: [1, 1], default: [0, 0], group: "Performance" }
  - { name: accent_gain, display: "Registration Energy", type: float, min: 0, max: 1.5, default: 0.86, group: "Finish" }
  - { name: ink_color, display: "Blackout Ink", type: color, default: [0.004, 0.003, 0.006], group: "Palette" }
  - { name: accent_color, display: "Registration Accent", type: color, default: [1.0, 0.11, 0.015], group: "Palette" }
passes:
  - name: master
    shader: master.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }
      - { slot: 5, source: "input:5" }
      - { slot: 6, source: "data:0" }
      - { slot: 7, source: "data:1" }
      - { slot: 8, source: "data:2" }
      - { slot: 9, source: "data:3" }
      - { slot: 10, source: "data:4" }
    output: output
outputs:
  - { name: "Master Program", pass: master }
