name: "Territory D - Capillary Memory"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - { name: master_phase, display: "Master Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_envelope, display: "Master Envelope", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_pulse, display: "Master Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: master_play, display: "Master Play", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Clock" }
  - { name: master_scrub, display: "Master Scrub", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Clock" }
  - { name: emitter_count, display: "Emitter Count", type: int, min: 2, max: 9, default: 6, group: "Structure" }
  - { name: memory_decay, display: "Memory Retention", type: float, min: 0.86, max: 0.999, default: 0.988, group: "Memory" }
  - { name: advection, display: "Field Advection", type: float, min: 0.0, max: 3.0, default: 1.35, group: "Memory" }
  - { name: deposit_gain, display: "Trace Deposit", type: float, min: 0.25, max: 2.0, default: 1.1, group: "Rendering" }
  - { name: trace_threshold, display: "Trace Threshold", type: float, min: 0.02, max: 0.75, default: 0.14, group: "Rendering" }
  - { name: accent_gain, display: "Active Trace", type: float, min: 0.0, max: 2.0, default: 1.05, group: "Rendering" }

buffers:
  - name: memory
    format: RGBA16F
    scale: 0.5
    persistent: true

passes:
  - name: accumulate
    shader: accumulate.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:memory" }
    output: "buffer:memory"

  - name: present
    shader: present.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:memory" }
    output: output
