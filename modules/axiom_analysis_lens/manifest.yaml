name: "Axiom Analysis Lens"
version: "1.0"
mode: generator
resolution: [480, 270]

inputs:
  - { name: "Plate", slot: 0, required: true }

parameters:
  - { name: threshold, display: "Print Threshold", type: float, min: 0.05, max: 0.95, default: 0.48, group: "Analysis" }
  - { name: softness, display: "Threshold Softness", type: float, min: 0.002, max: 0.18, default: 0.028, group: "Analysis" }
  - { name: contrast, display: "Signal Contrast", type: float, min: 0.5, max: 3.0, default: 1.35, group: "Analysis" }
  - { name: gamma, display: "Signal Gamma", type: float, min: 0.25, max: 2.5, default: 0.92, group: "Analysis" }
  - { name: preblur, display: "Cross Preblur", type: float, min: 0.0, max: 1.0, default: 0.24, group: "Analysis" }
  - { name: detail_boost, display: "Detail Recovery", type: float, min: 0.0, max: 2.0, default: 0.42, group: "Analysis" }
  - { name: graphite_shoulder, display: "Graphite Shoulder", type: float, min: 0.0, max: 0.8, default: 0.22, group: "Analysis" }
  - { name: islandize, display: "Print Separation", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Island Conditioning" }
  - { name: island_columns, display: "Island Columns", type: int, min: 3, max: 12, default: 7, group: "Island Conditioning" }
  - { name: island_rows, display: "Island Rows", type: int, min: 2, max: 8, default: 4, group: "Island Conditioning" }
  - { name: island_seam, display: "Seam Width", type: float, min: 0.005, max: 0.16, default: 0.055, group: "Island Conditioning" }
  - { name: invert_signal, display: "Invert Signal", type: bool, default: false, flags: button, group: "Analysis" }

passes:
  - name: analysis
    shader: analysis.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Analysis", pass: analysis }
