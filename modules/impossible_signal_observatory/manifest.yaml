name: "Impossible Signal Observatory"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Master Program", slot: 0, required: true }

parameters:
  - { name: observatory_mix, display: "Observatory Mix", type: float, min: 0.0, max: 1.0, default: 0.38, group: "Chamber" }
  - { name: aperture_center, display: "Aperture Center", type: point2D, default: [0.57,0.46], group: "Chamber" }
  - { name: aperture_size, display: "Aperture Size", type: float, min: 0.12, max: 0.9, default: 0.54, group: "Chamber" }
  - { name: chamber_depth, display: "Chamber Depth", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Chamber" }
  - { name: orbit_phase, display: "Orbit Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: orbit_rate, display: "Orbit Rate", type: float, min: -2.0, max: 2.0, default: 0.32, group: "Motion" }
  - { name: scan_density, display: "Scan Density", type: float, min: 2.0, max: 32.0, default: 13.0, group: "Motion" }
  - { name: signal_gain, display: "Signal Gain", type: float, min: 0.0, max: 1.5, default: 0.46, group: "Signal" }
  - { name: aperture_color, display: "Aperture Color", type: color, default: [0.94,0.09,0.03], group: "Signal" }
  - { name: trace_color, display: "Trace Color", type: color, default: [0.2,0.95,0.35], group: "Signal" }

passes:
  - name: observatory
    shader: observatory.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Observatory Program", pass: observatory }
