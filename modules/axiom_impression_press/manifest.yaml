name: "AXIOM 10 / IMPRESSION PRESS"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [noise]

inputs:
  - { name: "Corona Program", slot: 0, required: true }
  - { name: "Organic Plate", slot: 1, required: true }
  - { name: "Feature Edge Map", slot: 2, required: true }
  - { name: "Topology Score", slot: 3, required: true }
  - { name: "Pressure Desk", slot: 4, required: true }
  - { name: "Polyrhythm Rack", slot: 5, required: true }
  - { name: "Interference Mask", slot: 6, required: true }

data_inputs:
  - name: "Choir Nodes"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: weight, type: float }
      - { name: kind, type: float }
      - { name: group_id, type: float }
      - { name: rank, type: float }
      - { name: response, type: float }
      - { name: radius, type: float }
      - { name: active, type: float }
      - { name: id, type: float }
  - name: "Kinetic Events"
    slot: 1
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: speed, type: float }
      - { name: energy, type: float }
      - { name: active, type: float }
      - { name: id, type: float }

buffers:
  - { name: cut_edges, format: RGBA16F }
  - { name: instrument_impressions, format: RGBA16F }

parameters:
  - { name: press_mode, display: "Press Grammar", type: enum, default: 0, options: ["Dark Engraving", "Cross Section", "Overprint"], flags: button_grid, group: "Composition" }
  - { name: edge_gain, display: "Cut Edge", type: float, min: 0.0, max: 3.0, default: 0.62, group: "Plate Finesse" }
  - { name: edge_width, display: "Edge Separation", type: float, min: 0.35, max: 6.0, default: 1.25, group: "Plate Finesse" }
  - { name: edge_echo, display: "Edge Echo", type: float, min: 0.0, max: 0.04, default: 0.004, group: "Plate Finesse" }
  - { name: carrier_warp, display: "Carrier Flow", type: float, min: 0.0, max: 0.06, default: 0.012, group: "Plate Finesse" }
  - { name: block_columns, display: "Mask Columns", type: int, min: 4, max: 24, default: 12, group: "Rectilinear Mask" }
  - { name: block_rows, display: "Mask Rows", type: int, min: 3, max: 16, default: 7, group: "Rectilinear Mask" }
  - { name: block_displacement, display: "Masked Block Slip", type: float, min: 0.0, max: 0.10, default: 0.022, group: "Rectilinear Mask" }
  - { name: block_mask_threshold, display: "Mask Threshold", type: float, min: 0.05, max: 0.95, default: 0.48, group: "Rectilinear Mask" }
  - { name: block_mask_softness, display: "Mask Softness", type: float, min: 0.005, max: 0.30, default: 0.08, group: "Rectilinear Mask" }
  - { name: box_path_mode, display: "Processing Head Path", type: enum, default: 0, options: ["Raster Scan", "Lissajous Knot", "Corner Relay", "Feature Chase"], flags: button_grid, group: "Localized Distortion" }
  - { name: chase_randomness, display: "Chase Random Walk", type: float, min: 0.0, max: 0.35, default: 0.14, group: "Localized Distortion" }
  - { name: chase_jump_rate, display: "Chase Jump Rate", type: float, min: 0.1, max: 4.0, default: 0.72, group: "Localized Distortion" }
  - { name: chase_slew, display: "Chase Slew", type: float, min: 0.1, max: 1.0, default: 0.62, group: "Localized Distortion" }
  - { name: box_center, display: "Feature Chase Anchor", type: point2D, default: [0.5, 0.5], group: "Localized Distortion" }
  - { name: box_size, display: "Distortion Box Size", type: point2D, default: [0.30, 0.38], group: "Localized Distortion" }
  - { name: box_twist, display: "Localized Twist", type: float, min: -3.0, max: 3.0, default: 1.25, group: "Localized Distortion" }
  - { name: box_softness, display: "Box Edge Softness", type: float, min: 0.001, max: 0.12, default: 0.018, group: "Localized Distortion" }
  - { name: box_outline_gain, display: "Box Hairline", type: float, min: 0.0, max: 1.5, default: 0.38, group: "Localized Distortion" }
  - { name: box_operation, display: "Processing Operation", type: enum, default: 1, options: ["Cell Surgery", "Recursive Fold", "Slice Exchange"], flags: button_grid, group: "Localized Distortion" }
  - { name: operation_depth, display: "Operation Depth", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Localized Distortion" }
  - { name: operation_repeats, display: "Operation Subdivisions", type: int, min: 2, max: 12, default: 5, group: "Localized Distortion" }
  - { name: operation_ink, display: "Operation Difference Ink", type: float, min: 0.0, max: 2.0, default: 0.62, group: "Localized Distortion" }
  - { name: hud_gain, display: "Live Readout Ink", type: float, min: 0.0, max: 2.0, default: 0.78, group: "Live Readouts" }
  - { name: hud_edge_density, display: "Feature Edge Density", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Live Readouts" }
  - { name: organic_breakup, display: "Organic Breakup", type: float, min: 0.0, max: 1.0, default: 0.48, group: "Plate Finesse" }
  - { name: contour_gain, display: "Topographic Ribs", type: float, min: 0.0, max: 1.5, default: 0.46, group: "Plate Finesse" }
  - { name: feature_edge_gain, display: "Feature Etching", type: float, min: 0.0, max: 3.0, default: 0.72, group: "Plate Finesse" }
  - { name: topology_preview_gain, display: "Topology Impression", type: float, min: 0.0, max: 2.5, default: 0.62, group: "Preview Plates" }
  - { name: pressure_preview_gain, display: "Pressure Impression", type: float, min: 0.0, max: 2.5, default: 0.38, group: "Preview Plates" }
  - { name: rhythm_preview_gain, display: "Rhythm Impression", type: float, min: 0.0, max: 2.5, default: 0.52, group: "Preview Plates" }
  - { name: preview_inset, display: "Preview Inset", type: float, min: 0.02, max: 0.28, default: 0.105, group: "Preview Plates" }
  - { name: registration_fault, display: "Registration Fault", type: float, min: 0.0, max: 0.05, default: 0.009, group: "Print" }
  - { name: halftone_gain, display: "Halftone Grain", type: float, min: 0.0, max: 1.5, default: 0.26, group: "Print" }
  - { name: frame_gain, display: "Registration Frame", type: float, min: 0.0, max: 2.0, default: 0.82, group: "Print" }
  - { name: phase, display: "Press Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: paper_color, display: "Instrument White", type: color, default: [0.91, 0.90, 0.86], group: "Palette" }
  - { name: accent_color, display: "Fault Vermilion", type: color, default: [1.0, 0.14, 0.02], group: "Palette" }
  - { name: exposure, display: "Final Exposure", type: float, min: 0.4, max: 1.8, default: 1.0, group: "Output" }

passes:
  - name: cut_plate_edges
    shader: cut_edges.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:1" }
      - { slot: 1, source: "input:2" }
      - { slot: 2, source: "input:6" }
    output: "buffer:cut_edges"

  - name: impress_instruments
    shader: instrument_impressions.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:3" }
      - { slot: 1, source: "input:4" }
      - { slot: 2, source: "input:5" }
    output: "buffer:instrument_impressions"

  - name: final_press
    shader: composite.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:cut_edges" }
      - { slot: 2, source: "buffer:instrument_impressions" }
      - { slot: 3, source: "input:6" }
      - { slot: 4, source: "data:0" }
      - { slot: 5, source: "data:1" }
    output: output

outputs:
  - { name: "Master Program", pass: final_press }

viewport:
  hint: "Final multi-plate press. Organic and Features edges cut the carrier silhouette; the real Topology Score, Pressure Desk, and Polyrhythm Rack previews become restrained registration impressions around it."
