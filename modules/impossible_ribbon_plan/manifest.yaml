name: "Impossible Ribbon Plan"
version: "1.0"
mode: generator
resolution: [640, 360]
inputs:
  - { name: "Contour Material", slot: 0, required: true }
buffers:
  - { name: ribbons, structured: true, element_size: 64, element_count: 24 }
parameters:
  - { name: ribbon_seed, display: "Ribbon Seed", type: int, min: 0, max: 999, default: 451, group: "Grammar" }
  - { name: ribbon_count, display: "Ribbon Count", type: int, min: 4, max: 24, default: 14, group: "Grammar" }
  - { name: master_phase, display: "Master Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: travel_amount, display: "Lane Travel", type: float, min: 0, max: 0.8, default: 0.24, group: "Motion" }
  - { name: width_scale, display: "Width Scale", type: float, min: 0.35, max: 2.5, default: 1.0, group: "Structure" }
  - { name: warp_amount, display: "Ribbon Warp", type: float, min: 0, max: 1.5, default: 0.54, group: "Structure" }
  - { name: irregularity, display: "Controlled Irregularity", type: float, min: 0, max: 1, default: 0.48, group: "Structure" }
  - { name: rupture, display: "Rupture Direction", type: point2D, min: [-1, -1], max: [1, 1], default: [0, 0], group: "Structure" }
passes:
  - { name: emit_ribbons, shader: emit_ribbons.hlsl, target: cs_5_0, dispatch: [1, 1, 1], thread_group_x: 32, thread_group_y: 1, output: "buffer:ribbons" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:ribbons" }
    output: output
outputs:
  - { name: "Ribbon Preview", pass: preview }
data_outputs:
  - name: "Ribbon Records"
    buffer: ribbons
    schema:
      - { name: p0, type: float2 }
      - { name: p1, type: float2 }
      - { name: width, type: float }
      - { name: feather, type: float }
      - { name: material, type: float }
      - { name: layer, type: float }
      - { name: phase, type: float }
      - { name: speed, type: float }
      - { name: warp, type: float }
      - { name: opacity, type: float }
      - { name: uv_offset, type: float2 }
      - { name: active, type: float }
      - { name: reserved, type: float }
