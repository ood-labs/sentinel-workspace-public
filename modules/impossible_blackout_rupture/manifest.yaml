name: "Impossible Blackout Rupture"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Pocket Program", slot: 0, required: true }

parameters:
  - { name: rupture_mix, display: "Rupture Mix", type: float, min: 0.0, max: 1.0, default: 0.92, group: "Rupture" }
  - { name: rupture_phase, display: "Rupture Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: rupture_rate, display: "Rupture Rate", type: float, min: -2.0, max: 2.0, default: 0.52, group: "Motion" }
  - { name: blackout_amount, display: "Blackout Amount", type: float, min: 0.20, max: 0.95, default: 0.76, group: "Rupture" }
  - { name: aperture_width, display: "Aperture Width", type: float, min: 0.01, max: 0.16, default: 0.055, group: "Rupture" }
  - { name: rupture_diagonal, display: "Rupture Diagonal", type: float, min: -1.0, max: 1.0, default: 0.46, group: "Rupture" }
  - { name: shard_amount, display: "Shard Amount", type: float, min: 0.0, max: 1.0, default: 0.82, group: "Rupture" }
  - { name: distortion, display: "Shard Distortion", type: float, min: 0.0, max: 0.35, default: 0.14, group: "Motion" }
  - { name: blackout_color, display: "Blackout Color", type: color, default: [0.008,0.010,0.014], group: "Ink" }
  - { name: scar_color, display: "Scar Color", type: color, default: [0.92,0.08,0.03], group: "Ink" }

passes:
  - name: blackout
    shader: blackout.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Ruptured Program", pass: blackout }
