name: "AXIOM 16 / POLYRHYTHM INSPECTOR"
version: "1.0"
mode: generator
resolution: [1280,720]
inputs:
  - { name: "Refined Program", slot: 0, required: true }
parameters:
  - { name: phase, type: float, min: 0.0, max: 1.0, default: 0.2, group: "Live Data" }
  - { name: sine, type: float, min: -1.0, max: 1.0, default: 0.5, group: "Live Data" }
  - { name: tri, type: float, min: 0.0, max: 1.0, default: 0.5, group: "Live Data" }
  - { name: pulse, type: float, min: 0.0, max: 1.0, default: 0.0, group: "Live Data" }
  - { name: drift, type: float, min: 0.0, max: 1.0, default: 0.5, group: "Live Data" }
  - { name: envelope, type: float, min: 0.0, max: 1.0, default: 0.5, group: "Live Data" }
  - { name: blob_count, type: float, min: 0.0, max: 64.0, default: 1.0, group: "Features" }
  - { name: corner_count, type: float, min: 0.0, max: 512.0, default: 36.0, group: "Features" }
  - { name: edge_density, type: float, min: 0.0, max: 1.0, default: 0.06, group: "Features" }
  - { name: dominant_angle, type: float, min: -3.14, max: 3.14, default: 0.0, group: "Features" }
  - { name: paper_color, type: color, default: [0.91,0.90,0.86], group: "Palette" }
  - { name: accent_color, type: color, default: [1.0,0.14,0.02], group: "Palette" }
passes:
  - name: inspector
    shader: inspector.hlsl
    target: cs_5_0
    inputs: [{ slot: 0, source: "input:0" }]
    output: output
outputs: [{ name: "Master Program", pass: inspector }]
viewport: { hint: "Ten-section Polyrhythm and Features inspector with live scopes, meters, counters, and phase topology. No mouse controls." }

