name: "Interactive Architectural Lighting"
version: "2.0"
mode: generator
resolution: [1280,720]

panel:
  mode: canvas
  output: "Lighting Plan"
  resolution: follow_panel

data_inputs:
  - name: "Building PNodes"
    slot: 0
    element_size: 48
    element_count: 96
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float }
      - { name: kind_id, type: float }
      - { name: seed, type: float }
      - { name: yaw, type: float }
      - { name: height, type: float }
      - { name: width, type: float }
      - { name: depth, type: float }
      - { name: dir, type: float, count: 2 }

parameters:
  - { name: reset_selected, display: "Reset Selected", type: button, hidden: true, group: "Plan Editor" }
  - { name: reset_all, display: "Reset All", type: button, hidden: true, group: "Plan Editor" }
  - name: time_of_day
    display: "Time of Day"
    type: enum
    options: [Golden Hour, Blue Hour, Night Gallery]
    default: 1
    flags: button_grid
    group: "Environment"
  - { name: sun_intensity, display: "Sun Intensity", type: float, min: 0, max: 8, default: 3.6, group: "Sun" }
  - { name: sky_intensity, display: "Sky Fill", type: float, min: 0, max: 3, default: 0.72, group: "Environment" }
  - { name: interior_intensity, display: "Interior + Canopy", type: float, min: 0, max: 8, default: 3.2, group: "Practical" }
  - { name: lamp_intensity, display: "Path Lamps", type: float, min: 0, max: 8, default: 2.4, group: "Practical" }
  - { name: shadow_softness, display: "Shadow Softness", type: float, min: 0.02, max: 1, default: 0.28, group: "Shadows" }
  - { name: practical_range, display: "Practical Range", type: float, min: 3, max: 18, default: 9, group: "Practical" }
  - { name: canopy_range, display: "Canopy Range", type: float, min: 3, max: 18, default: 8, group: "Practical" }

viewport:
  hint: "Select Sun, Key, Fill, or Canopy, then drag it in the plan. Backspace resets the selection."
  interactions: [events, selection]
  selection: { mode: single, provider: ray_query, result_buffer: pick_result, object_buffer: viewport_objects }
  input: { pointer: [left], keyboard: [backspace, escape, shift], gestures: [click, drag] }
  bindings:
    - { gesture: left_click, action: select_light, label: "Select Light" }
    - { gesture: left_drag, action: move_light, label: "Move Light" }
  # ui-label: title = ARCHITECTURAL LIGHTING
  # ui-label: sun = SUN
  # ui-label: key = KEY
  # ui-label: fill = FILL
  # ui-label: canopy = CANOPY
  # ui-label: plan = LIVE LIGHT BUFFER / TOP-DOWN SITE PLAN
  # ui-label: reset = RST
  # ui-label: reset_all = RST ALL
  controls:
    - { id: reset, kind: button, param: reset_selected, rect: [0.790,0.032,0.875,0.078], label: "Reset Selected" }
    - { id: reset_all, kind: button, param: reset_all, rect: [0.882,0.032,0.970,0.078], label: "Reset All" }

buffers:
  - { name: editor_state, structured: true, element_size: 48, element_count: 1, persistent: true }
  - { name: drag_snapshot, structured: true, element_size: 32, element_count: 4, persistent: true }
  - { name: light_state, structured: true, element_size: 32, element_count: 4, persistent: true }
  - { name: lights, structured: true, element_size: 64, element_count: 8 }
  - { name: viewport_objects, structured: true, element_size: 120, element_count: 4, persistent: true }
  - { name: pick_result, structured: true, element_size: 40, element_count: 1, persistent: true }

state_buffers:
  - name: light_state
    max_elements: 4
    schema:
      - { name: position, type: float2 }
      - { name: rotation, type: float }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
      - { name: pad, type: float3 }

passes:
  - { name: interaction, shader: interaction.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:light_state" } ], output: "buffer:editor_state" }
  - { name: snapshot, shader: snapshot.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:light_state" } ], output: "buffer:drag_snapshot" }
  - { name: update, shader: update.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:drag_snapshot" } ], output: "buffer:light_state" }
  - { name: emit, shader: emit_lights.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 8, thread_group_y: 1, inputs: [ { slot: 0, source: "data:0" }, { slot: 1, source: "buffer:light_state" } ], output: "buffer:lights" }
  - { name: descriptors, shader: descriptors.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 4, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:light_state" } ], output: "buffer:viewport_objects" }
  - { name: pick, shader: pick.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:light_state" } ], output: "buffer:pick_result" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:lights" }, { slot: 1, source: "buffer:light_state" } ], output: output }

outputs:
  - { name: "Lighting Plan", pass: preview }

data_outputs:
  - name: "Light Records"
    buffer: lights
    schema:
      - { name: position, type: float, count: 3 }
      - { name: type_id, type: float }
      - { name: direction, type: float, count: 3 }
      - { name: range, type: float }
      - { name: color, type: float, count: 3 }
      - { name: intensity, type: float }
      - { name: size, type: float, count: 2 }
      - { name: softness, type: float }
      - { name: enabled, type: float }
