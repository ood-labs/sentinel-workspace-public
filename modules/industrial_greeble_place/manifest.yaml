name: "Industrial Greeble Place"
version: "1.0"
mode: generator
resolution: [512, 256]
working_format: RGBA8

data_inputs:
  - name: "SurfacePoints"
    slot: 0
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: parent_kind, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: weight, type: float }
      - { name: active, type: float }

buffers:
  - name: greebles
    structured: true
    element_size: 80
    element_count: 2048

parameters:
  - { name: seed, display: "Seed", type: int, min: 0, max: 999, default: 41, group: "Placement" }
  - { name: greeble_density, display: "Density", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Placement" }
  - { name: hero_detail_density, display: "Hero Density", type: float, min: 0.0, max: 2.0, default: 0.45, group: "Placement" }
  - { name: background_detail_density, display: "Background Density", type: float, min: 0.0, max: 1.0, default: 0.12, group: "Placement" }
  - { name: edge_detail_boost, display: "Edge Boost", type: float, min: 0.0, max: 2.0, default: 1.1, group: "Placement" }
  - { name: row_alignment, display: "Row Alignment", type: float, min: 0.0, max: 1.0, default: 0.55, group: "Placement" }
  - { name: symmetry_amount, display: "Symmetry", type: float, min: 0.0, max: 1.0, default: 0.45, group: "Placement" }
  - { name: scale_min, display: "Scale Min", type: float, min: 0.1, max: 4.0, default: 0.65, group: "Scale" }
  - { name: scale_max, display: "Scale Max", type: float, min: 0.1, max: 6.0, default: 1.45, group: "Scale" }
  - { name: detail_scale, display: "Detail Scale", type: float, min: 0.1, max: 4.0, default: 0.75, group: "Scale" }
  - { name: bolt_weight, display: "Bolts", type: float, min: 0.0, max: 4.0, default: 2.3, group: "Kind Mix" }
  - { name: plate_weight, display: "Plates", type: float, min: 0.0, max: 4.0, default: 1.7, group: "Kind Mix" }
  - { name: rib_weight, display: "Ribs", type: float, min: 0.0, max: 4.0, default: 1.1, group: "Kind Mix" }
  - { name: vent_weight, display: "Vents", type: float, min: 0.0, max: 4.0, default: 0.65, group: "Kind Mix" }
  - { name: box_weight, display: "Boxes", type: float, min: 0.0, max: 4.0, default: 0.55, group: "Kind Mix" }
  - { name: clamp_weight, display: "Clamps", type: float, min: 0.0, max: 4.0, default: 0.8, group: "Kind Mix" }
  - { name: conduit_weight, display: "Conduit", type: float, min: 0.0, max: 4.0, default: 0.9, group: "Kind Mix" }
  - { name: weld_weight, display: "Welds", type: float, min: 0.0, max: 4.0, default: 0.75, group: "Kind Mix" }
  - { name: stain_weight, display: "Stains", type: float, min: 0.0, max: 4.0, default: 0.55, group: "Kind Mix" }
  - { name: preview_scale, display: "Preview Scale", type: float, min: 0.01, max: 0.25, default: 0.06, group: "Preview" }
  - { name: preview_offset, display: "Preview Offset", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.0, 0.0], group: "Preview" }

passes:
  - name: compute
    shader: greeble.hlsl
    target: cs_5_0
    dispatch: [32, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:greebles"
    inputs:
      - { slot: 0, source: "data:0" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:greebles" }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Greebles"
    buffer: "greebles"
    schema:
      - { name: anchor, type: float3 }
      - { name: normal, type: float3 }
      - { name: tangent, type: float3 }
      - { name: uv, type: float2 }
      - { name: size, type: float3 }
      - { name: kind, type: float }
      - { name: material, type: float }
      - { name: parent_id, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: spare, type: float }
