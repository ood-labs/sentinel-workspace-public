name: "Marble SDF Renderer"
version: "0.1"
mode: generator
resolution: [1280, 720]
features: [camera]

viewport:
  hint: "RMB = look, WASD = move, Tab = orbit/fly"
  interactions: [camera]

data_inputs:
  - name: "SDF Parts"
    slot: 0
    schema:
      - { name: transform_a, type: float4 }
      - { name: transform_b, type: float4 }
      - { name: rotation, type: float4 }
      - { name: meta, type: float4 }
  - name: "Marble Profile"
    slot: 1
    schema:
      - { name: stone_color_roughness, type: float4 }
      - { name: vein_color_scale, type: float4 }
      - { name: vein_contrast_pore_scale, type: float4 }
      - { name: cavity_subsurface_micro_normal, type: float4 }
  - name: "Light Records"
    slot: 2
    schema:
      - { name: position_radius, type: float4 }
      - { name: color_intensity, type: float4 }
      - { name: direction_type, type: float4 }
  - name: "Glitch Field"
    slot: 3
    schema:
      - { name: global_distortion, type: float4 }
      - { name: slice_pattern, type: float4 }
      - { name: fracture_pattern, type: float4 }
      - { name: temporal_motion, type: float4 }

parameters:
  - { name: ray_steps, display: "Ray Steps", type: int, min: 32, max: 160, default: 92, group: "Render" }
  - { name: surface_eps, display: "Surface Precision", type: float, min: 0.001, max: 0.03, default: 0.008, group: "Render" }
  - { name: max_distance, display: "Max Distance", type: float, min: 4.0, max: 18.0, default: 9.0, group: "Render" }
  - { name: exposure, display: "Exposure", type: float, min: 0.2, max: 4.0, default: 1.35, group: "Look" }
  - { name: vein_visibility, display: "Vein Visibility", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Look" }
  - { name: micro_normal, display: "Micro Normal", type: float, min: 0.0, max: 1.0, default: 0.48, group: "Look" }
  - { name: surface_carve, display: "Surface Chisel", type: float, min: 0.0, max: 0.18, default: 0.11, group: "Look" }
  - { name: noise_scale, display: "Chisel Scale", type: float, min: 1.0, max: 16.0, default: 7.5, group: "Look" }
  - { name: chrome_amount, display: "Black Chrome", type: float, min: 0.0, max: 1.0, default: 0.94, group: "Look" }
  - { name: edge_break, display: "Edge Break", type: float, min: 0.0, max: 0.08, default: 0.018, group: "Look" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "data:2" }
      - { slot: 3, source: "data:3" }
    output: output

outputs:
  - name: "Marble Sculpture"
    pass: render
