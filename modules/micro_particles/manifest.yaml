name: "Micro Particles"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: density, display: "Particle Density", type: int, min: 8, max: 96, default: 34, group: "Field" }
  - { name: scale, display: "Particle Scale", type: float, min: 0.2, max: 3.0, default: 0.8, group: "Field" }
  - { name: drift, display: "Drift", type: float, min: 0.0, max: 2.0, default: 0.32, group: "Motion" }
  - { name: spread, display: "Spread", type: float, min: 0.1, max: 2.0, default: 0.92, group: "Motion" }
  - { name: seed, display: "Seed", type: float, min: 0.0, max: 99.0, default: 17.0, group: "Motion" }
  - { name: brightness, display: "Brightness", type: float, min: 0.0, max: 2.0, default: 0.42, group: "Output" }
  - { name: particle_color, display: "Particle Color", type: color, default: [0.55, 0.68, 0.78], group: "Output" }

passes:
  - { name: render, shader: particles.hlsl, target: cs_5_0 }

outputs:
  - { name: "Particles", pass: render }
