name: "Scientific Seed Lab"
version: "1.0"
mode: generator
resolution: [960, 540]

panel:
  mode: canvas
  output: "Seed Lab"
  resolution: follow_panel

parameters:
  - { name: seed_tool, display: "Seed Tool", type: button, group: "Tools" }
  - { name: vortex_tool, display: "Vortex Tool", type: button, group: "Tools" }
  - { name: erase_tool, display: "Erase Tool", type: button, group: "Tools" }
  - { name: clear_all, display: "Clear All", type: button, group: "Tools" }
  - { name: seed_radius, display: "Radius", type: float, min: 0.02, max: 0.28, default: 0.10, group: "Brush" }
  - { name: seed_strength, display: "Strength", type: float, min: 0.1, max: 2.5, default: 1.0, group: "Brush" }

viewport:
  hint: "Q Seed, W Vortex, E Erase, X Clear. Drag to move; wheel while dragging changes radius; Alt+wheel changes strength."
  interactions: [events]
  input:
    pointer: [left, wheel]
    keyboard: [q, w, e, x, alt]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: add_or_erase, label: "Add / Erase Stimulus" }
    - { gesture: left_drag, action: move, label: "Move Stimulus" }
    - { gesture: wheel, action: resize_dragged, label: "Resize Dragged Stimulus" }
    - { key: alt, action: strength_modifier, label: "Alt + Wheel Adjusts Strength" }
    - { key: q, action: seed_tool, label: "Seed Tool" }
    - { key: w, action: vortex_tool, label: "Vortex Tool" }
    - { key: e, action: erase_tool, label: "Erase Tool" }
    - { key: x, action: clear_all, label: "Clear All" }
  # ui-label: title = SCIENTIFIC SEED LAB
  # ui-label: seed = SEED
  # ui-label: vortex = VORTEX
  # ui-label: erase = ERASE
  # ui-label: clear = CLEAR
  # ui-label: active = ACTIVE
  controls:
    - { id: seed, kind: button, param: seed_tool, rect: [0.600, 0.027, 0.680, 0.096], label: "Seed Tool" }
    - { id: vortex, kind: button, param: vortex_tool, rect: [0.690, 0.027, 0.790, 0.096], label: "Vortex Tool" }
    - { id: erase, kind: button, param: erase_tool, rect: [0.800, 0.027, 0.885, 0.096], label: "Erase Tool" }
    - { id: clear, kind: button, param: clear_all, rect: [0.895, 0.027, 0.980, 0.096], label: "Clear All" }

buffers:
  - { name: editor_state, structured: true, element_size: 64, element_count: 1, persistent: true }
  - { name: stimulus_snapshot, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: stimuli, structured: true, element_size: 48, element_count: 64, persistent: true }

state_buffers:
  - name: stimuli
    max_elements: 64
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: age, type: float }
      - { name: mode, type: float }
      - { name: id, type: uint }
      - { name: flags, type: uint }
      - { name: pad, type: float2 }

passes:
  - name: interaction
    shader: interaction.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:stimuli" }
    output: "buffer:editor_state"
  - name: snapshot
    shader: snapshot.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:stimuli" }
    output: "buffer:stimulus_snapshot"
  - name: update
    shader: update.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:editor_state" }
      - { slot: 1, source: "buffer:stimulus_snapshot" }
    output: "buffer:stimuli"
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:stimuli" }
      - { slot: 1, source: "buffer:editor_state" }
    output: output

data_outputs:
  - name: "Stimuli"
    buffer: stimuli
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: age, type: float }
      - { name: mode, type: float }
      - { name: id, type: uint }
      - { name: flags, type: uint }
      - { name: pad, type: float2 }

outputs:
  - { name: "Seed Lab", pass: render }
