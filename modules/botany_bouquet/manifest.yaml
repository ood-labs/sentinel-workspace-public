name: "Botany Bouquet"
version: "0.1"
mode: generator
resolution: [720, 1104]

# Flat-color riso/pop botanical bouquet on a violet ground — striped hatched blade-leaves,
# mosaic berries, dotted spheres, drooping hatched petals, black wire scribbles, and a
# translucent crop-frame overlay. Recreation of reference x8X82M4fonC5rKXl. 2D, one pass.

parameters:
  - { name: loop_period, display: "Loop Period",  type: float, min: 3.0,  max: 30.0, default: 12.0, group: "Motion" }
  - { name: zoom_amt,    display: "Push-in",       type: float, min: 0.0,  max: 0.4,  default: 0.14, group: "Motion" }
  - { name: drift_amt,   display: "Drift",         type: float, min: 0.0,  max: 0.10, default: 0.02, group: "Motion" }

  - { name: frame_x0,    display: "Frame X0",      type: float, min: 0.0,  max: 1.0,  default: 0.31, group: "Frame" }
  - { name: frame_x1,    display: "Frame X1",      type: float, min: 0.0,  max: 1.0,  default: 0.97, group: "Frame" }
  - { name: frame_y0,    display: "Frame Y0",      type: float, min: 0.0,  max: 1.0,  default: 0.28, group: "Frame" }
  - { name: frame_y1,    display: "Frame Y1",      type: float, min: 0.0,  max: 1.0,  default: 0.88, group: "Frame" }
  - { name: frame_fill,  display: "Frame Fill",    type: float, min: 0.0,  max: 1.0,  default: 0.55, group: "Frame" }

passes:
  - name: bouquet
    shader: bouquet.hlsl
    target: cs_5_0

outputs:
  - { name: "Bouquet", pass: bouquet }
