name: "PL Path"
version: "1.0"
mode: generator
resolution: [256, 64]
working_format: RGBA8

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

buffers:
  - name: nodes
    structured: true
    element_size: 48
    element_count: 256

parameters:
  - name: mode
    display: "Mode"
    type: enum
    options: [Smooth, Linear, Loop]
    default: 0
    flags: button_grid
    group: "Path"
  - { name: points_per_path, display: "Points / Path", type: int, min: 2, max: 32, default: 12, group: "Path" }
  - { name: num_groups, display: "Num Groups", type: int, min: 1, max: 16, default: 4, group: "Path" }

passes:
  - name: compute
    shader: path.hlsl
    target: cs_5_0
    dispatch: [4, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:nodes"
    inputs:
      - { slot: 0, source: "data:0" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:nodes" } ] }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Nodes"
    buffer: "nodes"
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
