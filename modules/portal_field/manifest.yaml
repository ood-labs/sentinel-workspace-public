name: "Portal Field"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: rings, display: "Depth Rings", type: int, min: 2, max: 24, default: 9, group: "Structure" }
  - { name: cuts, display: "Axial Cuts", type: int, min: 2, max: 32, default: 11, group: "Structure" }
  - { name: depth, display: "Depth", type: float, min: 0.0, max: 2.0, default: 0.72, group: "Structure" }
  - { name: warp, display: "Warp", type: float, min: 0.0, max: 2.0, default: 0.38, group: "Motion" }
  - { name: drift, display: "Drift", type: float, min: 0.0, max: 2.0, default: 0.22, group: "Motion" }
  - { name: brightness, display: "Brightness", type: float, min: 0.0, max: 2.0, default: 0.28, group: "Output" }
  - { name: portal_color, display: "Portal Color", type: color, default: [0.12, 0.32, 0.52], group: "Output" }

passes:
  - { name: render, shader: portal.hlsl, target: cs_5_0 }

outputs:
  - { name: "Portal", pass: render }
