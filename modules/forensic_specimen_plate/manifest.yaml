name: "Forensic Specimen Plate"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [noise]

viewport:
  hint: "Authored semantic source: moving specimen geometry designed for intentional geometric analysis."
  interactions: [mouse]

parameters:
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Score" }
  - { name: animation_rate, display: "Scan Rate", type: float, min: 0.0, max: 0.25, default: 0.035, group: "Score" }
  - { name: composition_scale, display: "Plate Scale", type: float, min: 0.65, max: 1.5, default: 1.0, group: "Composition" }
  - { name: composition_offset, display: "Plate Offset", type: point2D, min: [-0.25, -0.25], max: [0.25, 0.25], default: [0.0, 0.0], group: "Composition" }
  - { name: shear, display: "Grid Shear", type: float, min: -1.0, max: 1.0, default: 0.38, group: "Structure" }
  - { name: grid_density, display: "Grid Density", type: float, min: 5.0, max: 36.0, default: 17.0, group: "Structure" }
  - { name: grid_gain, display: "Grid Gain", type: float, min: 0.0, max: 1.0, default: 0.24, group: "Structure" }
  - { name: cell_fill, display: "Cell Fill", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Structure" }
  - { name: fracture_gain, display: "Fracture Gain", type: float, min: 0.0, max: 2.0, default: 1.15, group: "Structure" }
  - { name: barcode_gain, display: "Archive Bars", type: float, min: 0.0, max: 1.0, default: 0.86, group: "Structure" }
  - { name: quantize_strength, display: "Binary Discipline", type: float, min: 0.0, max: 1.0, default: 0.64, group: "Image" }
  - { name: accent_gain, display: "Current Event", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Image" }
  - { name: accent_color, display: "Current Color", type: color, default: [1.0, 0.31, 0.055], group: "Image" }

passes:
  - { name: render, shader: render.hlsl, target: cs_5_0, time_dependent: true, output: output }

outputs:
  - { name: "Specimen", pass: render }
