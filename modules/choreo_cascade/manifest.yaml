name: "Choreo Cascade"
version: "1.0"
mode: generator
resolution: [1280, 720]

parameters:
  - name: demo_time
    display: "Demo Time"
    type: float
    min: 0.0
    max: 8.0
    default: 0.0
    group: "Motion"

  - name: cue_a_life
    display: "Cue A Life"
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Motion/Cues"

  - name: cue_b_life
    display: "Cue B Life"
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    group: "Motion/Cues"

  - name: beat_phase
    display: "Beat Phase"
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    group: "Motion/Cues"

  - name: tightness_macro
    display: "Tightness Macro"
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    group: "Motion/Cues"

  - name: demo_mode
    display: "Demo Mode"
    type: enum
    default: 0
    options: [Wavefront, Anticipation, Loop Noise]
    flags: button_grid
    group: "Motion"

  - name: spring_preset
    display: "Spring Preset"
    type: enum
    default: 0
    options: [Bouncy, Smooth, Snappy, Heavy]
    flags: button_grid
    group: "Motion"

  - name: spring_t
    display: "Spring Sample T"
    type: float
    min: 0.0
    max: 4.0
    default: 0.45
    group: "Motion/Readback"

  - name: stagger_span
    display: "Stagger Span"
    type: float
    min: 0.1
    max: 3.0
    default: 1.2
    group: "Motion/Wavefront"

  - name: base_radius
    display: "Base Radius"
    type: float
    min: 0.015
    max: 0.14
    default: 0.055
    group: "Motion/Wavefront"

  - name: anticipation_bias
    display: "Anticipation Bias"
    type: float
    min: 0.2
    max: 3.5
    default: 1.70158
    group: "Motion/Anticipation"

  - name: anticipation_duration
    display: "Anticipation Duration"
    type: float
    min: 0.2
    max: 4.0
    default: 1.4
    group: "Motion/Anticipation"

  - name: travel
    display: "Travel"
    type: float
    min: 0.1
    max: 1.4
    default: 0.9
    group: "Motion/Anticipation"

  - name: loop_period
    display: "Loop Period"
    type: float
    min: 0.25
    max: 8.0
    default: 2.0
    group: "Motion/Loop"

buffers:
  - name: stats_buf
    structured: true
    element_size: 32
    element_count: 1

passes:
  - name: stats
    shader: stats.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:stats_buf"

  - name: render
    shader: render.hlsl
    target: cs_5_0

outputs:
  - render

control_outputs:
  - name: spring_sample
    buffer: stats_buf
    element: 0
    field_offset: 0
    description: "an_spring sample for HLSL and ExprTk parity checks"
  - name: max_scale
    buffer: stats_buf
    element: 0
    field_offset: 4
    description: "Maximum instance scale in the wavefront"
  - name: min_scale
    buffer: stats_buf
    element: 0
    field_offset: 8
    description: "Minimum instance scale in the wavefront"
  - name: inner_scale
    buffer: stats_buf
    element: 0
    field_offset: 12
    description: "Largest inner-ring wavefront scale"
  - name: outer_scale
    buffer: stats_buf
    element: 0
    field_offset: 16
    description: "Largest outer-ring wavefront scale"
  - name: scale_variance
    buffer: stats_buf
    element: 0
    field_offset: 20
    description: "Wavefront scale variance"
  - name: anticipation_x
    buffer: stats_buf
    element: 0
    field_offset: 24
    description: "Anticipation demo x position"
  - name: loop_noise_sample
    buffer: stats_buf
    element: 0
    field_offset: 28
    description: "Seamless loop noise sample"
