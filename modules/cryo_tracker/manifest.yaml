name: "CRYO / Grain Tracker"
version: "1.0"
mode: generator
resolution: [960, 540]

viewport:
  hint: "Persistent identity over Features corners. Amber = confirmed, gray = provisional."

data_inputs:
  - name: "Corners"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }
  - name: "Blobs"
    slot: 1
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

buffers:
  - { name: tracks,      structured: true, element_size: 32, element_count: 97 }
  - { name: tracks_prev, structured: true, element_size: 32, element_count: 97, persistent: true }

parameters:
  - { name: analysis_width,   display: "Analysis Width",   group: "Contract",      type: int,   min: 64,  max: 4096, default: 480 }
  - { name: analysis_height,  display: "Analysis Height",  group: "Contract",      type: int,   min: 64,  max: 4096, default: 270 }

  - { name: match_radius,     display: "Match Radius",     group: "Association",   type: float, min: 0.005, max: 0.30, default: 0.055 }
  - { name: track_response,   display: "Track Response",   group: "Association",   type: float, min: 0.5,  max: 40.0, default: 12.0 }
  - { name: velocity_smoothing, display: "Velocity Smoothing", group: "Association", type: float, min: 0.5, max: 30.0, default: 6.0 }
  - { name: coast_gain,       display: "Coast On Dropout", group: "Association",   type: float, min: 0.0,  max: 1.5,  default: 0.85 }

  - { name: attack_rate,      display: "Confidence Attack", group: "Hysteresis",   type: float, min: 0.1,  max: 12.0, default: 1.9 }
  - { name: release_rate,     display: "Confidence Release", group: "Hysteresis",  type: float, min: 0.05, max: 8.0,  default: 0.85 }
  - { name: spawn_confidence, display: "Spawn Confidence", group: "Hysteresis",    type: float, min: 0.01, max: 0.9,  default: 0.16 }
  - { name: confirm_threshold, display: "Confirm Threshold", group: "Hysteresis",  type: float, min: 0.1,  max: 1.0,  default: 0.62 }

  - { name: marker_scale,     display: "Marker Scale",     group: "Readout",       type: float, min: 0.4,  max: 3.0,  default: 1.0 }
  - { name: vector_gain,      display: "Vector Gain",      group: "Readout",       type: float, min: 0.0,  max: 6.0,  default: 1.4 }
  - { name: age_wrap,         display: "Age Arc Wrap (s)", group: "Readout",       type: float, min: 1.0,  max: 90.0, default: 20.0 }
  - { name: show_ids,         display: "Show Track IDs",   group: "Readout",       type: bool,  default: true, flags: button }

passes:
  - name: update
    shader: update.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    time_dependent: false
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "buffer:tracks_prev" }
    output: "buffer:tracks"

  - name: commit
    shader: commit.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 97
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:tracks" }
    output: "buffer:tracks_prev"

  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:tracks" }
    output: output

data_outputs:
  - name: "Tracks"
    buffer: "tracks"
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: age, type: float }
      - { name: confidence, type: float }
      - { name: id, type: float }
      - { name: active, type: float }

control_outputs:
  - { name: track_count,     buffer: tracks, element: 96, field_offset: 8,  description: "Live tracks" }
  - { name: mean_confidence, buffer: tracks, element: 96, field_offset: 12, description: "Mean track confidence, 0..1" }
  - { name: mean_speed,      buffer: tracks, element: 96, field_offset: 16, description: "Mean track speed, normalized units/s" }
  - { name: confirmed_count, buffer: tracks, element: 96, field_offset: 20, description: "Tracks above confirm threshold" }
  - { name: drift_angle,     buffer: tracks, element: 96, field_offset: 24, description: "Dominant confirmed drift direction, 0..1" }

outputs:
  - { name: "Track Map", pass: preview }
