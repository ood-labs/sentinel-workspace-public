name: "Axiom Organic Membrane"
version: "1.0"
mode: filter
resolution_source: "match:input"
features: [noise]

inputs:
  - { name: "Plate", slot: 0, required: true }
  - { name: "Interference Mask", slot: 1, required: true }

parameters:
  - { name: displacement, display: "Displacement", type: float, min: 0.0, max: 0.45, default: 0.16, group: "Membrane" }
  - { name: warp_scale, display: "Tissue Scale", type: float, min: 0.4, max: 7.0, default: 2.15, group: "Membrane" }
  - { name: vortex_amount, display: "Vortex Pressure", type: float, min: 0.0, max: 4.0, default: 1.55, group: "Membrane" }
  - { name: fold_character, display: "Fold Character", type: float, min: 0.0, max: 1.0, default: 0.48, group: "Membrane" }
  - { name: ink_drag, display: "Ink Drag", type: float, min: 0.0, max: 1.0, default: 0.78, group: "Print" }
  - { name: tear_amount, display: "Organic Breakup", type: float, min: 0.0, max: 1.0, default: 0.86, group: "Print" }
  - { name: tear_threshold, display: "Breakup Threshold", type: float, min: 0.05, max: 0.95, default: 0.48, group: "Print" }
  - { name: tear_softness, display: "Breakup Softness", type: float, min: 0.01, max: 0.3, default: 0.075, group: "Print" }
  - { name: filament_amount, display: "Vermilion Filaments", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Print" }
  - { name: pressure_ridge, display: "Pressure Ridge", type: float, min: 0.0, max: 1.0, default: 0.36, group: "Print" }
  - { name: mask_influence, display: "Localized Processing", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Interference Mask" }
  - { name: mask_threshold, display: "Mask Threshold", type: float, min: 0.0, max: 1.0, default: 0.46, group: "Interference Mask" }
  - { name: mask_softness, display: "Mask Softness", type: float, min: 0.005, max: 0.35, default: 0.095, group: "Interference Mask" }
  - { name: mask_floor, display: "Protected Distortion", type: float, min: 0.0, max: 0.4, default: 0.015, group: "Interference Mask" }
  - { name: mask_gain, display: "Active Zone Gain", type: float, min: 0.0, max: 3.0, default: 1.35, group: "Interference Mask" }
  - { name: accent_color, display: "Vermilion", type: color, default: [0.894, 0.290, 0.176], group: "Palette" }
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: animation_speed, display: "Animation Speed", type: float, min: 0.0, max: 0.5, default: 0.073, group: "Motion" }

buffers:
  - { name: phase_state, structured: true, element_size: 16, element_count: 1, persistent: true }

passes:
  - name: clock
    shader: clock.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:phase_state" }
    output: "buffer:phase_state"

  - name: membrane
    shader: membrane.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "buffer:phase_state" }
    output: output

outputs:
  - { name: "Organic Plate", pass: membrane }
