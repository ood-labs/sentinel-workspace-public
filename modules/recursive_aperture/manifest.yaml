name: "Recursive Aperture"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Shard Scene", slot: 0, required: true }

parameters:
  - { name: recursion, display: "Recursion Depth", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Chamber" }
  - { name: scale_step, display: "Scale Step", type: float, min: 0.45, max: 0.95, default: 0.72, group: "Chamber" }
  - { name: offset, display: "Radial Offset", type: float, min: 0.0, max: 0.5, default: 0.11, group: "Chamber" }
  - { name: rotation, display: "Nested Rotation", type: float, min: -3.14, max: 3.14, default: 0.24, group: "Motion" }
  - { name: drift, display: "Chamber Drift", type: float, min: 0.0, max: 1.0, default: 0.06, group: "Motion" }
  - { name: echo_gain, display: "Echo Gain", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Output" }

passes:
  - name: chamber
    shader: chamber.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Chamber Scene", pass: chamber }
