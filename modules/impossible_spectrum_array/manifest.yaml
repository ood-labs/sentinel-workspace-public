name: "Impossible Spectrum Array"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Atlas Program", slot: 0, required: true }
parameters:
  - { name: spectrum_mix, display: "Spectrum Mix", type: float, min: 0, max: 1, default: 0.86, group: "Spectrum" }
  - { name: spectrum_phase, display: "Spectrum Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: sweep_speed, display: "Sweep Speed", type: float, min: -2, max: 2, default: 0.36, group: "Motion" }
  - { name: bar_count, display: "Bar Count", type: float, min: 8, max: 64, default: 24, group: "Spectrum" }
  - { name: bar_gain, display: "Bar Gain", type: float, min: 0.2, max: 2, default: 1.1, group: "Spectrum" }
  - { name: bar_width, display: "Bar Width", type: float, min: 0.1, max: 0.95, default: 0.62, group: "Spectrum" }
  - { name: threshold_gain, display: "Threshold Gain", type: float, min: 0, max: 1.5, default: 0.72, group: "Structure" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.002, 0.002, 0.004], group: "Ink" }
  - { name: bar_color, display: "Bar Color", type: color, default: [0.70, 0.62, 0.48], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.12, 0.018], group: "Ink" }
passes:
  - name: spectrum
    shader: spectrum.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Spectrum Program", pass: spectrum }
