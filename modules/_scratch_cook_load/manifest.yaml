name: "Scratch / Cook Load"
version: "1.0"
mode: generator
resolution: [3840, 2160]

# TEMPORARY TEST FIXTURE for phase 2 sub-phase 2B criterion 4 (cook-rate
# independence). Sentinel exposes no frame-rate cap in StateTree, so the only
# way to force a slower graph cook rate is to make the graph genuinely
# expensive. `iterations` dials the cost until the graph settles near the
# target rate.
#
# This node is NEVER wired to the analyzer or to any creative chain; it exists
# only to slow the clock while onset counts are compared. Delete after 2B.

parameters:
  - { name: iterations, display: "Iterations", type: float, min: 1.0, max: 60000.0, default: 4000.0 }

passes:
  - name: burn
    shader: burn.hlsl
    target: cs_5_0
    output: output
