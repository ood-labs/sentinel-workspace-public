name: "Impossible Luma Avalanche"
version: "1.0"
mode: generator
resolution: [1280, 720]

inputs:
  - { name: "Hinged Program", slot: 0, required: true }

parameters:
  - { name: avalanche_mix, display: "Avalanche Mix", type: float, min: 0.0, max: 1.0, default: 0.86, group: "Avalanche" }
  - { name: avalanche_phase, display: "Avalanche Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: avalanche_rate, display: "Avalanche Rate", type: float, min: -2.0, max: 2.0, default: 0.48, group: "Motion" }
  - { name: avalanche_amount, display: "Avalanche Amount", type: float, min: 0.0, max: 0.48, default: 0.24, group: "Avalanche" }
  - { name: band_count, display: "Band Count", type: float, min: 4.0, max: 36.0, default: 17.0, group: "Avalanche" }
  - { name: tear_amount, display: "Tear Amount", type: float, min: 0.0, max: 0.22, default: 0.07, group: "Avalanche" }
  - { name: grain_gain, display: "Grain Gain", type: float, min: 0.0, max: 1.2, default: 0.42, group: "Ink" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.008,0.010,0.014], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.90,0.16,0.03], group: "Ink" }

passes:
  - name: avalanche
    shader: avalanche.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Avalanche Program", pass: avalanche }
