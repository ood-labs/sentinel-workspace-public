name: "Impossible Oscilloscope Field"
version: "1.0"
mode: generator
resolution: [1280, 720]
inputs:
  - { name: "Halftone Program", slot: 0, required: true }
parameters:
  - { name: scope_mix, display: "Scope Mix", type: float, min: 0, max: 1, default: 0.86, group: "Scope" }
  - { name: scope_phase, display: "Scope Phase", type: float, min: 0, max: 1, default: 0, group: "Motion" }
  - { name: sweep_speed, display: "Sweep Speed", type: float, min: -2, max: 2, default: 0.52, group: "Motion" }
  - { name: trace_count, display: "Trace Count", type: float, min: 2, max: 8, default: 4, group: "Scope" }
  - { name: trace_gain, display: "Trace Gain", type: float, min: 0.2, max: 2.0, default: 1.0, group: "Scope" }
  - { name: trace_width, display: "Trace Width", type: float, min: 0.002, max: 0.06, default: 0.018, group: "Scope" }
  - { name: grid_gain, display: "Grid Gain", type: float, min: 0, max: 1.2, default: 0.48, group: "Instrument" }
  - { name: dark_color, display: "Dark Color", type: color, default: [0.003, 0.004, 0.007], group: "Ink" }
  - { name: line_color, display: "Line Color", type: color, default: [0.72, 0.66, 0.54], group: "Ink" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.98, 0.18, 0.025], group: "Ink" }
passes:
  - name: scope
    shader: scope.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output
outputs:
  - { name: "Scope Program", pass: scope }
