name: "CRYO / Lattice"
version: "1.0"
mode: generator
resolution: [960, 540]

viewport:
  hint: "Bonded structure over CONFIRMED identities only. Heavy stroke = compressed bond, fine = stretched."

data_inputs:
  - name: "Tracks"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: age, type: float }
      - { name: confidence, type: float }
      - { name: id, type: float }
      - { name: active, type: float }

buffers:
  - { name: filaments, structured: true, element_size: 48, element_count: 161 }

parameters:
  - { name: eligible_confidence, display: "Eligibility",     group: "Bonding", type: float, min: 0.1,  max: 1.0,  default: 0.90 }
  - { name: link_radius,         display: "Bond Radius",     group: "Bonding", type: float, min: 0.02, max: 0.60, default: 0.20 }
  - { name: max_degree,          display: "Max Degree",      group: "Bonding", type: int,   min: 1,    max: 6,    default: 3 }

  - { name: bond_gain,           display: "Bond Visibility", group: "Readout", type: float, min: 0.0,  max: 2.0,  default: 1.0 }
  - { name: bond_weight_min,     display: "Stretched Weight", group: "Readout", type: float, min: 0.2, max: 3.0,  default: 0.6 }
  - { name: bond_weight_max,     display: "Compressed Weight", group: "Readout", type: float, min: 0.5, max: 6.0, default: 2.4 }
  - { name: node_scale,          display: "Node Scale",      group: "Readout", type: float, min: 0.3,  max: 3.0,  default: 1.0 }

passes:
  - name: build
    shader: build.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    # NOT dirty-flagged: the upstream Tracks port reports generation 0, so a
    # time_dependent:false pass would never run. Verified cost below.
    inputs:
      - { slot: 0, source: "data:0" }
    output: "buffer:filaments"

  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:filaments" }
    output: output

data_outputs:
  - name: "Filaments"
    buffer: "filaments"
    schema:
      - { name: a, type: float2 }
      - { name: b, type: float2 }
      - { name: idA, type: float }
      - { name: idB, type: float }
      - { name: len, type: float }
      - { name: strain, type: float }
      - { name: weight, type: float }
      - { name: age, type: float }
      - { name: pad, type: float2 }

control_outputs:
  - { name: bond_count,   buffer: filaments, element: 160, field_offset: 0,  description: "Live bonds" }
  - { name: lattice_nodes, buffer: filaments, element: 160, field_offset: 4, description: "Eligible confirmed nodes" }
  - { name: spacing,      buffer: filaments, element: 160, field_offset: 8,  description: "Mean nearest-neighbour spacing" }

outputs:
  - { name: "Lattice", pass: preview }
