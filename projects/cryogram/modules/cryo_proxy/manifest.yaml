name: "CRYO / Analysis Proxy"
version: "1.0"
mode: generator
resolution: [480, 270]

inputs:
  - { name: "Specimen", slot: 0, required: true }

viewport:
  hint: "480x270 measurement branch. The full-resolution specimen bypasses this node into the renderers."

parameters:
  - { name: hatch_reject,  display: "Footprint Blur",   group: "Conditioning", type: float, min: 0.5, max: 4.0,  default: 1.20 }
  - { name: erode_px,      display: "Island Separation", group: "Conditioning", type: float, min: 0.0, max: 6.0,  default: 2.5 }
  - { name: local_radius,  display: "Contrast Radius",  group: "Conditioning", type: float, min: 0.5, max: 12.0, default: 3.4 }
  - { name: edge_focus,    display: "Boundary Focus",   group: "Conditioning", type: float, min: 0.0, max: 4.0,  default: 1.05 }
  - { name: luma_gain,     display: "Luma Gain",        group: "Conditioning", type: float, min: 0.2, max: 3.0,  default: 1.30 }
  - { name: luma_gamma,    display: "Luma Gamma",       group: "Conditioning", type: float, min: 0.3, max: 2.5,  default: 0.85 }

passes:
  - name: analysis
    shader: analysis.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

  - name: inspect
    shader: inspect.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:analysis" }
      - { slot: 1, source: "input:0" }
    output: "output:1"

outputs:
  - { name: "Analysis", pass: analysis }
  - { name: "Inspect", pass: inspect }
