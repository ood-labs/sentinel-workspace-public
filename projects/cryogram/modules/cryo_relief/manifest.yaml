name: "CRYO / Relief"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [camera, noise]

viewport:
  hint: "Fly camera: RMB look, WASD move, wheel adjusts speed"
  interactions: [camera]

inputs:
  - { name: "Field", slot: 0, required: true }
  - { name: "Specimen", slot: 1, required: false }

data_inputs:
  - name: "Filaments"
    slot: 0
    schema:
      - { name: a, type: float2 }
      - { name: b, type: float2 }
      - { name: idA, type: float }
      - { name: idB, type: float }
      - { name: len, type: float }
      - { name: strain, type: float }
      - { name: weight, type: float }
      - { name: age, type: float }
      - { name: pad, type: float2 }
  - name: "Tracks"
    slot: 1
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: age, type: float }
      - { name: confidence, type: float }
      - { name: id, type: float }
      - { name: active, type: float }
  - name: "Shocks"
    slot: 2
    schema:
      - { name: center, type: float2 }
      - { name: birth, type: float }
      - { name: strength, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: pad, type: float2 }

buffers:
  - { name: gbuf, format: RGBA32F }
  - { name: hfield, format: RGBA16F }
  - { name: pulses,      structured: true, element_size: 32, element_count: 17 }
  - { name: pulses_prev, structured: true, element_size: 32, element_count: 17, persistent: true }

parameters:
  - { name: height_scale,    display: "Relief Height",     group: "Terrain", type: float, min: 0.02, max: 1.60, default: 0.42 }

  # Kick-triggered ground swells. kick_level is driven by expression from the
  # detector; each rising edge spawns one pulse at a single point.
  # kick_count_in is the trigger: one swell per accepted onset, exactly.
  # kick_level only modulates height above a guaranteed floor.
  - { name: kick_count_in,   display: "Kick Count (driven)", group: "Kick Swell", type: float, min: 0.0, max: 10000000.0, default: 0.0 }
  - { name: kick_level,      display: "Kick Level (driven)", group: "Kick Swell", type: float, min: 0.0, max: 1.0,  default: 0.0 }
  - { name: pulse_min_strength, display: "Minimum Swell",   group: "Kick Swell", type: float, min: 0.05, max: 1.0, default: 0.55 }
  - { name: pulse_amp,       display: "Swell Height",       group: "Kick Swell", type: float, min: 0.0, max: 1.20, default: 0.38 }
  - { name: pulse_radius,    display: "Swell Radius",       group: "Kick Swell", type: float, min: 0.05, max: 2.0, default: 0.42 }
  - { name: pulse_speed,     display: "Swell Spread (u/s)", group: "Kick Swell", type: float, min: 0.0, max: 4.0,  default: 0.85 }
  - { name: pulse_decay,     display: "Swell Decay (s)",    group: "Kick Swell", type: float, min: 0.05, max: 3.0, default: 0.46 }
  - { name: pulse_life,      display: "Swell Life (s)",     group: "Kick Swell", type: float, min: 0.1, max: 6.0,  default: 1.8 }
  - { name: pulse_core,      display: "Swell Core",         group: "Kick Swell", type: float, min: 0.0, max: 0.95, default: 0.25 }
  - { name: pulse_ring,      display: "Dome / Ridge",       group: "Kick Swell", type: float, min: 0.0, max: 1.0,  default: 0.25 }
  - { name: pulse_strength_gain, display: "Swell Strength Gain", group: "Kick Swell", type: float, min: 0.2, max: 6.0, default: 2.4 }
  - { name: pulse_on_tracks, display: "Erupt On Tracked Points", group: "Kick Swell", type: bool, default: true, flags: button }
  - { name: pulse_track_confidence, display: "Track Confidence", group: "Kick Swell", type: float, min: 0.1, max: 1.0, default: 0.90 }
  - { name: march_steps,     display: "March Steps",       group: "Terrain", type: int,   min: 24,   max: 320,  default: 130 }
  - { name: march_distance,  display: "March Distance",    group: "Terrain", type: float, min: 4.0,  max: 60.0, default: 26.0 }
  - { name: normal_eps,      display: "Normal Epsilon",    group: "Terrain", type: float, min: 0.5,  max: 8.0,  default: 1.8 }

  - { name: key_gain,        display: "Key Light",         group: "Shading", type: float, min: 0.0,  max: 2.5,  default: 0.92 }
  - { name: rim_gain,        display: "Grazing Rim",       group: "Shading", type: float, min: 0.0,  max: 2.0,  default: 0.34 }
  - { name: hatch_gain,      display: "Hatch Gain",        group: "Shading", type: float, min: 0.0,  max: 1.2,  default: 0.20 }
  - { name: hatch_pitch,     display: "Hatch Pitch",       group: "Shading", type: float, min: 2.0,  max: 48.0, default: 11.0 }
  - { name: scarp_gain,      display: "Boundary Scarps",   group: "Shading", type: float, min: 0.0,  max: 1.0,  default: 0.85 }
  - { name: fog_density,     display: "Distance Fade",     group: "Shading", type: float, min: 0.0,  max: 0.45, default: 0.055 }
  - { name: exposure,        display: "Exposure",          group: "Shading", type: float, min: 0.2,  max: 3.0,  default: 1.15 }
  - { name: vignette,        display: "Vignette",          group: "Shading", type: float, min: 0.0,  max: 1.0,  default: 0.30 }

  - { name: contour_step,    display: "Strata Interval",   group: "Strata",  type: float, min: 0.004, max: 0.20, default: 0.030 }
  - { name: contour_width,   display: "Strata Width",      group: "Strata",  type: float, min: 0.2,  max: 4.0,  default: 0.9 }
  - { name: contour_gain,    display: "Strata Gain",       group: "Strata",  type: float, min: 0.0,  max: 1.0,  default: 0.62 }

  - { name: stage_grid,      display: "Stage Grid",        group: "Stage",   type: float, min: 0.04, max: 1.20, default: 0.25 }
  - { name: stage_gain,      display: "Stage Gain",        group: "Stage",   type: float, min: 0.0,  max: 1.0,  default: 0.20 }
  - { name: fwidth_approx_scale, display: "Grid Softness", group: "Stage",   type: float, min: 0.2,  max: 6.0,  default: 1.6 }

  - { name: wire_gain,       display: "Bond Visibility",   group: "Measured Overlay", type: float, min: 0.0, max: 1.5, default: 0.90 }
  - { name: wire_lift,       display: "Bond Lift",         group: "Measured Overlay", type: float, min: 0.0, max: 0.50, default: 0.075 }
  - { name: wire_weight_min, display: "Stretched Weight",  group: "Measured Overlay", type: float, min: 0.2, max: 3.0, default: 0.65 }
  - { name: wire_weight_max, display: "Compressed Weight", group: "Measured Overlay", type: float, min: 0.4, max: 6.0, default: 1.9 }
  - { name: xray_gain,       display: "Occluded X-Ray",    group: "Measured Overlay", type: float, min: 0.0, max: 1.0, default: 0.16 }
  - { name: marker_gain,     display: "Identity Markers",  group: "Measured Overlay", type: float, min: 0.0, max: 1.5, default: 0.95 }
  - { name: marker_height,   display: "Marker Height",     group: "Measured Overlay", type: float, min: 0.01, max: 0.60, default: 0.11 }
  - { name: marker_scale,    display: "Marker Scale",      group: "Measured Overlay", type: float, min: 0.3, max: 3.0, default: 1.0 }
  - { name: marker_confidence, display: "Marker Threshold", group: "Measured Overlay", type: float, min: 0.1, max: 1.0, default: 0.90 }

  # Burst thrown up from each snare impact point, driven by the specimen's own
  # shock records so it lands exactly where the plate was struck.
  - { name: strike_gain,     display: "Strike Visibility",  group: "Snare Strike", type: float, min: 0.0, max: 2.0,  default: 1.0 }
  - { name: strike_rays,     display: "Strike Rays",        group: "Snare Strike", type: int,   min: 1,   max: 12,   default: 6 }
  - { name: strike_height,   display: "Strike Height",      group: "Snare Strike", type: float, min: 0.02, max: 1.20, default: 0.34 }
  - { name: strike_spread,   display: "Strike Spread",      group: "Snare Strike", type: float, min: 0.0, max: 0.30, default: 0.055 }
  - { name: strike_rise,     display: "Strike Rise (s)",    group: "Snare Strike", type: float, min: 0.01, max: 1.0, default: 0.10 }
  - { name: strike_decay,    display: "Strike Decay (s)",   group: "Snare Strike", type: float, min: 0.03, max: 2.0, default: 0.26 }
  - { name: strike_life,     display: "Strike Life (s)",    group: "Snare Strike", type: float, min: 0.05, max: 3.0, default: 0.85 }
  - { name: strike_weight,   display: "Strike Weight",      group: "Snare Strike", type: float, min: 0.3, max: 5.0,  default: 1.5 }
  - { name: strike_tint,     display: "Strike Tip Warmth",  group: "Snare Strike", type: float, min: 0.0, max: 1.0,  default: 0.65 }

  # Volumetric noise burst: a 3D cell near the impact, tested against the real
  # world hit position. Replaces the radial ripple entirely.
  - { name: burst_amount,    display: "Burst Amount",       group: "Snare Burst", type: float, min: 0.0,  max: 1.0,  default: 0.85 }
  - { name: burst_radius,    display: "Burst Radius",       group: "Snare Burst", type: float, min: 0.05, max: 2.5,  default: 0.52 }
  - { name: burst_cell,      display: "Noise Cell Size",    group: "Snare Burst", type: float, min: 0.004, max: 0.30, default: 0.038 }
  - { name: burst_rate,      display: "Noise Rate (Hz)",    group: "Snare Burst", type: float, min: 0.0,  max: 90.0, default: 26.0 }
  - { name: burst_hard,      display: "Blockiness",         group: "Snare Burst", type: float, min: 0.0,  max: 1.0,  default: 0.55 }
  - { name: burst_level,     display: "Burst Brightness",   group: "Snare Burst", type: float, min: 0.0,  max: 2.0,  default: 1.0 }
  - { name: burst_attack,    display: "Burst Attack (s)",   group: "Snare Burst", type: float, min: 0.002, max: 0.30, default: 0.015 }
  - { name: burst_decay,     display: "Burst Decay (s)",    group: "Snare Burst", type: float, min: 0.02, max: 2.0,  default: 0.17 }
  - { name: burst_life,      display: "Burst Life (s)",     group: "Snare Burst", type: float, min: 0.05, max: 3.0,  default: 0.65 }
  - { name: burst_grow,      display: "Burst Growth",       group: "Snare Burst", type: float, min: 0.0,  max: 4.0,  default: 0.35 }
  - { name: burst_soft,      display: "Burst Edge Softness", group: "Snare Burst", type: float, min: 0.0, max: 1.0,  default: 0.55 }
  # Lift raises the sphere centre ABOVE the surface, which shrinks the ground
  # intersection. Default 0 = full authored radius meets the terrain.
  - { name: burst_lift,      display: "Burst Lift",         group: "Snare Burst", type: float, min: -0.5, max: 1.0,  default: 0.0 }
  - { name: burst_drift,     display: "Burst Drift (u/s)",  group: "Snare Burst", type: float, min: 0.0,  max: 3.0,  default: 0.45 }

passes:
  - name: pulse
    shader: pulse.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:pulses_prev" }
      - { slot: 1, source: "data:1" }
    output: "buffer:pulses"

  # Composite swells into the height field ONCE per texel, so the marcher below
  # stays a single texture read per step.
  - name: heightfield
    shader: heightfield.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:pulses" }
    output: "buffer:hfield"

  - name: march
    shader: march.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:hfield" }
    output: "buffer:gbuf"

  - name: shade
    shader: shade.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:gbuf" }
      - { slot: 1, source: "buffer:hfield" }
      - { slot: 2, source: "input:1" }
      - { slot: 3, source: "data:0" }
      - { slot: 4, source: "data:1" }
      - { slot: 5, source: "data:2" }
    output: output

  - name: pulsecommit
    shader: pulsecommit.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 17
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:pulses" }
    output: "buffer:pulses_prev"

outputs:
  - { name: "Relief", pass: shade }
