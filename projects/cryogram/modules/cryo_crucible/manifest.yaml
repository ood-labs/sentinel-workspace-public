name: "CRYO / Crucible"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [noise]

parameters:
  # Master clock: scales growth, ageing, resorption and nucleation together.
  # This is the control that actually changes how fast the specimen lives.
  - { name: sim_speed,        display: "Sim Speed",         group: "Solidification", type: float, min: 0.05, max: 12.0, default: 1.0 }
  - { name: growth_rate,      display: "Front Speed (px/s)", group: "Solidification", type: float, min: 0.5, max: 300.0, default: 42.0 }
  - { name: symmetry,         display: "Symmetry",          group: "Solidification", type: enum,  default: 2, options: [3-fold, 4-fold, 6-fold, 8-fold], flags: button_grid }
  - { name: facet_bias,       display: "Facet Bias",        group: "Solidification", type: float, min: 0.0,  max: 1.0,   default: 0.88 }
  - { name: facet_sharpness,  display: "Facet Sharpness",   group: "Solidification", type: float, min: 1.0,  max: 24.0,  default: 7.0 }
  - { name: facet_wobble,     display: "Facet Wobble",      group: "Solidification", type: float, min: 0.0, max: 2.5,  default: 0.70 }

  - { name: nucleation_rate,  display: "Nucleation Rate",   group: "Seeding",  type: float, min: 0.0, max: 30.0, default: 4.0 }
  - { name: bias_center,      display: "Seed Bias Center",  group: "Seeding",  type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.5, 0.5] }
  - { name: bias_gain,        display: "Seed Bias Gain",    group: "Seeding",  type: float, min: 0.0, max: 60.0, default: 0.0 }

  - { name: anneal_life,      display: "Anneal Life (s)",   group: "Anneal",   type: float, min: 1.0,  max: 180.0, default: 20.0 }
  - { name: anneal_rate,      display: "Anneal Rate",       group: "Anneal",   type: float, min: 0.0,  max: 3.0,   default: 0.45 }

  - { name: twin_fraction,    display: "Twinned Grains",    group: "Read",     type: float, min: 0.0,  max: 1.0,   default: 0.45 }
  - { name: twin_pitch,       display: "Twin Band Pitch",   group: "Read",     type: float, min: 6.0,  max: 160.0, default: 46.0 }
  - { name: twin_angle,       display: "Twin Angle",        group: "Read",     type: float, min: 0.0,  max: 1.57,  default: 1.05 }
  - { name: hatch_pitch,      display: "Hatch Pitch",       group: "Read",     type: float, min: 2.0,  max: 48.0, default: 9.0 }
  - { name: hatch_width,      display: "Hatch Width",       group: "Read",     type: float, min: 0.2,  max: 6.0,  default: 0.95 }
  - { name: boundary_width,   display: "Boundary Width",    group: "Read",     type: float, min: 0.5,  max: 4.0,  default: 1.2 }
  - { name: interior_level,   display: "Interior Level",    group: "Read",     type: float, min: 0.0,  max: 1.0,  default: 0.16 }
  - { name: liquid_level,     display: "Liquid Level",      group: "Read",     type: float, min: 0.0,  max: 0.25, default: 0.030 }
  - { name: front_gain,       display: "Front Gain",        group: "Read",     type: float, min: 0.0,  max: 2.0,  default: 1.0 }
  - { name: exposure,         display: "Exposure",          group: "Read",     type: float, min: 0.2,  max: 3.0,  default: 1.0 }
  - { name: structure_gap,    display: "Structure Gap (px)", group: "Measurement Tap", type: float, min: 1.0, max: 8.0, default: 3.0 }

  - { name: probe_seed_gain,   display: "Seed Probe Gain",    group: "Probes", type: float, min: 0.0, max: 400.0, default: 120.0 }
  - { name: probe_attract,     display: "Seed Attraction",    group: "Probes", type: float, min: 0.0, max: 6.0,   default: 2.2 }
  - { name: probe_anneal_rate, display: "Anneal Probe Rate",  group: "Probes", type: float, min: 0.0, max: 6.0,   default: 1.4 }
  - { name: probe_lifetime,    display: "Probe Lifetime (s, 0=hold)", group: "Probes", type: float, min: 0.0, max: 240.0, default: 0.0 }
  - { name: probe_overlay,     display: "Show Probes",        group: "Probes", type: bool,  default: true, flags: button }

  # Snare shocks. One per accepted onset, triggered on the counter.
  - { name: snare_count_in,    display: "Snare Count (driven)", group: "Snare Shock", type: float, min: 0.0, max: 10000000.0, default: 0.0 }
  - { name: snare_level_in,    display: "Snare Level (driven)", group: "Snare Shock", type: float, min: 0.0, max: 1.0,  default: 0.0 }
  - { name: shock_life,        display: "Shock Life (s)",     group: "Snare Shock", type: float, min: 0.05, max: 3.0,  default: 0.60 }
  - { name: shock_min_strength, display: "Minimum Shock",     group: "Snare Shock", type: float, min: 0.05, max: 1.0,  default: 0.70 }
  - { name: shock_strength_gain, display: "Shock Strength Gain", group: "Snare Shock", type: float, min: 0.2, max: 6.0, default: 2.4 }

  - { name: shock_melt_radius, display: "Strike Melt Radius", group: "Snare Shock", type: float, min: 0.0,  max: 0.40, default: 0.075 }
  - { name: shock_melt_time,   display: "Strike Melt Time (s)", group: "Snare Shock", type: float, min: 0.0, max: 0.50, default: 0.05 }

  - { name: reset,            display: "Reset Field",       group: "Anneal",   type: bool,  default: false, flags: button }

viewport:
  hint: "Paint the specimen: click/drag = probe, RMB = anneal, wheel = radius, C = kind, X = clear"
  interactions: [events]
  input:
    pointer: [left, right, wheel]
    keyboard: [c, x]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: place_probe,  label: "Place Probe" }
    - { gesture: left_drag,  action: paint_probes, label: "Paint Probes" }
    - { gesture: right_drag, action: anneal_brush, label: "Anneal Brush" }
    - { gesture: wheel,      action: probe_radius, label: "Probe Radius" }
    - { key: c,              action: next_kind,    label: "Next Probe Kind" }
    - { key: x,              action: clear_probes, label: "Clear Probes" }

buffers:
  - { name: state, format: RGBA32F, persistent: true }
  - { name: probes,      structured: true, element_size: 32, element_count: 33 }
  - { name: probes_prev, structured: true, element_size: 32, element_count: 33, persistent: true }
  - { name: shocks,      structured: true, element_size: 32, element_count: 9 }
  - { name: shocks_prev, structured: true, element_size: 32, element_count: 9, persistent: true }

state_buffers:
  - name: probes_prev
    max_elements: 33
    schema:
      - { name: pos, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: kind, type: float }
      - { name: age, type: float }
      - { name: id, type: float }
      - { name: active, type: float }

passes:
  - name: events
    shader: events.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:probes_prev" }
    output: "buffer:probes"

  - name: shockspawn
    shader: shockspawn.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:shocks_prev" }
    output: "buffer:shocks"

  - name: grow
    shader: grow.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:state" }
      - { slot: 1, source: "buffer:probes" }
      - { slot: 2, source: "buffer:shocks" }
    output: "buffer:state"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:state" }
      - { slot: 1, source: "buffer:probes" }
      - { slot: 2, source: "buffer:shocks" }
    output: output

  - name: structure
    shader: structure.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:state" }
      - { slot: 1, source: "buffer:shocks" }
    output: "output:1"

  - name: field
    shader: field.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:state" }
      - { slot: 1, source: "buffer:shocks" }
    output: "output:2"

  - name: shockcommit
    shader: shockcommit.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 9
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:shocks" }
    output: "buffer:shocks_prev"

  - name: probecommit
    shader: probecommit.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 33
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:probes" }
    output: "buffer:probes_prev"

data_outputs:
  # Published so the 3D layer can throw a strike at the point the snare hit.
  - name: "Shocks"
    buffer: "shocks"
    schema:
      - { name: center, type: float2 }
      - { name: birth, type: float }
      - { name: strength, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
      - { name: pad, type: float2 }

  - name: "Probes"
    buffer: "probes"
    schema:
      - { name: pos, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: kind, type: float }
      - { name: age, type: float }
      - { name: id, type: float }
      - { name: active, type: float }

control_outputs:
  - { name: current_kind, buffer: probes, element: 32, field_offset: 4,  description: "0 SEED, 1 ANNEAL, 2 ANCHOR" }
  - { name: brush_radius, buffer: probes, element: 32, field_offset: 8,  description: "Probe radius, normalized" }
  - { name: probe_count,  buffer: probes, element: 32, field_offset: 24, description: "Live probes" }

outputs:
  - { name: "Specimen", pass: render }
  - { name: "Structure", pass: structure }
  - { name: "Field", pass: field }
