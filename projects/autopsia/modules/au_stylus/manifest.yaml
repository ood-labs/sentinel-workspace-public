name: "AU Stylus"
version: "1.0"
mode: generator
resolution: [1280, 720]

viewport:
  hint: "LMB place mass, RMB place incision, drag to paint, wheel radius, M mode, X clear"
  interactions: [events]
  input:
    pointer: [left, right, wheel]
    keyboard: [x, m]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: place_mass, label: "Place Mass" }
    - { gesture: left_drag, action: paint_mass, label: "Paint Stimuli" }
    - { gesture: right_click, action: place_incision, label: "Place Incision" }
    - { gesture: wheel, action: radius, label: "Deposit Radius" }
    - { key: m, action: toggle_mode, label: "Toggle Mass/Incision" }
    - { key: x, action: clear, label: "Clear Stimuli" }

parameters:
  - { name: stim_life, display: "Stimulus Life", type: float, min: 0.2, max: 40.0, default: 9.0, group: "Stylus" }
  - { name: hold_stimuli, display: "Hold Stimuli", type: bool, default: false, group: "Stylus" }
  - { name: accent_color, display: "Accent", type: color, default: [1.0, 0.42, 0.09], group: "Stylus" }

  - { name: probe_enable, display: "Probe", type: bool, default: false, group: "Probe" }
  - { name: probe_x, display: "Probe X", type: float, min: 0.0, max: 1.0, default: 0.5, group: "Probe" }
  - { name: probe_y, display: "Probe Y", type: float, min: 0.0, max: 1.0, default: 0.5, group: "Probe" }
  - { name: probe_radius, display: "Probe Radius", type: float, min: 0.008, max: 0.4, default: 0.14, group: "Probe" }
  - { name: probe_strength, display: "Probe Strength", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Probe" }
  - { name: probe_angle, display: "Probe Angle", type: float, min: -3.15, max: 3.15, default: 1.57, group: "Probe" }
  - { name: probe_mode, display: "Probe Incision", type: bool, default: false, group: "Probe" }

buffers:
  - { name: stim, structured: true, element_size: 48, element_count: 17, persistent: true }

state_buffers:
  - name: stim
    max_elements: 17
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: age, type: float }
      - { name: mode, type: float }
      - { name: id, type: uint }
      - { name: flags, type: uint }
      - { name: pad, type: float2 }

passes:
  - name: events
    shader: events.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:stim"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 1, source: "buffer:stim" }
    output: output

data_outputs:
  - name: "Stimuli"
    buffer: stim
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: age, type: float }
      - { name: mode, type: float }
      - { name: id, type: uint }
      - { name: flags, type: uint }
      - { name: pad, type: float2 }

outputs:
  - { name: "Stylus", pass: render }
