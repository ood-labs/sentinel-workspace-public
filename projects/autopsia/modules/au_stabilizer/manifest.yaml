name: "AU Stabilizer"
version: "1.0"
mode: generator
resolution: [960, 540]

viewport:
  hint: "Persistent agents. Ring=response, brightness=confidence, dashed=coasting, tick=age, amber=significant."

inputs:
  - { name: "Analysis", slot: 0, required: true }

data_inputs:
  - name: "Corners"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }
  - name: "Blobs"
    slot: 1
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

parameters:
  - { name: assoc_radius, display: "Association Gate", type: float, min: 0.005, max: 0.30, default: 0.055, group: "Association" }
  - { name: track_stiffness, display: "Track Stiffness", type: float, min: 0.05, max: 4.0, default: 1.35, group: "Association" }
  - { name: confirm_rate, display: "Confirm Rate", type: float, min: 0.1, max: 8.0, default: 1.90, group: "Association" }
  - { name: decay_rate, display: "Decay Rate", type: float, min: 0.05, max: 6.0, default: 0.95, group: "Association" }
  - { name: coast, display: "Coast", type: float, min: 0.0, max: 1.5, default: 0.55, group: "Association" }
  - { name: spawn_response, display: "Spawn Threshold", type: float, min: 0.0, max: 12.0, default: 1.20, group: "Association" }
  - { name: spawn_confidence, display: "Spawn Confidence", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Association" }
  - { name: response_norm, display: "Response Normalize", type: float, min: 0.5, max: 20.0, default: 6.5, group: "Association" }

  - { name: significance, display: "Significance", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Preview" }
  - { name: establish_time, display: "Establish Time", type: float, min: 0.0, max: 20.0, default: 4.0, group: "Preview" }
  - { name: lead_scale, display: "Velocity Leader", type: float, min: 0.0, max: 2.0, default: 0.30, group: "Preview" }
  - { name: accent_color, display: "Accent", type: color, default: [1.0, 0.42, 0.09], group: "Preview" }

buffers:
  - { name: agents, structured: true, element_size: 64, element_count: 64, persistent: true }

passes:
  - name: track
    shader: track.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
      - { slot: 2, source: "data:1" }
    output: "buffer:agents"

  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:agents" }
      - { slot: 2, source: "data:1" }
    output: output

data_outputs:
  - name: "Agents"
    buffer: agents
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: scale, type: float }
      - { name: confidence, type: float }
      - { name: angle, type: float }
      - { name: age, type: float }
      - { name: stable_id, type: uint }
      - { name: kind, type: uint }
      - { name: source_index, type: uint }
      - { name: flags, type: uint }
      - { name: aux, type: float4 }

outputs:
  - { name: "Agent Map", pass: preview }
