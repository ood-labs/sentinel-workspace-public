name: "AU Relief"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [camera, noise]

viewport:
  hint: "Fly camera: RMB look, WASD move, wheel adjusts speed"
  interactions: [camera]

inputs:
  - { name: "Field", slot: 0, required: true }
  - { name: "Plate", slot: 1, required: true }

data_inputs:
  - name: "Agents"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: scale, type: float }
      - { name: confidence, type: float }
      - { name: angle, type: float }
      - { name: age, type: float }
      - { name: stable_id, type: uint }
      - { name: kind, type: uint }
      - { name: source_index, type: uint }
      - { name: flags, type: uint }
      - { name: aux, type: float4 }
  - name: "Observation Histogram"
    slot: 1
    schema:
      - { name: count, type: uint }
      - { name: r1, type: uint }
      - { name: r2, type: uint }
      - { name: r3, type: uint }

parameters:
  - { name: height_scale, display: "Relief Height", type: float, min: 0.05, max: 1.6, default: 0.52, group: "Relief" }
  - { name: slab_depth, display: "Slab Depth", type: float, min: 0.0, max: 1.2, default: 0.15, group: "Relief" }
  - { name: cage_inset, display: "Cage Thickness", type: float, min: 0.0005, max: 0.03, default: 0.006, group: "Relief" }
  - { name: cage_gain, display: "Cage Ink", type: float, min: 0.0, max: 2.0, default: 0.85, group: "Relief" }
  - { name: march_steps, display: "March Steps", type: float, min: 16.0, max: 256.0, default: 128.0, group: "Relief" }
  - { name: march_far, display: "March Distance", type: float, min: 2.0, max: 40.0, default: 14.0, group: "Relief" }

  - { name: plate_gain, display: "Inscription Wrap", type: float, min: 0.0, max: 3.0, default: 0.80, group: "Surface" }
  - { name: height_bands, display: "Height Contours", type: float, min: 1.0, max: 80.0, default: 26.0, group: "Surface" }
  - { name: height_line_gain, display: "Contour Ink", type: float, min: 0.0, max: 2.0, default: 1.15, group: "Surface" }
  - { name: surface_grid, display: "Surface Grid", type: float, min: 0.5, max: 24.0, default: 6.0, group: "Surface" }
  - { name: grid_gain, display: "Surface Grid Ink", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Surface" }
  - { name: shadow_gain, display: "Shadow Depth", type: float, min: 0.0, max: 1.0, default: 0.88, group: "Surface" }
  - { name: shadow_hardness, display: "Shadow Hardness", type: float, min: 1.0, max: 64.0, default: 14.0, group: "Surface" }
  - { name: strata_bands, display: "Section Strata", type: float, min: 2.0, max: 120.0, default: 42.0, group: "Surface" }
  - { name: fog_density, display: "Depth Falloff", type: float, min: 0.0, max: 1.2, default: 0.16, group: "Surface" }
  - { name: exposure, display: "Exposure", type: float, min: 0.2, max: 4.0, default: 1.55, group: "Surface" }

  - { name: pin_height, display: "Marker Height", type: float, min: 0.0, max: 0.9, default: 0.26, group: "Instrument" }
  - { name: pin_gain, display: "Marker Ink", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Instrument" }
  - { name: hist_mark, display: "Distribution Mark", type: float, min: 0.0, max: 1.0, default: 0.60, group: "Instrument" }
  - { name: plan_zoom, display: "Plan Extent", type: float, min: 1.0, max: 4.0, default: 2.45, group: "Instrument" }
  - { name: section_z, display: "Section Plane", type: float, min: 0.0, max: 1.0, default: 0.5, group: "Instrument" }
  - { name: accent_color, display: "Accent", type: color, default: [1.0, 0.42, 0.09], group: "Surface" }

buffers:
  - { name: gbuf, format: RGBA32F }
  - { name: main, format: RGBA8 }
  - { name: markers, structured: true, element_size: 32, element_count: 64, persistent: true }

passes:
  - name: march
    shader: march.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
    output: "buffer:gbuf"

  - name: shade
    shader: shade.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:gbuf" }
      - { slot: 1, source: "input:0" }
      - { slot: 2, source: "input:1" }
    output: "buffer:main"

  - name: project
    shader: project.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: "buffer:markers"

  - name: compose
    shader: compose.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "buffer:main" }
      - { slot: 1, source: "input:0" }
      - { slot: 2, source: "buffer:gbuf" }
      - { slot: 3, source: "buffer:markers" }
      - { slot: 4, source: "data:0" }
      - { slot: 5, source: "data:1" }
    output: output

outputs:
  - { name: "Instrument", pass: compose }
