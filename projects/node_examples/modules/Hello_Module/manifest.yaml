name: "Hello Module"
version: "1.0"
mode: generator
resolution: [640, 360]

parameters:
  - { name: pulse, display: "Pulse", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Hello" }

passes:
  - name: hello_ring
    shader: hello_ring.hlsl
    target: cs_5_0

outputs:
  - { name: "Out", pass: hello_ring }
