name: "C1 BG"
version: "0.1"
mode: generator
resolution: [864, 1080]

parameters:
  - { name: highlight, display: "Center Highlight", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Look" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 2.0, default: 0.85, group: "Look" }
  - { name: grain_amount, display: "Grain", type: float, min: 0.0, max: 0.04, default: 0.008, group: "Look" }

passes:
  - name: bg
    shader: bg.hlsl
    target: cs_5_0

outputs:
  - { name: "BG", pass: bg }
