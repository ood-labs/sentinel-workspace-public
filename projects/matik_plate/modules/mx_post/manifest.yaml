name: "MX Post"
version: "0.1"
mode: generator
resolution: [1080, 1080]

# Finishing only. Bloom on the linework, grade, grain, edge burn. Nothing structural.

inputs:
  - { name: "Plate", slot: 0, required: true }

parameters:
  - { name: glow_radius,    display: "Glow Radius",   type: float, min: 0.0, max: 24.0, default: 5.0, group: "Bloom" }
  - { name: glow_gain,      display: "Glow",          type: float, min: 0.0, max: 2.0,  default: 0.42, group: "Bloom" }
  - { name: glow_threshold, display: "Glow Threshold", type: float, min: 0.0, max: 0.95, default: 0.32, group: "Bloom" }

  - { name: exposure,    display: "Exposure",   type: float, min: 0.2, max: 2.0,  default: 1.02, group: "Grade" }
  - { name: contrast,    display: "Contrast",   type: float, min: 0.4, max: 2.5,  default: 1.16, group: "Grade" }
  - { name: gamma,       display: "Gamma",      type: float, min: 0.4, max: 2.2,  default: 1.0,  group: "Grade" }
  - { name: black_lift,  display: "Black Lift", type: float, min: 0.0, max: 0.15, default: 0.012, group: "Grade" }
  - { name: tint,        display: "Tint",       type: color, default: [1.0, 1.0, 1.0], group: "Grade" }

  - { name: grain,      display: "Grain",      type: float, min: 0.0, max: 0.3,  default: 0.045, group: "Texture" }
  - { name: grain_size, display: "Grain Size", type: float, min: 0.25, max: 6.0, default: 1.3,  group: "Texture" }
  - { name: vignette,   display: "Edge Burn",  type: float, min: 0.0, max: 1.0,  default: 0.22, group: "Texture" }

passes:
  - name: glow
    shader: glow.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
  - name: final
    shader: final.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "pass:glow" }

outputs:
  - { name: "Plate", pass: final }
