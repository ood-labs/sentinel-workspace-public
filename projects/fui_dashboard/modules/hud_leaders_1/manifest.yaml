name: "HUD Leaders"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }
  - { name: line_color, display: "Line Color", type: color, default: [0.24, 0.62, 0.50], group: "Color" }
  - { name: core_color, display: "Node Color", type: color, default: [0.75, 1.0, 0.88], group: "Color" }

passes:
  - { name: leaders, shader: leaders.hlsl, target: cs_5_0 }

outputs:
  - { name: "Leaders", pass: leaders }
