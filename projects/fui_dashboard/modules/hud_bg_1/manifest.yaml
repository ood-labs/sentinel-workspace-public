name: "HUD Background"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: bg_top, display: "BG Top", type: color, default: [0.020, 0.055, 0.070], group: "Base" }
  - { name: bg_bottom, display: "BG Bottom", type: color, default: [0.008, 0.022, 0.030], group: "Base" }
  - { name: grid_color, display: "Grid Color", type: color, default: [0.20, 0.55, 0.45], group: "Grid" }
  - { name: grid_spacing, display: "Grid Spacing (px)", type: float, min: 8.0, max: 160.0, default: 42.0, group: "Grid" }
  - { name: grid_intensity, display: "Grid Intensity", type: float, min: 0.0, max: 1.0, default: 0.10, group: "Grid" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 3.0, default: 1.2, group: "Lens" }

passes:
  - { name: bg, shader: bg.hlsl, target: cs_5_0 }

outputs:
  - { name: "BG", pass: bg }
