name: "HUD Orbits"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }
  - { name: orbit_color, display: "Orbit Color", type: color, default: [0.28, 0.72, 0.58], group: "Color" }
  - { name: core_color, display: "Core Color", type: color, default: [0.80, 1.0, 0.92], group: "Color" }

  - { name: orbit_x, display: "Orbit X", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Orbits" }
  - { name: orbit_y, display: "Orbit Y", type: float, min: 0.0, max: 1.0, default: 0.17, group: "Orbits" }
  - { name: orbit_radius, display: "Orbit Radius", type: float, min: 0.03, max: 0.4, default: 0.155, group: "Orbits" }
  - { name: orbit_speed, display: "Orbit Speed", type: float, min: -1.0, max: 1.0, default: 0.12, group: "Orbits" }

  - { name: globe_x, display: "Globe X", type: float, min: 0.0, max: 1.0, default: 0.145, group: "Globe" }
  - { name: globe_y, display: "Globe Y", type: float, min: 0.0, max: 1.0, default: 0.17, group: "Globe" }
  - { name: globe_radius, display: "Globe Radius", type: float, min: 0.03, max: 0.3, default: 0.10, group: "Globe" }
  - { name: globe_speed, display: "Globe Speed", type: float, min: -1.0, max: 1.0, default: 0.10, group: "Globe" }

passes:
  - { name: orbits, shader: orbits.hlsl, target: cs_5_0 }

outputs:
  - { name: "Orbits", pass: orbits }
