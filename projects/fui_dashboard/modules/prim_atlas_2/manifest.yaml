name: "Primitive Atlas"
version: "1.0"
mode: generator
resolution: [2048, 1024]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: unused, display: "Unused", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Atlas" }

passes:
  - { name: atlas, shader: atlas.hlsl, target: cs_5_0 }

outputs:
  - { name: "Atlas", pass: atlas }
