name: "HUD Compositor"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "BG", slot: 0, required: true }
  - { name: "Orbits", slot: 1, required: false }
  - { name: "Gauge", slot: 2, required: false }
  - { name: "Labels", slot: 3, required: false }
  - { name: "Splines", slot: 4, required: false }
  - { name: "Layer A", slot: 5, required: false }
  - { name: "Layer B", slot: 6, required: false }
  - { name: "Layer C", slot: 7, required: false }
  - { name: "Layer D", slot: 8, required: false }
  - { name: "Layer E", slot: 9, required: false }
  - { name: "Layer F", slot: 10, required: false }
  - { name: "Layer G", slot: 11, required: false }

parameters:
  - { name: bg_gain, display: "BG", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: orbits_gain, display: "Orbits", type: float, min: 0.0, max: 2.0, default: 0.45, group: "Layer Gain" }
  - { name: gauge_gain, display: "Gauge", type: float, min: 0.0, max: 2.0, default: 0.5, group: "Layer Gain" }
  - { name: labels_gain, display: "Labels", type: float, min: 0.0, max: 2.0, default: 1.15, group: "Layer Gain" }
  - { name: splines_gain, display: "Splines", type: float, min: 0.0, max: 2.0, default: 0.7, group: "Layer Gain" }
  - { name: layers_gain, display: "Cloner Layers", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: master_mix, display: "Master Mix", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Master" }

passes:
  - name: composite
    shader: composite.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }
      - { slot: 5, source: "input:5" }
      - { slot: 6, source: "input:6" }
      - { slot: 7, source: "input:7" }
      - { slot: 8, source: "input:8" }
      - { slot: 9, source: "input:9" }
      - { slot: 10, source: "input:10" }
      - { slot: 11, source: "input:11" }

outputs:
  - { name: "Scene", pass: composite }
