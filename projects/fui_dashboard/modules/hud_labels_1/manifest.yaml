name: "HUD Labels"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Text" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 2.0, default: 0.2, group: "Text" }
  - { name: text_scale, display: "Text Scale", type: float, min: 0.5, max: 4.0, default: 1.0, group: "Text" }
  - { name: label_color, display: "Label Color", type: color, default: [0.65, 0.98, 0.82], group: "Color" }
  - { name: accent_color, display: "Accent Color", type: color, default: [0.85, 1.0, 0.92], group: "Color" }

passes:
  - { name: render, shader: labels.hlsl, target: cs_5_0 }

outputs:
  - { name: "Labels Tex", pass: render }
