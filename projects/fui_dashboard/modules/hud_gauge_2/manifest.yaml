name: "HUD Gauge"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }
  - { name: spin_speed, display: "Spin Speed", type: float, min: -2.0, max: 2.0, default: 0.15, group: "Motion" }
  - { name: body_color, display: "Body Color", type: color, default: [0.30, 0.82, 0.62], group: "Color" }
  - { name: core_color, display: "Core Color", type: color, default: [0.75, 1.0, 0.90], group: "Color" }

  - { name: hero_x, display: "Hero X", type: float, min: 0.0, max: 1.0, default: 0.735, group: "Hero" }
  - { name: hero_y, display: "Hero Y", type: float, min: 0.0, max: 1.0, default: 0.47, group: "Hero" }
  - { name: hero_radius, display: "Hero Radius", type: float, min: 0.05, max: 0.5, default: 0.30, group: "Hero" }
  - { name: hero_value, display: "Hero Value", type: float, min: 0.0, max: 1.0, default: 0.25, group: "Hero" }

  - { name: sec_x, display: "Sec X", type: float, min: 0.0, max: 1.0, default: 0.505, group: "Secondary" }
  - { name: sec_y, display: "Sec Y", type: float, min: 0.0, max: 1.0, default: 0.44, group: "Secondary" }
  - { name: sec_radius, display: "Sec Radius", type: float, min: 0.02, max: 0.25, default: 0.075, group: "Secondary" }

  - { name: fan_x, display: "Fan X", type: float, min: -0.5, max: 1.0, default: 0.115, group: "Tick Fan" }
  - { name: fan_y, display: "Fan Y", type: float, min: 0.0, max: 1.5, default: 0.94, group: "Tick Fan" }
  - { name: fan_radius, display: "Fan Radius", type: float, min: 0.05, max: 0.6, default: 0.26, group: "Tick Fan" }
  - { name: fan_ticks, display: "Fan Ticks", type: float, min: 20.0, max: 200.0, default: 80.0, group: "Tick Fan" }
  - { name: fan_start, display: "Fan Start (rad)", type: float, min: -3.15, max: 3.15, default: -2.4, group: "Tick Fan" }
  - { name: fan_end, display: "Fan End (rad)", type: float, min: -3.15, max: 3.15, default: 0.4, group: "Tick Fan" }
  - { name: fan_value, display: "Fan Value", type: float, min: 0.0, max: 1.0, default: 0.6, group: "Tick Fan" }

passes:
  - { name: gauge, shader: gauge.hlsl, target: cs_5_0 }

outputs:
  - { name: "Gauge", pass: gauge }
