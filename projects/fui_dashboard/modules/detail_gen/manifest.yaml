name: "Detail Gen"
version: "1.0"
mode: generator
resolution: [256, 64]
working_format: RGBA8

buffers:
  - name: widgets
    structured: true
    element_size: 64
    element_count: 256

parameters:
  - { name: seed, display: "Seed", type: int, min: 0, max: 63, default: 7, group: "Detail" }
  - { name: density, display: "Density", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Detail" }

passes:
  - name: compute
    shader: detail.hlsl
    target: cs_5_0
    dispatch: [4, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:widgets"
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:widgets" } ] }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Widgets"
    buffer: "widgets"
    schema:
      - { name: pos, type: float2 }
      - { name: depth, type: float }
      - { name: rot, type: float }
      - { name: scale, type: float2 }
      - { name: kind, type: float }
      - { name: value, type: float }
      - { name: p01, type: float2 }
      - { name: p23, type: float2 }
      - { name: tier, type: float }
      - { name: active, type: float }
      - { name: group, type: float }
      - { name: seed, type: float }
