name: "HUD Compositor"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "BG", slot: 0, required: true }
  - { name: "Orbits", slot: 1, required: false }
  - { name: "Panels", slot: 2, required: false }
  - { name: "Leaders", slot: 3, required: false }
  - { name: "Gauge", slot: 4, required: false }
  - { name: "Labels", slot: 5, required: false }

parameters:
  - { name: bg_gain, display: "BG", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: orbits_gain, display: "Orbits", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Layer Gain" }
  - { name: panels_gain, display: "Panels", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: leaders_gain, display: "Leaders", type: float, min: 0.0, max: 2.0, default: 0.85, group: "Layer Gain" }
  - { name: gauge_gain, display: "Gauge", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: labels_gain, display: "Labels", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: master_mix, display: "Master Mix", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Master" }

passes:
  - name: composite
    shader: composite.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }
      - { slot: 5, source: "input:5" }

outputs:
  - { name: "Scene", pass: composite }
