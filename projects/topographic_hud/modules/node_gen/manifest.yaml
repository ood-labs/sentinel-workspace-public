name: "Editable Node Field"
version: "2.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F

inputs:
  - { name: "Field", slot: 0, required: true }

parameters:
  - name: placement_mode
    display: "Placement"
    type: enum
    options: [Random, Peaks, Pits, Ring, Hybrid]
    default: 4
    flags: button_grid
    group: "Placement"
  - { name: node_count, display: "Node Count", type: int, min: 0, max: 128, default: 60, group: "Placement" }
  - { name: seed, display: "Seed", type: int, min: 0, max: 63, default: 5, group: "Placement" }
  - { name: ring_radius, display: "Ring Radius", type: float, min: 0.05, max: 0.5, default: 0.34, group: "Placement" }
  - { name: jitter, display: "Jitter", type: float, min: 0.0, max: 0.3, default: 0.04, group: "Placement" }
  - { name: ascent_steps, display: "Ascent Steps", type: int, min: 0, max: 16, default: 7, group: "Peaks" }
  - { name: ascent_rate, display: "Ascent Rate", type: float, min: 0.0, max: 0.2, default: 0.05, group: "Peaks" }
  - { name: size_min, display: "Size Min", type: float, min: 0.005, max: 0.1, default: 0.012, group: "Style" }
  - { name: size_max, display: "Size Max", type: float, min: 0.01, max: 0.2, default: 0.05, group: "Style" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Style" }
  - { name: color_mix, display: "Color Mix", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Style" }
  - { name: reset_offsets, display: "Reset Priority Offsets", type: bool, default: false, flags: button, group: "Editor" }

viewport:
  hint: "Select and drag one of the twelve priority survey nodes. Offsets are durable, preset-aware, and preserve the downstream link and label lanes."
  interactions: [events, selection]
  selection: { mode: single, provider: ray_query, result_buffer: pick_result, object_buffer: viewport_objects }
  input:
    pointer: [left]
    keyboard: [escape]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: select_priority_node, label: "Select Priority Node" }
    - { gesture: left_drag, action: move_priority_node, label: "Move Priority Node" }
    - { key: escape, action: cancel_node_edit, label: "Cancel Node Edit" }

buffers:
  - { name: nodes, structured: true, element_size: 32, element_count: 128 }
  - { name: node_overrides, structured: true, element_size: 16, element_count: 13, persistent: true }
  - { name: node_edit_state, structured: true, element_size: 48, element_count: 1, persistent: true }
  - { name: viewport_objects, structured: true, element_size: 120, element_count: 12, persistent: true }
  - { name: pick_result, structured: true, element_size: 40, element_count: 1, persistent: true }

state_buffers:
  - name: node_overrides
    max_elements: 12
    schema:
      - { name: offset, type: float2 }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
  - name: node_edit_state
    max_elements: 1
    schema:
      - { name: active_id, type: float }
      - { name: dragging, type: float }
      - { name: command, type: float }
      - { name: sequence, type: uint }
      - { name: pointer, type: float2 }
      - { name: start_pointer, type: float2 }
      - { name: snapshot_offset, type: float2 }
      - { name: pad1, type: float2 }

passes:
  - name: node_interaction
    shader: node_interaction.hlsl
    target: cs_5_0
    time_dependent: true
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:node_overrides" }
    output: "buffer:node_edit_state"

  - name: node_update
    shader: node_update.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:node_edit_state" }
      - { slot: 1, source: "buffer:node_overrides" }
    output: "buffer:node_overrides"

  - name: compute_nodes
    shader: compute_nodes.hlsl
    target: cs_5_0
    dispatch: [2, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:nodes"
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:node_overrides" }

  - name: node_descriptors
    shader: node_descriptors.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 12
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:nodes" }
    output: "buffer:viewport_objects"

  - name: node_pick
    shader: node_pick.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:nodes" }
    output: "buffer:pick_result"

  - { name: preview, shader: preview_nodes.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:nodes" } ] }

outputs:
  - { name: "Priority Node Editor", pass: preview }

data_outputs:
  - name: "Nodes"
    buffer: "nodes"
    schema:
      - { name: pos, type: float2 }
      - { name: radius, type: float }
      - { name: intensity, type: float }
      - { name: color_mix, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
  - name: "Priority Node Offsets"
    buffer: "node_overrides"
    schema:
      - { name: offset, type: float2 }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
  - name: "Node Edit State"
    buffer: "node_edit_state"
    schema:
      - { name: active_id, type: float }
      - { name: dragging, type: float }
      - { name: command, type: float }
      - { name: sequence, type: uint }
      - { name: pointer, type: float2 }
      - { name: start_pointer, type: float2 }
      - { name: snapshot_offset, type: float2 }
      - { name: pad1, type: float2 }
