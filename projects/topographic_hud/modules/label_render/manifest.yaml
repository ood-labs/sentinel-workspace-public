name: "Label Render"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

data_inputs:
  - name: "Labels"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: scale, type: float }
      - { name: label_id, type: float }
      - { name: color_mix, type: float }
      - { name: rotation, type: float }
      - { name: active, type: float }
      - { name: pad0, type: float }

parameters:
  - { name: text_scale, display: "Text Scale", type: float, min: 1.0, max: 6.0, default: 2.0, group: "Text" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Text" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 2.0, default: 0.25, group: "Text" }
  - { name: show_ticks, display: "Underline Ticks", type: bool, default: true, flags: button, group: "Text" }
  - { name: label_color, display: "Label Color", type: color, default: [0.75, 0.85, 0.95], group: "Color" }
  - { name: dim_color, display: "Dim Color", type: color, default: [0.95, 0.6, 0.25], group: "Color" }

passes:
  - { name: render, shader: render_labels.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }

outputs:
  - { name: "Labels Tex", pass: render }
