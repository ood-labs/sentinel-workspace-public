name: "Atmosphere"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: haze_color, display: "Haze Color", type: color, default: [0.05, 0.17, 0.24], group: "Haze" }
  - { name: haze_strength, display: "Haze Strength", type: float, min: 0.0, max: 2.0, default: 0.7, group: "Haze" }
  - { name: depth_gradient, display: "Depth Gradient", type: float, min: 0.1, max: 4.0, default: 1.1, group: "Haze" }
  - { name: star_density, display: "Star Density", type: float, min: 20.0, max: 220.0, default: 95.0, group: "Stars" }
  - { name: twinkle, display: "Twinkle", type: float, min: 0.0, max: 10.0, default: 3.0, group: "Stars" }
  - { name: dust_density, display: "Dust Density", type: float, min: 50.0, max: 700.0, default: 280.0, group: "Dust" }
  - { name: dust_brightness, display: "Dust Brightness", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Dust" }
  - { name: drift_speed, display: "Drift Speed", type: float, min: -0.2, max: 0.2, default: 0.012, group: "Motion" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }

passes:
  - { name: atmos, shader: atmosphere.hlsl, target: cs_5_0 }

outputs:
  - { name: "Atmosphere", pass: atmos }
