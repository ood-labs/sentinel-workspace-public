name: "Node Render"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: radius, type: float }
      - { name: intensity, type: float }
      - { name: color_mix, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

parameters:
  - { name: core_size, display: "Core Size", type: float, min: 0.1, max: 2.0, default: 0.5, group: "Glow" }
  - { name: glow_radius, display: "Glow Radius", type: float, min: 0.1, max: 3.0, default: 0.8, group: "Glow" }
  - { name: glow_falloff, display: "Glow Falloff", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Glow" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.1, group: "Glow" }
  - { name: star_rays, display: "Star Rays", type: bool, default: true, flags: button, group: "Rays" }
  - { name: ray_count, display: "Ray Count", type: int, min: 2, max: 8, default: 4, group: "Rays" }
  - { name: ray_length, display: "Ray Length", type: float, min: 0.1, max: 3.0, default: 1.2, group: "Rays" }
  - { name: pulse_speed, display: "Pulse Speed", type: float, min: 0.0, max: 10.0, default: 2.2, group: "Motion" }
  - { name: pulse_amount, display: "Pulse Amount", type: float, min: 0.0, max: 1.0, default: 0.25, group: "Motion" }
  - { name: white_color, display: "White Color", type: color, default: [0.85, 0.93, 1.0], group: "Color" }
  - { name: orange_color, display: "Orange Color", type: color, default: [1.0, 0.55, 0.2], group: "Color" }

passes:
  - { name: render, shader: render_nodes.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }

outputs:
  - { name: "Nodes Glow", pass: render }
