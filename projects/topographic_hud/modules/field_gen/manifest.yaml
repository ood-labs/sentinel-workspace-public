name: "Field Gen"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - name: field_mode
    display: "Field Mode"
    type: enum
    options: [Basins, Ridges, Islands, Flow]
    default: 2
    flags: button_grid
    group: "Terrain"
  - { name: center_count, display: "Center Count", type: int, min: 0, max: 8, default: 5, group: "Terrain" }
  - { name: warp_amount, display: "Warp Amount", type: float, min: 0.0, max: 2.0, default: 0.85, group: "Terrain" }
  - { name: frequency, display: "Frequency", type: float, min: 0.3, max: 6.0, default: 1.6, group: "Terrain" }
  - { name: octaves, display: "Octaves", type: int, min: 1, max: 8, default: 5, group: "Terrain" }
  - { name: lacunarity, display: "Lacunarity", type: float, min: 1.5, max: 3.0, default: 2.0, group: "Terrain" }
  - { name: gain, display: "Gain", type: float, min: 0.2, max: 0.8, default: 0.5, group: "Terrain" }
  - { name: elevation_bias, display: "Elevation Bias", type: float, min: -0.6, max: 0.6, default: 0.0, group: "Terrain" }
  - { name: region_split, display: "Region Split", type: float, min: 1.0, max: 12.0, default: 4.0, group: "Terrain" }
  - { name: detail_gain, display: "Detail Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Terrain" }
  - { name: aspect, display: "Aspect Stretch", type: float, min: 0.4, max: 2.0, default: 1.0, group: "Layout" }
  - { name: seed, display: "Seed", type: int, min: 0, max: 63, default: 3, group: "Layout" }
  - { name: flow_speed, display: "Flow Speed", type: float, min: -1.0, max: 1.0, default: 0.06, group: "Motion" }
  - { name: flow_dir, display: "Flow Dir", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.15, 0.1], group: "Motion" }

passes:
  - { name: field, shader: field.hlsl, target: cs_5_0 }

outputs:
  - { name: "Field", pass: field }
