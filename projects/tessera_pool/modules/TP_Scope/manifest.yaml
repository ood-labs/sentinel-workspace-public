name: "TP Scope"
version: "0.1"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F
output_format: RGBA16F

# The exploded instrument view. Draws NOTHING of its own — every mark stands for a number some
# other node published. See scope.hlsli.
#
# CAMERA: this node has its own, and its orbit parameters are DRIVEN BY EXPRESSION from
# TP_Render's. It must match that viewpoint exactly or every mark lands in the wrong place.
#
# The obvious answer — one shared Camera node, both nodes' camera_ref pointing at it — was tried
# and is wrong: with camera_ref set, the host takes over the viewport's pointer events for camera
# control, and TP_Render's pick pass deliberately ignores anything flagged HOST_CONSUMED. So the
# shared camera silently killed click-to-ripple on the water, which is the headline interaction
# of the whole piece. Mirroring the parameters instead leaves TP_Render's own camera untouched
# and interactive.
#
# The cost is one frame of latency: expressions evaluate a cook behind, so the overlay trails
# very slightly WHILE the camera is moving and is exact the moment it stops. If that ever needs
# fixing, the answer is for TP_Render to publish its view matrix as a data output — this node is
# downstream, so it would receive the current cook's matrix with no lag at all.
features: [camera]

buffers:
  # Three channels x two parity halves at 1280x720. Structure / measurement / prediction are
  # accumulated separately so overlapping marks stay legible as separate things rather than
  # averaging into one brighter smear. Parity removes the need for a clear pass.
  # SIX channels x two parity halves at 1280x720, plus one element for the parity handshake.
  # See TP_ACC_CH in scope.hlsli for why the gizmo needs three of its own.
  - { name: acc,   structured: true, element_size: 4,  element_count: 11059201 }
  - { name: trail, structured: true, element_size: 16, element_count: 1024, persistent: true }
  - { name: sctl,  structured: true, element_size: 32, element_count: 1, persistent: true }

inputs:
  - { name: "Beauty",   slot: 0, required: true }
  - { name: "Surface",  slot: 1, required: true }
  - { name: "Caustics", slot: 2, required: true }

data_inputs:
  - name: "Plan"
    slot: 0
    schema:
      - { name: pos,    type: float3 }
      - { name: dims,   type: float3 }
      - { name: role,   type: float }
      - { name: kind,   type: float }
      - { name: tint,   type: float3 }
      - { name: seed,   type: float }
      - { name: p0,     type: float }
      - { name: p1,     type: float }
      - { name: p2,     type: float }
      - { name: p3,     type: float }
      - { name: flags,  type: float }
      - { name: active, type: float }
      - { name: pad0,   type: float }
      - { name: pad1,   type: float }

  - name: "School"
    slot: 1
    schema:
      - { name: pos,    type: float3 }
      - { name: dir,    type: float3 }
      - { name: phase,  type: float }
      - { name: len,    type: float }
      - { name: tint,   type: float3 }
      - { name: speed,  type: float }
      - { name: bank,   type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }
      - { name: sweep,  type: float }

parameters:
  # THE ONE CONTROL THE PIECE IS ABOUT. At 0 every layer sits exactly where it truly is and the
  # overlay registers on the render; being able to CLOSE it is what makes the open state
  # trustworthy, because it proves the same scene is being described.
  #
  # Layer Spread used to sit beside this and the two only ever multiplied, so between them they
  # expressed one number and offered two ways to get lost setting it. Its travel is baked in.
  - { name: explode,     display: "Explode",       type: float, min: 0.0, max: 1.0, default: 0.0,  group: "Scope" }
  - { name: scope_mix,   display: "Overlay Mix",   type: float, min: 0.0, max: 1.0, default: 1.0,  group: "Scope" }
  # How far the underlying render is pushed down while the instrument is open, so the linework
  # has something to sit against. At 1 the beauty is untouched.
  - { name: beauty_dim,  display: "Beauty Dim",    type: float, min: 0.0, max: 1.0, default: 1.0,  group: "Scope" }

  # ---- What is drawn
  - { name: show_cage,   display: "Tank Cage",     type: bool,  default: true, group: "Layers" }
  - { name: show_caus,   display: "Caustic Plate", type: bool,  default: true, group: "Layers" }
  - { name: show_surf,   display: "Surface Plate", type: bool,  default: true, group: "Layers" }
  - { name: show_vec,    display: "Fish Vectors",  type: bool,  default: true, group: "Layers" }
  - { name: show_trail,  display: "Trails",        type: bool,  default: true, group: "Layers" }
  - { name: show_fcast,  display: "Forecast",      type: bool,  default: true, group: "Layers" }
  # Per-fish transform gizmo: red forward, green up, blue right, taken from the same frame the
  # renderer builds the body in — so it reports the fish's real orientation, bank included.
  - { name: show_gizmo,  display: "Fish Gizmos",   type: bool,  default: true, group: "Layers" }
  - { name: gizmo_size,  display: "Gizmo Size",    type: float, min: 0.0, max: 6.0, default: 1.6, group: "Layers" }

  # ---- Linework
  - { name: line_width,  display: "Line Width",    type: float, min: 0.5, max: 6.0,  default: 1.4,  group: "Line" }
  - { name: line_gain,   display: "Line Gain",     type: float, min: 0.0, max: 8.0,  default: 2.2,  group: "Line" }
  # How much an occluded mark survives. Zero hides everything behind the tiles, which reads as
  # broken; a low value reads as an instrument overlay seen through the water.
  - { name: occlude,     display: "See-Through",   type: float, min: 0.0, max: 1.0,  default: 0.28, group: "Line" }

  # Seconds between recorded trail samples. This is a MEASUREMENT interval, not a look control:
  # it decides how much history the ring holds (interval x 64) and therefore how far back the
  # trail actually reaches.
  - { name: trail_rate,  display: "Trail Interval", type: float, min: 0.01, max: 0.5, default: 0.06, group: "Line" }
  - { name: trail_fade,  display: "Trail Fade",     type: float, min: 0.0, max: 1.0, default: 0.75, group: "Line" }
  # How far ahead the forecast is extrapolated, in seconds. It is NOT a re-simulation — see
  # splat.hlsl — so it is honest for about a second and diverges after.
  - { name: fcast_time,  display: "Forecast Time",  type: float, min: 0.0, max: 4.0, default: 1.4,  group: "Line" }

  # ---- Palette. Three inks, one per kind of mark, so structure / measurement / prediction stay
  # distinguishable where they cross.
  - { name: ink_struct,  display: "Structure Ink",  type: color, default: [0.30, 0.72, 0.95], group: "Palette" }
  - { name: ink_measure, display: "Measured Ink",   type: color, default: [1.00, 0.62, 0.18], group: "Palette" }
  - { name: ink_predict, display: "Predicted Ink",  type: color, default: [0.62, 0.34, 0.98], group: "Palette" }
  - { name: plate_gain,  display: "Plate Gain",     type: float, min: 0.0, max: 4.0, default: 1.15, group: "Palette" }

passes:
  - name: tick
    shader: tick.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:sctl"

  # One thread per fish. Appends the CURRENT position into that fish's ring when the interval
  # has elapsed, so the trail is recorded history rather than a curve fitted after the fact.
  - name: trail
    shader: trail.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 16
    thread_group_y: 1
    inputs:
      - { slot: 1, source: "buffer:sctl" }
      - { slot: 2, source: "data:1" }
    output: "buffer:trail"

  # Scatter. One thread per sample along every polyline in the frame.
  - name: splat
    shader: splat.hlsl
    target: cs_5_0
    dispatch: [16, 1, 1]
    thread_group_x: 256
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:sctl" }
      - { slot: 2, source: "data:1" }
      - { slot: 3, source: "data:0" }
      - { slot: 4, source: "buffer:trail" }
    output: "buffer:acc"

  # Resolve: the analytic plates, then the scattered linework, over the beauty.
  - name: draw
    shader: draw.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:sctl" }
      - { slot: 2, source: "buffer:acc" }
      - { slot: 3, source: "data:0" }
      - { slot: 4, source: "input:1" }
      - { slot: 5, source: "input:2" }

outputs:
  - { name: "Scope", pass: draw }
