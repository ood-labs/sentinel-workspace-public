name: "Fruit Guide"
version: "1.0"
mode: generator
resolution: [512, 896]

parameters:
  - name: center_x
    display: "Center X"
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    group: "Shape"

  - name: center_y
    display: "Center Y"
    type: float
    min: 0.0
    max: 1.0
    default: 0.45
    group: "Shape"

  - name: radius
    display: "Radius"
    type: float
    min: 0.05
    max: 0.5
    default: 0.27
    group: "Shape"

  - name: squash
    display: "Vertical Squash"
    type: float
    min: 0.5
    max: 1.5
    default: 1.05
    group: "Shape"

  - name: softness
    display: "Edge Softness"
    type: float
    min: 0.005
    max: 0.2
    default: 0.03
    group: "Shape"

  - name: color_r
    display: "Color R"
    type: float
    min: 0.0
    max: 1.0
    default: 0.75
    group: "Color"

  - name: color_g
    display: "Color G"
    type: float
    min: 0.0
    max: 1.0
    default: 0.12
    group: "Color"

  - name: color_b
    display: "Color B"
    type: float
    min: 0.0
    max: 1.0
    default: 0.08
    group: "Color"

passes:
  - name: blob
    shader: blob.hlsl
    target: ps_5_0
    format: RGBA8
    output: output

outputs:
  - name: "Guide"
    pass: blob
