name: "PR Plan"
version: "0.1"
mode: generator
resolution: [864, 1080]

# The plan authority for prism_reliquary. It is the only node that decides where anything
# sits, how big it is, and which material it wears. Everything downstream derives.
#
# 4:5 generator resolution on purpose: the preview's uv IS the reference image coordinate
# system the layout tables are written in, so the schematic cannot drift from the numbers
# it is drawing. The frame contract (camera pose, lens, ground line) lives in
# _shared/relic.hlsli and is shared with the renderer.

# PERSISTENT, and declared as a state buffer: hand edits have to survive cooks, project
# saves, node presets and undo. Without this the plan is a read-only generator and every
# drag evaporates on the next frame.
buffers:
  - { name: cast, structured: true, element_size: 96, element_count: 96, persistent: true }

state_buffers:
  - name: cast
    max_elements: 96
    schema:
      - { name: pos,    type: float3 }
      - { name: radius, type: float }
      - { name: rot,    type: float4 }
      - { name: dims,   type: float3 }
      - { name: role,   type: float }
      - { name: tint,   type: float3 }
      - { name: mat,    type: float }
      - { name: p0,     type: float }
      - { name: p1,     type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }
      - { name: flags,  type: float }
      - { name: aux,    type: float3 }

# The edit verbs are chosen for THIS subject: the reference is about material (fur, chrome,
# smoked glass, cut stone) and about the size hierarchy that makes the composition read, so
# those are what go on keys. Chips cycle their cut instead of their size, because at that
# scale the cut is what you actually see.
viewport:
  hint: "Click select · drag move · M material · K size/cut · X on-off · N re-roll · R reseed · C clear"
  interactions: [events]
  input:
    pointer: [left]
    keyboard: [m, k, x, n, r, c]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: select,       label: "Select element" }
    - { gesture: left_drag,  action: move,         label: "Move element" }
    - { key: m, action: cycle_material,  label: "Cycle material" }
    - { key: k, action: cycle_kind,      label: "Cycle size / chip cut" }
    - { key: x, action: toggle_active,   label: "Toggle on/off" }
    - { key: n, action: reroll,          label: "Re-roll element" }
    - { key: r, action: reseed,          label: "Reseed layout" }
    - { key: c, action: clear_selection, label: "Clear selection" }

parameters:
  # ---- exploration axes -----------------------------------------------------
  - name: arrangement
    display: "Arrangement"
    type: enum
    options: [Reference, Orbit, Colonnade]
    default: 0
    flags: button_grid
    group: "Composition"
  - name: glyph_style
    display: "Glyph"
    type: enum
    options: [Double Cross, Single Cross, Lattice Tower]
    default: 0
    flags: button_grid
    group: "Composition"

  # ---- arrangement randomizer ----------------------------------------------
  # variation = 0 is exactly the transcribed reference and can never be lost. Raising it
  # blends toward a bounded stratified re-roll; sizes are never re-rolled, so the size
  # hierarchy that makes the composition read survives every seed.
  - { name: variation,   display: "Variation",    type: float, min: 0.0, max: 1.0,   default: 0.000000, group: "Composition" }
  - { name: seed,        display: "Seed",         type: float, min: 0.0, max: 512.0, default: 7.000000, group: "Composition" }
  - { name: spread,      display: "Spread",       type: float, min: 0.3, max: 1.8,   default: 1.000000, group: "Composition" }
  - { name: scale_master, display: "Object Scale", type: float, min: 0.5, max: 1.6,  default: 1.000000, group: "Composition" }

  # ---- stage ----------------------------------------------------------------
  - { name: floor_gloss,   display: "Floor Gloss",   type: float, min: 0.0, max: 1.0, default: 0.82, group: "Stage" }
  - { name: floor_ripple,  display: "Floor Ripple",  type: float, min: 0.0, max: 1.0, default: 0.3, group: "Stage" }
  - { name: backdrop_lift, display: "Backdrop Lift", type: float, min: 0.0, max: 1.0, default: 0.4, group: "Stage" }

  # ---- the hero -------------------------------------------------------------
  - { name: torus_pitch, display: "Hero Pitch", type: float, min: -90.0, max: 90.0, default: -24.000000, group: "Hero" }
  - { name: torus_yaw,   display: "Hero Yaw",   type: float, min: -90.0, max: 90.0, default: -30.000000, group: "Hero" }
  - { name: torus_roll,  display: "Hero Roll",  type: float, min: -90.0, max: 90.0, default:  16.000000, group: "Hero" }
  - { name: fur_length,  display: "Fur Length",  type: float, min: 0.0, max: 1.0, default: 0.36, group: "Hero" }
  - { name: fur_curl,    display: "Fur Curl",    type: float, min: 0.0, max: 1.0, default: 1.000000, group: "Hero" }
  # max 8.0, not 3.0: the tuned value sits AT 3.0 and a ceiling on the tuned value is a
  # silent clamp, not a range. Setting 4.2 during tuning quietly did nothing.
  - { name: fur_density, display: "Fur Density", type: float, min: 0.2, max: 8.0, default: 3.000000, group: "Hero" }
  - { name: irid_gain,   display: "Iridescence", type: float, min: 0.0, max: 3.0, default: 1.4, group: "Hero" }

  # ---- gem lattice ----------------------------------------------------------
  - { name: gem_cols, display: "Lattice Columns", type: int,   min: 1,   max: 8,   default: 6,    group: "Lattice" }
  - { name: gem_rows, display: "Lattice Rows",    type: int,   min: 1,   max: 8,   default: 6,    group: "Lattice" }
  - { name: gem_fill, display: "Cell Fill",       type: float, min: 0.0, max: 1.0, default: 0.82, group: "Lattice" }
  - { name: gem_ruby, display: "Ruby Mix",        type: float, min: 0.0, max: 1.0, default: 0.75, group: "Lattice" }

  # ---- membrane and ring ----------------------------------------------------
  - { name: film_billow,    display: "Drape Billow",   type: float, min: 0.0,  max: 2.0,   default: 1.000000, group: "Membrane" }
  - { name: film_thickness, display: "Film Thickness", type: float, min: 180.0, max: 900.0, default: 430.000000, group: "Membrane" }
  - { name: film_folds,     display: "Fold Count",     type: float, min: 1.0,  max: 8.0,   default: 3.2, group: "Membrane" }
  - { name: ring_glow,      display: "Ring Glow",      type: float, min: 0.0,  max: 8.0,   default: 0.8, group: "Membrane" }

  # ---- life ------------------------------------------------------------------
  # One master clock. Everything animated scales this, so the whole piece speeds up and
  # slows down together and nothing can drift apart. 0 freezes the show completely.
  - { name: anim_rate,    display: "Animation Rate",  type: float, min: 0.0, max: 4.0, default: 1.000000, group: "Life" }
  - { name: sphere_float, display: "Sphere Float",    type: float, min: 0.0, max: 2.0, default: 0.35, group: "Life" }
  - { name: lattice_rate, display: "Lattice Shuffle", type: float, min: 0.0, max: 2.0, default: 0.22, group: "Life" }

passes:
  - name: plan
    shader: plan.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:cast"
  - name: canvas
    shader: canvas.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:cast" }

data_outputs:
  - name: "Cast"
    buffer: "cast"
    schema:
      - { name: pos,    type: float3 }
      - { name: radius, type: float }
      - { name: rot,    type: float4 }
      - { name: dims,   type: float3 }
      - { name: role,   type: float }
      - { name: tint,   type: float3 }
      - { name: mat,    type: float }
      - { name: p0,     type: float }
      - { name: p1,     type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }
      - { name: flags,  type: float }
      - { name: aux,    type: float3 }

outputs:
  # named distinctly from the "Cast" DATA output so a link never has to disambiguate by slot
  - { name: "Plan View", pass: canvas }
