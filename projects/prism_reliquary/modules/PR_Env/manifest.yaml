name: "PR Env"
version: "0.1"
mode: generator
resolution: [1024, 512]
working_format: RGBA16F

# The studio for prism_reliquary, authored as a lat-long HDR panorama.
#
# RGBA16F is not optional here: the key softbox runs to ~9.0 and the rim strips to ~6.0, and
# an LDR environment clips them to white, which is exactly the difference between chrome that
# looks like polished metal and chrome that looks like grey paint.
#
# It reads the Cast only for the stage record's backdrop lift, because that is a stage
# decision and the plan authority owns it.

data_inputs:
  - name: "Cast"
    slot: 0
    schema:
      - { name: pos,    type: float3 }
      - { name: radius, type: float }
      - { name: rot,    type: float4 }
      - { name: dims,   type: float3 }
      - { name: role,   type: float }
      - { name: tint,   type: float3 }
      - { name: mat,    type: float }
      - { name: p0,     type: float }
      - { name: p1,     type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }
      - { name: flags,  type: float }
      - { name: aux,    type: float3 }

parameters:
  # Azimuth is measured as atan2(z, x): +Z is toward camera, -X is stage left. The key
  # therefore sits front-left-high at ~143 degrees, which is where the reference's shadows
  # say it is.
  - { name: key_azimuth,   display: "Key Azimuth",   type: float, min: -180.0, max: 180.0, default: 143.000000, group: "Key" }
  - { name: key_elevation, display: "Key Elevation", type: float, min: -20.0,  max: 89.0,  default: 42.000000,  group: "Key" }
  - { name: key_size,      display: "Softbox Size",  type: float, min: 0.05,  max: 1.60,  default: 0.55,  group: "Key" }
  - { name: key_softness,  display: "Edge Softness", type: float, min: 0.0,   max: 1.0,   default: 0.5,  group: "Key" }
  - { name: key_gain,      display: "Key Gain",      type: float, min: 0.0,   max: 30.0,  default: 9.000000,  group: "Key" }
  - { name: key_color,     display: "Key Colour",    type: color, default: [1.000000, 0.98, 0.95], group: "Key" }

  - { name: rim_azimuth,   display: "Rim Azimuth",   type: float, min: -180.0, max: 180.0, default: -72.000000, group: "Rim" }
  - { name: rim_opposition, display: "Rim Opposition", type: float, min: 30.0, max: 330.0, default: 150.000000, group: "Rim" }
  - { name: rim_gain,    display: "Rim Gain",    type: float, min: 0.0, max: 24.0, default: 6.000000, group: "Rim" }
  - { name: rim_color,   display: "Rim Colour",  type: color, default: [0.85, 0.9, 1.000000], group: "Rim" }
  - { name: strip_gain,  display: "Horizon Strip",  type: float, min: 0.0, max: 8.0,  default: 1.4, group: "Rim" }
  - { name: horizon_height, display: "Strip Height", type: float, min: -1.0, max: 1.0, default: 0.15, group: "Rim" }

  - { name: fill_azimuth, display: "Fill Azimuth", type: float, min: -180.0, max: 180.0, default: 20.000000, group: "Fill" }
  - { name: fill_gain,    display: "Fill Gain",    type: float, min: 0.0, max: 4.0, default: 0.35, group: "Fill" }
  - { name: fill_color,   display: "Fill Colour",  type: color, default: [0.2, 0.22, 0.3], group: "Fill" }
  - { name: bounce_gain,  display: "Floor Bounce", type: float, min: 0.0, max: 3.0, default: 0.5, group: "Fill" }

  - { name: ceiling_color, display: "Ceiling", type: color, default: [0.004, 0.005, 0.007], group: "Room" }
  - { name: wall_color,    display: "Wall",    type: color, default: [0.016, 0.017, 0.021], group: "Room" }
  - { name: floor_color,   display: "Ground",  type: color, default: [0.006, 0.006, 0.008], group: "Room" }

passes:
  - name: env
    shader: env.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }

outputs:
  - { name: "Studio", pass: env }
