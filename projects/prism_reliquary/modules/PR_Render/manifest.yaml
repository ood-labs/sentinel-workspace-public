name: "PR Render"
version: "0.1"
mode: generator
resolution: [1080, 1350]
# TWO DIFFERENT FORMATS, AND THE DISTINCTION IS LOAD-BEARING.
#   working_format governs INTERMEDIATE pass buffers.
#   output_format  governs the texture this node hands to the NEXT NODE.
# Setting only working_format leaves the node publishing BGRA8, which silently clamps
# alpha to [0,1] — and this module carries LINEAR DEPTH in alpha for PR_Post's lens blur.
# Every depth (11..14, and 1000 for a miss) collapsed to 1.0, so the defocus applied
# uniformly with no depth separation at all. It also clipped the HDR, so the bloom
# downstream was working on [0,1] data rather than the real specular range.
working_format: RGBA16F
output_format: RGBA16F
features: [camera]

viewport:
  hint: "Fly camera: RMB look, WASD move, wheel adjusts speed"
  interactions: [camera]

# The SDF renderer. Owns Sentinel's internal camera and nothing else about the composition:
# every primitive is a Cast record and every light is a texel of PR_Env's panorama.
#
# The saved pose is the frame contract from _shared/relic.hlsli — position (0, 2.22, 12.0),
# 28 degree FOV. That long lens is a compositional decision, not a default: it reproduces the
# reference's very flat perspective. Flying the camera is an intentional creative move.
#
# The float formats are why the speculars survive: they run well above 1.0, and PR_Post needs
# both that headroom to bloom them and the depth in alpha to focus on.

inputs:
  - { name: "Studio", slot: 0, required: true }

data_inputs:
  - name: "Cast"
    slot: 0
    schema:
      - { name: pos,    type: float3 }
      - { name: radius, type: float }
      - { name: rot,    type: float4 }
      - { name: dims,   type: float3 }
      - { name: role,   type: float }
      - { name: tint,   type: float3 }
      - { name: mat,    type: float }
      - { name: p0,     type: float }
      - { name: p1,     type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }
      - { name: flags,  type: float }
      - { name: aux,    type: float3 }

parameters:
  # EXPLORATION AXIS: how the pelt's strand field is generated. Structural, so it is a
  # shipped enum rather than a throwaway variant.
  - name: fur_style
    display: "Fur Style"
    type: enum
    options: [Combed, Radial, Frizz]
    default: 0
    flags: button_grid
    group: "Pelt"
  - { name: fur_shade, display: "Pelt Shade", type: float, min: 0.0, max: 4.0, default: 0.55, group: "Pelt" }
  - { name: fur_spec,  display: "Strand Sheen", type: float, min: 0.0, max: 4.0, default: 1.8, group: "Pelt" }

  # Iridescence is shared by the pelt, the glass and the chips: one dispersion language for
  # the whole image. The pelt's GAIN comes from the hero record, because the plan owns it.
  - { name: irid_phase,  display: "Spectral Phase",  type: float, min: 0.0, max: 1.0, default: 0.25, group: "Dispersion" }
  - { name: irid_spread, display: "Spectral Spread", type: float, min: 0.0, max: 0.9, default: 0.35, group: "Dispersion" }
  - { name: irid_sat,    display: "Spectral Saturation", type: float, min: 0.0, max: 1.0, default: 0.95, group: "Dispersion" }
  - { name: glass_rim,        display: "Glass Edge",  type: float, min: 0.0, max: 4.0, default: 2.000000, group: "Dispersion" }
  - { name: glass_dispersion, display: "Glass Split", type: float, min: 0.0, max: 0.9, default: 0.3, group: "Dispersion" }

  - { name: irid_bands, display: "Pelt Bands",  type: float, min: 0.0, max: 6.0,  default: 2.8,  group: "Dispersion" }
  - { name: irid_drift, display: "Spectral Drift", type: float, min: 0.0, max: 0.30, default: 0.03, group: "Dispersion" }

  # EXPLORATION AXIS: how the membrane hangs.
  - name: film_form
    display: "Drape Form"
    type: enum
    options: [Drape, Furl, Sheet]
    default: 0
    flags: button_grid
    group: "Membrane"
  - { name: film_opacity,  display: "Membrane Presence", type: float, min: 0.0, max: 3.0,  default: 0.85, group: "Membrane" }
  - { name: film_refract,  display: "Refraction",        type: float, min: 0.0, max: 3.0,  default: 0.8, group: "Membrane" }
  - { name: film_grain,    display: "Thickness Grain",   type: float, min: 0.1, max: 6.0,  default: 3.2, group: "Membrane" }
  - { name: film_flare,    display: "Edge Flare",        type: float, min: 0.0, max: 6.0,  default: 0.25, group: "Membrane" }
  - { name: film_edge_aa,  display: "Edge Softness",      type: float, min: 0.2, max: 4.0,  default: 1.3, group: "Membrane" }
  - { name: film_undulate, display: "Undulation",        type: float, min: 0.0, max: 4.0,  default: 0.227, group: "Membrane" }
  - { name: film_steps,    display: "Membrane Steps",    type: int,   min: 16,  max: 160,  default: 72,   group: "Quality" }

  - { name: gem_facets, display: "Chip Facets", type: float, min: 0.5, max: 4.0, default: 1.000000, group: "Lattice" }
  - { name: gem_spark,  display: "Chip Glint",  type: float, min: 0.0, max: 6.0, default: 0.7, group: "Lattice" }

  - { name: floor_reflect, display: "Floor Reflection", type: float, min: 0.0, max: 3.0, default: 2.2, group: "Stage" }
  - { name: ao_amt,        display: "Ambient Occlusion", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Stage" }
  - { name: exposure,      display: "Exposure",         type: float, min: 0.1, max: 4.0, default: 1.000000, group: "Stage" }

  - { name: march_steps,    display: "March Steps",     type: int,   min: 32,     max: 256,   default: 110,    group: "Quality" }
  - { name: surface_eps,    display: "Surface Epsilon", type: float, min: 0.0002, max: 0.006, default: 0.0012, group: "Quality" }
  - { name: step_scale,     display: "Step Scale",      type: float, min: 0.30,   max: 1.0,   default: 0.8,   group: "Quality" }
  - { name: normal_eps,     display: "Normal Epsilon",  type: float, min: 0.0003, max: 0.010, default: 0.002, group: "Quality" }
  - { name: aa_samples,     display: "Rays Per Axis",   type: int,   min: 1,      max: 3,     default: 2,      group: "Quality" }
  - { name: reflect_bounce, display: "Scene Reflections", type: int, min: 0,      max: 1,     default: 1,      group: "Quality" }
  - { name: reflect_steps,  display: "Reflection Steps", type: int,  min: 8,      max: 96,    default: 42,     group: "Quality" }

passes:
  - name: solids
    shader: solids.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "input:0" }
  # The membrane is a second pass in THIS module rather than its own node: it needs the
  # resolved opaque colour and depth to composite and occlude against, and it shares the one
  # injected internal camera. Two camera-capable renderer nodes would have forced an external
  # camera rig for no gain.
  - name: film
    shader: film.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "input:0" }
      - { slot: 2, source: "pass:solids" }

outputs:
  - { name: "Beauty", pass: film }
