name: "PR Post"
version: "0.1"
working_format: RGBA16F

# The finish. Deliberately a separate node from the renderer: bloom, flare, aberration and
# grain are LENS and film properties, not scene properties, and keeping them out of the
# marcher means the renderer's preview stays an honest picture of what it actually computed.
#
# Full resolution throughout rather than a half-res bloom chain. The renderer is by far the
# expensive node here, so the pixels are affordable, and it avoids the scaled-pass
# coordinate trap entirely.

inputs:
  - { name: "Beauty", slot: 0, required: true }

parameters:
  # ---- lens blur ---------------------------------------------------------------
  # Depth arrives in the renderer's alpha channel. focus_dist is in WORLD units and the
  # camera sits at z = 12, so the hero at z = 0 is 12 away — that is the default.
  - { name: dof_amount,      display: "Lens Blur",       type: float, min: 0.0,  max: 48.0, default: 11.000000,  group: "Lens Blur" }
  - { name: focus_dist,      display: "Focus Distance",  type: float, min: 1.0,  max: 30.0, default: 12.000000, group: "Lens Blur" }
  - { name: focus_near,      display: "Near Falloff",    type: float, min: 0.05, max: 20.0, default: 2.4,  group: "Lens Blur" }
  - { name: focus_far,       display: "Far Falloff",     type: float, min: 0.05, max: 20.0, default: 3.2,  group: "Lens Blur" }
  - { name: dof_far_void,    display: "Backdrop Blur",   type: float, min: 0.0,  max: 1.0,  default: 0.425, group: "Lens Blur" }
  - { name: bokeh_highlight, display: "Bokeh Highlight", type: float, min: 0.0,  max: 8.0,  default: 3.937,  group: "Lens Blur" }
  - { name: dof_taps,        display: "Bokeh Quality",   type: int,   min: 8,    max: 96,   default: 40,   group: "Lens Blur" }
  - name: bokeh_shape
    display: "Bokeh Shape"
    type: enum
    options: [Circle, Hexagon, Anamorphic]
    default: 1
    flags: button_grid
    group: "Lens Blur"

  - name: debug_view
    display: "Diagnostic View"
    type: enum
    options: [Off, Depth, Focus]
    default: 0
    flags: button_grid
    group: "Lens Blur"

  # ---- antialiasing ------------------------------------------------------------
  # This handles EDGES. The pelt's high-frequency noise needs rays, not a filter — raise
  # "Rays Per Axis" on PR_Render for that.
  - name: aa_mode
    display: "Edge AA"
    type: enum
    options: [Off, Standard, High, Ultra]
    default: 1
    flags: button_grid
    group: "Antialiasing"
  # Two chained passes beats one strong pass: pass 1 turns a hard step into a ramp, pass 2
  # smooths the ramp. Raising a single pass's strength only blends the original step further
  # into its neighbours — blurrier, not smoother.
  - { name: aa_iterations, display: "AA Iterations",    type: int,   min: 1,     max: 2,    default: 2,      group: "Antialiasing" }
  # 0 = short filter only, which is the safe default. Raise it to chase long shallow
  # diagonals; it trades sharpness for smoothness, so watch the pelt when you do.
  - { name: aa_search,     display: "AA Edge Search",   type: int,   min: 0,     max: 16,   default: 0,      group: "Antialiasing" }
  - { name: aa_strength,  display: "AA Strength",       type: float, min: 0.0,   max: 1.0,  default: 1.000000,  group: "Antialiasing" }
  - { name: aa_threshold, display: "AA Edge Threshold", type: float, min: 0.002, max: 0.20, default: 0.02, group: "Antialiasing" }
  - { name: aa_relative,  display: "AA Relative Gate",  type: float, min: 0.0,   max: 0.50, default: 0.11, group: "Antialiasing" }

  - { name: bloom_threshold, display: "Bloom Threshold", type: float, min: 0.0, max: 4.0,  default: 1.25, group: "Bloom" }
  - { name: bloom_knee,      display: "Bloom Knee",      type: float, min: 0.01, max: 2.0, default: 0.55, group: "Bloom" }
  - { name: bloom_radius,    display: "Bloom Radius",    type: float, min: 0.5, max: 24.0, default: 7.000000, group: "Bloom" }
  - { name: bloom_gain,      display: "Bloom Gain",      type: float, min: 0.0, max: 4.0,  default: 0.38, group: "Bloom" }

  - { name: star_gain,   display: "Flare Gain",   type: float, min: 0.0, max: 3.0,   default: 0.022, group: "Flare" }
  - { name: star_length, display: "Flare Length", type: float, min: 0.0, max: 0.35,  default: 0.045, group: "Flare" }
  - { name: star_decay,  display: "Flare Decay",  type: float, min: 0.5, max: 0.98,  default: 0.86, group: "Flare" }
  - { name: star_rotate, display: "Flare Angle",  type: float, min: -90.0, max: 90.0, default: 0.000000, group: "Flare" }
  - name: star_arms
    display: "Flare Arms"
    type: enum
    options: [Cross, Starburst]
    default: 0
    flags: button_grid
    group: "Flare"

  - { name: aberration,    display: "Aberration",   type: float, min: 0.0, max: 4.0, default: 0.9, group: "Lens" }
  - { name: vignette,      display: "Vignette",     type: float, min: 0.0, max: 1.0, default: 0.62, group: "Lens" }
  - { name: grain,         display: "Grain",        type: float, min: 0.0, max: 2.0, default: 0.35, group: "Lens" }

  - { name: exposure_post, display: "Exposure",   type: float, min: 0.1, max: 4.0, default: 1.08, group: "Grade" }
  - { name: contrast,      display: "Contrast",   type: float, min: 0.0, max: 1.0, default: 0.35, group: "Grade" }
  - { name: saturation,    display: "Saturation", type: float, min: 0.0, max: 2.0, default: 1.06, group: "Grade" }
  - { name: lift,          display: "Lift",       type: float, min: -1.0, max: 1.0, default: 0.000000, group: "Grade" }

passes:
  # The lens defocus runs FIRST, on the HDR image with depth still in alpha. Bloom and flare
  # are glare produced BY the lens, so they must be drawn from the already-defocused image —
  # blooming a sharp image and then blurring it puts crisp glow around soft objects.
  - name: dof
    shader: dof.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
  - name: bright
    shader: bright.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:dof" }
  - name: blur_h
    shader: blur_h.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:bright" }
  - name: blur_v
    shader: blur_v.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:blur_h" }
  - name: star
    shader: star.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:bright" }
  - name: grade
    shader: grade.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:dof" }
      - { slot: 1, source: "pass:blur_v" }
      - { slot: 2, source: "pass:star" }
  # AA last, on the graded LDR image — edge detection wants perceptual contrast, not linear
  # radiance.
  - name: aa
    shader: aa.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:grade" }
  - name: aa2
    shader: aa2.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:aa" }

outputs:
  - { name: "Program", pass: aa2 }
