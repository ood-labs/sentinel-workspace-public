name: "Blob Layout"
version: "0.1"
mode: generator
resolution: [480, 720]

# Authors the BlobPart buffer for strata plate 1 (the glossy organic mass). Hand-dialed
# woven column in basePart(); external transforms (spread/jitter/seed/lift/size) drive
# infinite variation from ordinary parameter and preset control.

buffers:
  - name: parts
    structured: true
    element_size: 64
    element_count: 128

parameters:
  - { name: palette_variant, display: "Palette", type: int, min: 0, max: 4, default: 0, hidden: true, group: "Arrange" }
  - { name: spread,   display: "Spread",   type: float, min: 0.4, max: 2.0, default: 1.0, group: "Arrange" }
  - { name: jitter,   display: "Jitter",   type: float, min: 0.0, max: 2.0, default: 0.0, group: "Arrange" }
  - { name: seed,     display: "Seed",     type: float, min: 0.0, max: 50.0, default: 1.0, group: "Arrange" }
  - { name: lift,     display: "Lift Y",   type: float, min: -3.0, max: 3.0, default: 0.0, group: "Arrange" }
  - { name: size_mul, display: "Size",     type: float, min: 0.5, max: 1.8, default: 1.0, group: "Arrange" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [2, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:parts"
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:parts" }

data_outputs:
  - name: "Parts"
    buffer: "parts"
    schema:
      - { name: pos_xy, type: float2 }
      - { name: sc_xy, type: float2 }
      - { name: pos_z, type: float }
      - { name: sc_z, type: float }
      - { name: yaw, type: float }
      - { name: tilt, type: float }
      - { name: roll, type: float }
      - { name: kind, type: float }
      - { name: mat, type: float }
      - { name: group, type: float }
      - { name: colA, type: float }
      - { name: colB, type: float }
      - { name: grad, type: float }
      - { name: active, type: float }

outputs:
  - { name: "Preview", pass: preview }
