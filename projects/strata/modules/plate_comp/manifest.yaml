name: "Plate Comp"
version: "0.1"
mode: generator
resolution: [720, 1080]

# strata multi-plate compositor. Inputs bottom->top: 0 bg (opaque), 1 blobs, 2 marble,
# 3 wire, 4 marks — all premultiplied except bg. Per-plate gain + blend mode.

inputs:
  - { name: "BG",     slot: 0, required: true }
  - { name: "Blobs",  slot: 1, required: false }
  - { name: "Marble", slot: 2, required: false }
  - { name: "Wire",   slot: 3, required: false }
  - { name: "Marks",  slot: 4, required: false }

parameters:
  - { name: bg_gain,     display: "BG Gain",     type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: blob_gain,   display: "Blobs Gain",  type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - name: blob_mode
    display: "Blobs Mode"
    type: enum
    options: [Over, Add, Screen]
    default: 0
    flags: button_grid
    group: "Comp"
  - { name: marble_gain, display: "Marble Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - name: marble_mode
    display: "Marble Mode"
    type: enum
    options: [Over, Add, Screen]
    default: 0
    flags: button_grid
    group: "Comp"
  - { name: wire_gain,   display: "Wire Gain",   type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - name: wire_mode
    display: "Wire Mode"
    type: enum
    options: [Over, Add, Screen]
    default: 0
    flags: button_grid
    group: "Comp"
  - { name: marks_gain,  display: "Marks Gain",  type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - name: marks_mode
    display: "Marks Mode"
    type: enum
    options: [Over, Add, Screen]
    default: 0
    flags: button_grid
    group: "Comp"

passes:
  - name: comp
    shader: comp.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }

outputs:
  - { name: "Comp", pass: comp }
