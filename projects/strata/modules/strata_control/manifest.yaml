name: "Strata Composition Desk"
version: "2.0"
mode: generator
resolution: [960, 540]
working_format: RGBA8

panel:
  mode: canvas
  output: "Composition Desk"
  resolution: follow_panel

data_inputs:
  - name: "Feature Corners"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }

parameters:
  - { name: master_seed, display: "Master Seed", type: float, min: 0.0, max: 50.0, default: 12.0, group: "Composition" }
  - { name: palette_variant, display: "Palette", type: int, min: 0, max: 4, default: 0, group: "Composition" }
  - { name: melt_macro, display: "Melt", type: float, min: 0.0, max: 1.0, default: 0.5, group: "Distortion" }
  - { name: twist_macro, display: "Twist", type: float, min: 0.0, max: 1.0, default: 0.4, group: "Distortion" }
  - { name: marble_warp_macro, display: "Marble Warp", type: float, min: 0.0, max: 2.5, default: 1.0, group: "Distortion" }
  - { name: spread_macro, display: "Spread", type: float, min: 0.4, max: 2.0, default: 1.0, group: "Layout" }
  - { name: wire_scale_macro, display: "Wire Scale", type: float, min: 0.4, max: 2.0, default: 0.82, group: "Layout" }
  - { name: blob_mix, display: "Sculpture Plate", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Plate Mix" }
  - { name: marble_mix, display: "Marble Plate", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Plate Mix" }
  - { name: wire_mix, display: "Wire Plate", type: float, min: 0.0, max: 2.0, default: 0.0, group: "Plate Mix" }
  - { name: marks_mix, display: "Graphic Marks", type: float, min: 0.0, max: 2.0, default: 0.584, group: "Plate Mix" }
  - { name: feature_enabled, display: "Feature Thread", type: bool, default: true, group: "Features" }
  - { name: feature_gain, display: "Thread Gain", type: float, min: 0.0, max: 2.0, default: 0.688, group: "Features" }

viewport:
  hint: "Gray/red composition desk for deterministic seeds, shared palette, plate balance, distortion macros, and the live Features thread. Drag the marble plate itself in its own viewport."
  # ui-label: title = STRATA COMPOSITION DESK
  # ui-label: subtitle = PLATE SYSTEM / PREMULTIPLIED ALPHA
  # ui-label: composition = COMPOSITION
  # ui-label: seed = MASTER SEED
  # ui-label: palette = PALETTE
  # ui-label: atelier = ATELIER
  # ui-label: chrome = CHROME
  # ui-label: poster = POSTER
  # ui-label: cage = CAGE
  # ui-label: mono = MONO
  # ui-label: distortion = DISTORTION
  # ui-label: melt = MELT
  # ui-label: twist = TWIST
  # ui-label: marble = MARBLE WARP
  # ui-label: spread = SPREAD
  # ui-label: wire_scale = WIRE SCALE
  # ui-label: plate_mix = PLATE MIX
  # ui-label: sculpture = SCULPTURE
  # ui-label: marble_plate = MARBLE
  # ui-label: wire = WIRE
  # ui-label: marks = MARKS
  # ui-label: features = FEATURE THREAD
  # ui-label: corners = CORNERS
  controls:
    - { id: master_seed, kind: slider, param: master_seed, rect: [0.060, 0.245, 0.455, 0.305], label: "Master Seed" }
    - { id: palette_variant, kind: slider, param: palette_variant, rect: [0.060, 0.395, 0.455, 0.455], label: "Palette" }
    - { id: melt_macro, kind: slider, param: melt_macro, rect: [0.060, 0.565, 0.245, 0.625], label: "Melt" }
    - { id: twist_macro, kind: slider, param: twist_macro, rect: [0.270, 0.565, 0.455, 0.625], label: "Twist" }
    - { id: marble_warp_macro, kind: slider, param: marble_warp_macro, rect: [0.060, 0.705, 0.455, 0.765], label: "Marble Warp" }
    - { id: spread_macro, kind: slider, param: spread_macro, rect: [0.060, 0.850, 0.245, 0.910], label: "Spread" }
    - { id: wire_scale_macro, kind: slider, param: wire_scale_macro, rect: [0.270, 0.850, 0.455, 0.910], label: "Wire Scale" }
    - { id: blob_mix, kind: slider, param: blob_mix, rect: [0.550, 0.250, 0.920, 0.310], label: "Sculpture Plate" }
    - { id: marble_mix, kind: slider, param: marble_mix, rect: [0.550, 0.380, 0.920, 0.440], label: "Marble Plate" }
    - { id: wire_mix, kind: slider, param: wire_mix, rect: [0.550, 0.510, 0.920, 0.570], label: "Wire Plate" }
    - { id: marks_mix, kind: slider, param: marks_mix, rect: [0.550, 0.640, 0.920, 0.700], label: "Graphic Marks" }
    - { id: feature_enabled, kind: toggle, param: feature_enabled, rect: [0.550, 0.825, 0.650, 0.900], label: "Feature Thread" }
    - { id: feature_gain, kind: slider, param: feature_gain, rect: [0.685, 0.825, 0.920, 0.900], label: "Thread Gain" }

buffers:
  - { name: ctrl, structured: true, element_size: 64, element_count: 1 }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
    output: "buffer:ctrl"
  - name: display
    shader: display.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:ctrl" }
    output: output

outputs:
  - { name: "Composition Desk", pass: display }

control_outputs:
  - { name: seed, buffer: ctrl, element: 0, field_offset: 0, description: "Master seed 0-50" }
  - { name: melt, buffer: ctrl, element: 0, field_offset: 4, description: "Melt macro 0-1" }
  - { name: twist, buffer: ctrl, element: 0, field_offset: 8, description: "Twist macro 0-1" }
  - { name: marble_warp, buffer: ctrl, element: 0, field_offset: 12, description: "Marble warp 0-2.5" }
  - { name: spread, buffer: ctrl, element: 0, field_offset: 16, description: "Layout spread 0.4-2" }
  - { name: wire_scale, buffer: ctrl, element: 0, field_offset: 20, description: "Wire scale 0.4-2" }
  - { name: palette, buffer: ctrl, element: 0, field_offset: 24, description: "Shared palette variant 0-4" }
  - { name: blob_mix, buffer: ctrl, element: 0, field_offset: 28, description: "Sculpture plate gain" }
  - { name: marble_mix, buffer: ctrl, element: 0, field_offset: 32, description: "Marble plate gain" }
  - { name: wire_mix, buffer: ctrl, element: 0, field_offset: 36, description: "Wire plate gain" }
  - { name: marks_mix, buffer: ctrl, element: 0, field_offset: 40, description: "Graphic marks gain" }
  - { name: feature_enabled, buffer: ctrl, element: 0, field_offset: 44, description: "Feature thread enabled state" }
  - { name: feature_gain, buffer: ctrl, element: 0, field_offset: 48, description: "Feature thread visual gain" }
  - { name: feature_count, buffer: ctrl, element: 0, field_offset: 52, description: "Live feature corner record count" }
