name: "Feature Analysis Downscale"
version: "1.0"
mode: generator
resolution: [320, 480]

inputs:
  - { name: "Full Resolution Plate", slot: 0, required: true }

viewport:
  hint: "320 x 480 portrait analysis proxy for Features; the full-resolution Program bypasses this node."

passes:
  - name: downscale
    shader: downscale.hlsl
    target: ps_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - { name: "Analysis 320 x 480", pass: downscale }
