name: "Pattern Canvas"
version: "1.0"
mode: generator
resolution: [1080, 1350]
working_format: RGBA16F
time_dependent: true

inputs:
  - { name: "Generated Subject", slot: 0, required: true }
  - { name: "Subject Matte", slot: 1, required: true }
  - { name: "Subject Depth", slot: 2, required: true }

buffers:
  - { name: canvas, format: RGBA16F, scale: 1.0, persistent: true }
  - { name: depth_canvas_masked, format: RGBA16F, scale: 1.0, persistent: true }
  - { name: stamp_subject, format: RGBA8, scale: 1.0, persistent: true }
  - { name: stamp_matte, format: RGBA8, scale: 1.0, persistent: true }
  - { name: stamp_depth, format: RGBA16F, scale: 1.0, persistent: true }
  - { name: trace_schedule, format: RGBA16F, scale: 0.5, persistent: true }
  - { name: stamp_pose, structured: true, element_size: 32, element_count: 1, persistent: true }
  - { name: canvas_state, structured: true, element_size: 16, element_count: 1, persistent: true }
  - { name: spawn_points, structured: true, element_size: 16, element_count: 64, persistent: true }

parameters:
  - { name: run, display: "Run", type: bool, default: true, group: "Spawn" }
  - { name: spawn_seconds, display: "Seconds Per Stamp", type: float, min: 0.05, max: 2.0, default: 0.18, group: "Spawn" }
  - { name: sync_generation, display: "Sync Generation", type: float, min: 0.0, max: 1.0, default: 0.0, hidden: true, group: "Spawn" }
  - { name: external_cycle, display: "External Cycle", type: float, min: 0.0, max: 16777215.0, default: 0.0, hidden: true, group: "Spawn" }
  - { name: clear_toggle, display: "Clear Canvas", type: bool, default: false, group: "Spawn" }

  - { name: feedback_enabled, display: "Feedback", type: bool, default: false, group: "Feedback" }
  - { name: zoom, display: "Zoom Speed", type: float, min: -0.5, max: 0.5, default: 0.10, group: "Feedback" }
  - { name: feedback_rotation_speed, display: "Rotation Speed", type: float, min: -180.0, max: 180.0, default: 0.0, group: "Feedback" }
  - { name: pan, display: "Drift", type: point2D, min: [-0.2, -0.2], max: [0.2, 0.2], default: [0.0, 0.0], group: "Feedback" }
  - { name: control_gain, display: "Control Gain", type: float, min: 1.0, max: 10.0, default: 5.0, group: "Feedback" }
  - { name: feedback_pivot, display: "Pivot", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.5, 0.5], group: "Feedback" }
  - { name: feedback_fade, display: "Trail Fade", type: float, min: 0.0, max: 4.0, default: 0.12, group: "Feedback" }
  - { name: feedback_edge_mode, display: "Edges", type: enum, options: [Background, Clamp, Repeat, Mirror], flags: button_grid, default: 0, group: "Feedback" }

  - { name: pattern_mode, display: "Pattern", type: enum, options: [Random, Grid, Spiral, Wave, Border], flags: button_grid, default: 0, group: "Pattern" }
  - { name: pattern_count, display: "Pattern Count", type: int, min: 4, max: 36, default: 16, group: "Pattern" }
  - { name: pattern_phase, display: "Pattern Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Pattern" }
  - { name: seed, display: "Seed", type: float, min: 0.0, max: 100.0, default: 7.0, group: "Pattern" }
  - { name: position_jitter, display: "Position Jitter", type: float, min: 0.0, max: 0.35, default: 0.035, group: "Pattern" }
  # Shrinks the region stamps spawn into without shrinking the canvas or the
  # stamps themselves, so a large canvas can carry a smaller cluster of stamps
  # with real empty margin around it. Normalized, so on a wide canvas the same
  # factor buys more absolute margin on the long axis than the short one.
  - { name: spawn_area, display: "Spawn Area", type: float, min: 0.05, max: 1.0, default: 1.0, group: "Pattern", description: "Contracts every placement mode toward the canvas centre. 1.0 spawns across the full canvas as before; 0.6 confines stamps to the middle 60 percent and leaves a clear margin on all sides. Applied after position jitter and the per-mode insets, so it is the final word on where a stamp can land. It does not change stamp size - use Scale for that." }
  - { name: follow_pattern, display: "Follow Pattern", type: bool, default: true, group: "Pattern" }

  - { name: cutout_scale, display: "Scale", type: float, min: 0.05, max: 0.70, default: 0.24, group: "Stamp" }
  # Width-over-height of the subject feeding "Generated Subject". This cannot be
  # read from the texture: the host conforms module inputs to this module's own
  # resolution, so GetDimensions returns the canvas size and every stamp would
  # inherit the canvas aspect. 1.0 matches the square 1280x1280 diffusion output.
  - { name: stamp_aspect, display: "Stamp Aspect", type: float, min: 0.25, max: 4.0, default: 1.0, group: "Stamp", description: "Width divided by height of the incoming subject, used to shape the stamp rectangle. Set it to match the generator feeding Generated Subject - 1.0 for a square 1280x1280 StreamDiff output, 1.777 for 16:9, 0.8 for a 4:5 portrait. It must be stated rather than measured because the host resizes module inputs to the module's own resolution, which would otherwise make stamps stretch whenever the canvas aspect changes." }
  - { name: scale_variation, display: "Scale Variation", type: float, min: 0.0, max: 0.85, default: 0.22, group: "Stamp" }
  - { name: rotation, display: "Rotation", type: float, min: -180.0, max: 180.0, default: 0.0, group: "Stamp" }
  - { name: rotation_jitter, display: "Rotation Jitter", type: float, min: 0.0, max: 360.0, default: 28.0, group: "Stamp" }
  - { name: opacity, display: "Opacity", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Stamp" }
  - { name: reveal_sequence, display: "Three-Frame Reveal", type: bool, default: false, flags: button, group: "Stamp" }
  - { name: reveal_border, display: "Reveal Border", type: float, min: 0.0, max: 0.25, default: 0.08, group: "Stamp" }
  - { name: latest_outline_delay, display: "Trace Delay", type: float, min: 0.0, max: 0.5, default: 0.14, group: "Stamp/Laser", description: "Wait after each new stamp before its laser trace appears. Every hit is latched into an independent schedule lane, so the next stamp cannot cancel this delay." }
  - { name: latest_outline_hold, display: "Trace Visible Time", type: float, min: 0.06, max: 0.5, default: 0.12, group: "Stamp/Laser", description: "How long each hit's complete binary outline remains visible. This directly controls the physical laser trace duration." }
  - { name: latest_outline_fade, display: "Legacy Trace Tail", type: float, min: 0.01, max: 5.0, default: 0.01, group: "Stamp/Laser", hidden: true }

  - { name: depth_fade, display: "Fade Rate", type: float, min: 0.0, max: 8.0, default: 0.35, group: "Depth Accumulation" }
  - { name: depth_gain, display: "Stamp Gain", type: float, min: 0.0, max: 4.0, default: 1.0, group: "Depth Accumulation" }
  - { name: depth_offset, display: "Stamp Offset", type: float, min: -1.0, max: 1.0, default: 0.0, group: "Depth Accumulation" }

  - { name: background_color, display: "Background", type: color, default: [0.94, 0.94, 0.92], group: "Canvas" }
  - { name: matte_threshold, display: "Matte Threshold", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Canvas" }
  - { name: matte_feather, display: "Matte Feather", type: float, min: 0.001, max: 0.30, default: 0.08, group: "Canvas" }
  - { name: drop_shadow, display: "Drop Shadow", type: float, min: 0.0, max: 1.5, default: 0.28, group: "Canvas" }

viewport:
  hint: "Left-drag adjusts drift. Wheel adjusts zoom. Run and stamp cadence are in Properties."
  interactions: [pan_zoom]

passes:
  - name: state_update
    shader: state_update.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:canvas_state" }
    output: "buffer:canvas_state"

  - name: capture_subject
    shader: capture_stamp.hlsl
    target: cs_5_0
    format: RGBA8
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:stamp_subject" }
      - { slot: 2, source: "buffer:canvas_state" }
    output: "buffer:stamp_subject"

  - name: stamp_pose_update
    shader: stamp_pose.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:stamp_pose" }
      - { slot: 1, source: "buffer:canvas_state" }
    output: "buffer:stamp_pose"

  - name: capture_matte
    shader: capture_stamp.hlsl
    target: cs_5_0
    format: RGBA8
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:1" }
      - { slot: 1, source: "buffer:stamp_matte" }
      - { slot: 2, source: "buffer:canvas_state" }
    output: "buffer:stamp_matte"

  - name: capture_depth
    shader: capture_stamp.hlsl
    target: cs_5_0
    format: RGBA16F
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:2" }
      - { slot: 1, source: "buffer:stamp_depth" }
      - { slot: 2, source: "buffer:canvas_state" }
    output: "buffer:stamp_depth"

  - name: trace_schedule_update
    shader: trace_schedule.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:trace_schedule" }
      - { slot: 1, source: "buffer:stamp_matte" }
      - { slot: 2, source: "buffer:stamp_pose" }
      - { slot: 3, source: "buffer:canvas_state" }
    output: "buffer:trace_schedule"

  - name: accumulate
    shader: accumulate.hlsl
    target: cs_5_0
    format: RGBA16F
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:stamp_subject" }
      - { slot: 1, source: "buffer:stamp_matte" }
      - { slot: 2, source: "buffer:canvas" }
      - { slot: 3, source: "buffer:canvas_state" }
      - { slot: 4, source: "buffer:stamp_pose" }
    output: "buffer:canvas"

  - name: accumulate_depth
    shader: accumulate_depth.hlsl
    target: cs_5_0
    format: RGBA16F
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:stamp_depth" }
      - { slot: 1, source: "buffer:stamp_matte" }
      - { slot: 2, source: "buffer:depth_canvas_masked" }
      - { slot: 3, source: "buffer:canvas_state" }
      - { slot: 4, source: "buffer:stamp_pose" }
    output: "buffer:depth_canvas_masked"

  - name: spawn_points_update
    shader: spawn_points.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:canvas_state" }
    output: "buffer:spawn_points"

  - name: present
    shader: present.hlsl
    target: cs_5_0
    format: RGBA8
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:canvas" }
    output: output

  - name: present_depth
    shader: present_depth.hlsl
    target: cs_5_0
    format: RGBA8
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:depth_canvas_masked" }

  - name: present_latest_stamp
    shader: present_latest_stamp.hlsl
    target: cs_5_0
    format: RGBA8
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:trace_schedule" }

data_outputs:
  - name: "Spawn Points"
    buffer: "spawn_points"
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: sequence, type: uint }
      - { name: active, type: uint }

outputs:
  - { name: "Pattern Canvas", pass: present }
  - { name: "Accumulated Depth", pass: present_depth }
  - { name: "Latest Stamp Mask", pass: present_latest_stamp }
