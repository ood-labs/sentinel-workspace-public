name: "Steel Lattice"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F   # linear HDR out so the mono_post bloom has highlight headroom
features: [camera]

# NOTE: defaults below are baked from a dialed-in look (2026-07-05). Edit freely.

parameters:
  # ---- structure (all real world-unit dimensions) ----
  - { name: cell,      display: "Grid Spacing (XZ)", type: float, min: 1.5, max: 12.0, default: 6.0,   group: "Structure" }
  - { name: floor_h,   display: "Floor Height (Y)",  type: float, min: 1.5, max: 12.0, default: 4.0,   group: "Structure" }
  - { name: col_thick, display: "Column Half-Width", type: float, min: 0.05, max: 1.5, default: 0.42,  group: "Structure" }
  - { name: beam_w,    display: "Beam Half-Width",   type: float, min: 0.05, max: 1.0, default: 0.248, group: "Structure" }
  - { name: beam_h,    display: "Beam Half-Height",  type: float, min: 0.05, max: 1.2, default: 0.392, group: "Structure" }

  # ---- look ----
  - { name: steel_color, display: "Steel Color", type: color, default: [0.52, 0.51, 0.49], group: "Look" }
  - { name: fog_density, display: "Fog / Depth Falloff", type: float, min: 0.0, max: 2.0, default: 0.7, group: "Look" }
  - { name: spec_amt,    display: "Specular",     type: float, min: 0.0, max: 1.0, default: 0.22, group: "Look" }
  - { name: shadows,     display: "Sun Shadows",  type: bool, default: true, flags: button, group: "Look" }
  - { name: march_dist,  display: "March Distance", type: float, min: 20.0, max: 200.0, default: 63.66, group: "Look" }

  # ---- ray-march quality (defaults preserve the authored look) ----
  # AA is per axis: 4 casts 4x4 = 16 rays per output pixel.
  - { name: aa_samples,     display: "Rays Per Axis (NxN)", type: int,   min: 1,      max: 8,     default: 4,      group: "Quality" }
  - { name: march_steps,    display: "March Steps",         type: int,   min: 32,     max: 256,   default: 160,    group: "Quality" }
  - { name: surface_epsilon,display: "Surface Epsilon",     type: float, min: 0.0001, max: 0.002, default: 0.0006, group: "Quality" }
  - { name: step_scale,     display: "Step Scale",          type: float, min: 0.5,    max: 1.0,   default: 0.82,   group: "Quality" }
  - { name: normal_epsilon, display: "Normal Epsilon",      type: float, min: 0.0002, max: 0.004, default: 0.0009, group: "Quality" }

  # ---- Living Room-style world-space SDF distortion ----
  # Master defaults off so existing projects and presets render exactly as authored.
  - { name: fx_amount, display: "Distortion Master", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Distortion" }
  - { name: fx_speed, display: "Time Speed", type: float, min: 0.0, max: 3.0, default: 0.6, group: "Distortion" }
  - { name: melt_amt, display: "Melt", type: float, min: 0.0, max: 3.0, default: 0.85, group: "Distortion" }

  - { name: w1_amt, display: "Amount", type: float, min: 0.0, max: 3.0, default: 0.5, group: "Distortion/Warp 1" }
  - name: w1_mode
    display: "Mode"
    type: enum
    options: [Flow, Ripple, Turbulent, Fractal, Steps, Boxes, Shatter]
    default: 0
    flags: button_grid
    group: "Distortion/Warp 1"
  - { name: w1_freq, display: "Frequency", type: float, min: 0.2, max: 4.0, default: 1.0, group: "Distortion/Warp 1" }
  - { name: w1_speed, display: "Speed", type: float, min: 0.0, max: 3.0, default: 0.6, group: "Distortion/Warp 1" }
  - { name: w1_yaw, display: "Yaw", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Distortion/Warp 1" }
  - { name: w1_pitch, display: "Pitch", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Distortion/Warp 1" }
  - { name: w1_ox, display: "Offset X", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Warp 1" }
  - { name: w1_oy, display: "Offset Y", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Warp 1" }
  - { name: w1_oz, display: "Offset Z", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Warp 1" }

  - { name: w2_amt, display: "Amount", type: float, min: 0.0, max: 3.0, default: 0.0, group: "Distortion/Warp 2" }
  - name: w2_mode
    display: "Mode"
    type: enum
    options: [Flow, Ripple, Turbulent, Fractal, Steps, Boxes, Shatter]
    default: 2
    flags: button_grid
    group: "Distortion/Warp 2"
  - { name: w2_freq, display: "Frequency", type: float, min: 0.2, max: 4.0, default: 1.8, group: "Distortion/Warp 2" }
  - { name: w2_speed, display: "Speed", type: float, min: 0.0, max: 3.0, default: 0.9, group: "Distortion/Warp 2" }
  - { name: w2_yaw, display: "Yaw", type: float, min: -3.15, max: 3.15, default: 1.57, group: "Distortion/Warp 2" }
  - { name: w2_pitch, display: "Pitch", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Distortion/Warp 2" }
  - { name: w2_ox, display: "Offset X", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Warp 2" }
  - { name: w2_oy, display: "Offset Y", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Warp 2" }
  - { name: w2_oz, display: "Offset Z", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Warp 2" }

  - { name: twist_amt, display: "Twist", type: float, min: -2.0, max: 2.0, default: 0.0, group: "Distortion/Deform" }
  - { name: bend_amt, display: "Bend", type: float, min: -1.5, max: 1.5, default: 0.0, group: "Distortion/Deform" }
  - { name: swirl_amt, display: "Swirl", type: float, min: -3.0, max: 3.0, default: 0.0, group: "Distortion/Deform" }
  - { name: wave_amt, display: "Wave", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Distortion/Deform" }
  - { name: wave_freq, display: "Wave Frequency", type: float, min: 0.5, max: 8.0, default: 2.0, group: "Distortion/Deform" }
  - { name: dist_cx, display: "Center X", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Center" }
  - { name: dist_cy, display: "Center Y", type: float, min: -8.0, max: 8.0, default: 1.0, group: "Distortion/Center" }
  - { name: dist_cz, display: "Center Z", type: float, min: -8.0, max: 8.0, default: 0.0, group: "Distortion/Center" }

  # ---- panels (coffered formwork carved as REAL recessed grooves in the SDF) ----
  - name: panels_on
    display: "Panels"
    type: enum
    options: [Off, On]
    default: 1
    flags: button_grid
    group: "Panels"
  - { name: panel_w,      display: "Panel Div (X/Z)", type: float, min: 0.2,   max: 3.0, default: 1.76,  group: "Panels" }
  - { name: panel_h,      display: "Panel Div (Y)",   type: float, min: 0.2,   max: 4.0, default: 3.586, group: "Panels" }
  - { name: panel_off_x,  display: "Offset X",        type: float, min: -6.0,  max: 6.0, default: 0.0,   group: "Panels" }
  - { name: panel_off_y,  display: "Offset Y",        type: float, min: -6.0,  max: 6.0, default: 0.238, group: "Panels" }
  - { name: panel_off_z,  display: "Offset Z",        type: float, min: -6.0,  max: 6.0, default: -5.449, group: "Panels" }
  - { name: flute_width,  display: "Flute Width (V)", type: float, min: 0.005, max: 0.25, default: 0.25,  group: "Panels" }
  - { name: flute_depth,  display: "Flute Depth (V)", type: float, min: 0.0,   max: 0.4,  default: 0.024, group: "Panels" }
  - { name: band_width,   display: "Band Width (H)",  type: float, min: 0.005, max: 0.3,  default: 0.077, group: "Panels" }
  - { name: band_depth,   display: "Band Depth (H)",  type: float, min: 0.0,   max: 0.5,  default: 0.064, group: "Panels" }
  - { name: member_round, display: "Edge Round",      type: float, min: 0.0,   max: 0.25, default: 0.061, group: "Panels" }

  # ---- junction hardware (real guard-banded SDF at each beam<->column node) ----
  - name: junctions_on
    display: "Junctions"
    type: enum
    options: [Off, On]
    default: 1
    flags: button_grid
    group: "Junctions"
  - { name: collar_out,   display: "Collar Out",   type: float, min: 0.0,  max: 0.6,  default: 0.187, group: "Junctions" }
  - { name: collar_h,     display: "Collar Height",type: float, min: 0.05, max: 1.5,  default: 0.359, group: "Junctions" }
  - { name: collar_round, display: "Collar Round", type: float, min: 0.0,  max: 0.2,  default: 0.03,  group: "Junctions" }
  - name: bolts_on
    display: "Bolts"
    type: enum
    options: [Off, On]
    default: 1
    flags: button_grid
    group: "Junctions"
  - { name: bolt_pitch,   display: "Bolt Pitch",   type: float, min: 0.08, max: 1.0,  default: 0.239, group: "Junctions" }
  - { name: bolt_radius,  display: "Bolt Radius",  type: float, min: 0.0,  max: 0.2,  default: 0.023, group: "Junctions" }

  # ---- surface (weathered concrete, layered noise, shade-time procedural) ----
  - { name: noise_scale,   display: "Detail Scale",  type: float, min: 0.2, max: 8.0, default: 7.73,  group: "Surface" }
  - { name: grime_amount,  display: "Grime",         type: float, min: 0.0, max: 1.0, default: 0.451, group: "Surface" }
  - { name: detail_amount, display: "Fine Detail",   type: float, min: 0.0, max: 1.5, default: 0.131, group: "Surface" }
  - { name: streak_amount, display: "Streaks",       type: float, min: 0.0, max: 1.0, default: 0.158, group: "Surface" }
  - { name: streak_sharp,  display: "Streak Sharp",  type: float, min: 0.0, max: 1.0, default: 0.376, group: "Surface" }
  - { name: crack_amount,  display: "Cracks",        type: float, min: 0.0, max: 1.0, default: 0.211, group: "Surface" }
  - { name: spall_amount,  display: "Spalling",      type: float, min: 0.0, max: 1.0, default: 0.267, group: "Surface" }
  - { name: edge_wear,     display: "Edge Wear",     type: float, min: 0.0, max: 1.5, default: 0.4,   group: "Surface" }

  # ---- light (camera headlamp; scene fades to black) ----
  - { name: spot_intensity, display: "Spot Intensity", type: float, min: 0.0, max: 4.0,  default: 2.1,   group: "Light" }
  - { name: spot_falloff,   display: "Spot Falloff",   type: float, min: 0.0, max: 0.6,  default: 0.056, group: "Light" }
  - { name: spot_cone,      display: "Spot Cone",      type: float, min: 0.0, max: 4.0,  default: 0.3,   group: "Light" }
  - { name: ambient,        display: "Ambient",        type: float, min: 0.0, max: 0.5,  default: 0.05,  group: "Light" }
  - { name: sun_fill,       display: "Sun Fill",       type: float, min: 0.0, max: 1.0,  default: 0.0,   group: "Light" }

  # ---- sun (direction of the optional Sun Fill above) ----
  - { name: sun_azimuth,   display: "Sun Azimuth",   type: float, min: 0.0, max: 360.0, default: 55.0, group: "Sun" }
  - { name: sun_elevation, display: "Sun Elevation", type: float, min: 5.0, max: 89.0, default: 42.0, group: "Sun" }

  # ---- camera ----
  # Fly = WASD + right-drag in the viewport (default). Orbit = deterministic rig below.
  - name: cam_mode
    display: "Camera Mode"
    type: enum
    options: [Fly, Orbit]
    default: 0
    flags: button_grid
    group: "Camera"
  - { name: cam_orbit,     display: "Camera Orbit",     type: float, min: 0.0, max: 360.0, default: 45.0, group: "Camera" }
  - { name: cam_elevation, display: "Camera Elevation", type: float, min: -30.0, max: 85.0, default: -8.0, group: "Camera" }
  - { name: cam_distance,  display: "Camera Distance",  type: float, min: 0.5, max: 30.0, default: 9.0, group: "Camera" }
  - { name: cam_target_y,  display: "Camera Target Y",  type: float, min: -4.0, max: 6.0, default: 2.5, group: "Camera" }
  - { name: cam_focal,     display: "Camera Focal",     type: float, min: 0.6, max: 4.0, default: 1.4, group: "Camera" }
  - { name: rotate_speed,  display: "Auto Rotate",      type: float, min: 0.0, max: 2.0, default: 0.0, group: "Camera" }

passes:
  - name: render
    shader: steel.hlsl
    target: cs_5_0

outputs:
  - { name: "Lattice", pass: render }
