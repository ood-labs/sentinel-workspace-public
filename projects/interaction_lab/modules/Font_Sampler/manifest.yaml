name: "Scientific Font Style Sampler"
version: "1.0"
mode: generator
resolution: [960, 540]

panel:
  mode: canvas
  output: "Font Sampler"
  resolution: follow_panel

parameters:
  - { name: selected_style, display: "Selected Style", type: enum, default: 2, options: [Regular, Light Edge, Clean Edge, Full Edge], flags: button_grid, group: "Font Choice" }
  - { name: custom_weight, display: "Custom Edge", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Font Choice" }

viewport:
  hint: "Compare synthetic edge weights built from the regular Scientifica face. The rest of Interaction Lab uses Clean Edge."
  # ui-label: title = SCIENTIFICA WEIGHT LAB
  # ui-label: regular = REGULAR
  # ui-label: light = LIGHT EDGE
  # ui-label: clean = CLEAN EDGE
  # ui-label: full = FULL EDGE
  # ui-label: specimen = Aa09.W/+
  controls:
    - { id: weight, kind: slider, param: custom_weight, rect: [0.667, 0.867, 0.925, 0.930], label: "Custom Regular Edge Weight" }

passes:
  - { name: render, shader: render.hlsl, target: cs_5_0, output: output }

outputs:
  - { name: "Font Sampler", pass: render }
