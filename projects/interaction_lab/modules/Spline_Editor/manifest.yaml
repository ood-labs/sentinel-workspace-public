name: "Scientific Spline Editor"
version: "1.0"
mode: generator
resolution: [960, 540]

panel:
  mode: canvas
  output: "Spline Editor"
  resolution: follow_panel

parameters:
  - { name: select_tool, display: "Select Tool", type: button, group: "Spline Tools" }
  - { name: pen_tool, display: "Pen Tool", type: button, group: "Spline Tools" }
  - { name: tangent_cycle, display: "Cycle Tangent", type: button, group: "Spline Tools" }
  - { name: close_path, display: "Open / Close", type: button, group: "Spline Tools" }
  - { name: delete_selected, display: "Delete", type: button, group: "Spline Tools" }

viewport:
  hint: "V/P tools, drag anchors or handles, drag empty space for marquee, Shift add, Ctrl subtract, T tangent, O close, Backspace delete."
  interactions: [events]
  input:
    pointer: [left]
    keyboard: [v, p, t, o, backspace, enter, escape, shift, control]
    gestures: [click, double_click, drag]
  bindings:
    - { gesture: left_drag, action: edit_or_marquee, label: "Edit Point / Marquee" }
    - { gesture: shift_left_click, action: add_selection, label: "Add Selection" }
    - { key: p, action: pen_tool, label: "Pen Tool" }
    - { key: v, action: select_tool, label: "Select Tool" }
  # ui-label: title = SPLINE EDITOR
  # ui-label: spline = SPLINE
  # ui-label: select = SELECT
  # ui-label: pen = PEN
  # ui-label: tangent = TANGENT
  # ui-label: close = CLOSE
  # ui-label: delete = DELETE
  controls:
    - { id: select, kind: button, param: select_tool, rect: [0.219, 0.026, 0.315, 0.096], label: "Select Tool" }
    - { id: pen, kind: button, param: pen_tool, rect: [0.325, 0.026, 0.392, 0.096], label: "Pen Tool" }
    - { id: tangent, kind: button, param: tangent_cycle, rect: [0.404, 0.026, 0.521, 0.096], label: "Cycle Tangent" }
    - { id: close, kind: button, param: close_path, rect: [0.533, 0.026, 0.615, 0.096], label: "Open / Close" }
    - { id: delete, kind: button, param: delete_selected, rect: [0.627, 0.026, 0.723, 0.096], label: "Delete Selected" }

buffers:
  - { name: editor_state, structured: true, element_size: 80, element_count: 1, persistent: true }
  - { name: drag_snapshot, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: spline_knots, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: spline_headers, structured: true, element_size: 16, element_count: 8, persistent: true }
  - { name: sampled_path, structured: true, element_size: 48, element_count: 512, persistent: true }
  - { name: editor_selection, structured: true, element_size: 16, element_count: 64, persistent: true }

state_buffers:
  - name: spline_knots
    max_elements: 64
    schema:
      - { name: anchor, type: float2 }
      - { name: handle_in, type: float2 }
      - { name: handle_out, type: float2 }
      - { name: knot_id, type: uint }
      - { name: spline_id, type: uint }
      - { name: tangent_mode, type: uint }
      - { name: flags, type: uint }
      - { name: active, type: float }
      - { name: marker, type: float }

passes:
  - { name: interaction, shader: interaction.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:editor_state" }
  - { name: snapshot, shader: snapshot.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:spline_knots" } ], output: "buffer:drag_snapshot" }
  - { name: update, shader: update.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:drag_snapshot" } ], output: "buffer:spline_knots" }
  - { name: headers, shader: headers.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 8, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:spline_headers" }
  - { name: samples, shader: derive.hlsl, target: cs_5_0, dispatch: [8,1,1], thread_group_x: 64, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:sampled_path" }
  - { name: selection, shader: selection.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 64, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:editor_selection" }
  - { name: render, shader: render.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:spline_knots" }, { slot: 1, source: "buffer:sampled_path" }, { slot: 2, source: "buffer:editor_state" } ], output: output }

data_outputs:
  - { name: "Spline Headers", buffer: spline_headers, schema: [ { name: first_knot, type: uint }, { name: knot_count, type: uint }, { name: closed, type: uint }, { name: active, type: uint } ] }
  - name: "Spline Knots"
    buffer: spline_knots
    schema:
      - { name: anchor, type: float2 }
      - { name: handle_in, type: float2 }
      - { name: handle_out, type: float2 }
      - { name: knot_id, type: uint }
      - { name: spline_id, type: uint }
      - { name: tangent_mode, type: uint }
      - { name: flags, type: uint }
      - { name: active, type: float }
      - { name: marker, type: float }
  - { name: "Sampled Path", buffer: sampled_path, schema: [ { name: pos, type: float2 }, { name: dir, type: float2 }, { name: depth, type: float }, { name: u, type: float }, { name: v, type: float }, { name: weight, type: float }, { name: group, type: float }, { name: kind, type: float }, { name: seed, type: float }, { name: active, type: float } ] }
  - { name: "Editor Selection", buffer: editor_selection, schema: [ { name: knot_id, type: uint }, { name: spline_id, type: uint }, { name: selected, type: uint }, { name: tangent_mode, type: uint } ] }

outputs:
  - { name: "Spline Editor", pass: render }
