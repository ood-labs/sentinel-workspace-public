name: "Spline Desk"
version: "3.0"
mode: generator

# Fallback extent for a hidden or not-yet-sized panel, and the resolution the
# forced-extent layout sweep proves against. The v1 editor declared 960x540 and
# then hit-tested against it, which is the bug Amendment 3 records; here the
# number is a fallback only and no shader reads it.
resolution: [1280, 720]

panel:
  mode: canvas
  output: "Spline Desk"
  resolution: follow_panel

# TWO WAYS INTO EVERY ACTION, deliberately.
#
# The three actions (tangent / close / delete) are `kind: button` controls, and
# the shader reads each one's `down` bit out of the control-flags array -- NOT
# the `type: button` parameter global, which 3C measured as a one-way latch that
# fires and never releases. Reading the flag is the v1 path and it is sound; it
# is the parameter global that is broken.
#
# But a control flag can only be set by a real click, and 3B established there
# is no MCP route to click inside a module preview. A phase that must prove
# "delete a knot, then undo it" cannot depend on a gesture no tool can make. So
# each action ALSO has a bool rising-edge parameter, compared against a latch in
# editor_state exactly like the Motion Console burst. Same command, two doors:
# the button for a human, the bool for OSC, cues, expressions and automated
# proof.
viewport:
  hint: "Drag anchors and handles. Drag empty space to marquee. Shift adds, Ctrl subtracts. T tangent, O close, Backspace delete, Enter next lane, Ctrl+Z undo."
  interactions: [events]
  input:
    pointer: [left]
    keyboard: [v, p, t, o, backspace, enter, escape, shift, control]
    gestures: [click, double_click, drag]
  bindings:
    - { gesture: left_drag, action: edit_or_marquee, label: "Edit Point / Marquee" }
    - { gesture: shift_left_click, action: add_selection, label: "Add Selection" }
    - { key: v, action: select_tool, label: "Select Tool" }
    - { key: p, action: pen_tool, label: "Pen Tool" }
    - { key: t, action: cycle_tangent, label: "Cycle Tangent" }
    - { key: o, action: close_path, label: "Open / Close Path" }
  controls:
    # Tool is a two-cell bank on ONE slider, not two buttons. A tool is a MODE,
    # and a mode backed by an ordinary parameter gets undo, presets, project
    # save and OSC for free -- the whole reason 3B's rule prefers host controls.
    - { id: tool,    kind: slider, param: tool_mode,      rect: [0.016, 0.038, 0.150, 0.086], label: "Tool" }
    - { id: tangent, kind: button, param: tangent_cycle,  rect: [0.166, 0.038, 0.276, 0.086], label: "Cycle Tangent" }
    - { id: close,   kind: button, param: close_path,     rect: [0.286, 0.038, 0.372, 0.086], label: "Open / Close" }
    - { id: delete,  kind: button, param: delete_selected, rect: [0.382, 0.038, 0.470, 0.086], label: "Delete Selected" }

parameters:
  - { name: tool_mode, display: "Tool", type: int, min: 0, max: 1, default: 0, group: "Spline Tools" }
  - { name: tangent_cycle, display: "Cycle Tangent", type: button, group: "Spline Tools" }
  - { name: close_path, display: "Open / Close", type: button, group: "Spline Tools" }
  - { name: delete_selected, display: "Delete", type: button, group: "Spline Tools" }

  # Rising-edge automation doors. Bool, never `type: button` -- see the viewport
  # comment above.
  - { name: do_tangent, display: "Tangent (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_close, display: "Close (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_delete, display: "Delete (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_next_lane, display: "Next Lane (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_undo, display: "Undo Drag (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_select_lane, display: "Select Lane (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_clear_sel, display: "Clear Selection (edge)", type: bool, default: false, group: "Automation" }
  - { name: do_reset, display: "Reset Path (edge)", type: bool, default: false, group: "Automation" }
  # Nudge the selection by an exact offset. This is what arrow keys should do in
  # any point editor, and it is the only way to MOVE a knot without a pointer
  # drag -- which makes 3D's downstream criterion provable without a human.
  - { name: do_nudge, display: "Nudge (edge)", type: bool, default: false, group: "Automation" }
  - { name: nudge_x, display: "Nudge X", type: float, min: -0.5, max: 0.5, default: 0.06, group: "Automation" }
  - { name: nudge_y, display: "Nudge Y", type: float, min: -0.5, max: 0.5, default: -0.12, group: "Automation" }

  # Hit radius in PIXELS, not normalized. v1 used a normalized 0.022, which on a
  # 1920x403 panel is a 42x9 px ellipse -- the same coordinate defect CLAUDE.md
  # warns about, and unusable on any dock that is not close to 16:9.
  - { name: hit_radius, display: "Hit Radius (px)", type: float, min: 6.0, max: 40.0, default: 16.0, group: "Editing" }
  - { name: accent_color, display: "Accent", type: color, default: [1.0, 0.42, 0.09], group: "Editing" }

buffers:
  - { name: editor_state, structured: true, element_size: 96, element_count: 1, persistent: true }
  - { name: drag_snapshot, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: spline_knots, structured: true, element_size: 48, element_count: 64, persistent: true }
  - { name: spline_headers, structured: true, element_size: 16, element_count: 8, persistent: true }
  - { name: sampled_path, structured: true, element_size: 48, element_count: 512, persistent: true }
  - { name: editor_selection, structured: true, element_size: 16, element_count: 64, persistent: true }

# The durable authored state. Unchanged from v1 so a project saved by either
# station reloads in the other.
state_buffers:
  - name: spline_knots
    max_elements: 64
    schema:
      - { name: anchor, type: float2 }
      - { name: handle_in, type: float2 }
      - { name: handle_out, type: float2 }
      - { name: knot_id, type: uint }
      - { name: spline_id, type: uint }
      - { name: tangent_mode, type: uint }
      - { name: flags, type: uint }
      - { name: active, type: float }
      - { name: marker, type: float }

passes:
  - { name: interaction, shader: interaction.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:editor_state" }
  - { name: snapshot, shader: snapshot.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:spline_knots" } ], output: "buffer:drag_snapshot" }
  - { name: update, shader: update.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:editor_state" }, { slot: 1, source: "buffer:drag_snapshot" } ], output: "buffer:spline_knots" }
  - { name: headers, shader: headers.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 8, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:spline_headers" }
  - { name: samples, shader: derive.hlsl, target: cs_5_0, dispatch: [8,1,1], thread_group_x: 64, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:sampled_path" }
  - { name: selection, shader: selection.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 64, thread_group_y: 1, inputs: [ { slot: 0, source: "buffer:spline_knots" } ], output: "buffer:editor_selection" }
  - { name: render, shader: render.hlsl, target: cs_5_0, format: RGBA8, inputs: [ { slot: 0, source: "buffer:spline_knots" }, { slot: 1, source: "buffer:sampled_path" }, { slot: 2, source: "buffer:editor_state" }, { slot: 3, source: "buffer:spline_headers" } ], output: output }

# UNCHANGED FROM v1, byte for byte. Spline_Output consumes these and must keep
# working with no modification; that is 3D's criterion 2.
data_outputs:
  - { name: "Spline Headers", buffer: spline_headers, schema: [ { name: first_knot, type: uint }, { name: knot_count, type: uint }, { name: closed, type: uint }, { name: active, type: uint } ] }
  - name: "Spline Knots"
    buffer: spline_knots
    schema:
      - { name: anchor, type: float2 }
      - { name: handle_in, type: float2 }
      - { name: handle_out, type: float2 }
      - { name: knot_id, type: uint }
      - { name: spline_id, type: uint }
      - { name: tangent_mode, type: uint }
      - { name: flags, type: uint }
      - { name: active, type: float }
      - { name: marker, type: float }
  - { name: "Sampled Path", buffer: sampled_path, schema: [ { name: pos, type: float2 }, { name: dir, type: float2 }, { name: depth, type: float }, { name: u, type: float }, { name: v, type: float }, { name: weight, type: float }, { name: group, type: float }, { name: kind, type: float }, { name: seed, type: float }, { name: active, type: float } ] }
  - { name: "Editor Selection", buffer: editor_selection, schema: [ { name: knot_id, type: uint }, { name: spline_id, type: uint }, { name: selected, type: uint }, { name: tangent_mode, type: uint } ] }

outputs:
  - { name: "Spline Desk", pass: render }

control_outputs:
  - { name: active_lane, buffer: editor_state, element: 0, field_offset: 36, description: "Active spline lane 0-7" }
  - { name: tangent_mode, buffer: editor_state, element: 0, field_offset: 40, description: "Tangent mode 0 free / 1 aligned / 2 mirrored" }
  - { name: last_command, buffer: editor_state, element: 0, field_offset: 84, description: "Last non-zero editor command code" }
