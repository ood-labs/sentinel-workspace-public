name: "Relief"
version: "1.0"
mode: generator
execution: on_dirty
resolution: [1280, 720]
# A hypsometric plate: an island's terrain tinted by elevation through the Ramp Desk's palette,
# shaded by a low sun, with contours, a coastline and a legend that reads the palette back as metres.
#
# On demand: `execution: on_dirty` and a single `time_dependent: false` pass. It renders when the
# Palette's generation moves (the desk writes it only when the stops change), when a parameter here
# changes, or on a reload - and sleeps otherwise (profile: cook_hz 0 while the desk is idle).

# IBM Plex Sans Condensed + IBM Plex Mono, SIL OFL 1.1 (_shared/type/IBM_PLEX_OFL.txt)
assets:
  - { name: type, type: texture, file: ../_shared/type/il_type.png, srgb: false }

data_inputs:
  - name: "Palette"
    slot: 0
    schema:
      - { name: v, type: float4 }

parameters:
  - { name: seed,      display: "Terrain",        type: int,   min: 1,      max: 64,     default: 7,      group: "Terrain", description: "Which island" }
  - { name: sea_level, display: "Sea level",      type: float, min: -1500.0, max: 1500.0, default: 0.0,   group: "Terrain", description: "Raise the sea to flood the lowlands, lower it to bare the shelf (m)" }
  - { name: range_m,   display: "Elevation span", type: float, min: 500.0,  max: 9000.0, default: 3200.0, group: "Tints",   description: "The elevation at each end of the palette: t = 0.5 + elevation / (2 x span), so sea level sits at its middle (m)" }
  - { name: shading,   display: "Hill shading",   type: float, min: 0.0,    max: 1.5,    default: 0.8,    group: "Relief",  description: "Strength of the shading from the sun" }
  - { name: light,     display: "Sun azimuth",    type: float, min: 0.0,    max: 360.0,  default: 315.0,  group: "Relief",  description: "Where the sun stands, clockwise from north (degrees): 315 is the cartographer's north-west" }
  - { name: contours,  display: "Contours",       type: enum,  options: [Off, "100 m", "250 m", "500 m"], default: 2, group: "Relief" }

passes:
  - name: relief
    shader: relief.hlsl
    target: cs_5_0
    time_dependent: false
    format: RGBA8
    thread_group_x: 16
    thread_group_y: 16
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "asset:type" }
    output: output

outputs:
  - { name: "Relief", pass: relief }
