name: SIMPLE STAGE / Program
version: '1.0'
mode: generator
resolution: [1920, 1080]
features: [camera]
viewport:
  hint: RMB look, WASD move, wheel speed
  interactions: [camera]
# The program image of what the DMX says. Every Fixture Rig fixture's DMX (SS_Lighting's, or a DMX In's to play
# from a console) is decoded through its own GDTF (vis_decode), each fixture sits where the show's fixture table has the
# truss carry it (Rig Fixtures), and the decoded state becomes the movers' pose and optics, the strobes, the pixel-bar
# texture (PHAGE's own types, drawn by PHAGE's models) and every other type's body, cells and beams from its GDTF
# (guest_*). The vis_* passes are that decode; everything after draws it.
# SS_Haze's Haze Field (_shared/ss_haze.hlsli): the simulated haze, the air that carries it and the wisp noise. Unlinked,
# the haze is the even haze the Haze control describes.
inputs:
  - {name: Haze Field, slot: 0}
data_inputs:
  - name: DMX
    slot: 0
    schema:
      - {name: channels, type: uint, count: 512}
  - name: Rig Fixtures
    slot: 1
    schema:
      - {name: ids, type: uint, count: 4}
      - {name: run, type: uint, count: 4}
      - {name: patch, type: uint, count: 4}
      - {name: x, type: float4}
      - {name: y, type: float4}
      - {name: z, type: float4}
      - {name: o, type: float4}
      - {name: rest, type: float4}
  - name: Bar Pieces
    slot: 2
    schema:
      - {name: a, type: float4}
      - {name: b, type: float4}
      - {name: n, type: float4}
      - {name: w, type: float4}
  - name: Structure
    slot: 3
    schema:
      - {name: a, type: float4}
      - {name: b, type: float4}
      - {name: c, type: float4}
      - {name: d, type: float4}
  - name: Venue
    slot: 4
    schema:
      - {name: value, type: float4}
  - name: Show State
    slot: 5
    schema:
      - {name: value, type: float4}
  - name: FixtureRender
    slot: 6
    schema:
      - {name: w, type: uint, count: 4}
parameters:
  - {name: worklight, type: float, default: 0.15, min: 0, max: 4}
  - {name: optic_beam_gain, label: Decoded beam gain, type: float, default: 64, min: 0, max: 512, description: 'Render intensity per unit of decoded beam dimmer: 8 x 2^boost, as Lighting draws it (boost 3).'}
  - {name: optic_halo_gain, label: Decoded halo gain, type: float, default: 1.6, min: 0, max: 16, description: 'Render intensity per unit of decoded halo dimmer: 0.2 x 2^boost (boost 3).'}
  - {name: reach, label: Beam reach, type: float, default: 40, min: 5, max: 80}
  - {name: exposure, type: float, default: 1.0, min: 0.1, max: 4}
  - {name: haze, type: float, default: 0.03, min: 0, max: 1}
  - {name: haze_sim, label: Simulated haze, type: float, default: 1.0, min: 0, max: 1, description: 'How much of the haze is SS_Haze''s simulated field (the hazers'' clouds, carried and lifted by the hall''s air) rather than the even haze the Haze control describes. 0 is the even haze; needs the Haze Field linked.'}
  - {name: haze_wisps, label: Haze wisps, type: float, default: 0.6, min: 0, max: 1, description: 'Structure finer than the simulation''s 1/8 m cells where the beams cut the haze: flow-carried noise that breaks thin haze into wisps and frays the clouds'' edges.'}
  - {name: wisp_size, label: Wisp size (m), type: float, default: 1.1, min: 0.2, max: 4, description: 'How big a wisp is.'}
  - {name: beam_gain, type: float, default: 10.000000, min: 0, max: 20}
  - {name: led_gain, type: float, default: 3.0, min: 0, max: 20}
  - {name: bloom, type: float, default: 0.12, min: 0, max: 1}
  - {name: sensor_white_start, type: float, default: 2.0, min: 0, max: 10}
  - {name: sensor_response, type: float, default: 0.16, min: 0, max: 1}
  - {name: streak_strength, type: float, default: 0.005, min: 0, max: 1}
  - {name: streak_length, type: float, default: 0.08, min: 0.01, max: 0.3}
  - {name: strobe_gain, type: float, default: 2.0, min: 0, max: 20}
  - {name: strobe_haze, label: Strobe haze scatter, type: float, default: 0.5, min: 0, max: 5}
  - {name: emitter_gain, type: float, default: 3.0, min: 0, max: 20}
  - {name: bar_glow, type: float, default: 1.0, min: 0, max: 10}
  - {name: glow_range, label: Bar glow range (m), type: float, default: 10.0, min: 3, max: 60}
  - {name: beam_falloff, label: Beam shaft falloff (1 = inverse square), type: float, default: 0.45, min: 0.2, max: 1}
  - {name: ring_haze, label: Mover ring haze, type: float, default: 0.35, min: 0, max: 2}
  - {name: crowd_bob, type: float, default: 1.0, min: 0, max: 3}
  - {name: volume_samples, type: int, default: 8, min: 4, max: 32}
  - {name: taa, label: Temporal anti-aliasing, type: float, default: 1, min: 0, max: 1, description: 'Above 0.5 every raster pass jitters a sub-pixel step each frame and taa.hlsl averages the frames along the camera, clipped to what each frame shows. 0 draws one sample per pixel.'}
  - {name: taa_feedback, label: TAA history weight, type: float, default: 0.9, min: 0.5, max: 0.97, description: 'How much of the history a still pixel keeps each frame: higher is smoother and slower to settle.'}
buffers:
  - {name: vinst, structured: true, element_size: 32, element_count: 1024}
  - {name: vstate, structured: true, element_size: 8, element_count: 1048576}
  - {name: vframes, structured: true, element_size: 64, element_count: 1024}
  - {name: poses, structured: true, element_size: 64, element_count: 32}
  - {name: optics, structured: true, element_size: 80, element_count: 880}    # Lighting's 816 (SS_OPT_COUNT), then 64 guest sources
  - {name: runs, structured: true, element_size: 4, element_count: 2048}
  - {name: glist, structured: true, element_size: 4, element_count: 65}
  - {name: gframe, structured: true, element_size: 16, element_count: 8576}   # 64 guests x 134 rows
  - {name: sources, structured: true, element_size: 80, element_count: 160}   # lightgrid.hlsli LG_SOURCES
  - {name: lightgrid, structured: true, element_size: 4, element_count: 1044480}
  - {name: beamT, structured: true, element_size: 4, element_count: 6144}       # (SS_MOVERS + 64 guests) x 64 segments
  - {name: taa_history, format: RGBA16F, scale: 1.0, persistent: true}           # last frame's resolved image
  - {name: taa_cam, structured: true, element_size: 16, element_count: 8, persistent: true}   # last frame's camera
passes:
  - name: vis_inst
    shader: vis_inst.hlsl
    target: cs_5_0
    dispatch: [16, 1, 1]
    inputs:
      - {slot: 0, source: 'data:1'}
      - {slot: 1, source: 'data:6'}
    output: buffer:vinst
  - name: vis_decode
    shader: vis_decode.hlsl
    target: cs_5_0
    dispatch: [16, 1, 1]
    inputs:
      - {slot: 0, source: buffer:vinst}
      - {slot: 1, source: 'data:6'}
      - {slot: 2, source: 'data:0'}
    output: buffer:vstate
  - name: vis_frames
    shader: vis_frames.hlsl
    target: cs_5_0
    dispatch: [16, 1, 1]
    inputs:
      - {slot: 0, source: buffer:vinst}
      - {slot: 1, source: 'data:1'}
      - {slot: 2, source: 'data:6'}
    output: buffer:vframes
  - name: vis_guests
    shader: vis_guests.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    inputs:
      - {slot: 0, source: buffer:vinst}
      - {slot: 1, source: 'data:6'}
    output: buffer:glist
  - name: vis_gframe
    shader: vis_gframe.hlsl
    target: cs_5_0
    dispatch: [128, 1, 1]
    inputs:
      - {slot: 0, source: buffer:vinst}
      - {slot: 1, source: buffer:vframes}
      - {slot: 2, source: buffer:vstate}
      - {slot: 3, source: buffer:glist}
      - {slot: 4, source: 'data:6'}
    output: buffer:gframe
  - name: vis_pose
    shader: vis_pose.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    inputs:
      - {slot: 0, source: buffer:vinst}
      - {slot: 1, source: buffer:vframes}
      - {slot: 2, source: buffer:vstate}
      - {slot: 3, source: 'data:6'}
    output: buffer:poses
  - name: vis_optics
    shader: vis_optics.hlsl
    target: cs_5_0
    dispatch: [14, 1, 1]
    inputs:
      - {slot: 0, source: buffer:poses}
      - {slot: 1, source: buffer:vinst}
      - {slot: 2, source: buffer:vframes}
      - {slot: 3, source: buffer:vstate}
      - {slot: 4, source: 'data:6'}
      - {slot: 6, source: buffer:gframe}
      - {slot: 7, source: buffer:glist}
    output: buffer:optics
  - name: vis_runs
    shader: vis_runs.hlsl
    target: cs_5_0
    dispatch: [32, 1, 1]
    inputs:
      - {slot: 0, source: buffer:vinst}
    output: buffer:runs
  - name: vis_led
    shader: vis_led.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution: [1024, 64]     # fixed: the renderer and the venue sample it, so it must not follow the panel
    inputs:
      - {slot: 0, source: buffer:vinst}
      - {slot: 1, source: buffer:vstate}
      - {slot: 2, source: buffer:runs}
      - {slot: 3, source: 'data:6'}
      - {slot: 4, source: 'data:2'}
      - {slot: 5, source: 'data:5'}
  - name: sources
    shader: sources.hlsl
    target: cs_5_0
    dispatch: [3, 1, 1]
    inputs:
      - {slot: 0, source: buffer:optics}
    output: buffer:sources
  # The haze between each narrow beam's lens and every point down it (beamt.hlsl): one group per beam.
  - name: beamt
    shader: beamt.hlsl
    target: cs_5_0
    dispatch: [96, 1, 1]       # SS_MOVERS + 64 guests
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - {slot: 0, source: 'buffer:sources'}
      - {slot: 1, source: 'input:0'}
      - {slot: 2, source: 'data:4'}
      - {slot: 7, source: 'pass:sources'}   # order edge: passes are ordered by pass: inputs only
    output: buffer:beamT
  - name: lightgrid
    shader: lightgrid.hlsl
    target: cs_5_0
    dispatch: [120, 1, 1]
    inputs:
      - {slot: 0, source: 'buffer:sources'}
      - {slot: 1, source: 'data:4'}
    output: buffer:lightgrid
  - name: movers
    shader: movers.hlsl
    target: draw
    vertex_count: 352128       # SS_MOVERS x 11004
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: buffer:poses}
      - {slot: 1, source: buffer:optics}
  - name: structure
    shader: structure.hlsl
    target: draw
    vertex_count: 221184       # SS_TUBE_COUNT x 72
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'data:3'}
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: solids
    shader: solids.hlsl
    target: draw
    vertex_count: 13824
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'data:3'}
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: emitters
    shader: emitters.hlsl
    target: draw
    vertex_count: 4032         # SS_STROBES x 84 + SS_BARS x SS_BAR_SEGS x 42
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: buffer:optics}
      - {slot: 1, source: 'data:2'}
      - {slot: 2, source: 'pass:vis_led'}
  - name: crowd
    shader: crowd.hlsl
    target: draw
    vertex_count: 276480       # PV_PEOPLE x 180
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 4, source: 'data:5'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: venue
    shader: venue.hlsl
    target: draw
    vertex_count: 9216
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: guest_bodies
    shader: guest_bodies.hlsl
    target: draw
    vertex_count: 165888      # 64 guests x 8 parts x 324
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: buffer:gframe}
      - {slot: 1, source: 'data:6'}
  - name: guest_faces
    shader: guest_faces.hlsl
    target: draw
    vertex_count: 3072        # 64 guests x 8 faces x 6
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: buffer:gframe}
      - {slot: 1, source: 'data:6'}
  - name: nearest
    shader: nearest.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'pass:movers'}
      - {slot: 1, source: 'pass:structure'}
      - {slot: 2, source: 'pass:solids'}
      - {slot: 3, source: 'pass:emitters'}
      - {slot: 4, source: 'pass:crowd'}
      - {slot: 5, source: 'pass:venue'}
      - {slot: 6, source: 'pass:guest_bodies'}
      - {slot: 7, source: 'pass:guest_faces'}
  - name: volume
    shader: volume.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.5
    inputs:
      - {slot: 0, source: 'buffer:sources'}
      - {slot: 1, source: 'pass:nearest'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'input:0'}
      - {slot: 4, source: 'buffer:beamT'}
      - {slot: 7, source: 'pass:beamt'}     # order edge, as above
  - name: floor_reflections
    shader: floor_reflections.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'pass:nearest'}
      - {slot: 1, source: 'data:4'}
  - name: hdr_scene
    shader: hdr_scene.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 1
    inputs:
      - {slot: 0, source: 'pass:nearest'}
      - {slot: 1, source: 'pass:volume'}
      - {slot: 2, source: 'pass:floor_reflections'}
  # Temporal anti-aliasing: the resolve reads last frame's history and camera (declared before their writers), then
  # keeps this frame's for the next.
  - name: taa
    shader: taa.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'pass:hdr_scene'}
      - {slot: 1, source: 'buffer:taa_history'}
      - {slot: 2, source: 'pass:nearest'}
      - {slot: 3, source: 'buffer:taa_cam'}
  - name: taa_store
    shader: taa_store.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'pass:taa'}
    output: buffer:taa_history
  - name: taa_cam
    shader: taa_cam.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    output: buffer:taa_cam
  - name: bloom_d0
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.5
    inputs:
      - {slot: 0, source: 'pass:taa'}
  - name: bloom_d1
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:bloom_d0'}
  - name: bloom_d2
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.125
    inputs:
      - {slot: 0, source: 'pass:bloom_d1'}
  - name: bloom_d3
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.0625
    inputs:
      - {slot: 0, source: 'pass:bloom_d2'}
  - name: bloom_d4
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.03125
    inputs:
      - {slot: 0, source: 'pass:bloom_d3'}
  - name: bloom_u3
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.0625
    inputs:
      - {slot: 0, source: 'pass:bloom_d4'}
      - {slot: 1, source: 'pass:bloom_d3'}
  - name: bloom_u2
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.125
    inputs:
      - {slot: 0, source: 'pass:bloom_u3'}
      - {slot: 1, source: 'pass:bloom_d2'}
  - name: bloom_u1
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:bloom_u2'}
      - {slot: 1, source: 'pass:bloom_d1'}
  - name: bloom_u0
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.5
    inputs:
      - {slot: 0, source: 'pass:bloom_u1'}
      - {slot: 1, source: 'pass:bloom_d0'}
  - name: streak_seed
    shader: streak_seed.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:bloom_d1'}
  - name: streaks
    shader: streaks.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:streak_seed'}
  - name: present
    shader: present.hlsl
    inputs:
      - {slot: 0, source: 'pass:taa'}
      - {slot: 1, source: 'pass:bloom_u0'}
      - {slot: 2, source: 'pass:streaks'}
outputs:
  - name: Program
    pass: present
data_outputs:
  - name: Atmosphere Sources
    buffer: sources
    schema:
      - {name: position, type: float3}
      - {name: fixture_id, type: float}
      - {name: normal, type: float3}
      - {name: local_id, type: float}
      - {name: colour, type: float3}
      - {name: intensity, type: float}
      - {name: beam_tangent, type: float}
      - {name: field_tangent, type: float}
      - {name: reach, type: float}
      - {name: active, type: float}
      - {name: frost, type: float}
      - {name: padding, type: float3}
