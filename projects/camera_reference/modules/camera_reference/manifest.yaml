name: "Native Camera Reference"
version: "1.0.0"
mode: generator
execution: on_dirty
resolution: [1280, 720]
features: [camera]

viewport:
  hint: "Fly: RMB look, WASD move, wheel changes speed. Tab toggles Orbit."
  interactions: [camera]

parameters:
  - name: grid_spacing
    display: "Grid Spacing"
    type: float
    min: 0.1
    max: 4.0
    default: 1.0
    group: "Grid"

  - name: line_width
    display: "Line Width"
    type: float
    min: 0.03
    max: 2.0
    default: 0.18
    group: "Grid"

  - name: grid_strength
    display: "Grid Strength"
    type: float
    min: 0.0
    max: 1.0
    default: 0.72
    group: "Grid"

  - name: grid_fade
    display: "Distance Fade"
    type: float
    min: 0.005
    max: 0.25
    default: 0.055
    group: "Grid"

  - name: axis_strength
    display: "Origin Axes"
    type: float
    min: 0.0
    max: 1.0
    default: 0.72
    group: "Grid"

  - name: exposure
    display: "Exposure"
    type: float
    min: 0.4
    max: 2.5
    default: 1.15
    group: "Display"

  - name: aa_strength
    display: "Anti-Aliasing"
    type: float
    min: 0.0
    max: 1.0
    default: 0.58
    group: "Display"

passes:
  - name: scene
    shader: render.hlsl
    time_dependent: false
    target: cs_5_0

  - name: aa_color
    shader: aa.hlsl
    time_dependent: false
    inputs:
      - { slot: 0, source: "pass:scene" }

  - name: color_output
    shader: color_out.hlsl
    time_dependent: false
    inputs:
      - { slot: 0, source: "pass:aa_color" }

  - name: depth_output
    shader: depth_out.hlsl
    time_dependent: false
    inputs:
      - { slot: 0, source: "pass:scene" }

outputs:
  - { name: "Color", pass: color_output }
  - { name: "Depth", pass: depth_output }
