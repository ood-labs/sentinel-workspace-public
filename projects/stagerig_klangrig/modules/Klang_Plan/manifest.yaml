name: Klangrig / Construction Plan
version: '1.0'
mode: generator
resolution:
- 1200
- 760
panel:
  mode: canvas
  output: Plan
  resolution: follow_panel
viewport:
  hint: 'Top: plan / lower left: side / lower right: end. Drag circular wing handles;
    R resets selected.'
  interactions:
  - events
  input:
    pointer:
    - left
    keyboard:
    - r
    - escape
    gestures:
    - click
    - drag
parameters:
- name: spine_length
  type: float
  default: 32
  min: 20
  max: 48
- name: spine_height
  type: float
  default: 7.5
  min: 4
  max: 12
- name: bay_spacing
  type: float
  default: 10
  min: 6
  max: 14
- name: wing_length
  type: float
  default: 9
  min: 5
  max: 13
- name: inner_width
  type: float
  default: 1.2
  min: 0.5
  max: 3
- name: wing_width
  type: float
  default: 6
  min: 3
  max: 10
- name: wing_rise
  type: float
  default: 3
  min: 1
  max: 5
- name: tier_separation
  type: float
  default: 1.5
  min: 0.5
  max: 4
  description: Vertical centerline separation of upper/lower inner rails, in metres.
    Moves each complete wing away from the spine.
- name: wing_height_offset
  type: float
  default: 0
  min: -5
  max: 5
  description: Moves all wings vertically relative to the center spine, in metres.
    Positive raises wings; tier separation is preserved.
- name: wing_angle
  type: float
  default: 0
  min: -25
  max: 25
- name: truss_width
  type: float
  default: 0.4
  min: 0.22
  max: 0.7
- name: led_width
  type: float
  default: 0.45
  min: 0.1
  max: 1
- name: spine_count
  type: int
  default: 72
  min: 1
  max: 96
- name: wing_01_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_02_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_03_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_04_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_05_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_06_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_07_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_08_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_09_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_10_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_11_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
- name: wing_12_count
  type: int
  default: 10
  min: 0
  max: 16
  group: Fixture rows
buffers:
- name: edits
  structured: true
  element_size: 16
  element_count: 17
  persistent: true
- name: records
  structured: true
  element_size: 64
  element_count: 49
- name: mounts
  structured: true
  element_size: 64
  element_count: 288
state_buffers:
- name: edits
  max_elements: 17
  schema:
  - name: value
    type: float4
passes:
- name: state
  shader: state.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  output: buffer:edits
- name: resolve
  shader: resolve.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  inputs:
  - slot: 0
    source: buffer:edits
  output: buffer:records
- name: mounts
  shader: mounts.hlsl
  target: cs_5_0
  dispatch:
  - 5
  - 1
  - 1
  inputs:
  - slot: 0
    source: buffer:records
  output: buffer:mounts
- name: preview
  shader: preview.hlsl
  target: cs_5_0
  inputs:
  - slot: 0
    source: buffer:records
  - slot: 1
    source: buffer:edits
  - slot: 2
    source: buffer:mounts
  output: output
data_outputs:
- name: Rig Segments
  buffer: records
  schema:
  - name: a
    type: float4
  - name: b
    type: float4
  - name: shape
    type: float4
  - name: meta
    type: float4
- name: Fixture Mounts
  buffer: mounts
  schema:
  - name: position
    type: float3
  - name: fixture_id
    type: float
  - name: mount_pitch
    type: float
  - name: mount_roll
    type: float
  - name: base_visible
    type: float
  - name: active
    type: float
  - name: content_origin
    type: float2
  - name: content_extent
    type: float2
  - name: reserved
    type: float4
- name: Plan Edits
  buffer: edits
  schema:
  - name: value
    type: float4
outputs:
- name: Plan
  pass: preview
