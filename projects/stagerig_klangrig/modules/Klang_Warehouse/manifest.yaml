name: Klangrig / Warehouse
version: '1.0'
mode: generator
resolution:
- 800
- 480
parameters:
- name: ambient
  label: Room fill
  type: float
  default: 0.0
  min: 0
  max: 0.5
  group: ROOM LIGHTING
- name: crowd_fill
  label: Crowd fill
  type: float
  default: 0.012
  min: 0
  max: 0.5
  group: ROOM LIGHTING
- name: truss_fill
  label: Metal fill
  type: float
  default: 0.0
  min: 0
  max: 0.5
  group: ROOM LIGHTING
- name: surface_spill
  label: Moving-head spill
  type: float
  default: 1.0
  min: 0
  max: 3
  group: ROOM LIGHTING
- name: led_spill
  label: LED bounce
  type: float
  default: 0.089
  min: 0
  max: 3
  group: ROOM LIGHTING
- name: fill_color
  label: Fill colour
  type: color
  default:
  - 0.72
  - 0.79
  - 1
  group: ROOM LIGHTING
- name: metal_roughness
  label: Truss roughness
  type: float
  default: 0.468
  min: 0.06
  max: 0.85
  group: MATERIALS
- name: metal_reflection
  label: Truss reflectivity
  type: float
  default: 0.217
  min: 0
  max: 1
  group: MATERIALS
- name: floor_roughness
  label: Concrete roughness
  type: float
  default: 0.824
  min: 0.12
  max: 1
  group: MATERIALS
- name: floor_reflection
  label: Floor reflections
  type: float
  default: 0.154
  min: 0
  max: 1
  group: MATERIALS
- name: floor_wear
  label: Floor wear
  type: float
  default: 0.65
  min: 0
  max: 1
  group: MATERIALS
- name: wall_texture
  label: Concrete texture
  type: float
  default: 0.65
  min: 0
  max: 1
  group: MATERIALS
- name: width
  type: float
  default: 36.0
  min: 24
  max: 80
  group: HALL GEOMETRY
- name: length
  type: float
  default: 56.0
  min: 40
  max: 100
  group: HALL GEOMETRY
- name: height
  type: float
  default: 14.0
  min: 10
  max: 24
  group: HALL GEOMETRY
- name: floor_level
  type: float
  default: 0.0
  min: -5
  max: 3
  group: HALL GEOMETRY
- name: enabled
  type: bool
  default: false
  group: HALL GEOMETRY
- name: walls
  type: bool
  default: false
  group: HALL GEOMETRY
- name: roof
  type: bool
  default: false
  group: HALL GEOMETRY
buffers:
- name: architecture
  structured: true
  element_size: 64
  element_count: 256
- name: room_settings
  structured: true
  element_size: 80
  element_count: 1
- name: led_emitters
  structured: true
  element_size: 48
  element_count: 48
passes:
- name: build
  shader: build.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  output: buffer:architecture
- name: settings
  shader: settings.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  output: buffer:room_settings
- name: emitters
  shader: emitters.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  inputs:
  - slot: 0
    source: data:0
  - slot: 1
    source: input:0
  output: buffer:led_emitters
- name: preview
  shader: preview.hlsl
  target: cs_5_0
  inputs:
  - slot: 0
    source: buffer:architecture
  output: output
data_outputs:
- name: Architecture
  buffer: architecture
  schema:
  - name: center
    type: float4
  - name: extent
    type: float4
  - name: surface
    type: float4
  - name: rotation
    type: float4
- name: Room Settings
  buffer: room_settings
  schema:
  - name: fill
    type: float4
  - name: material
    type: float4
  - name: tint
    type: float4
  - name: bounds
    type: float4
  - name: finish
    type: float4
- name: LED Emitters
  buffer: led_emitters
  schema:
  - name: a
    type: float4
  - name: b
    type: float4
  - name: radiance
    type: float4
outputs:
- name: Warehouse Plan and Elevation
  pass: preview
inputs:
- name: LED RGB
  slot: 0
data_inputs:
- name: Rig Segments
  slot: 0
  schema:
  - name: a
    type: float4
  - name: b
    type: float4
  - name: shape
    type: float4
  - name: meta
    type: float4
