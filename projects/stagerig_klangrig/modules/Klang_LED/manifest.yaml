name: Klangrig / LED Faces
version: '1.0'
mode: generator
resolution:
- 1024
- 192
output_format: rgba16f
parameters:
- name: strobe_rate
  type: float
  default: 6
  min: 1
  max: 24
- name: strobe_duty
  type: float
  default: 0.35
  min: 0.05
  max: 0.95
- name: strobe_cycle_beats
  type: float
  default: 1
  min: 0.0625
  max: 64
  hidden: true
- name: pattern
  type: enum
  options:
  - Solid
  - Parallel outlines
  - Chase
  - Pulse
  - Address sweep
  - Sequential face test
  default: 1
  min: 0
  max: 5
- name: led_color
  type: color
  default:
  - 1
  - 0.6
  - 0.72
- name: level
  type: float
  default: 1
  min: 0
  max: 4
- name: rate
  type: float
  default: 0.2
  min: 0
  max: 4
- name: phase
  type: float
  default: 0
  min: 0
  max: 1
- name: animate
  type: bool
  default: false
- name: isolate_wing
  type: int
  default: -1
  min: -1
  max: 11
- name: chase_seconds
  type: float
  default: 1
  min: 0.1
  max: 5
- name: test_face
  type: int
  default: 1
  min: 1
  max: 48
passes:
- name: clock
  shader: clock.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  output: buffer:diagnostic
- name: content
  shader: content.hlsl
  target: cs_5_0
  output: output
  inputs:
  - slot: 0
    source: data:0
  - slot: 1
    source: buffer:diagnostic
  - slot: 2
    source: data:1
  - slot: 3
    source: data:2
- name: monitor
  shader: monitor.hlsl
  target: cs_5_0
  inputs:
  - slot: 0
    source: buffer:diagnostic
  output: monitor
outputs:
- name: LED RGB
  pass: content
- name: Face Test Monitor
  pass: monitor
data_inputs:
- name: Rig Segments
  slot: 0
  schema:
  - name: a
    type: float4
  - name: b
    type: float4
  - name: shape
    type: float4
  - name: meta
    type: float4
- name: Show State
  slot: 1
  schema:
  - name: value
    type: float4
- name: Fixture Program
  slot: 2
  schema:
  - name: aim
    type: float4
  - name: routing
    type: float4
  - name: movement
    type: float4
  - name: timing
    type: float4
  - name: meta
    type: float4
buffers:
- name: diagnostic
  structured: true
  element_size: 16
  element_count: 1
  persistent: true
data_outputs:
- name: Face Test State
  buffer: diagnostic
  schema:
  - name: value
    type: float4
