name: Klangrig / Reference Chase
version: '1.0'
mode: generator
resolution:
- 960
- 180
parameters:
- name: global_strobe
  type: bool
  default: false
- name: enabled
  type: bool
  default: true
- name: run
  type: bool
  default: true
- name: cycle_seconds
  type: float
  default: 1
  min: 0.4
  max: 8
- name: phase
  type: float
  default: 0
  min: 0
  max: 1
- name: chase_spread
  type: float
  default: 0.45
  min: 0
  max: 0.8
- name: pulse_width
  type: float
  default: 0.5
  min: 0.05
  max: 0.9
- name: wing_elevation
  type: float
  default: 45
  min: 0
  max: 80
- name: reverse
  type: bool
  default: false
- name: led_peak
  type: float
  default: 8
  min: 0
  max: 20
- name: native_control
  type: float
  default: 0
  min: 0
  max: 1
- name: lane1_phase
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane1_active
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane1_trigger
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane1_envelope
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane2_phase
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane2_active
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane2_trigger
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane2_envelope
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane3_phase
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane3_active
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane3_trigger
  type: float
  default: 0
  min: 0
  max: 10000000
- name: lane3_envelope
  type: float
  default: 0
  min: 0
  max: 10000000
- name: palette_a
  type: float
  default: 53247
  min: 0
  max: 16777215
- name: palette_b
  type: float
  default: 53247
  min: 0
  max: 16777215
- name: palette_c
  type: float
  default: 16711936
  min: 0
  max: 16777215
buffers:
- name: clock
  structured: true
  element_size: 16
  element_count: 10
  persistent: true
passes:
- name: clock
  shader: clock.hlsl
  target: cs_5_0
  dispatch:
  - 1
  - 1
  - 1
  output: buffer:clock
- name: preview
  shader: preview.hlsl
  target: cs_5_0
  inputs:
  - slot: 0
    source: buffer:clock
  output: output
data_outputs:
- name: Show State
  buffer: clock
  schema:
  - name: value
    type: float4
outputs:
- name: Chase Monitor
  pass: preview
