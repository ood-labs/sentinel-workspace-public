- name: bloom_u2
  shader: bloom_up.hlsl
  target: cs_5_0
  format: RGBA16F
  resolution_scale: 0.125
  inputs:
  - slot: 0
    source: pass:bloom_u3
  - slot: 1
    source: pass:bloom_d2
- name: bloom_u1
  shader: bloom_up.hlsl
  target: cs_5_0
  format: RGBA16F
  resolution_scale: 0.25
  inputs:
  - slot: 0
    source: pass:bloom_u2
  - slot: 1
    source: pass:bloom_d1
- name: bloom_u0
  shader: bloom_up.hlsl
  target: cs_5_0
  format: RGBA16F
  resolution_scale: 0.5
  inputs:
