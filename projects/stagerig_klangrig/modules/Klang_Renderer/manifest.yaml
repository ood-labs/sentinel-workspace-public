parameters:
- name: worklight
  type: float
  min: 0
  max: 4
  default: 0.123841
- name: exposure
  type: float
  min: 0.1
  max: 4
  default: 1.0
- name: haze
  type: float
  min: 0
  max: 1
  default: 0.03
- name: beam_gain
  type: float
  min: 0
  max: 20
  default: 6.031
- name: volume_samples
  type: int
  min: 4
  max: 32
  default: 8
- name: led_gain
  type: float
  default: 3.0
  min: 0
  max: 20
- name: bloom
  type: float
  default: 0.12
  min: 0
  max: 1
  description: Fraction of HDR light scattered through the bloom pyramid.
- name: sensor_white_start
  type: float
  default: 2.0
  min: 0
  max: 10
- name: sensor_response
  type: float
  default: 0.16
  min: 0
  max: 1
- name: streak_strength
  type: float
  default: 0.005
  min: 0
  max: 1
- name: streak_length
  type: float
  default: 0.08
  min: 0.01
  max: 0.3
passes:
- name: sources
  shader: sources.hlsl
  target: cs_5_0
  dispatch:
  - 576
  - 1
  - 1
  thread_group_x: 1
  thread_group_y: 1
  output: buffer:sources
  inputs:
  - slot: 0
    source: data:1
- name: geometry
  shader: geometry.hlsl
  target: draw
  vertex_count: 3169152
  topology: trianglelist
  depth: true
  depth_write: true
  cull: none
  format: RGBA16F
  inputs:
  - slot: 0
    source: data:0
  - slot: 1
    source: data:1
- name: structure
  shader: structure.hlsl
  vertex_count: 923904
  inputs:
  - slot: 0
    source: data:3
  - slot: 1
    source: buffer:sources
  - slot: 2
    source: data:5
  - slot: 3
    source: data:6
  target: draw
  topology: trianglelist
  depth: true
  depth_write: true
  cull: none
  format: RGBA16F
- name: panels
  shader: panels.hlsl
  vertex_count: 1728
