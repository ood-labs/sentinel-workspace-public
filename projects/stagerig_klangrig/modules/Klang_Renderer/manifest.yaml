    source: pass:nearest
  - slot: 1
    source: pass:volume
  - slot: 2
    source: pass:floor_reflections
- name: bloom_d0
  shader: bloom_down.hlsl
  target: cs_5_0
  format: RGBA16F
  resolution_scale: 0.5
