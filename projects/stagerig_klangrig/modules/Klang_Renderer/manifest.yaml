    source: data:2
  - slot: 1
    source: input:0
  target: draw
  topology: trianglelist
  depth: true
  depth_write: true
  cull: none
  format: RGBA16F
- name: warehouse
  shader: warehouse.hlsl
  target: draw
  vertex_count: 9216
  topology: trianglelist
  depth: true
  depth_write: true
  cull: none
  format: RGBA16F
  inputs:
  - slot: 0
    source: data:4
  - slot: 1
    source: buffer:sources
  - slot: 2
    source: data:5
  - slot: 3
    source: data:6
- name: nearest
  shader: nearest.hlsl
  target: cs_5_0
  inputs:
  - slot: 0
    source: pass:geometry
  - slot: 1
    source: pass:structure
  - slot: 2
    source: pass:panels
  - slot: 3
    source: pass:warehouse
  - slot: 4
    source: input:1
  format: RGBA16F
- name: volume
  shader: volume.hlsl
  target: cs_5_0
  inputs:
  - slot: 0
    source: data:0
  - slot: 1
    source: buffer:sources
  - slot: 2
    source: pass:nearest
  - slot: 3
    source: pass:sources
  format: RGBA16F
- name: floor_reflections
  shader: floor_reflections.hlsl
  target: cs_5_0
  format: RGBA16F
