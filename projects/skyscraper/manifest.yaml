name: "Generative Skyscraper"
version: "1.0"
mode: generator
resolution: [1280, 720]
features: [camera]

parameters:
  # ---- Massing ----
  - { name: seed, display: "Seed", type: int, min: 0, max: 255, default: 7, group: "Massing" }
  - { name: tower_height, display: "Tower Height", type: float, min: 3.0, max: 14.0, default: 7.5, group: "Massing" }
  - { name: base_width, display: "Base Width", type: float, min: 0.8, max: 4.0, default: 2.3, group: "Massing" }
  - { name: setbacks, display: "Setback Tiers", type: int, min: 2, max: 6, default: 4, group: "Massing" }
  - { name: taper, display: "Taper", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Massing" }
  - { name: twist, display: "Twist", type: float, min: -1.2, max: 1.2, default: 0.0, group: "Massing" }
  - name: plan_shape
    display: "Plan Shape"
    type: enum
    options: [Auto, Square, Slab, Chamfered, Cross, Round]
    default: 0
    flags: button_grid
    group: "Massing"

  # ---- Facade ----
  - { name: floor_height, display: "Floor Height", type: float, min: 0.12, max: 0.5, default: 0.22, group: "Facade" }
  - { name: window_pitch, display: "Window Pitch", type: float, min: 0.1, max: 0.5, default: 0.2, group: "Facade" }
  - { name: window_w_ratio, display: "Window Width", type: float, min: 0.2, max: 0.95, default: 0.68, group: "Facade" }
  - { name: window_h_ratio, display: "Window Height", type: float, min: 0.2, max: 0.95, default: 0.72, group: "Facade" }
  - { name: window_inset, display: "Window Inset", type: float, min: 0.005, max: 0.08, default: 0.042, group: "Facade" }
  - { name: pier_every, display: "Pier Every N", type: int, min: 1, max: 8, default: 4, group: "Facade" }
  - { name: mech_every, display: "Mech Floor Every N", type: int, min: 2, max: 20, default: 9, group: "Facade" }

  # ---- Roof ----
  - name: crown_style
    display: "Crown Style"
    type: enum
    options: [Auto, Spire, Stepped, Mech]
    default: 0
    flags: button_grid
    group: "Roof"
  - { name: spire_height, display: "Spire Height", type: float, min: 0.3, max: 3.0, default: 1.4, group: "Roof" }

  # ---- Scene ----
  - { name: day_night, display: "Day / Night", type: float, min: 0.0, max: 1.0, default: 0.15, group: "Scene" }
  - { name: lit_ratio, display: "Lit Window Ratio", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Scene" }
  - { name: context_amount, display: "Context Skyline", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Scene" }
  - { name: context_radius, display: "Context Radius", type: float, min: 8.0, max: 40.0, default: 22.0, group: "Scene" }
  - { name: shadows, display: "Sun Shadows", type: bool, default: true, flags: button, group: "Scene" }
  - { name: fog_density, display: "Fog Density", type: float, min: 0.0, max: 1.5, default: 0.4, group: "Scene" }

  # ---- Look ----
  - { name: structure_color, display: "Structure Color", type: color, default: [0.55, 0.5, 0.44], group: "Look" }
  - { name: glass_color, display: "Glass Color", type: color, default: [0.3, 0.45, 0.6], group: "Look" }
  - { name: emissive_color, display: "Window Glow", type: color, default: [1.0, 0.82, 0.5], group: "Look" }

  # ---- Sun ----
  - { name: sun_azimuth, display: "Sun Azimuth", type: float, min: 0.0, max: 360.0, default: 40.0, group: "Sun" }
  - { name: sun_elevation, display: "Sun Elevation", type: float, min: 3.0, max: 89.0, default: 24.0, group: "Sun" }

  # ---- Camera ----
  - { name: use_fly_cam, display: "Use Fly Camera", type: bool, default: false, flags: button, group: "Camera" }
  - { name: cam_orbit, display: "Camera Orbit", type: float, min: 0.0, max: 360.0, default: 38.0, group: "Camera" }
  - { name: cam_elevation, display: "Camera Elevation", type: float, min: -5.0, max: 80.0, default: 12.0, group: "Camera" }
  - { name: cam_distance, display: "Camera Distance", type: float, min: 3.0, max: 40.0, default: 15.0, group: "Camera" }
  - { name: cam_target_y, display: "Camera Target Y", type: float, min: 0.0, max: 10.0, default: 3.4, group: "Camera" }
  - { name: rotate_speed, display: "Auto Rotate", type: float, min: 0.0, max: 2.0, default: 0.0, group: "Camera" }

passes:
  - name: render
    shader: skyscraper.hlsl
    target: cs_5_0
    output: output
