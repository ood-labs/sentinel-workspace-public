name: "VT Plan"
version: "0.1"
mode: generator
resolution: [1024, 1024]

# The plan authority for soft_vitrine. Owns STAGE SPACE (see _shared/vitrine.hlsli) and is the
# only node that decides where anything sits. Publishes one Plan record buffer consumed by the
# stage, the growth expander, the flat-graphic renderer and the compositor.
#
# Square generator resolution on purpose: stage space, this canvas's uv, and normalized
# viewport pointer coordinates are then the same numbers, so render / pick / drag cannot drift
# apart. The editor draws a schematic plan, not a copy of the program image.

buffers:
  - { name: plan, structured: true, element_size: 48, element_count: 64, persistent: true }

state_buffers:
  - name: plan
    max_elements: 64
    schema:
      - { name: pos, type: float2 }
      - { name: size, type: float2 }
      - { name: role, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: tone, type: float }
      - { name: grp, type: float }
      - { name: phase, type: float }
      - { name: flags, type: float }
      - { name: active, type: float }

viewport:
  hint: "Click select · drag move · K kind · M material · X on/off · N re-roll · R reseed · C clear"
  interactions: [events]
  input:
    pointer: [left]
    keyboard: [k, m, x, n, r, c]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: select, label: "Select record" }
    - { gesture: left_drag, action: move, label: "Move record" }
    - { key: k, action: cycle_kind, label: "Cycle kind" }
    - { key: m, action: cycle_material, label: "Cycle material" }
    - { key: x, action: toggle_active, label: "Toggle on/off" }
    - { key: n, action: reroll, label: "Re-roll record" }
    - { key: r, action: reseed, label: "Reseed layout" }
    - { key: c, action: clear_selection, label: "Clear selection" }

parameters:
  - name: layout_preset
    display: "Layout"
    type: enum
    options: [Vitrine, Salon Wall, Diagonal Drift, Column Rack]
    default: 0
    flags: button_grid
    group: "Layout"
  # ARRANGEMENT RANDOMIZER.
  # `variation` blends the transcribed reference arrangement (0) into a free draw from the same
  # vocabulary (1): positions, kinds, materials, palette and layer membership all re-roll, while
  # the size HIERARCHY and the bimodal stroke weights are preserved so a random seed still reads
  # as a composition. `seed` picks which draw you get; scrub it to shuffle. The reference look is
  # exactly variation = 0, so it can never be lost.
  - { name: variation,     display: "Variation",      type: float, min: 0.0, max: 1.0,   default: 0.0,  group: "Layout" }
  - { name: seed,          display: "Seed",           type: float, min: 0.0, max: 512.0, default: 3.0,  group: "Layout" }
  - { name: spacing,       display: "Anchor Spacing", type: float, min: 0.4, max: 1.8,   default: 0.95, group: "Layout" }
  - { name: spread,        display: "Spread",         type: float, min: 0.5, max: 1.4,  default: 1.0,  group: "Layout" }
  - { name: scale_master,  display: "Object Scale",   type: float, min: 0.4, max: 1.8,  default: 1.0,  group: "Layout" }
  - { name: jitter,        display: "Jitter",         type: float, min: 0.0, max: 0.12, default: 0.018, group: "Layout" }
  - { name: depth_spread,  display: "Depth Spread",   type: float, min: 0.0, max: 1.0,  default: 0.6,  group: "Layout" }

  # Stage geometry lives here, not in VT_Stage: the horizon is a placement decision and both
  # the backdrop and the reflection compositor must read exactly one number for it.
  - { name: horizon,       display: "Horizon",        type: float, min: 0.35, max: 0.95, default: 0.775, group: "Stage" }
  - { name: room_depth,    display: "Room Depth",     type: float, min: 0.2,  max: 3.0,  default: 1.0,   group: "Stage" }

  - { name: mass_count,    display: "Sculpted Masses", type: int, min: 0, max: 16, default: 8,  group: "Cast" }
  - { name: stroke_count,  display: "Strokes",         type: int, min: 0, max: 16, default: 10, group: "Cast" }
  - { name: confetti,      display: "Confetti Dashes", type: int, min: 0, max: 16, default: 12, group: "Cast" }
  - { name: stroke_weight, display: "Stroke Weight",   type: float, min: 0.3, max: 2.5, default: 1.0, group: "Cast" }

passes:
  - name: plan
    shader: plan.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:plan"
  - name: canvas
    shader: canvas.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:plan" }

data_outputs:
  - name: "Plan"
    buffer: "plan"
    schema:
      - { name: pos, type: float2 }
      - { name: size, type: float2 }
      - { name: role, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: tone, type: float }
      - { name: grp, type: float }
      - { name: phase, type: float }
      - { name: flags, type: float }
      - { name: active, type: float }

outputs:
  # named distinctly from the "Plan" DATA output so a link never has to disambiguate by slot
  - { name: "Plan View", pass: canvas }
