name: "VT Volumes"
version: "0.1"
mode: generator
resolution: [1080, 1080]
working_format: RGBA16F
features: [camera]

viewport:
  hint: "Fly camera: RMB look, WASD move, wheel adjusts speed"
  interactions: [camera]

# Ray-marches the limb chains as smooth-unioned round cones with four shared materials.
# Owns Sentinel's internal camera. Its saved pose is the canonical one from
# _shared/vitrine.hlsli — position (0, 0, -1.732), 60 degree FOV — so world XY in [-1,1] fills
# the square frame and the masses register 1:1 with the flat layers. Flying it is an
# intentional creative move, not a mistake.
#
# It reads BOTH the plan and the limbs: the limb header carries the bounding sphere and the
# material, the plan record carries the body tone. Colour stays owned by the plan authority.

data_inputs:
  - name: "Plan"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: size, type: float2 }
      - { name: role, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: tone, type: float }
      - { name: grp, type: float }
      - { name: phase, type: float }
      - { name: flags, type: float }
      - { name: active, type: float }
  - name: "Limbs"
    slot: 1
    schema:
      - { name: pos, type: float3 }
      - { name: radius, type: float }
      - { name: parent, type: float }
      - { name: group, type: float }
      - { name: role, type: float }
      - { name: material, type: float }
      - { name: tparam, type: float }
      - { name: seed, type: float }
      - { name: kind, type: float }
      - { name: active, type: float }

parameters:
  - { name: blend,      display: "Limb Fusion",  type: float, min: 0.0,  max: 0.25, default: 0.03, group: "Form" }
  - { name: chrome_mono, display: "Chrome Studio", type: float, min: 0.0, max: 1.0, default: 0.8, group: "Form" }

  # EXPLORATION AXIS 4 — the clay finish. Structural surface character, swept and baked.
  - name: clay_finish
    display: "Clay Finish"
    type: enum
    options: [Plaster, Wax, Sand, Smooth]
    default: 0
    flags: button_grid
    group: "Surface"
  - { name: grain,       display: "Surface Relief", type: float, min: 0.0, max: 3.0, default: 1.9, group: "Surface" }
  - { name: grain_scale, display: "Relief Scale",   type: float, min: 0.2, max: 4.0, default: 1.3, group: "Surface" }
  - { name: frost_rim,   display: "Frost Rim",      type: float, min: 0.0, max: 2.0, default: 0.85, group: "Surface" }

  - { name: env_top,   display: "Env Ceiling", type: color, default: [0.02, 0.04, 0.15], group: "Environment" }
  - { name: env_mid,   display: "Env Wall",    type: color, default: [0.07, 0.23, 0.78], group: "Environment" }
  - { name: env_glow,  display: "Env Horizon", type: color, default: [0.62, 0.93, 1.000000], group: "Environment" }
  - { name: env_floor, display: "Env Ground",  type: color, default: [0.02, 0.035, 0.11], group: "Environment" }
  - { name: key_gain,  display: "Key Softbox", type: float, min: 0.0, max: 6.0, default: 2.4, group: "Environment" }
  - { name: fill_gain, display: "Fill",        type: float, min: 0.0, max: 2.0, default: 0.45, group: "Environment" }
  - { name: bounce,    display: "Floor Bounce", type: float, min: 0.0, max: 2.0, default: 0.6, group: "Environment" }
  - { name: shadow_amt, display: "Self Shadow", type: float, min: 0.0, max: 1.0, default: 0.75, group: "Environment" }
  - { name: ao_amt,     display: "Ambient Occlusion", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Environment" }
  - { name: exposure,   display: "Exposure",    type: float, min: 0.2, max: 3.0, default: 1.000000, group: "Environment" }

  - { name: aa_samples,  display: "Rays Per Axis", type: int,   min: 1, max: 3, default: 2, group: "Quality" }
  - { name: march_steps, display: "March Steps",   type: int,   min: 24, max: 256, default: 110, group: "Quality" }
  - { name: surface_eps, display: "Surface Epsilon", type: float, min: 0.00005, max: 0.004, default: 0.0006, group: "Quality" }
  - { name: step_scale,  display: "Step Scale",   type: float, min: 0.4, max: 1.0, default: 0.85, group: "Quality" }
  - { name: normal_eps,  display: "Normal Epsilon", type: float, min: 0.0002, max: 0.01, default: 0.0018, group: "Quality" }

passes:
  - name: march
    shader: march.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
  - name: color
    shader: color.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:march" }
  - name: cover
    shader: cover.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:march" }

outputs:
  - { name: "Volumes", pass: color }
  - { name: "Coverage", pass: cover }
