name: "VT Plates"
version: "0.1"
mode: generator
resolution: [1080, 1080]
working_format: RGBA16F

# The flat graphic family, split into the plates that hang BEHIND the sculpted masses and the
# ones that stand IN FRONT of them. The split comes from the F_FRONT flag the plan authority
# already set, so layer order is a property of the plan rather than a second decision here.

data_inputs:
  - name: "Plan"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: size, type: float2 }
      - { name: role, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: tone, type: float }
      - { name: grp, type: float }
      - { name: phase, type: float }
      - { name: flags, type: float }
      - { name: active, type: float }

parameters:
  - { name: plate_col,     display: "Grid Plate",     type: color, default: [0.880, 0.115, 0.360], group: "Grid Plate" }
  - { name: grid_density,  display: "Grid Density",   type: float, min: 2.0, max: 60.0, default: 26.0, group: "Grid Plate" }
  - { name: grid_weight,   display: "Mortar Weight",  type: float, min: 0.1, max: 3.0, default: 1.0, group: "Grid Plate" }

  - { name: checker_count, display: "Checker Count",  type: float, min: 2.0, max: 40.0, default: 13.0, group: "Checker" }
  - { name: checker_tilt,  display: "Checker Tilt",   type: float, min: 0.0, max: 1.5, default: 0.45, group: "Checker" }

  - { name: star_split,    display: "Panel Split",    type: float, min: 0.1, max: 0.9, default: 0.62, group: "Star Panel" }

  - { name: exposure,      display: "Exposure",       type: float, min: 0.2, max: 3.0, default: 1.0, group: "Look" }

passes:
  - name: back
    shader: back.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
  - name: front
    shader: front.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "data:0" }
  - name: back_color
    shader: back_color.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:back" }
  - name: back_cover
    shader: back_cover.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:back" }
  - name: front_color
    shader: front_color.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:front" }
  - name: front_cover
    shader: front_cover.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:front" }

outputs:
  - { name: "Back", pass: back_color }
  - { name: "Back Coverage", pass: back_cover }
  - { name: "Front", pass: front_color }
  - { name: "Front Coverage", pass: front_cover }
