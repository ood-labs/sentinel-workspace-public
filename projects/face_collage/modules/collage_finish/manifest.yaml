name: "Collage Finish"
version: "0.1"
mode: generator
resolution: [720, 1280]

# Reference finish: periwinkle/purple grid background with the collage inset on top, RGB-split
# glitch, grain, vignette, grade. input:0 = Collage_Render.

inputs:
  - { name: "Collage", slot: 0, required: true }

parameters:
  - { name: inset, display: "Inset", type: float, min: 0.6, max: 1.0, default: 0.9, group: "Layout" }

  - { name: grid_cells, display: "Grid Cells", type: float, min: 4.0, max: 40.0, default: 18.0, group: "Grid" }
  - { name: grid_width, display: "Grid Width", type: float, min: 0.5, max: 4.0, default: 1.2, group: "Grid" }
  - { name: grid_r, display: "Grid R", type: float, min: 0.0, max: 1.0, default: 0.10, group: "Grid" }
  - { name: grid_g, display: "Grid G", type: float, min: 0.0, max: 1.0, default: 0.06, group: "Grid" }
  - { name: grid_b, display: "Grid B", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Grid" }
  - { name: bg_top_r, display: "BG Top R", type: float, min: 0.0, max: 1.0, default: 0.52, group: "Grid" }
  - { name: bg_top_g, display: "BG Top G", type: float, min: 0.0, max: 1.0, default: 0.46, group: "Grid" }
  - { name: bg_top_b, display: "BG Top B", type: float, min: 0.0, max: 1.0, default: 0.86, group: "Grid" }
  - { name: bg_bot_r, display: "BG Bot R", type: float, min: 0.0, max: 1.0, default: 0.60, group: "Grid" }
  - { name: bg_bot_g, display: "BG Bot G", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Grid" }
  - { name: bg_bot_b, display: "BG Bot B", type: float, min: 0.0, max: 1.0, default: 0.80, group: "Grid" }

  - { name: glitch_amt, display: "Glitch",  type: float, min: 0.0, max: 1.0, default: 0.35, group: "FX" }
  - { name: chroma,     display: "Chroma",  type: float, min: 0.0, max: 3.0, default: 1.0,  group: "FX" }
  - { name: grain_amt,  display: "Grain",   type: float, min: 0.0, max: 0.3, default: 0.05, group: "FX" }
  - { name: vignette,   display: "Vignette", type: float, min: 0.0, max: 1.0, default: 0.35, group: "FX" }

  - { name: brightness, display: "Brightness", type: float, min: -0.5, max: 0.5, default: 0.0, group: "Grade" }
  - { name: contrast,   display: "Contrast",   type: float, min: 0.5, max: 2.0, default: 1.08, group: "Grade" }
  - { name: gamma,      display: "Gamma",      type: float, min: 0.5, max: 2.0, default: 1.0, group: "Grade" }

passes:
  - name: finish
    shader: finish.hlsl
    target: ps_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - name: "Final"
    pass: finish
