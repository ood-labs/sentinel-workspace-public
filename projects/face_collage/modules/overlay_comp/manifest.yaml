name: "Overlay Comp"
version: "0.2"
mode: generator
resolution: [720, 1280]

# Stacks: accumulation (input:0) + current face-cutout crisply on top (input:1) + vector overlay
# (input:2, premultiplied). fresh_amt controls how strongly the current cutout sits over the history.

inputs:
  - { name: "Accum",   slot: 0, required: true }
  - { name: "Fresh",   slot: 1, required: false }
  - { name: "Overlay", slot: 2, required: false }

parameters:
  - { name: fresh_amt, display: "Fresh On Top", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Comp" }

passes:
  - name: comp
    shader: comp.hlsl
    target: ps_5_0
    format: RGBA16F
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
    output: output

outputs:
  - name: "Out"
    pass: comp
