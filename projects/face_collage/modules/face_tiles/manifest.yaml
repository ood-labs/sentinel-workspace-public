name: "Face Tiles"
version: "0.1"
mode: generator
resolution: [720, 1280]

# Rectangular photo-patchwork of the face. input:0 = face. Irregular tile grid, per-tile
# crop/tone mismatch, hard seams. The fragmentation base the collage stamps sit on.

inputs:
  - { name: "Face", slot: 0, required: true }

parameters:
  - { name: crop_zoom,  display: "Crop Zoom",  type: float, min: 0.0, max: 0.5, default: 0.12, group: "Mismatch" }
  - { name: crop_shift, display: "Crop Shift", type: float, min: 0.0, max: 0.3, default: 0.06, group: "Mismatch" }
  - { name: tone_amt,   display: "Tone Jitter", type: float, min: 0.0, max: 0.8, default: 0.28, group: "Mismatch" }
  - { name: hue_amt,    display: "Hue Jitter",  type: float, min: 0.0, max: 2.0, default: 0.35, group: "Mismatch" }
  - { name: seed,       display: "Seed",        type: float, min: 0.0, max: 50.0, default: 3.0, group: "Mismatch" }

  - { name: seam_width,   display: "Seam Width",   type: float, min: 0.0, max: 6.0, default: 2.0, group: "Seams" }
  - { name: seam_opacity, display: "Seam Opacity", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Seams" }
  - { name: seam_r, display: "Seam R", type: float, min: 0.0, max: 1.0, default: 0.03, group: "Seams" }
  - { name: seam_g, display: "Seam G", type: float, min: 0.0, max: 1.0, default: 0.03, group: "Seams" }
  - { name: seam_b, display: "Seam B", type: float, min: 0.0, max: 1.0, default: 0.04, group: "Seams" }

passes:
  - name: tiles
    shader: tiles.hlsl
    target: ps_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - name: "Tiles"
    pass: tiles
