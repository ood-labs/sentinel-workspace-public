name: "Collage Render"
version: "0.1"
mode: generator
resolution: [720, 1280]

# Stamps atlas element cutouts (eyes/lips/...) at Face_Stitch PNode anchors, composited over the
# tracked face. input:0 = Parts_Atlas (color|matte|depth grid); input:1 = face background;
# data:0 = Anchors (PNode). Element per anchor via kind->slot; matte-cut, dir-rotated, weight-scaled.

inputs:
  - { name: "Atlas", slot: 0, required: true }
  - { name: "Face",  slot: 1, required: false }

data_inputs:
  - name: "Anchors"
    slot: 0
    schema:
      - { name: pos,    type: float2 }
      - { name: dir,    type: float2 }
      - { name: depth,  type: float }
      - { name: u,      type: float }
      - { name: v,      type: float }
      - { name: weight, type: float }
      - { name: group,  type: float }
      - { name: kind,   type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }

parameters:
  - { name: slot_count,          display: "Slot Count",   type: int, min: 1, max: 64, default: 9, group: "Atlas" }
  - { name: column_count,        display: "Column Count", type: int, min: 1, max: 8,  default: 3, group: "Atlas" }
  - { name: segmentation_column, display: "Matte Column", type: int, min: 0, max: 7,  default: 1, group: "Atlas" }
  - { name: tile_width,  display: "Tile Width",  type: float, min: 16.0, max: 512.0, default: 128.0, group: "Atlas" }
  - { name: tile_height, display: "Tile Height", type: float, min: 16.0, max: 512.0, default: 224.0, group: "Atlas" }

  - { name: stamp_scale,   display: "Stamp Scale",   type: float, min: 0.2, max: 4.0, default: 1.5, group: "Stamp" }
  - { name: stamp_opacity, display: "Stamp Opacity", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Stamp" }
  - { name: mask_cutoff,   display: "Matte Cutoff",  type: float, min: 0.0, max: 0.9, default: 0.35, group: "Stamp" }

passes:
  - name: stamps
    shader: stamps.hlsl
    target: draw
    vertex_count: 96
    topology: trianglelist
    depth: false
    cull: none
    vs_entry: VSMain
    ps_entry: PSMain
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }

  - name: present
    shader: present.hlsl
    target: ps_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "pass:stamps" }
      - { slot: 1, source: "input:1" }
    output: output

outputs:
  - name: "Collage"
    pass: present
