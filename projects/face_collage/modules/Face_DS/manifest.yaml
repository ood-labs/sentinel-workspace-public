name: "Resample"
version: "0.1"
mode: generator
resolution: [512, 896]

# Resolution converter. input:0 -> emitted at this module's resolution (set resolution_width/
# height per instance). Use to bring StreamDiff's 2x output down to a sane working size before
# matte / depth / tracking / atlas consume it. Mild sharpen counters bilinear softness.

inputs:
  - { name: "In", slot: 0, required: true }

parameters:
  - { name: sharpen, display: "Sharpen", type: float, min: 0.0, max: 1.5, default: 0.25, group: "Resample" }

passes:
  - name: resample
    shader: resample.hlsl
    target: ps_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
    output: output

outputs:
  - name: "Out"
    pass: resample
