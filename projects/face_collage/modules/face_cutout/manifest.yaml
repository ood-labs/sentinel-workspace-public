name: "Face Cutout"
version: "0.1"
mode: generator
resolution: [720, 1280]

# Cuts elliptical eye/mouth patches from the live face and stamps them at stepped-jittered spots,
# output as a straight-alpha layer for Accum to bake. input:0 = Face_DS; data:0 = Face_Stitch anchors.

inputs:
  - { name: "Face", slot: 0, required: true }

data_inputs:
  - name: "Anchors"
    slot: 0
    schema:
      - { name: pos,    type: float2 }
      - { name: dir,    type: float2 }
      - { name: depth,  type: float }
      - { name: u,      type: float }
      - { name: v,      type: float }
      - { name: weight, type: float }
      - { name: group,  type: float }
      - { name: kind,   type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }

parameters:
  - { name: stamp_rate,  display: "Stamps/sec",   type: float, min: 0.2, max: 12.0, default: 3.0, group: "Stamp" }
  - { name: spread,      display: "Scatter",      type: float, min: 0.0, max: 1.5, default: 0.5, group: "Stamp" }
  - { name: stamp_scale, display: "Stamp Scale",  type: float, min: 0.3, max: 4.0, default: 1.4, group: "Stamp" }
  - { name: sample_scale, display: "Sample Window", type: float, min: 0.3, max: 3.0, default: 1.3, group: "Stamp" }
  - { name: edge_soft,   display: "Edge Soft",    type: float, min: 0.02, max: 0.8, default: 0.25, group: "Stamp" }

passes:
  - name: cut
    shader: cutout.hlsl
    target: draw
    vertex_count: 96
    topology: trianglelist
    depth: false
    cull: none
    vs_entry: VSMain
    ps_entry: PSMain
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: output

outputs:
  - name: "Cutout"
    pass: cut
