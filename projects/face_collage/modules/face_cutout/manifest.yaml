name: "Face Cutout"
version: "0.5"
mode: generator
resolution: [720, 1280]

# Cuts eye/mouth patches from the live face and stamps many independently-animated duplicates of
# each. A compute pass writes every clone's transform to the Clones buffer (published as a
# data_output for an overlay module); the draw pass renders from that same buffer. shape:
# Circle/Square/Rounded. input:0 = Face_DS; data:0 = Face_Stitch anchors.

inputs:
  - { name: "Face", slot: 0, required: true }

data_inputs:
  - name: "Anchors"
    slot: 0
    schema:
      - { name: pos,    type: float2 }
      - { name: dir,    type: float2 }
      - { name: depth,  type: float }
      - { name: u,      type: float }
      - { name: v,      type: float }
      - { name: weight, type: float }
      - { name: group,  type: float }
      - { name: kind,   type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }

buffers:
  - name: clones
    structured: true
    element_size: 56
    element_count: 256
  - name: history
    structured: true
    element_size: 16
    element_count: 5505024   # HW*HH*HF = 256*448*48
  - name: anchor_ring
    structured: true
    element_size: 8
    element_count: 768       # HF*MAX_NODES = 48*16

parameters:
  - name: edge_mode
    display: "Shape"
    type: enum
    options: [Circle, Square, Rounded]
    default: 1
    flags: button_grid
    group: "Shape"
  - { name: edge_soft, display: "Edge Soft", type: float, min: 0.02, max: 0.8, default: 0.25, group: "Shape" }

  - { name: border_on,    display: "Border",       type: bool,  default: false, flags: button, group: "Border" }
  - { name: border_width, display: "Border Width", type: float, min: 0.01, max: 0.4, default: 0.06, group: "Border" }
  - { name: border_color, display: "Border Color", type: color, default: [0.0, 0.0, 0.0], group: "Border" }
  - { name: border_alpha, display: "Border Alpha", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Border" }

  - name: motion_mode
    display: "Motion"
    type: enum
    options: [Orbit, Noise, Spiral, Wave, Static]
    default: 1
    flags: button_grid
    group: "Motion"
  - { name: drift_speed, display: "Drift Speed", type: float, min: 0.0, max: 3.0, default: 0.5, group: "Motion" }
  - { name: drift_range, display: "Drift Range", type: float, min: 0.0, max: 0.9, default: 0.28, group: "Motion" }

  - { name: copies,      display: "Copies",       type: int,   min: 1, max: 16, default: 4, group: "Copies" }
  - { name: copy_spread, display: "Copy Spread",  type: float, min: 0.0, max: 0.6, default: 0.12, group: "Copies" }

  - name: scale_mode
    display: "Scale Mode"
    type: enum
    options: [None, Pulse, Noise]
    default: 0
    flags: button_grid
    group: "Scale"
  - { name: scale_amt,   display: "Scale Amount", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Scale" }
  - { name: scale_speed, display: "Scale Speed",  type: float, min: 0.0, max: 3.0, default: 0.5, group: "Scale" }
  - { name: scale_independent, display: "Independent X/Y", type: bool, default: false, flags: button, group: "Scale" }

  - { name: stamp_scale,  display: "Stamp Scale",   type: float, min: 0.3, max: 4.0, default: 0.42, group: "Stamp" }
  - { name: sample_scale, display: "Sample Window", type: float, min: 0.3, max: 3.0, default: 0.62, group: "Stamp" }

  - { name: history_on,   display: "History",       type: bool,  default: false, flags: button, group: "History" }
  - { name: delay_time,   display: "Delay/Copy (s)", type: float, min: 0.0, max: 1.5, default: 0.25, group: "History" }
  - { name: capture_rate, display: "Capture Rate",   type: float, min: 4.0, max: 30.0, default: 15.0, group: "History" }

passes:
  - name: history_write
    shader: history.hlsl
    target: cs_5_0
    dispatch: [32, 56, 1]
    thread_group_x: 8
    thread_group_y: 8
    inputs:
      - { slot: 0, source: "input:0" }
    output: "buffer:history"

  - name: anchor_history
    shader: anchor_history.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 16
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
    output: "buffer:anchor_ring"

  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [4, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "buffer:anchor_ring" }
    output: "buffer:clones"

  - name: cut
    shader: cutout.hlsl
    target: draw
    vertex_count: 1536
    topology: trianglelist
    depth: false
    cull: none
    vs_entry: VSMain
    ps_entry: PSMain
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:clones" }
      - { slot: 2, source: "buffer:history" }
    output: output

data_outputs:
  - name: "Clones"
    buffer: "clones"
    schema:
      - { name: pos,    type: float2 }
      - { name: ext,    type: float2 }
      - { name: uv,     type: float2 }
      - { name: win,    type: float2 }
      - { name: vel,    type: float2 }
      - { name: group,  type: float }
      - { name: kind,   type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }

outputs:
  - name: "Cutout"
    pass: cut
