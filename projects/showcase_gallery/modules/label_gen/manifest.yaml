name: "Editable Survey Labels"
version: "2.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: radius, type: float }
      - { name: intensity, type: float }
      - { name: color_mix, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

parameters:
  - name: attach_mode
    display: "Attach Mode"
    type: enum
    options: [Nodes, Ring, Grid]
    default: 0
    flags: button_grid
    group: "Labels"
  - { name: label_count, display: "Label Count", type: int, min: 0, max: 48, default: 18, group: "Labels" }
  - { name: scale, display: "Scale", type: float, min: 0.5, max: 2.0, default: 1.0, group: "Labels" }
  - { name: jitter, display: "Jitter", type: float, min: 0.0, max: 0.2, default: 0.02, group: "Labels" }
  - { name: color_mix, display: "Color Mix", type: float, min: 0.0, max: 1.0, default: 0.3, group: "Labels" }
  - { name: ring_radius, display: "Ring Radius", type: float, min: 0.1, max: 0.6, default: 0.46, group: "Labels" }
  - { name: rotation, display: "Rotation", type: float, min: -0.5, max: 0.5, default: 0.0, group: "Labels" }
  - { name: seed, display: "Seed", type: int, min: 0, max: 63, default: 2, group: "Labels" }
  - { name: reset_offsets, display: "Reset Label Offsets", type: bool, default: false, flags: button, group: "Editor" }

viewport:
  hint: "Select and drag one of the first twelve survey labels. The offset is applied after node attachment and persists through save, presets, and undo."
  interactions: [events, selection]
  selection: { mode: single, provider: ray_query, result_buffer: pick_result, object_buffer: viewport_objects }
  input:
    pointer: [left]
    keyboard: [escape]
    gestures: [click, drag]
  bindings:
    - { gesture: left_click, action: select_survey_label, label: "Select Survey Label" }
    - { gesture: left_drag, action: move_survey_label, label: "Move Survey Label" }
    - { key: escape, action: cancel_label_edit, label: "Cancel Label Edit" }

buffers:
  - { name: labels, structured: true, element_size: 32, element_count: 48 }
  - { name: label_overrides, structured: true, element_size: 16, element_count: 13, persistent: true }
  - { name: label_edit_state, structured: true, element_size: 48, element_count: 1, persistent: true }
  - { name: viewport_objects, structured: true, element_size: 120, element_count: 12, persistent: true }
  - { name: pick_result, structured: true, element_size: 40, element_count: 1, persistent: true }

state_buffers:
  - name: label_overrides
    max_elements: 12
    schema:
      - { name: offset, type: float2 }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
  - name: label_edit_state
    max_elements: 1
    schema:
      - { name: active_id, type: float }
      - { name: dragging, type: float }
      - { name: command, type: float }
      - { name: sequence, type: uint }
      - { name: pointer, type: float2 }
      - { name: start_pointer, type: float2 }
      - { name: snapshot_offset, type: float2 }
      - { name: pad1, type: float2 }

passes:
  - name: label_interaction
    shader: label_interaction.hlsl
    target: cs_5_0
    time_dependent: true
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:label_overrides" }
    output: "buffer:label_edit_state"

  - name: label_update
    shader: label_update.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:label_edit_state" }
      - { slot: 1, source: "buffer:label_overrides" }
    output: "buffer:label_overrides"

  - name: place
    shader: place_labels.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 48
    thread_group_y: 1
    output: "buffer:labels"
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "buffer:label_overrides" }

  - name: label_descriptors
    shader: label_descriptors.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 12
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:labels" }
    output: "buffer:viewport_objects"

  - name: label_pick
    shader: label_pick.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:labels" }
    output: "buffer:pick_result"

  - { name: preview, shader: preview_labels.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:labels" } ] }

outputs:
  - { name: "Survey Label Editor", pass: preview }

data_outputs:
  - name: "Labels"
    buffer: "labels"
    schema:
      - { name: pos, type: float2 }
      - { name: scale, type: float }
      - { name: label_id, type: float }
      - { name: color_mix, type: float }
      - { name: rotation, type: float }
      - { name: active, type: float }
      - { name: pad0, type: float }
  - name: "Survey Label Offsets"
    buffer: "label_overrides"
    schema:
      - { name: offset, type: float2 }
      - { name: object_id, type: uint }
      - { name: marker, type: float }
