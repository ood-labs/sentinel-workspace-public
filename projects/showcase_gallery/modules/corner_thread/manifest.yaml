name: "Corner Thread"
version: "0.1"
mode: generator
resolution: [720, 1080]

# Threads a spline through the corner points from a `features` node, over the base image.
# Video input 0 = base image; data input 0 = Corners buffer ({x,y,response,pad}, pixels).

inputs:
  - { name: "Base", slot: 0, required: true }

data_inputs:
  - name: "Corners"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }

parameters:
  - { name: palette_variant, display: "Palette", type: int, min: 0, max: 4, default: 0, hidden: true, group: "Thread" }
  - name: thread_mode
    display: "Thread Mode"
    type: enum
    options: [Loop, Chain]
    default: 0
    flags: button_grid
    group: "Thread"
  - { name: line_width,  display: "Line Width",   type: float, min: 0.5, max: 6.0,  default: 1.8, group: "Thread" }
  - { name: glow,        display: "Glow",         type: float, min: 0.0, max: 2.0,  default: 0.7, group: "Thread" }
  - { name: glow_radius, display: "Glow Radius",  type: float, min: 1.0, max: 24.0, default: 7.0, group: "Thread" }
  - { name: intensity,   display: "Intensity",    type: float, min: 0.0, max: 3.0,  default: 1.3, group: "Thread" }
  - { name: samples,     display: "Samples/Seg",  type: int,   min: 4,   max: 24,   default: 12,  group: "Thread" }
  - { name: chain_length, display: "Line Length",  type: float, min: 0.0, max: 1.0, default: 1.0, group: "Thread" }
  - { name: chain_offset, display: "Line Offset",  type: float, min: 0.0, max: 1.0, default: 0.0, group: "Thread" }
  - { name: thread_color, display: "Thread Color", type: color, default: [0.55, 0.95, 1.0], group: "Thread" }
  - { name: base_gain,   display: "Base Gain",    type: float, min: 0.0, max: 1.5,  default: 0.9, group: "Thread" }
  - { name: marker_on,   display: "Corner Markers", type: bool, default: true, flags: button, group: "Markers" }
  - { name: marker_size, display: "Marker Size",  type: float, min: 2.0, max: 20.0, default: 7.0, group: "Markers" }
  - { name: dash_amt,    display: "Dash",         type: float, min: 0.0, max: 1.0,  default: 0.0, group: "Flow" }
  - { name: dash_count,  display: "Dash Count",   type: float, min: 2.0, max: 60.0, default: 24.0, group: "Flow" }
  - { name: flow_speed,  display: "Flow Speed",   type: float, min: -3.0, max: 3.0, default: 0.4, group: "Flow" }

passes:
  - name: thread
    shader: corner_thread.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }

outputs:
  - { name: "Out", pass: thread }
