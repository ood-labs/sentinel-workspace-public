name: "Compositor"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Atmosphere", slot: 0, required: true }
  - { name: "Grid", slot: 1, required: false }
  - { name: "Blue Contours", slot: 2, required: false }
  - { name: "Accent Contours", slot: 3, required: false }
  - { name: "Links", slot: 4, required: false }
  - { name: "Nodes Glow", slot: 5, required: false }
  - { name: "HUD", slot: 6, required: false }
  - { name: "Labels Tex", slot: 7, required: false }
  - { name: "Viewport Mask", slot: 8, required: false }

parameters:
  - { name: bg_gain, display: "Atmosphere", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: grid_gain, display: "Grid", type: float, min: 0.0, max: 2.0, default: 0.5, group: "Layer Gain" }
  - { name: blue_gain, display: "Blue Contours", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Layer Gain" }
  - { name: accent_gain, display: "Accent Contours", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: links_gain, display: "Links", type: float, min: 0.0, max: 2.0, default: 0.85, group: "Layer Gain" }
  - { name: nodes_gain, display: "Nodes", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: hud_gain, display: "HUD", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Layer Gain" }
  - { name: labels_gain, display: "Labels", type: float, min: 0.0, max: 2.0, default: 0.9, group: "Layer Gain" }
  - { name: master_mix, display: "Master Mix", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Master" }
  - { name: viewport_clip, display: "Viewport Clip", type: bool, default: true, flags: button, group: "Master" }
  - { name: clip_amount, display: "Clip Amount", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Master" }
  - { name: bg_tint, display: "BG Tint", type: color, default: [0.04, 0.12, 0.18], group: "Master" }

passes:
  - name: composite
    shader: composite.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }
      - { slot: 5, source: "input:5" }
      - { slot: 6, source: "input:6" }
      - { slot: 7, source: "input:7" }
      - { slot: 8, source: "input:8" }

outputs:
  - { name: "Scene", pass: composite }
