name: "Wire Render"
version: "0.1"
mode: generator
resolution: [720, 1080]

# strata wire plate — thin ellipse rings + loose strands + a triangulated cage. Bright thin
# lines on transparent bg (premultiplied RGBA), seedable. No distortion (frames the mass).

parameters:
  - { name: palette_variant, display: "Palette", type: int, min: 0, max: 4, default: 0, hidden: true, group: "Wire" }
  - { name: wire_seed,    display: "Seed",      type: float, min: 0.0, max: 50.0, default: 4.0, group: "Wire" }
  - { name: wire_scale,   display: "Scale",     type: float, min: 0.4, max: 2.0,  default: 1.0, group: "Wire" }
  - { name: wire_width,   display: "Width",     type: float, min: 0.3, max: 3.0,  default: 1.0, group: "Wire" }
  - { name: wire_bright,  display: "Brightness", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Wire" }
  - { name: wire_opacity, display: "Opacity",   type: float, min: 0.0, max: 1.0,  default: 0.9, group: "Wire" }
  - { name: ring_count,   display: "Rings",     type: int, min: 0, max: 6, default: 3, group: "Wire" }
  - { name: strand_count, display: "Strands",   type: int, min: 0, max: 8, default: 4, group: "Wire" }
  - { name: cage_points,  display: "Cage Points", type: int, min: 0, max: 8, default: 5, group: "Wire" }

passes:
  - name: wire
    shader: wire.hlsl
    target: cs_5_0

outputs:
  - { name: "Wire", pass: wire }
