name: "Link Render"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

data_inputs:
  - name: "Links"
    slot: 0
    schema:
      - { name: a, type: float2 }
      - { name: b, type: float2 }
      - { name: c, type: float2 }
      - { name: d, type: float2 }
      - { name: width, type: float }
      - { name: group_id, type: float }
      - { name: style, type: float }
      - { name: intensity, type: float }
      - { name: progress, type: float }
      - { name: active, type: float }
      - { name: curve, type: float }
      - { name: pad0, type: float }

parameters:
  - { name: width_scale, display: "Width Scale", type: float, min: 0.2, max: 3.0, default: 1.0, group: "Stroke" }
  - { name: softness, display: "Softness", type: float, min: 0.0005, max: 0.02, default: 0.0025, group: "Stroke" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Stroke" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 2.0, default: 0.4, group: "Stroke" }
  - { name: dash_count, display: "Dash Count", type: float, min: 2.0, max: 60.0, default: 14.0, group: "Dash" }
  - { name: dash_offset, display: "Dash Offset", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Dash" }
  - { name: dash_speed, display: "Dash Speed", type: float, min: -2.0, max: 2.0, default: 0.25, group: "Dash" }
  - { name: link_color, display: "Link Color", type: color, default: [0.85, 0.93, 1.0], group: "Color" }
  - { name: orbit_color, display: "Orbit Color", type: color, default: [1.0, 0.5, 0.14], group: "Color" }

passes:
  - { name: render, shader: render_links.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }

outputs:
  - { name: "Links", pass: render }
