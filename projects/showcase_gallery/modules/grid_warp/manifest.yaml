name: "Grid Warp"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Field", slot: 0, required: true }

parameters:
  - { name: grid_density, display: "Grid Density", type: float, min: 4.0, max: 90.0, default: 30.0, group: "Grid" }
  - { name: warp_amount, display: "Warp Amount", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Grid" }
  - { name: line_width, display: "Line Width", type: float, min: 0.005, max: 0.1, default: 0.03, group: "Grid" }
  - { name: perspective, display: "Perspective", type: float, min: 0.0, max: 2.0, default: 0.5, group: "Grid" }
  - { name: fade_center, display: "Fade Center", type: float, min: 0.0, max: 1.0, default: 0.25, group: "Fade" }
  - { name: fade_edges, display: "Fade Edges", type: float, min: 0.2, max: 1.5, default: 0.7, group: "Fade" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 0.55, group: "Output" }
  - { name: drift_speed, display: "Drift Speed", type: float, min: -0.5, max: 0.5, default: 0.015, group: "Motion" }
  - { name: grid_color, display: "Grid Color", type: color, default: [0.35, 0.55, 0.72], group: "Color" }

passes:
  - { name: grid, shader: grid.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "input:0" } ] }

outputs:
  - { name: "Grid", pass: grid }
