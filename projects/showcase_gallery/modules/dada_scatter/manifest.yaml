name: "Dada Scatter"
version: "0.1"
mode: generator
resolution: [420, 640]

buffers:
  - name: parts
    structured: true
    element_size: 64
    element_count: 128

parameters:
  - { name: scatter_count, display: "Accent Count", type: int, min: 0, max: 120, default: 48, group: "Scatter" }
  - { name: scatter_seed,  display: "Seed",         type: float, min: 0.0, max: 50.0, default: 3.0, group: "Scatter" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [2, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:parts"
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:parts" }

data_outputs:
  - name: "Parts"
    buffer: "parts"
    schema:
      - { name: pos_xy, type: float2 }
      - { name: sc_xy, type: float2 }
      - { name: pos_z, type: float }
      - { name: sc_z, type: float }
      - { name: yaw, type: float }
      - { name: tilt, type: float }
      - { name: roll, type: float }
      - { name: kind, type: float }
      - { name: mat, type: float }
      - { name: group, type: float }
      - { name: p0, type: float }
      - { name: p1, type: float }
      - { name: p2, type: float }
      - { name: active, type: float }

outputs:
  - { name: "Preview", pass: preview }
