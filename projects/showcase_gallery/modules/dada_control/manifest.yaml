name: "Desert Warp Bus"
version: "2.1"
mode: generator
resolution: [480, 270]
working_format: RGBA8

parameters:
  - { name: melt_macro, display: "Melt", type: float, min: 0.0, max: 0.6, default: 0.12, group: "Structure" }
  - { name: sag_macro, display: "Sag", type: float, min: 0.0, max: 0.6, default: 0.18, group: "Structure" }
  - { name: spread_macro, display: "Spread", type: float, min: 0.7, max: 1.4, default: 1.0, group: "Structure" }
  - { name: explode_macro, display: "Explode", type: float, min: 0.0, max: 1.2, default: 0.0, group: "Structure" }
  - { name: warp_primary, display: "Primary Warp", type: float, min: 0.0, max: 1.2, default: 0.45, group: "Warp" }
  - { name: warp_secondary, display: "Secondary Warp", type: float, min: 0.0, max: 1.0, default: 0.15, group: "Warp" }
  - { name: twist_macro, display: "Twist", type: float, min: -1.0, max: 1.0, default: 0.20, group: "Warp" }
  - { name: painterly_macro, display: "Painterly", type: float, min: 0.0, max: 1.0, default: 0.40, group: "Surface" }
  - { name: facet_macro, display: "Facet", type: float, min: 0.0, max: 1.0, default: 0.10, group: "Surface" }
  - { name: hue_macro, display: "Hue Shift", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Surface" }
  - { name: heat_macro, display: "Heat Haze", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Surface" }
  - { name: scatter_macro, display: "Accent Field", type: int, min: 0, max: 80, default: 48, group: "Field" }

viewport:
  hint: "Passive warp-bus preview. Edit deformation, assembly, surface, haze, and accent parameters in Properties."

buffers:
  - { name: ctrl, structured: true, element_size: 64, element_count: 1 }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:ctrl"
  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:ctrl" }

outputs:
  - { name: "Warp Deck", pass: display }

control_outputs:
  - { name: style, buffer: ctrl, element: 0, field_offset: 0, description: "Legacy primary-mode mirror" }
  - { name: melt, buffer: ctrl, element: 0, field_offset: 4, description: "Watchdog-safe melt amount" }
  - { name: sag, buffer: ctrl, element: 0, field_offset: 8, description: "Coherent vertical sag" }
  - { name: spread, buffer: ctrl, element: 0, field_offset: 12, description: "Assembly spread" }
  - { name: explode, buffer: ctrl, element: 0, field_offset: 16, description: "Radial assembly explode" }
  - { name: primary, buffer: ctrl, element: 0, field_offset: 20, description: "Primary warp amount" }
  - { name: secondary, buffer: ctrl, element: 0, field_offset: 24, description: "Secondary warp amount" }
  - { name: twist, buffer: ctrl, element: 0, field_offset: 28, description: "Coherent twist" }
  - { name: painterly, buffer: ctrl, element: 0, field_offset: 32, description: "Painterly surface amount" }
  - { name: facet, buffer: ctrl, element: 0, field_offset: 36, description: "Faceted normal amount" }
  - { name: hue, buffer: ctrl, element: 0, field_offset: 40, description: "Palette hue rotation" }
  - { name: heat, buffer: ctrl, element: 0, field_offset: 44, description: "Desert heat haze" }
  - { name: scatter, buffer: ctrl, element: 0, field_offset: 48, description: "Accent record count" }
  - { name: primary_mode, buffer: ctrl, element: 0, field_offset: 52, description: "Primary warp mode" }
  - { name: secondary_mode, buffer: ctrl, element: 0, field_offset: 56, description: "Secondary warp mode" }
