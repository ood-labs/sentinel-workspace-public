name: "TP School"
version: "0.1"
mode: generator
resolution: [960, 640]

# The school authority for koi_tank. It owns where the fish are, where they are pointing and
# how hard they are swimming, and it is the ONLY node that decides any of that. TP_Render
# consumes the records and marches the shape; it never re-decides a position.
#
# Same division as the rest of the show: TP_Plan owns the tank, TP_Sim owns the surface,
# TP_Caustics owns the light, TP_School owns the fish. The behaviour is therefore inspectable on
# its own preview instead of being buried inside the renderer, which matters because "the fish
# look wrong" is nearly always a steering problem and almost never a shading one.

working_format: RGBA16F
output_format: RGBA16F

buffers:
  # 64 bytes per fish — see TpFish in _shared/fish.hlsli. Persistent: the school has to still be
  # where it was last cook, or there is no swimming, only teleporting.
  - { name: school, structured: true, element_size: 64, element_count: 16, persistent: true }
  - { name: sctl,   structured: true, element_size: 32, element_count: 1,  persistent: true }
  # This node's own trail history, for its own preview. See the header of trail.hlsl for why it
  # is private rather than shared with TP_Scope's.
  - { name: trail,  structured: true, element_size: 16, element_count: 1024, persistent: true }

state_buffers:
  - name: school
    max_elements: 16
    schema: &fishschema
      - { name: pos,    type: float3 }
      - { name: dir,    type: float3 }
      - { name: phase,  type: float }
      - { name: len,    type: float }
      - { name: tint,   type: float3 }
      - { name: speed,  type: float }
      - { name: bank,   type: float }
      - { name: seed,   type: float }
      - { name: active, type: float }
      - { name: sweep,  type: float }

data_inputs:
  - name: "Plan"
    slot: 0
    schema:
      - { name: pos,    type: float3 }
      - { name: dims,   type: float3 }
      - { name: role,   type: float }
      - { name: kind,   type: float }
      - { name: tint,   type: float3 }
      - { name: seed,   type: float }
      - { name: p0,     type: float }
      - { name: p1,     type: float }
      - { name: p2,     type: float }
      - { name: p3,     type: float }
      - { name: flags,  type: float }
      - { name: active, type: float }
      - { name: pad0,   type: float }
      - { name: pad1,   type: float }

parameters:
  - { name: fish_count, display: "Fish",   type: int,   min: 1,   max: 16,   default: 7,    group: "School" }
  - { name: school_seed, display: "Seed",  type: float, min: 0.0, max: 512.0, default: 23.0, group: "School" }
  - { name: sim_reset,  display: "Reset (hold)", type: bool, default: false, group: "School" }

  # Body length as a FRACTION OF THE TANK's short horizontal half-extent, not world units. The
  # basin proportions are an exploration axis on TP_Plan, and a fish authored in absolute units
  # would silently become a whale the moment the tank was made small.
  - { name: body_len,   display: "Body Length", type: float, min: 0.02, max: 0.60, default: 0.155, group: "School" }
  - { name: len_var,    display: "Size Variance", type: float, min: 0.0, max: 1.0, default: 0.45, group: "School" }

  # ---- Swimming
  - { name: swim_speed, display: "Speed",      type: float, min: 0.0,  max: 2.0,  default: 0.30, group: "Swim" }
  - { name: speed_var,  display: "Speed Variance", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Swim" }
  - { name: turn_rate,  display: "Turn Rate",  type: float, min: 0.1,  max: 8.0,  default: 1.9,  group: "Swim" }
  # Heading wander. Without it a school solves its steering and then swims in a dead straight
  # line forever, which is the single most obvious tell that nothing is alive in there.
  - { name: wander,     display: "Wander",     type: float, min: 0.0,  max: 3.0,  default: 1.0,  group: "Swim" }
  # How strongly a fish returns its nose to horizontal. Fish swim level, and a shoal reads as a
  # horizontal band even while individuals rise and dive through it. At 0 the heading wanders
  # onto the vertical and stays there — see the anti-parallel note in swim.hlsl for why that
  # state is also the worst-conditioned one the steering has.
  - { name: level_bias, display: "Level Out",  type: float, min: 0.0,  max: 6.0,  default: 0.9,  group: "Swim" }

  # ---- Flocking. Three classic terms; they are exposed separately because the interesting
  # looks are the UNBALANCED ones — cohesion alone gives a nervous knot, alignment alone gives a
  # loose drifting shoal, and the reference-grade result is usually neither extreme.
  - { name: f_align,    display: "Alignment",  type: float, min: 0.0, max: 3.0, default: 0.9, group: "Flock" }
  - { name: f_cohere,   display: "Cohesion",   type: float, min: 0.0, max: 3.0, default: 0.55, group: "Flock" }
  - { name: f_separate, display: "Separation", type: float, min: 0.0, max: 6.0, default: 2.2, group: "Flock" }
  - { name: f_radius,   display: "Neighbour Radius", type: float, min: 0.05, max: 2.0, default: 0.62, group: "Flock" }

  # ---- The envelope the school is allowed to occupy, as fractions of the tank interior.
  # Fish avoid the glass and hang off the bottom; they do not fill the box uniformly.
  - { name: wall_margin, display: "Wall Margin", type: float, min: 0.01, max: 0.6, default: 0.14, group: "Envelope" }
  - { name: depth_bias,  display: "Depth",       type: float, min: 0.0,  max: 1.0, default: 0.45, group: "Envelope" }
  - { name: depth_band,  display: "Depth Spread", type: float, min: 0.02, max: 1.0, default: 0.90, group: "Envelope" }
  # How strongly each fish seeks its own slowly drifting preferred depth. This is what makes
  # individuals traverse the full height instead of settling into the layer they were seeded at
  # — a free envelope alone only ALLOWS depth changes, it does not ask for any.
  - { name: depth_roam,  display: "Depth Roaming", type: float, min: 0.0, max: 6.0, default: 1.6, group: "Envelope" }
  # How hard the envelope pushes back. This is a STEERING force, not a clamp: a clamp pins fish
  # flat against the glass with their noses in it, which looks far worse than a rare excursion.
  - { name: avoid_gain,  display: "Avoidance",   type: float, min: 0.0, max: 8.0, default: 3.2, group: "Envelope" }

  # ---- Tail
  # Beats per second at the school's nominal speed. Real fish beat FASTER when they go faster,
  # so this is a rate coefficient and not an absolute — a fish that sprints with a lazy tail is
  # uncanny in a way that is hard to name but impossible to miss.
  - { name: beat_rate,  display: "Beat Rate",  type: float, min: 0.0, max: 12.0, default: 3.4, group: "Tail" }
  - { name: beat_amp,   display: "Beat Amount", type: float, min: 0.0, max: 1.2, default: 0.42, group: "Tail" }

  # ---- Colour
  # The CRIMSON of the markings, not the colour of the whole fish — TP_Render lays this over a
  # white ground as hard-edged patches. Variance is kept low on purpose: a pond of koi is one
  # species with individual patterning, not a bag of different-coloured fish.
  - { name: body_col,   display: "Marking Colour", type: color, default: [0.86, 0.26, 0.055], group: "Look" }
  - { name: col_var,    display: "Colour Variance", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Look" }

  # ---- What the plan and section draw besides the fish themselves.
  - { name: show_trail, display: "Trails",   type: bool, default: true, group: "Preview" }
  - { name: show_fcast, display: "Forecast", type: bool, default: true, group: "Preview" }
  # Per-fish transform gizmo: red forward, green up, blue right, from the same frame the renderer
  # builds the body in — so it shows the real orientation, bank roll included.
  - { name: show_gizmo, display: "Gizmos",   type: bool,  default: true, group: "Preview" }
  - { name: gizmo_size, display: "Gizmo Size", type: float, min: 0.0, max: 6.0, default: 1.8, group: "Preview" }
  # Seconds between recorded samples. Interval x 64 is how far back the trail actually reaches.
  - { name: trail_rate, display: "Trail Interval", type: float, min: 0.01, max: 0.5, default: 0.07, group: "Preview" }
  - { name: trail_fade, display: "Trail Fade",     type: float, min: 0.0,  max: 1.0, default: 0.8,  group: "Preview" }
  # How far ahead the forecast is extrapolated. It is an extrapolation from heading, speed and
  # the turn rate implied by bank — NOT a re-simulation — so it is honest for about a second.
  - { name: fcast_time, display: "Forecast Time",  type: float, min: 0.0,  max: 4.0, default: 1.2,  group: "Preview" }

  - name: view_mode
    display: "View"
    type: enum
    options: [Plan, Speed]
    default: 0
    flags: button_grid
    group: "Preview"

passes:
  # Owns the clock, once, single threaded — same reason as TP_Sim's ctl pass.
  - name: ctl
    shader: ctl.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:sctl"

  # One group, so every fish can see every other through groupshared. At this population an
  # O(n^2) neighbourhood is a rounding error and it is exact, which a spatial hash would not be.
  - name: swim
    shader: swim.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 16
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:school" }
      - { slot: 1, source: "buffer:sctl" }
      - { slot: 2, source: "data:0" }
    output: "buffer:school"

  # One thread per fish, appending the current position into its ring.
  - name: trail
    shader: trail.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 16
    thread_group_y: 1
    inputs:
      - { slot: 1, source: "buffer:sctl" }
      - { slot: 2, source: "buffer:school" }
    output: "buffer:trail"

  - name: canvas
    shader: canvas.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:school" }
      - { slot: 1, source: "buffer:sctl" }
      - { slot: 2, source: "data:0" }
      - { slot: 3, source: "buffer:trail" }

data_outputs:
  - name: "School"
    buffer: "school"
    schema: *fishschema

outputs:
  - { name: "School View", pass: canvas }
