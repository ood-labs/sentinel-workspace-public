name: "Pattern Spatial SDF"
version: "1.1"
mode: generator
resolution: [1920, 1080]
output_format: RGBA8
features: [camera]

viewport:
  hint: "Native Camera: RMB look, WASD move, Tab toggles fly/orbit"
  interactions: [camera]

inputs:
  - { name: "Video Color", slot: 0, required: true }
  - { name: "Depth Map", slot: 1, required: true }
  - { name: "Foreground Mask", slot: 2, required: false }
  - { name: "Tracer Surface", slot: 3, required: true }
  - { name: "Latest Stamp Mask", slot: 4, required: true }

data_inputs:
  - name: "Detections"
    slot: 0
    schema:
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: confidence, type: float }
      - { name: classId, type: float }
      - { name: _pad1, type: float }
      - { name: _pad2, type: float }

parameters:
  - name: display_mode
    display: "Display"
    type: enum
    options: [Lit, Unlit, Depth, Normals, Cutout Mask]
    default: 0
    flags: button_grid
    group: "View"

  - name: frame_mode
    display: "Housing Mode"
    type: enum
    options: [Off, Exhibit Frame, Wall Inset, Wall Breakthrough]
    default: 3
    flags: button_grid
    group: "Frame"
  - { name: frame_width, display: "Border Width", type: float, min: 0.02, max: 1.25, default: 0.26, group: "Frame/Geometry" }
  - { name: frame_gap, display: "Image Gap", type: float, min: 0.0, max: 0.3, default: 0.025, group: "Frame/Geometry" }
  - { name: frame_depth, display: "Housing Depth", type: float, min: 0.02, max: 1.5, default: 0.34, group: "Frame/Geometry" }
  - { name: frame_front_z, display: "Front Position", type: float, min: -1.0, max: 1.5, default: 0.24, group: "Frame/Geometry" }
  - { name: frame_corner_radius, display: "Corner Roundness", type: float, min: 0.0, max: 0.5, default: 0.015, group: "Frame/Geometry" }
  - { name: frame_bevel, display: "Face Bevel", type: float, min: 0.0, max: 0.15, default: 0.008, group: "Frame/Geometry" }
  - { name: wall_extent, display: "Wall Surround", type: float, min: 0.25, max: 6.0, default: 2.5, group: "Frame/Wall Inset" }
  - { name: inset_depth, display: "Relief Recess / Pull", type: float, min: -1.0, max: 2.0, default: 0.28, group: "Frame/Wall Inset" }
  - { name: frame_distort, display: "Distort Housing", type: bool, default: false, flags: button, group: "Frame/Distortion" }
  - { name: frame_color, display: "Housing Color", type: color, default: [0.12, 0.14, 0.18], group: "Frame/Material" }
  - { name: frame_roughness, display: "Housing Roughness", type: float, min: 0.02, max: 1.0, default: 0.28, group: "Frame/Material" }
  - { name: frame_metallic, display: "Housing Metallic", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Frame/Material" }
  - { name: frame_specular, display: "Housing Specular", type: float, min: 0.0, max: 3.0, default: 0.9, group: "Frame/Material" }

  - { name: fx_amount, display: "Distortion Master", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Distortion" }
  - { name: fx_speed, display: "Time Speed", type: float, min: 0.0, max: 3.0, default: 0.6, group: "Distortion" }
  - { name: melt_amt, display: "Melt", type: float, min: 0.0, max: 3.0, default: 0.85, group: "Distortion" }

  - { name: w1_amt, display: "Amount", type: float, min: 0.0, max: 2.0, default: 0.5, group: "Distortion/Warp 1" }
  - { name: w1_mode, display: "Mode", type: enum, options: [Flow, Ripple, Turbulent, Fractal, Steps, Boxes, Shatter], default: 0, flags: button_grid, group: "Distortion/Warp 1" }
  - { name: w1_freq, display: "Frequency", type: float, min: 0.1, max: 8.0, default: 1.0, group: "Distortion/Warp 1" }
  - { name: w1_speed, display: "Speed", type: float, min: 0.0, max: 3.0, default: 0.6, group: "Distortion/Warp 1" }
  - { name: w1_yaw, display: "Yaw", type: float, min: -3.1416, max: 3.1416, default: 0.0, group: "Distortion/Warp 1/Domain" }
  - { name: w1_pitch, display: "Pitch", type: float, min: -3.1416, max: 3.1416, default: 0.0, group: "Distortion/Warp 1/Domain" }
  - { name: w1_ox, display: "Offset X", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Warp 1/Domain" }
  - { name: w1_oy, display: "Offset Y", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Warp 1/Domain" }
  - { name: w1_oz, display: "Offset Z", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Warp 1/Domain" }

  - { name: w2_amt, display: "Amount", type: float, min: 0.0, max: 2.0, default: 0.0, group: "Distortion/Warp 2" }
  - { name: w2_mode, display: "Mode", type: enum, options: [Flow, Ripple, Turbulent, Fractal, Steps, Boxes, Shatter], default: 2, flags: button_grid, group: "Distortion/Warp 2" }
  - { name: w2_freq, display: "Frequency", type: float, min: 0.1, max: 8.0, default: 1.8, group: "Distortion/Warp 2" }
  - { name: w2_speed, display: "Speed", type: float, min: 0.0, max: 3.0, default: 0.9, group: "Distortion/Warp 2" }
  - { name: w2_yaw, display: "Yaw", type: float, min: -3.1416, max: 3.1416, default: 1.57, group: "Distortion/Warp 2/Domain" }
  - { name: w2_pitch, display: "Pitch", type: float, min: -3.1416, max: 3.1416, default: 0.0, group: "Distortion/Warp 2/Domain" }
  - { name: w2_ox, display: "Offset X", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Warp 2/Domain" }
  - { name: w2_oy, display: "Offset Y", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Warp 2/Domain" }
  - { name: w2_oz, display: "Offset Z", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Warp 2/Domain" }

  - { name: twist_amt, display: "Twist", type: float, min: -10.0, max: 10.0, default: 0.0, group: "Distortion/Shape" }
  - { name: bend_amt, display: "Bend", type: float, min: -1.5, max: 1.5, default: 0.0, group: "Distortion/Shape" }
  - { name: swirl_amt, display: "Swirl", type: float, min: -3.0, max: 3.0, default: 0.0, group: "Distortion/Shape" }
  - { name: wave_amt, display: "Wave", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Distortion/Shape" }
  - { name: wave_freq, display: "Wave Frequency", type: float, min: 0.5, max: 8.0, default: 2.0, group: "Distortion/Shape" }
  - { name: dist_cx, display: "Center X", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Center" }
  - { name: dist_cy, display: "Center Y", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Center" }
  - { name: dist_cz, display: "Center Z", type: float, min: -4.0, max: 4.0, default: 0.0, group: "Distortion/Center" }

  - name: relief_direction
    display: "Direction"
    type: enum
    options: [Outward, Inward]
    default: 0
    flags: button_grid
    group: "Relief"
  - { name: relief_amount, display: "Relief Amount", type: float, min: 0.0, max: 10.0, default: 0.32, group: "Relief" }
  - { name: recess_amount, display: "Inward Recess", type: float, min: 0.0, max: 1.0, default: 0.15, group: "Relief" }
  - { name: panel_thickness, display: "Panel Thickness", type: float, min: 0.02, max: 0.8, default: 0.14, group: "Relief" }
  - { name: panel_scale, display: "Panel Scale", type: float, min: 0.35, max: 2.5, default: 1.25, group: "Relief" }
  - { name: edge_fade, display: "Edge Seal", type: float, min: 0.005, max: 0.3, default: 0.065, group: "Relief" }
  - { name: mirror_z, display: "Mirror Front to Back", type: bool, default: false, flags: button, group: "Relief/Z Mirror" }
  - { name: mirror_core, display: "Center Thickness", type: float, min: 0.01, max: 0.6, default: 0.08, group: "Relief/Z Mirror" }

  - name: integration_mode
    display: "Integration Mode"
    type: enum
    options: [Surface Relief, Separate Volume]
    default: 0
    flags: button_grid
    group: "Spatial Integration"
  - { name: tracer_mix, display: "Surface Mix", type: float, min: 0.0, max: 1.0, default: 0.85, group: "Spatial Integration/Tracer", description: "Opacity of the tracer only. Fades its colour and emission and deletes it entirely at 0. Does NOT move it - the lift belongs to Relief." }
  - { name: tracer_relief, display: "Relief", type: float, min: 0.0, max: 5.0, default: 0.18, group: "Spatial Integration/Tracer", description: "How far the tracer lifts off whatever it is anchored to. Independent of Surface Mix, so a fade never heaves the slab up out of the surface." }
  - { name: tracer_depth_follow, display: "Depth Follow", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Spatial Integration/Tracer", description: "1 rides the artwork's depth relief. 0 pins the tracer to a rigid flat plane the depth map cannot touch, positioned by Plane Offset. In between cross-fades the two." }
  - { name: tracer_plane_offset, display: "Plane Offset", type: float, min: -3.0, max: 3.0, default: 0.0, group: "Spatial Integration/Tracer", description: "Z position of the fixed plane. Only has an effect as Depth Follow moves away from 1; at full Depth Follow the tracer is anchored to the artwork instead." }
  - { name: tracer_emission, display: "Emission", type: float, min: 0.0, max: 6.0, default: 0.8, group: "Spatial Integration/Tracer" }
  - { name: detections_enabled, display: "Detection Frames", type: bool, default: true, flags: button, group: "Spatial Integration/Detections" }
  - { name: detection_confidence, display: "Confidence Floor", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Spatial Integration/Detections" }
  - { name: detection_line_width, display: "Frame Width", type: float, min: 0.00001, max: 0.08, default: 0.0004, description: "Thickness of the detection frame rail. This drives BOTH the flat 2D outline and, in Spatial integration mode, the real 3D rail geometry. A hard floor used to clamp the geometry at 0.004 in Boxes mode regardless of this value, so the frame could not be made thin; both geometry modes now share a 0.00012 floor that exists only to stop the distance field collapsing to zero thickness.", group: "Spatial Integration/Detections" }
  - { name: detection_opacity, display: "Frame Opacity", type: float, min: 0.0, max: 1.0, default: 1.0, description: "Master fade for the detection frames. At 0 they are gone completely - the 3D rail geometry stops being generated, so nothing is left to occlude the panel, catch a highlight or cast a shadow. Fading also thins the rail and sinks it back toward the surface as it goes, so it retreats rather than hovering at full height and then popping out. Affects the corner dots and depth struts too.", group: "Spatial Integration/Detections" }
  - { name: detection_relief, display: "Relief", type: float, min: 0.0, max: 5.0, default: 0.22, group: "Spatial Integration/Detections" }
  - { name: detection_color, display: "Frame Color", type: color, default: [1.0, 0.32, 0.08], group: "Spatial Integration/Detections" }
  - { name: detection_corner_dots, display: "Corner Dots", type: bool, default: true, flags: button, group: "Spatial Integration/Detections" }
  - { name: detection_dot_radius, display: "Dot Radius", type: float, min: 0.0005, max: 0.15, default: 0.018, group: "Spatial Integration/Detections" }
  - { name: detection_depth_struts, display: "Depth Struts", type: bool, default: true, flags: button, group: "Spatial Integration/Detections" }
  - name: detection_geometry_mode
    display: "Geometry"
    type: enum
    options: [Depth Rails, Wireframe]
    default: 1
    flags: button_grid
    group: "Spatial Integration/Detections"
  - name: detection_color_mode
    display: "Color Mode"
    type: enum
    options: [Accent, Class Palette, Confidence Heat]
    default: 1
    flags: button_grid
    group: "Spatial Integration/Detections"

  - { name: depth_invert, display: "Invert Depth", type: bool, default: false, flags: button, group: "Depth/Range" }
  - { name: depth_black, display: "Black Level", type: float, min: 0.0, max: 0.95, default: 0.0, group: "Depth/Range" }
  - { name: depth_white, display: "White Level", type: float, min: 0.05, max: 1.0, default: 1.0, group: "Depth/Range" }
  - { name: depth_gamma, display: "Depth Gamma", type: float, min: 0.2, max: 4.0, default: 1.0, group: "Depth/Range" }

  - name: cutout_mode
    display: "Geometry Cutout"
    type: enum
    options: [Off, Depth Black Level, Background Mask, Both]
    default: 2
    flags: button_grid
    group: "Cutout"
  - { name: mask_threshold, display: "Mask Threshold", type: float, min: 0.0, max: 0.95, default: 0.35, group: "Cutout/Background Mask" }
  - { name: mask_erode, display: "Mask Erode / Dilate", type: float, min: -0.3, max: 0.5, default: 0.025, group: "Cutout/Background Mask" }
  - { name: mask_invert, display: "Invert Mask", type: bool, default: false, flags: button, group: "Cutout/Background Mask" }
  - { name: cutout_feather, display: "Edge Feather", type: float, min: 0.001, max: 0.3, default: 0.05, group: "Cutout" }
  - { name: cutout_wall_width, display: "Edge SDF Width", type: float, min: 0.02, max: 0.8, default: 0.22, group: "Cutout/Quality" }

  - { name: framing_pan, display: "Pan", type: point2D, min: [-1.0, -1.0], max: [1.0, 1.0], default: [0.0, 0.0], group: "Framing" }
  - { name: framing_zoom, display: "Zoom", type: float, min: 1.0, max: 4.0, default: 1.0, group: "Framing" }

  - { name: light_orbit, display: "Light Direction", type: point2D, min: [-3.1416, -0.2], max: [3.1416, 1.55], default: [-0.53856, 0.7125], group: "Lighting/Key" }
  - { name: light_color, display: "Light Color", type: color, default: [1.000000, 0.9, 0.78], group: "Lighting/Key" }
  - { name: key_intensity, display: "Key Intensity", type: float, min: 0.0, max: 5.0, default: 1.962, group: "Lighting/Key" }
  - { name: shadows_enabled, display: "Self Shadows", type: bool, default: true, flags: button, group: "Lighting/Shadows" }
  - { name: shadow_softness, display: "Shadow Softness", type: float, min: 1.0, max: 32.0, default: 1.737, group: "Lighting/Shadows" }
  # The overlays hover above the artwork, so casting from them puts a hard shadow
  # across the image every time the tracer switches on. Off by default.
  - { name: overlay_shadows, display: "Overlays Cast Shadows", type: bool, default: false, flags: button, description: "Whether the tracer slab and the detection frames cast shadows and contribute ambient occlusion. They are overlays floating above the panel, so casting from them stamps a hard shadow across the artwork underneath every time the tracer switches on, and the AO pass darkens the same area again. Off keeps the panel lighting stable and unaffected by overlays. The panel content and the housing frame always cast either way.", group: "Lighting/Shadows" }
  - { name: shadow_strength, display: "Shadow Strength", type: float, min: 0.0, max: 1.0, default: 1.0, description: "How dark shadowed areas are allowed to get. At 1.0 a fully occluded point receives no key light at all, which is what makes deep relief read as harsh. Lower values lift the shadow floor so form still reads without the image going black wherever geometry blocks the key. Independent of Shadow Softness, which controls the penumbra width rather than the depth.", group: "Lighting/Shadows" }
  - { name: ambient_color, display: "Ambient Color", type: color, default: [0.18, 0.26, 0.38], group: "Lighting/Ambient" }
  - { name: ambient_strength, display: "Ambient Strength", type: float, min: 0.0, max: 3.0, default: 0.95, group: "Lighting/Ambient" }
  - { name: ao_strength, display: "Cavity Occlusion", type: float, min: 0.0, max: 3.0, default: 1.15, group: "Lighting/Ambient" }
  - { name: ao_floor, display: "AO Minimum", type: float, min: 0.0, max: 1.0, default: 0.3, group: "Lighting/Ambient" }
  - { name: rim_color, display: "Rim Color", type: color, default: [0.18, 0.42, 0.72], group: "Lighting/Rim" }
  - { name: rim_strength, display: "Rim Strength", type: float, min: 0.0, max: 2.0, default: 0.22, group: "Lighting/Rim" }
  - { name: rim_power, display: "Rim Tightness", type: float, min: 1.0, max: 10.0, default: 4.000000, group: "Lighting/Rim" }

  - { name: normal_strength, display: "Normal Strength", type: float, min: 0.0, max: 2.0, default: 1.335, group: "Material" }
  - { name: normal_sample_scale, display: "Normal Sample Radius", type: float, min: 0.25, max: 8.0, default: 1.573, group: "Material/Normal Refinement" }
  - { name: normal_smoothing, display: "Normal Smoothing", type: float, min: 0.0, max: 1.0, default: 0.21, group: "Material/Normal Refinement" }
  - { name: normal_smooth_radius, display: "Smooth Radius", type: float, min: 1.0, max: 8.0, default: 5.42, group: "Material/Normal Refinement" }
  - { name: normal_front_bias, display: "Front-Facing Bias", type: float, min: 0.0, max: 1.0, default: 0.945, group: "Material/Normal Refinement" }
  - { name: normal_edge_soften, display: "Cutout Edge Soften", type: float, min: 0.0, max: 1.0, default: 0.65, group: "Material/Edge Cleanup" }
  - { name: normal_edge_width, display: "Edge Detection Width", type: float, min: 0.001, max: 0.35, default: 0.08, group: "Material/Edge Cleanup" }
  - { name: edge_fill_strength, display: "Cutout Edge Fill", type: float, min: 0.0, max: 2.0, default: 0.35, group: "Material/Edge Cleanup" }
  - { name: side_fill_strength, display: "Side Wall Fill", type: float, min: 0.0, max: 2.0, default: 0.22, group: "Material/Edge Cleanup" }
  - { name: edge_color_inset, display: "Edge Color Inset", type: float, min: 0.0, max: 8.0, default: 3.549, group: "Material/Edge Cleanup" }
  - { name: roughness, display: "Roughness", type: float, min: 0.02, max: 1.0, default: 0.62, group: "Material" }
  - { name: specular_strength, display: "Specular", type: float, min: 0.0, max: 2.0, default: 0.22, group: "Material" }
  - { name: albedo_tint, display: "Albedo Tint", type: color, default: [1.000000, 1.000000, 1.000000], group: "Material/Color" }
  - { name: color_gain, display: "Color Gain", type: float, min: 0.0, max: 3.0, default: 1.000000, group: "Material/Color" }
  - { name: saturation, display: "Saturation", type: float, min: 0.0, max: 2.0, default: 1.000000, group: "Material/Color" }
  - { name: input_gamma, display: "Input Gamma", type: float, min: 0.5, max: 3.0, default: 2.4, group: "Material/Color" }
  - { name: exposure, display: "Exposure", type: float, min: 0.1, max: 4.0, default: 0.752, group: "Material/Color" }
  - { name: output_gamma, display: "Output Gamma", type: float, min: 1.0, max: 3.0, default: 2.2, group: "Material/Color" }

  - { name: background_top, display: "Background Top", type: color, default: [0.055, 0.075, 0.11], group: "Background" }
  - { name: background_bottom, display: "Background Bottom", type: color, default: [0.008, 0.01, 0.016], group: "Background" }

  # Binary white-on-black laser output. The trace is extracted from the
  # cutout-controlled SDF surface classification, never from shaded RGB.
  - { name: laser_line_thickness_px, display: "Line Thickness Px", type: float, min: 0.5, max: 12.0, default: 2.0, group: "Laser/Output" }
  - { name: laser_edge_buffer_px, display: "Blank Edge Buffer Px", type: float, min: 0.0, max: 128.0, default: 8.0, group: "Laser/Output" }
  # Legacy trace fields remain hidden only to retain the already-compiled SDF
  # kernel. Their live values are forced to a neutral full-outline/no-flash
  # configuration; timing belongs to Pattern Canvas.
  - { name: trace_reveal, display: "Reveal", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Laser/Internal", hidden: true }
  - { name: trace_count, display: "Count", type: float, min: -1.0, max: 32.0, default: -1.0, group: "Laser/Internal", hidden: true }
  - { name: trace_mode, display: "Mode", type: float, min: 0.0, max: 5.0, default: 0.0, group: "Laser/Internal", hidden: true }
  - { name: trace_speed, display: "Speed", type: float, min: 0.0, max: 8.0, default: 0.0, group: "Laser/Internal", hidden: true }
  - { name: trace_cycle, display: "Cycle (s)", type: float, min: 0.05, max: 10.0, default: 2.0, group: "Laser/Internal", hidden: true }
  - { name: flash_strobe, display: "Flash Strobe", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Laser/Internal", hidden: true }
  - { name: flash_rate, display: "Flash Rate", type: float, min: 0.0, max: 10.0, default: 0.0, group: "Laser/Internal", hidden: true }
  - { name: flash_width, display: "Flash Width", type: float, min: 0.0, max: 0.5, default: 0.0, group: "Laser/Internal", hidden: true }

  - { name: ray_steps, display: "Ray Steps", type: int, min: 48, max: 160, default: 160, group: "Quality" }
  - { name: march_safety, display: "March Safety", type: float, min: 0.1, max: 0.9, default: 0.18, group: "Quality" }
  - { name: hit_epsilon, display: "Surface Precision", type: float, min: 0.0005, max: 0.01, default: 0.003, group: "Quality" }
  - { name: max_distance, display: "Max Distance", type: float, min: 4.0, max: 30.0, default: 16.0, group: "Quality" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }
      - { slot: 5, source: "data:0" }
  - name: video
    shader: video_output.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:render" }
  - name: laser
    shader: laser_output.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "pass:render" }

outputs:
  - { name: "Video", pass: video }
  - { name: "Laser", pass: laser }
