name: "Pattern Tracer"
version: "1.0"
mode: generator
resolution: [1080, 1350]
time_dependent: true

inputs:
  - { name: "Canvas", slot: 0, required: true }

data_inputs:
  - name: "Spawn Points"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: sequence, type: uint }
      - { name: active, type: uint }

buffers:
  - { name: displacement_clock, structured: true, element_size: 16, element_count: 1, persistent: true }

parameters:
  - name: trace_mode
    display: "Trace Mode"
    type: enum
    options: [Spline, Chain, Loop, Proximity, Nearest, Cage]
    default: 0
    flags: button_grid
    group: "Topology"
  - { name: link_distance, display: "Link Distance", type: float, min: 0.02, max: 1.0, default: 0.28, group: "Topology" }
  - { name: links_per_point, display: "Links Per Point", type: int, min: 1, max: 6, default: 2, group: "Topology" }

  - { name: point_count, display: "Recent Points", type: int, min: 2, max: 32, default: 16, group: "Trace" }
  - { name: trace_length, display: "Trace Length", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Trace" }
  - { name: trace_offset, display: "Trace Offset", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Trace" }
  - { name: smoothness, display: "Smoothness", type: int, min: 4, max: 12, default: 8, group: "Trace" }

  - { name: line_width, display: "Line Width", type: float, min: 0.5, max: 12.0, default: 2.0, group: "Style" }
  - { name: line_color, display: "Line Color", type: color, default: [1.0, 1.0, 1.0], group: "Style" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Style" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 2.0, default: 0.35, group: "Style" }
  - { name: glow_radius, display: "Glow Radius", type: float, min: 1.0, max: 24.0, default: 6.0, group: "Style" }
  - { name: base_gain, display: "Canvas Gain", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Style" }

  - { name: displace_amount, display: "Displacement", type: float, min: -80.0, max: 80.0, default: 0.0, group: "Displacement" }
  - { name: displace_radius, display: "Radius", type: float, min: 4.0, max: 180.0, default: 48.0, group: "Displacement" }
  - { name: displace_ripple, display: "Ripple", type: float, min: 0.0, max: 1.0, default: 0.65, group: "Displacement" }
  - { name: displace_frequency, display: "Bands", type: float, min: 1.0, max: 12.0, default: 4.0, group: "Displacement" }
  - { name: displace_phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Displacement" }
  - { name: displace_speed, display: "Speed", type: float, min: -3.0, max: 3.0, default: 0.6, group: "Displacement" }

  - { name: show_points, display: "Main Point Dots", type: bool, default: true, flags: button, group: "Points" }
  - { name: point_size, display: "Point Size", type: float, min: 2.0, max: 20.0, default: 6.0, group: "Points" }
  - name: point_style
    display: "Point Style"
    type: enum
    options: [Solid, Ring, Ring + Dot]
    default: 2
    flags: button_grid
    group: "Points"
  - { name: point_color, display: "Point Color", type: color, default: [1.0, 1.0, 1.0], group: "Points" }
  - { name: point_opacity, display: "Point Opacity", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Points" }

passes:
  - name: displacement_phase
    shader: displacement_phase.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:displacement_clock" }
    output: "buffer:displacement_clock"

  - name: trace
    shader: render_modes.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
      - { slot: 2, source: "buffer:displacement_clock" }
    output: output

outputs:
  - { name: "Traced Canvas", pass: trace }
