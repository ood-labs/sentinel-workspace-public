name: "Pattern Tracer"
version: "1.0"
mode: generator
resolution: [1080, 1350]
time_dependent: true

inputs:
  - { name: "Canvas", slot: 0, required: true }

data_inputs:
  - name: "Spawn Points"
    slot: 0
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: sequence, type: uint }
      - { name: active, type: uint }

parameters:
  - { name: point_count, display: "Recent Points", type: int, min: 2, max: 32, default: 16, group: "Trace" }
  - { name: trace_length, display: "Trace Length", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Trace" }
  - { name: trace_offset, display: "Trace Offset", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Trace" }
  - { name: smoothness, display: "Smoothness", type: int, min: 4, max: 12, default: 8, group: "Trace" }

  - { name: line_width, display: "Line Width", type: float, min: 0.5, max: 12.0, default: 2.0, group: "Style" }
  - { name: line_color, display: "Line Color", type: color, default: [1.0, 1.0, 1.0], group: "Style" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Style" }
  - { name: glow, display: "Glow", type: float, min: 0.0, max: 2.0, default: 0.35, group: "Style" }
  - { name: glow_radius, display: "Glow Radius", type: float, min: 1.0, max: 24.0, default: 6.0, group: "Style" }
  - { name: base_gain, display: "Canvas Gain", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Style" }

  - { name: show_points, display: "Point Markers", type: bool, default: false, flags: button, group: "Points" }
  - { name: point_size, display: "Point Size", type: float, min: 2.0, max: 20.0, default: 6.0, group: "Points" }

passes:
  - name: trace
    shader: render.hlsl
    target: cs_5_0
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
    output: output

outputs:
  - { name: "Traced Canvas", pass: trace }
