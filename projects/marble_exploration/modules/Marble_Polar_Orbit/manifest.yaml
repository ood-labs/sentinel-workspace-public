name: "Polar Orbit"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "Temporal Scene", slot: 0, required: true }

parameters:
  - { name: warp, display: "Polar Warp", type: float, min: 0.0, max: 1.0, default: 0.54, group: "Orbit" }
  - { name: bands, display: "Orbit Bands", type: float, min: 2.0, max: 18.0, default: 7.0, group: "Orbit" }
  - { name: spin, display: "Orbit Spin", type: float, min: -1.0, max: 1.0, default: 0.12, group: "Motion" }
  - { name: drift, display: "Band Drift", type: float, min: 0.0, max: 1.0, default: 0.07, group: "Motion" }
  - { name: center_mix, display: "Center Preserve", type: float, min: 0.0, max: 1.0, default: 0.68, group: "Output" }
  - { name: orbit_gain, display: "Orbit Gain", type: float, min: 0.0, max: 1.5, default: 0.64, group: "Output" }

passes:
  - name: orbit
    shader: orbit.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }

outputs:
  - { name: "Orbit Scene", pass: orbit }
