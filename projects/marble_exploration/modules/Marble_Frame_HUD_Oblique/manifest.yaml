name: "Frame HUD"
version: "1.0"
mode: generator
resolution: [1920, 1080]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: ring_count, display: "Ring Count", type: int, min: 2, max: 40, default: 20, group: "Bezel" }
  - { name: radius_spread, display: "Radius Spread", type: float, min: 0.0, max: 0.6, default: 0.24, group: "Bezel" }
  - { name: viewport_radius, display: "Viewport Radius", type: float, min: 0.3, max: 1.3, default: 0.94, group: "Bezel" }
  - { name: inner_ratio, display: "Inner Ring Ratio", type: float, min: 0.1, max: 1.0, default: 0.52, group: "Bezel" }
  - { name: segment_gaps, display: "Segment Gaps", type: int, min: 0, max: 12, default: 4, group: "Bezel" }
  - { name: tick_density, display: "Tick Density", type: float, min: 20.0, max: 400.0, default: 190.0, group: "Ticks" }
  - { name: corner_ticks, display: "Corner Ticks", type: bool, default: true, flags: button, group: "Ticks" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 3.0, default: 1.0, group: "Output" }
  - { name: rot_speed_a, display: "Rot Speed A", type: float, min: -0.5, max: 0.5, default: 0.02, group: "Motion" }
  - { name: rot_speed_b, display: "Rot Speed B", type: float, min: -0.5, max: 0.5, default: -0.03, group: "Motion" }
  - { name: ring_color, display: "Ring Color", type: color, default: [0.35, 0.55, 0.72], group: "Color" }
  - { name: accent_color, display: "Accent Color", type: color, default: [1.0, 0.55, 0.2], group: "Color" }

passes:
  - { name: compute, shader: compute_hud.hlsl, target: cs_5_0 }
  - { name: hud, shader: hud_out.hlsl, target: ps_5_0, inputs: [ { slot: 0, source: "pass:compute" } ] }
  - { name: mask, shader: mask_out.hlsl, target: ps_5_0, format: RGBA8, inputs: [ { slot: 0, source: "pass:compute" } ] }

outputs:
  - { name: "HUD", pass: hud }
  - { name: "Viewport Mask", pass: mask }
