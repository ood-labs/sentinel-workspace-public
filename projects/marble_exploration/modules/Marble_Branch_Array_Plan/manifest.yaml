name: "SDF Orbit Array Plan"
version: "0.1"
mode: generator
resolution: [640, 360]

buffers:
  - name: parts
    structured: true
    element_size: 64
    element_count: 48

parameters:
  - { name: orbit_radius, display: "Orbit Radius", type: float, min: 0.4, max: 2.4, default: 1.18, group: "Array" }
  - { name: orbital_twist, display: "Orbital Twist", type: float, min: -2.0, max: 2.0, default: 0.42, group: "Array" }
  - { name: shard_scale, display: "Shard Scale", type: float, min: 0.2, max: 2.0, default: 0.88, group: "Array" }
  - { name: cutter_scale, display: "Cutter Scale", type: float, min: 0.2, max: 2.0, default: 0.76, group: "Carve" }
  - { name: asymmetry, display: "Array Asymmetry", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Carve" }
  - { name: phase_rate, display: "Phase Rate", type: float, min: 0.0, max: 2.0, default: 0.24, group: "Motion" }
  - { name: pulse, display: "Sequencer Pulse", type: float, min: 0.0, max: 4.0, default: 0.0, group: "Motion" }
  - { name: seed, display: "Array Seed", type: float, min: 0.0, max: 20.0, default: 9.3, group: "Motion" }

passes:
  - { name: compute, shader: compute.hlsl, target: cs_5_0, dispatch: [1,1,1], thread_group_x: 1, thread_group_y: 1, output: "buffer:parts" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:parts" } ] }

data_outputs:
  - name: "SDF Parts"
    buffer: parts
    schema:
      - { name: transform_a, type: float4 }
      - { name: transform_b, type: float4 }
      - { name: rotation, type: float4 }
      - { name: meta, type: float4 }

outputs:
  - name: "Orbit Array Preview"
    pass: preview
