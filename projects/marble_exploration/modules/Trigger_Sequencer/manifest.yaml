name: "Trigger Sequencer"
version: "0.1"
mode: generator
resolution: [960, 540]

# Four clocked trigger lanes. The structured output is intentionally stable so a
# future audio input can replace the clock/trigger source without changing the
# downstream expression contract.
buffers:
  - name: controls
    structured: true
    element_size: 64
    element_count: 1

parameters:
  - name: tempo
    display: "Tempo (BPM)"
    type: float
    min: 20.0
    max: 240.0
    default: 96.0
    group: "Clock"
  - name: steps_per_beat
    display: "Steps / Beat"
    type: enum
    options: [1, 2, 4, 8]
    default: 1
    flags: button_grid
    group: "Clock"
  - name: swing
    display: "Swing"
    type: float
    min: 0.0
    max: 0.45
    default: 0.0
    group: "Clock"
  - name: attack
    display: "Attack (s)"
    type: float
    min: 0.001
    max: 1.0
    default: 0.02
    group: "ADSR"
  - name: decay
    display: "Decay (s)"
    type: float
    min: 0.001
    max: 1.0
    default: 0.12
    group: "ADSR"
  - name: sustain
    display: "Sustain"
    type: float
    min: 0.0
    max: 1.0
    default: 0.65
    group: "ADSR"
  - name: release
    display: "Release (s)"
    type: float
    min: 0.001
    max: 1.5
    default: 0.18
    group: "ADSR"
  - name: gate_length
    display: "Gate Length"
    type: float
    min: 0.05
    max: 0.98
    default: 0.72
    group: "ADSR"
  - name: pattern_1
    display: "Pattern"
    type: int
    min: 0
    max: 255
    default: 165
    group: "Track 1"
  - name: level_1
    display: "Level"
    type: float
    min: 0.0
    max: 1.0
    default: 1.0
    group: "Track 1"
  - name: pattern_2
    display: "Pattern"
    type: int
    min: 0
    max: 255
    default: 24
    group: "Track 2"
  - name: level_2
    display: "Level"
    type: float
    min: 0.0
    max: 1.0
    default: 0.8
    group: "Track 2"
  - name: pattern_3
    display: "Pattern"
    type: int
    min: 0
    max: 255
    default: 150
    group: "Track 3"
  - name: level_3
    display: "Level"
    type: float
    min: 0.0
    max: 1.0
    default: 0.65
    group: "Track 3"
  - name: pattern_4
    display: "Pattern"
    type: int
    min: 0
    max: 255
    default: 129
    group: "Track 4"
  - name: level_4
    display: "Level"
    type: float
    min: 0.0
    max: 1.0
    default: 0.55
    group: "Track 4"

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:controls"
  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:controls" }

outputs:
  - name: "Sequencer"
    pass: display

control_outputs:
  - { name: env_1, buffer: controls, element: 0, field_offset: 0, description: "Track 1 ADSR envelope" }
  - { name: gate_1, buffer: controls, element: 0, field_offset: 4, description: "Track 1 gate" }
  - { name: trigger_1, buffer: controls, element: 0, field_offset: 8, description: "Track 1 trigger pulse" }
  - { name: env_2, buffer: controls, element: 0, field_offset: 12, description: "Track 2 ADSR envelope" }
  - { name: gate_2, buffer: controls, element: 0, field_offset: 16, description: "Track 2 gate" }
  - { name: trigger_2, buffer: controls, element: 0, field_offset: 20, description: "Track 2 trigger pulse" }
  - { name: env_3, buffer: controls, element: 0, field_offset: 24, description: "Track 3 ADSR envelope" }
  - { name: gate_3, buffer: controls, element: 0, field_offset: 28, description: "Track 3 gate" }
  - { name: trigger_3, buffer: controls, element: 0, field_offset: 32, description: "Track 3 trigger pulse" }
  - { name: env_4, buffer: controls, element: 0, field_offset: 36, description: "Track 4 ADSR envelope" }
  - { name: gate_4, buffer: controls, element: 0, field_offset: 40, description: "Track 4 gate" }
  - { name: trigger_4, buffer: controls, element: 0, field_offset: 44, description: "Track 4 trigger pulse" }
  - { name: clock_phase, buffer: controls, element: 0, field_offset: 48, description: "0..1 phase of current step" }
  - { name: step_index, buffer: controls, element: 0, field_offset: 52, description: "Current step normalized 0..1" }
