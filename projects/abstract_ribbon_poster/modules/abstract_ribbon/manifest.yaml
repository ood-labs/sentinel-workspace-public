name: "Abstract Ribbon Render"
version: "1.1"
mode: generator
resolution: [1024, 1280]
working_format: RGBA16F
output_format: RGBA16F

data_inputs:
  - name: "Ribbon Path"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

parameters:
  - { name: width_gain, display: "Width Gain", type: float, min: 0.45, max: 1.80, default: 0.76, group: "Ribbon" }
  - { name: rib_count, display: "Rib Count", type: float, min: 8.0, max: 128.0, default: 58.0, group: "Ribbon" }
  - { name: rib_width, display: "Rib Width", type: float, min: 0.005, max: 0.220, default: 0.090, group: "Ribbon" }
  - { name: rib_slant, display: "Rib Slant", type: float, min: -2.0, max: 2.0, default: 0.35, group: "Ribbon" }
  - { name: line_strength, display: "Line Strength", type: float, min: 0.0, max: 1.0, default: 0.62, group: "Ribbon" }
  - { name: fold_darkness, display: "Fold Darkness", type: float, min: 0.0, max: 1.2, default: 0.82, group: "Fold" }
  - { name: fold_side, display: "Fold Side", type: float, min: -1.0, max: 1.0, default: -0.42, group: "Fold" }
  - { name: highlight_pos, display: "Highlight U", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Lighting" }
  - { name: highlight_side, display: "Highlight Side", type: float, min: -1.0, max: 1.0, default: -0.38, group: "Lighting" }
  - { name: rim_gain, display: "Rim Gain", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Lighting" }
  - { name: lower_glow, display: "Lower Glow", type: float, min: 0.0, max: 1.0, default: 0.34, group: "Lighting" }
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 2.0, default: 1.06, group: "Look" }
  - { name: palette_mode, display: "Palette", type: enum, options: [Reference, Magenta, Dusk, Cool], default: 0, flags: button_grid, group: "Look" }
  - { name: warm_color, display: "Warm", type: color, default: [1.00, 0.76, 0.50], group: "Palette" }
  - { name: orange_color, display: "Orange", type: color, default: [1.00, 0.40, 0.02], group: "Palette" }
  - { name: magenta_color, display: "Magenta", type: color, default: [0.86, 0.02, 0.43], group: "Palette" }
  - { name: dark_color, display: "Dark Fold", type: color, default: [0.035, 0.020, 0.34], group: "Palette" }
  - { name: mint_color, display: "Mint Edge", type: color, default: [0.72, 0.88, 0.76], group: "Palette" }
  - { name: shimmer, display: "Shimmer", type: float, min: 0.0, max: 1.0, default: 0.18, group: "Animation" }
  - { name: rib_phase, display: "Rib Phase", type: float, min: -1.0, max: 1.0, default: 0.0, group: "Animation" }
  - { name: motion, display: "Motion", type: float, min: 0.0, max: 3.0, default: 0.16, group: "Animation" }

passes:
  - { name: ribbon, shader: ribbon.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }

outputs:
  - { name: "Ribbon", pass: ribbon }
