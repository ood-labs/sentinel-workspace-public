name: "Abstract Triangle Column"
version: "1.0"
mode: generator
resolution: [1024, 1280]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: opacity, display: "Opacity", type: float, min: 0.0, max: 1.5, default: 0.96, group: "Column" }
  - { name: x_offset, display: "X Offset", type: float, min: -0.25, max: 0.25, default: 0.0, group: "Column" }

passes:
  - { name: column, shader: column.hlsl, target: cs_5_0 }

outputs:
  - { name: "Column", pass: column }
