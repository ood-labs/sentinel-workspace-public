name: "Abstract Solids"
version: "1.0"
mode: generator
resolution: [1024, 1280]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: solids_gain, display: "Solids Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Mix" }
  - { name: motion, display: "Motion", type: float, min: 0.0, max: 3.0, default: 0.18, group: "Animation" }

passes:
  - { name: solids, shader: solids.hlsl, target: cs_5_0 }

outputs:
  - { name: "Solids", pass: solids }
