name: "Abstract Triangle Generator"
version: "1.0"
mode: generator
resolution: [512, 256]
working_format: RGBA8

buffers:
  - name: triangles
    structured: true
    element_size: 64
    element_count: 128

parameters:
  - { name: column_center, display: "Column Center", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.735, 0.508], group: "Layout" }
  - { name: column_extent, display: "Column Extent", type: point2D, min: [0.02, 0.02], max: [0.60, 1.00], default: [0.200, 0.835], group: "Layout" }
  - { name: cols, display: "Columns", type: int, min: 1, max: 8, default: 4, group: "Grid" }
  - { name: rows, display: "Rows", type: int, min: 1, max: 16, default: 13, group: "Grid" }
  - { name: seed, display: "Seed", type: int, min: 0, max: 64, default: 8, group: "Grid" }
  - { name: tint, display: "Tint", type: color, default: [0.72, 0.72, 0.70], group: "Look" }
  - { name: contrast, display: "Contrast", type: float, min: 0.0, max: 1.5, default: 1.0, group: "Look" }
  - { name: opacity, display: "Opacity", type: float, min: 0.0, max: 1.5, default: 0.95, group: "Look" }

passes:
  - name: compute
    shader: triangle_gen.hlsl
    target: cs_5_0
    dispatch: [2, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:triangles"
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:triangles" } ] }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Triangles"
    buffer: "triangles"
    schema:
      - { name: p0, type: float4 }
      - { name: p1, type: float4 }
      - { name: color, type: float4 }
      - { name: aux, type: float4 }
