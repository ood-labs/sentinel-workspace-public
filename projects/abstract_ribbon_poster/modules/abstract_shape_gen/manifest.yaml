name: "Abstract Shape Generator"
version: "1.0"
mode: generator
resolution: [512, 256]
working_format: RGBA8

buffers:
  - name: shapes
    structured: true
    element_size: 64
    element_count: 32

parameters:
  - { name: global_offset, display: "Global Offset", type: point2D, min: [-0.35, -0.35], max: [0.35, 0.35], default: [0.0, 0.0], group: "Global" }
  - { name: global_scale, display: "Global Scale", type: float, min: 0.50, max: 1.50, default: 1.0, group: "Global" }
  - { name: seed, display: "Seed", type: int, min: 0, max: 64, default: 3, group: "Global" }
  - { name: blue_color, display: "Blue", type: color, default: [0.02, 0.00, 0.92], group: "Palette" }
  - { name: left_stack, display: "Left Stack", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.205, 0.790], group: "Handles/Left" }
  - { name: left_visible, display: "Left Visible", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Handles/Left" }
  - { name: right_bar_center, display: "Right Bar", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.740, 0.350], group: "Handles/Bar" }
  - { name: bar_visible, display: "Bar Visible", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Handles/Bar" }
  - { name: ring_center, display: "Ring Center", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.338, 0.292], group: "Handles/Solids" }
  - { name: stripe_center, display: "Stripe Oval", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.445, 0.548], group: "Handles/Solids" }
  - { name: stripe_rot, display: "Stripe Rot", type: float, min: -3.15, max: 3.15, default: 0.0, group: "Handles/Solids" }
  - { name: stripe_freq, display: "Stripe Freq", type: float, min: 2.0, max: 20.0, default: 8.0, group: "Handles/Solids" }
  - { name: sphere_cluster, display: "Sphere Cluster", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.550, 0.385], group: "Handles/Solids" }
  - { name: lower_sphere, display: "Lower Sphere", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.692, 0.102], group: "Handles/Solids" }
  - { name: solids_visible, display: "Solids Visible", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Handles/Solids" }
  - { name: capsule_anchor, display: "Top Capsules", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.552, 0.908], group: "Handles/Capsules" }
  - { name: bottom_capsules, display: "Bottom Capsules", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.160, 0.109], group: "Handles/Capsules" }
  - { name: capsule_visible, display: "Capsule Visible", type: float, min: 0.0, max: 1.0, default: 0.65, group: "Handles/Capsules" }
  - { name: guide_a_start, display: "Guide A Start", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.392, 0.365], group: "Handles/Guides" }
  - { name: guide_a_end, display: "Guide A End", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.755, 0.525], group: "Handles/Guides" }
  - { name: guide_b_start, display: "Guide B Start", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.745, 0.880], group: "Handles/Guides" }
  - { name: guide_b_end, display: "Guide B End", type: point2D, min: [0.0, 0.0], max: [1.0, 1.0], default: [0.745, 0.295], group: "Handles/Guides" }
  - { name: guide_width, display: "Guide Width", type: float, min: 0.0005, max: 0.010, default: 0.0012, group: "Handles/Guides" }
  - { name: guide_visible, display: "Guide Visible", type: float, min: 0.0, max: 1.0, default: 0.70, group: "Handles/Guides" }

passes:
  - name: compute
    shader: shape_gen.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:shapes"
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:shapes" } ] }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Shapes"
    buffer: "shapes"
    schema:
      - { name: p0, type: float4 }
      - { name: p1, type: float4 }
      - { name: color, type: float4 }
      - { name: style, type: float4 }
