name: "Abstract Accents"
version: "1.0"
mode: generator
resolution: [1024, 1280]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: blue_gain, display: "Blue Gain", type: float, min: 0.0, max: 2.5, default: 1.0, group: "Accents" }

passes:
  - { name: accents, shader: accents.hlsl, target: cs_5_0 }

outputs:
  - { name: "Accents", pass: accents }
