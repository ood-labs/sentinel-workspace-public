name: "Abstract Shape Render"
version: "1.0"
mode: generator
resolution: [1024, 1280]
working_format: RGBA16F
output_format: RGBA16F

data_inputs:
  - name: "Shapes"
    slot: 0
    schema:
      - { name: p0, type: float4 }
      - { name: p1, type: float4 }
      - { name: color, type: float4 }
      - { name: style, type: float4 }

parameters:
  - { name: intensity, display: "Intensity", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Output" }
  - { name: motion, display: "Motion", type: float, min: 0.0, max: 3.0, default: 0.15, group: "Animation" }

passes:
  - { name: render, shader: render.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "data:0" } ] }

outputs:
  - { name: "Shapes", pass: render }
