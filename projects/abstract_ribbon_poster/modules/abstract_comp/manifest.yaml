name: "Abstract Poster Composite"
version: "1.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F
output_format: RGBA16F

inputs:
  - { name: "BG", slot: 0, required: true }
  - { name: "Triangles", slot: 1, required: false }
  - { name: "Shapes", slot: 2, required: false }
  - { name: "Ribbon", slot: 3, required: false }
  - { name: "Guides", slot: 4, required: false }

parameters:
  - { name: bg_gain, display: "BG Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: column_gain, display: "Triangles Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: solids_gain, display: "Shapes Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: ribbon_gain, display: "Ribbon Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: accents_gain, display: "Guides Gain", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Layer Gain" }
  - { name: exposure, display: "Exposure", type: float, min: 0.4, max: 2.0, default: 1.04, group: "Grade" }
  - { name: vignette, display: "Vignette", type: float, min: 0.0, max: 2.0, default: 0.50, group: "Grade" }

passes:
  - name: composite
    shader: composite.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }

outputs:
  - { name: "Scene", pass: composite }
