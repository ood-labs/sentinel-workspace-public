name: "Abstract Poster BG"
version: "1.0"
mode: generator
resolution: [1024, 1280]
working_format: RGBA16F
output_format: RGBA16F

parameters:
  - { name: shadow_strength, display: "Shadow Strength", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Studio" }
  - { name: grain_amount, display: "Grain Amount", type: float, min: 0.0, max: 0.08, default: 0.010, group: "Studio" }

passes:
  - { name: bg, shader: bg.hlsl, target: cs_5_0 }

outputs:
  - { name: "BG", pass: bg }
