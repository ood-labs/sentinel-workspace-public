name: "06 / LIVE FEATURE INSTRUMENT"
version: "2.0"
mode: filter
resolution_source: "match:input"
working_format: RGBA16F

viewport:
  hint: "Strongest live corner is selected automatically. Labels show real response and 480x270 analysis coordinates."

inputs:
  - { name: "Signal Cut Program", slot: 0, required: true }

data_inputs:
  - name: "Stabilized Regions"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: weight, type: float }
      - { name: kind, type: float }
      - { name: group_id, type: float }
      - { name: active, type: float }
  - name: "Raw Blobs 480x270"
    slot: 1
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }
  - name: "Sparse Corners 480x270"
    slot: 2
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }

parameters:
  - { name: print_levels, display: "Luma Levels", type: float, min: 2.0, max: 16.0, default: 7.0, group: "Image" }
  - { name: network_tension, display: "Network Tension", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Feature Network" }
  - { name: network_width, display: "Network Width", type: float, min: 0.00035, max: 0.004, default: 0.00115, group: "Feature Network" }
  - { name: network_opacity, display: "Network Ink", type: float, min: 0.0, max: 1.0, default: 0.72, group: "Feature Network" }
  - { name: network_ink, display: "Network Color", type: color, default: [0.84, 0.84, 0.82], group: "Feature Network" }
  - { name: label_opacity, display: "Point Labels", type: float, min: 0.0, max: 1.0, default: 0.92, group: "Tracked Labels" }
  - { name: label_ink, display: "Label Color", type: color, default: [0.94, 0.94, 0.91], group: "Tracked Labels" }
  - { name: ascii_mode, display: "ASCII / Vector Mode", type: bool, default: true, group: "ASCII" }
  - { name: ascii_density, display: "ASCII Density", type: float, min: 0.0, max: 1.0, default: 0.62, group: "ASCII" }
  - { name: ascii_amount, display: "ASCII Ink", type: float, min: 0.0, max: 1.0, default: 0.90, group: "ASCII" }
  - { name: ascii_radius, display: "ASCII Radius", type: float, min: 0.025, max: 0.28, default: 0.105, group: "ASCII" }
  - { name: corner_accent, display: "Active Accent", type: color, default: [1.0, 0.39, 0.015], group: "Accent" }
  - { name: border_ticks, display: "Registration Ticks", type: float, min: 0.0, max: 1.0, default: 0.58, group: "Image" }

passes:
  - name: live_feature_instrument
    shader: post.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }
      - { slot: 2, source: "data:1" }
      - { slot: 3, source: "data:2" }
    output: output

outputs:
  - { name: "Instrument Program", pass: live_feature_instrument }
