name: "Evolving Food Collage"
version: "2.0"
mode: generator
resolution: [1080, 1350]
working_format: RGBA16F

inputs:
  - { name: "Generated Subject", slot: 0, required: true }
  - { name: "Subject Matte", slot: 1, required: true }

buffers:
  - { name: poster, format: RGBA16F, scale: 1.0, persistent: true }

parameters:
  - { name: evolve, display: "Spam Cutouts", type: bool, default: true, group: "Accumulation" }
  - { name: update_seconds, display: "Seconds Per Hit", type: float, min: 0.05, max: 2.0, default: 0.18, group: "Accumulation" }
  - { name: region_count, display: "Placement Cells", type: int, min: 6, max: 14, default: 14, group: "Accumulation" }
  - { name: reset_canvas, display: "Clear Canvas", type: bool, default: false, group: "Accumulation" }

  - { name: layout_seed, display: "Layout Seed", type: float, min: 0.0, max: 100.0, default: 7.000000, group: "Placement" }
  - { name: collage_scale, display: "Cutout Scale", type: float, min: 0.35, max: 1.65, default: 0.92, group: "Placement" }
  - { name: rotation_jitter, display: "Rotation Chaos", type: float, min: 0.0, max: 1.6, default: 0.72, group: "Placement" }
  - { name: paper, display: "Paper Ground", type: enum, options: [WarmKraft, GalleryWhite, Charcoal], flags: button_grid, default: 0, group: "Placement" }
  - { name: cutout_threshold, display: "Matte Threshold", type: float, min: 0.02, max: 0.90, default: 0.22, group: "Placement" }
  - { name: cutout_feather, display: "Cutout Feather", type: float, min: 0.005, max: 0.30, default: 0.1, group: "Placement" }
  - { name: drop_shadow, display: "Paper Shadow", type: float, min: 0.0, max: 1.5, default: 0.55, group: "Placement" }

  - { name: color_fx_chance, display: "Color FX / Hit", type: float, min: 0.0, max: 0.025, default: 0.0015, group: "Rare Events" }
  - { name: halftone_chance, display: "Halftone / Hit", type: float, min: 0.0, max: 0.02, default: 0.001, group: "Rare Events" }
  - { name: rip_chance, display: "Rip / Hit", type: float, min: 0.0, max: 0.02, default: 0.0015, group: "Rare Events" }
  - { name: displace_chance, display: "History Disturb / Hit", type: float, min: 0.0, max: 0.02, default: 0.001, group: "Rare Events" }
  - { name: repeat_chance, display: "Registration Echo / Hit", type: float, min: 0.0, max: 0.02, default: 0.0025, group: "Rare Events" }
  - { name: frame_chance, display: "Graphic Frame / Hit", type: float, min: 0.0, max: 0.08, default: 0.025, group: "Structure" }
  - { name: block_chance, display: "Negative Space Block / Hit", type: float, min: 0.0, max: 0.08, default: 0.02, group: "Structure" }
  - { name: displace_strength, display: "History Displacement", type: float, min: 0.0, max: 0.12, default: 0.018, group: "Rare Events" }
  - { name: effect_intensity, display: "Effect Intensity", type: float, min: 0.0, max: 1.5, default: 0.65, group: "Rare Events" }

  - { name: exposure, display: "Exposure", type: float, min: 0.5, max: 1.8, default: 1.05, group: "Print FX" }
  - { name: contrast, display: "Print Contrast", type: float, min: 0.6, max: 1.8, default: 1.12, group: "Print FX" }
  - { name: saturation, display: "Saturation", type: float, min: 0.0, max: 2.0, default: 1.1, group: "Print FX" }
  - { name: posterize, display: "Ink Steps", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Print FX" }
  - { name: ink_outline, display: "Ink Outline", type: float, min: 0.0, max: 1.5, default: 0.48, group: "Print FX" }
  - { name: chromatic_offset, display: "Print Misregistration", type: float, min: 0.0, max: 3.0, default: 0.65, group: "Print FX" }
  - { name: paper_grain, display: "Paper Grain", type: float, min: 0.0, max: 1.0, default: 0.42, group: "Print FX" }
  - { name: vignette, display: "Edge Darkening", type: float, min: 0.0, max: 1.0, default: 0.14, group: "Print FX" }

passes:
  - name: collage_update
    shader: collage_update.hlsl
    target: cs_5_0
    format: RGBA16F
    time_dependent: true
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "buffer:poster" }
    output: "buffer:poster"

  - name: post
    shader: post.hlsl
    target: cs_5_0
    format: RGBA8
    time_dependent: true
    inputs:
      - { slot: 0, source: "buffer:poster" }
    output: output

outputs:
  - { name: "Evolving Poster", pass: post }
