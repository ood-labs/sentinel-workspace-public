name: "Scientific Feature Temporalizer"
version: "1.0"
mode: generator
resolution: [960, 540]

viewport:
  hint: "Live Features records stabilized into typed agents with motion vectors"

data_inputs:
  - name: "Blobs"
    slot: 0
    schema:
      - { name: centroidX, type: float }
      - { name: centroidY, type: float }
      - { name: area, type: float }
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: colorR, type: float }
      - { name: colorG, type: float }
      - { name: colorB, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }
  - name: "Corners"
    slot: 1
    schema:
      - { name: x, type: float }
      - { name: y, type: float }
      - { name: response, type: float }
      - { name: pad, type: float }
  - name: "Lines"
    slot: 2
    schema:
      - { name: x1, type: float }
      - { name: y1, type: float }
      - { name: x2, type: float }
      - { name: y2, type: float }
      - { name: angle, type: float }
      - { name: length, type: float }
      - { name: pad0, type: float }
      - { name: pad1, type: float }

buffers:
  - name: agents
    structured: true
    element_size: 64
    element_count: 96
  - name: previous_agents
    structured: true
    element_size: 64
    element_count: 96
    persistent: true

parameters:
  - { name: tracking_response, display: "Tracking Response", type: float, min: 1.0, max: 30.0, default: 10.0, group: "Temporal" }
  - { name: release_rate, display: "Release Rate", type: float, min: 0.5, max: 12.0, default: 3.2, group: "Temporal" }
  - { name: blob_scale_gain, display: "Blob Scale", type: float, min: 0.5, max: 8.0, default: 3.0, group: "Mapping" }
  - { name: blob_confidence_area, display: "Blob Confidence Area", type: float, min: 10.0, max: 3000.0, default: 500.0, group: "Mapping" }
  - { name: corner_scale, display: "Corner Scale", type: float, min: 0.05, max: 1.0, default: 0.34, group: "Mapping" }
  - { name: corner_response_gain, display: "Corner Response", type: float, min: 0.05, max: 1.0, default: 0.42, group: "Mapping" }
  - { name: line_reference_length, display: "Line Reference", type: float, min: 4.0, max: 120.0, default: 32.0, group: "Mapping" }
  - { name: line_confidence_gain, display: "Line Confidence", type: float, min: 0.2, max: 3.0, default: 1.5, group: "Mapping" }
  - { name: velocity_gain, display: "Velocity Visibility", type: float, min: 0.0, max: 4.0, default: 1.0, group: "Preview" }
  - { name: blob_ink, display: "Mass Ink", type: color, default: [0.95, 0.93, 0.86], group: "Preview" }
  - { name: corner_ink, display: "Corner Ink", type: color, default: [0.72, 0.72, 0.68], group: "Preview" }
  - { name: line_ink, display: "Line Ink", type: color, default: [0.95, 0.42, 0.08], group: "Preview" }
  - { name: velocity_ink, display: "Motion Ink", type: color, default: [0.34, 0.34, 0.32], group: "Preview" }
  - { name: preview_exposure, display: "Preview Exposure", type: float, min: 0.5, max: 3.0, default: 1.15, group: "Preview" }

passes:
  - name: temporalize
    shader: temporalize.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 96
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
      - { slot: 2, source: "data:2" }
      - { slot: 3, source: "buffer:previous_agents" }
    output: "buffer:agents"

  - name: commit
    shader: commit.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 96
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:agents" }
    output: "buffer:previous_agents"

  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:agents" }
    output: output

data_outputs:
  - name: "Feature Agents"
    buffer: "agents"
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: scale, type: float }
      - { name: confidence, type: float }
      - { name: angle, type: float }
      - { name: age, type: float }
      - { name: stable_id, type: uint }
      - { name: kind, type: uint }
      - { name: source_index, type: uint }
      - { name: flags, type: uint }
      - { name: aux, type: float4 }

outputs:
  - { name: "Temporal Agents", pass: preview }
