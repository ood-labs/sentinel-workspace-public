name: "Scientific Organism Renderer"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F

viewport:
  hint: "Canonical 16:9 Program renderer — source organism, measured field, agents, and topology"

inputs:
  - { name: "Biotic Source", slot: 0, required: true }
  - { name: "Synaptic Field", slot: 1, required: true }

data_inputs:
  - name: "Feature Agents"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: scale, type: float }
      - { name: confidence, type: float }
      - { name: angle, type: float }
      - { name: age, type: float }
      - { name: stable_id, type: uint }
      - { name: kind, type: uint }
      - { name: source_index, type: uint }
      - { name: flags, type: uint }
      - { name: aux, type: float4 }
  - name: "Topology Edges"
    slot: 1
    schema:
      - { name: a, type: float2 }
      - { name: b, type: float2 }
      - { name: weight, type: float }
      - { name: phase, type: float }
      - { name: distance, type: float }
      - { name: tension, type: float }
      - { name: source_a, type: uint }
      - { name: source_b, type: uint }
      - { name: kind, type: uint }
      - { name: flags, type: uint }

parameters:
  - { name: quality_mode, display: "Render Quality", type: enum, values: ["Performance", "Hero"], default: 1, group: "System" }
  - { name: source_exposure, display: "Organism Exposure", type: float, min: 0.2, max: 3.0, default: 1.05, group: "Organism" }
  - { name: source_mix, display: "Organism Body", type: float, min: 0.0, max: 2.0, default: 0.62, group: "Organism" }
  - { name: source_floor, display: "Organism Floor", type: float, min: 0.0, max: 0.8, default: 0.14, group: "Organism" }
  - { name: source_bands, display: "Membrane Bands", type: float, min: 2.0, max: 24.0, default: 9.0, group: "Organism" }
  - { name: membrane_mix, display: "Membrane Visibility", type: float, min: 0.0, max: 2.0, default: 0.72, group: "Organism" }
  - { name: relief_depth, display: "Relief Depth", type: float, min: 0.0, max: 12.0, default: 4.8, group: "Organism" }
  - { name: warp_amount, display: "Field Warp", type: float, min: 0.0, max: 0.08, default: 0.012, group: "Field" }
  - { name: field_mix, display: "Field Body", type: float, min: 0.0, max: 2.0, default: 0.34, group: "Field" }
  - { name: field_bands, display: "Field Bands", type: float, min: 2.0, max: 30.0, default: 13.0, group: "Field" }
  - { name: field_contour_mix, display: "Field Contours", type: float, min: 0.0, max: 2.0, default: 0.62, group: "Field" }
  - { name: causal_coupling, display: "Membrane Coupling", type: float, min: 0.0, max: 1.5, default: 0.55, group: "Field" }
  - { name: network_mix, display: "Topology", type: float, min: 0.0, max: 3.0, default: 0.72, group: "Records" }
  - { name: agent_mix, display: "Agents", type: float, min: 0.0, max: 3.0, default: 0.88, group: "Records" }
  - { name: motion_mix, display: "Motion Vectors", type: float, min: 0.0, max: 2.0, default: 0.34, group: "Records" }
  - { name: motion_vector_scale, display: "Motion Reach", type: float, min: 0.0, max: 4.0, default: 0.9, group: "Records" }
  - { name: signal_divisions, display: "Signal Divisions", type: float, min: 2.0, max: 40.0, default: 14.0, group: "Records" }
  - { name: signal_gap, display: "Signal Duty", type: float, min: 0.05, max: 0.9, default: 0.35, group: "Records" }
  - { name: signal_articulation, display: "Signal Articulation", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Records" }
  - { name: telemetry_mix, display: "Confidence Telemetry", type: float, min: 0.0, max: 2.0, default: 0.82, group: "Instrument" }
  - { name: minor_grid_mix, display: "Fine Grid", type: float, min: 0.0, max: 1.0, default: 0.045, group: "Instrument" }
  - { name: major_grid_mix, display: "Major Grid", type: float, min: 0.0, max: 1.0, default: 0.085, group: "Instrument" }
  - { name: frame_mix, display: "Registration Frame", type: float, min: 0.0, max: 2.0, default: 0.8, group: "Instrument" }
  - { name: vignette_mix, display: "Vignette", type: float, min: 0.0, max: 1.0, default: 0.46, group: "Finish" }
  - { name: vignette_power, display: "Vignette Shape", type: float, min: 0.2, max: 4.0, default: 1.2, group: "Finish" }
  - { name: grain_amount, display: "Sensor Grain", type: float, min: 0.0, max: 0.08, default: 0.012, group: "Finish" }
  - { name: output_gamma, display: "Output Gamma", type: float, min: 0.5, max: 2.4, default: 1.0, group: "Finish" }
  - { name: background_color, display: "Black Field", type: color, default: [0.002, 0.002, 0.001], group: "Palette" }
  - { name: source_color, display: "Tissue", type: color, default: [0.24, 0.23, 0.20], group: "Palette" }
  - { name: membrane_color, display: "Membrane", type: color, default: [0.94, 0.91, 0.82], group: "Palette" }
  - { name: field_color, display: "Field", type: color, default: [0.13, 0.13, 0.11], group: "Palette" }
  - { name: field_contour_color, display: "Field Contours", type: color, default: [0.46, 0.45, 0.40], group: "Palette" }
  - { name: network_color, display: "Network", type: color, default: [0.78, 0.77, 0.70], group: "Palette" }
  - { name: agent_color, display: "Agents", type: color, default: [0.94, 0.92, 0.84], group: "Palette" }
  - { name: motion_color, display: "Motion", type: color, default: [0.34, 0.33, 0.30], group: "Palette" }
  - { name: accent_color, display: "Signal Amber", type: color, default: [1.0, 0.255, 0.025], group: "Palette" }
  - { name: grid_color, display: "Grid", type: color, default: [0.32, 0.31, 0.28], group: "Palette" }
  - { name: frame_color, display: "Frame", type: color, default: [0.82, 0.80, 0.72], group: "Palette" }

passes:
  - name: render
    shader: render.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "data:0" }
      - { slot: 3, source: "data:1" }
    output: output

outputs:
  - { name: "Program", pass: render }
