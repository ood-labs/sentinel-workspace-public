name: "Scientific Topology Weaver"
version: "1.0"
mode: generator
execution: on_dirty
resolution: [960, 540]

viewport:
  hint: "Confidence-weighted topology inferred from stabilized Features agents"

data_inputs:
  - name: "Feature Agents"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: velocity, type: float2 }
      - { name: scale, type: float }
      - { name: confidence, type: float }
      - { name: angle, type: float }
      - { name: age, type: float }
      - { name: stable_id, type: uint }
      - { name: kind, type: uint }
      - { name: source_index, type: uint }
      - { name: flags, type: uint }
      - { name: aux, type: float4 }

buffers:
  - name: edges
    structured: true
    element_size: 48
    element_count: 96

parameters:
  - { name: link_radius, display: "Corner Reach", type: float, min: 0.04, max: 0.7, default: 0.31, group: "Topology" }
  - { name: min_link_distance, display: "Minimum Span", type: float, min: 0.001, max: 0.12, default: 0.018, group: "Topology" }
  - { name: mass_reach, display: "Mass Reach", type: float, min: 0.5, max: 3.0, default: 1.55, group: "Topology" }
  - { name: velocity_reach, display: "Motion Reach", type: float, min: 0.0, max: 4.0, default: 1.3, group: "Topology" }
  - { name: motion_weight, display: "Motion Weight", type: float, min: 0.1, max: 6.0, default: 2.0, group: "Topology" }
  - { name: edge_floor, display: "Edge Floor", type: float, min: 0.0, max: 0.5, default: 0.035, group: "Topology" }
  - { name: dash_count, display: "Signal Divisions", type: float, min: 2.0, max: 40.0, default: 13.0, group: "Preview" }
  - { name: dash_mix, display: "Signal Articulation", type: float, min: 0.0, max: 1.0, default: 0.35, group: "Preview" }
  - { name: edge_ink, display: "Network Ink", type: color, default: [0.56, 0.56, 0.52], group: "Preview" }
  - { name: mass_ink, display: "Mass Ink", type: color, default: [0.96, 0.45, 0.09], group: "Preview" }
  - { name: line_ink, display: "Observed Line Ink", type: color, default: [0.92, 0.90, 0.82], group: "Preview" }
  - { name: node_ink, display: "Node Ink", type: color, default: [0.80, 0.80, 0.75], group: "Preview" }
  - { name: preview_exposure, display: "Preview Exposure", type: float, min: 0.5, max: 3.0, default: 1.2, group: "Preview" }

passes:
  - name: weave
    shader: weave.hlsl
    time_dependent: false
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 96
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
    output: "buffer:edges"

  - name: preview
    shader: preview.hlsl
    time_dependent: false
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:edges" }
      - { slot: 1, source: "data:0" }
    output: output

data_outputs:
  - name: "Topology Edges"
    buffer: "edges"
    schema:
      - { name: a, type: float2 }
      - { name: b, type: float2 }
      - { name: weight, type: float }
      - { name: phase, type: float }
      - { name: distance, type: float }
      - { name: tension, type: float }
      - { name: source_a, type: uint }
      - { name: source_b, type: uint }
      - { name: kind, type: uint }
      - { name: flags, type: uint }

outputs:
  - { name: "Topology Map", pass: preview }
