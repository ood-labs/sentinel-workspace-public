name: "Scientific Filament Memory"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F

viewport:
  hint: "Persistent edge-tangent filaments derived from the live Program image"

inputs:
  - { name: "Program", slot: 0, required: true }

buffers:
  - { name: history, format: RGBA16F, persistent: true }

parameters:
  - { name: persistence, display: "Memory Persistence", type: float, min: 0.0, max: 0.999, default: 0.91, group: "Memory" }
  - { name: drift_pixels, display: "Filament Drift", type: float, min: -8.0, max: 8.0, default: 1.1, group: "Memory" }
  - { name: drift_bias, display: "Drift Bias", type: point2D, min: [-4.0, -4.0], max: [4.0, 4.0], default: [0.35, -0.18], group: "Memory" }
  - { name: injection_floor, display: "Injection Floor", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Memory" }
  - { name: injection_ceiling, display: "Injection Ceiling", type: float, min: 0.05, max: 1.0, default: 0.72, group: "Memory" }
  - { name: injection_gain, display: "Injection Gain", type: float, min: 0.0, max: 3.0, default: 0.72, group: "Memory" }
  - { name: accumulation, display: "Accumulation", type: float, min: 0.0, max: 1.0, default: 0.28, group: "Memory" }
  - { name: memory_mix, display: "Memory Mix", type: float, min: 0.0, max: 2.0, default: 0.28, group: "Render" }
  - { name: filament_bands, display: "Filament Bands", type: float, min: 2.0, max: 32.0, default: 12.0, group: "Render" }
  - { name: filament_gain, display: "Filament Gain", type: float, min: 0.0, max: 2.0, default: 0.42, group: "Render" }
  - { name: echo_color, display: "Echo Ink", type: color, default: [0.26, 0.25, 0.22], group: "Palette" }
  - { name: filament_color, display: "Filament Ink", type: color, default: [1.0, 0.25, 0.02], group: "Palette" }

passes:
  - name: evolve
    shader: evolve.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:history" }
    output: "buffer:history"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:history" }
    output: output

outputs:
  - { name: "Filament Program", pass: render }
