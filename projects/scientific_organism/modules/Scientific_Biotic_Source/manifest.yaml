name: "Scientific Biotic Source"
version: "1.0"
mode: generator
resolution: [1280, 720]
working_format: RGBA16F

data_inputs:
  - name: "Stimuli"
    slot: 0
    schema:
      - { name: position, type: float2 }
      - { name: direction, type: float2 }
      - { name: radius, type: float }
      - { name: strength, type: float }
      - { name: age, type: float }
      - { name: mode, type: float }
      - { name: id, type: uint }
      - { name: flags, type: uint }
      - { name: pad, type: float2 }

parameters:
  - { name: phase, display: "Phase", type: float, min: 0.0, max: 1.0, default: 0.0, group: "Motion" }
  - { name: animation_speed, display: "Animation Speed", type: float, min: 0.0, max: 0.5, default: 0.045, group: "Motion" }
  - { name: reaction_rate, display: "Reaction", type: float, min: 0.05, max: 1.8, default: 0.42, group: "Field" }
  - { name: diffusion, display: "Diffusion", type: float, min: 0.0, max: 0.24, default: 0.075, group: "Field" }
  - { name: cell_scale, display: "Cell Scale", type: float, min: 0.5, max: 3.0, default: 1.25, group: "Field" }
  - { name: seed_gain, display: "Stimulus Gain", type: float, min: 0.1, max: 1.5, default: 0.58, group: "Field" }
  - { name: contour_bands, display: "Contour Bands", type: float, min: 3.0, max: 18.0, default: 9.0, group: "Render" }
  - { name: membrane_gain, display: "Membrane", type: float, min: 0.0, max: 1.5, default: 0.88, group: "Render" }
  - { name: grid_gain, display: "Registration Grid", type: float, min: 0.0, max: 1.0, default: 0.16, group: "Render" }
  - { name: scan_gain, display: "Scan Structure", type: float, min: 0.0, max: 1.0, default: 0.22, group: "Render" }
  - { name: accent_color, display: "Amber Accent", type: color, default: [1.0, 0.24, 0.035], group: "Render" }
  - { name: accent_gain, display: "Accent Gain", type: float, min: 0.0, max: 2.0, default: 0.95, group: "Render" }

buffers:
  - { name: clock_state, structured: true, element_size: 16, element_count: 1, persistent: true }
  - { name: compact_stimuli, structured: true, element_size: 48, element_count: 16, persistent: true }
  - { name: organism, format: RGBA16F, scale: 0.5, persistent: true }

passes:
  - name: compact
    shader: compact.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "data:0" }
    output: "buffer:compact_stimuli"
  - name: clock
    shader: clock.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:clock_state"
  - name: evolve
    shader: evolve.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:organism" }
      - { slot: 1, source: "buffer:clock_state" }
      - { slot: 2, source: "buffer:compact_stimuli" }
    output: "buffer:organism"
  - name: source
    shader: source.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "buffer:organism" }
      - { slot: 1, source: "buffer:compact_stimuli" }
  - name: field
    shader: field_out.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "buffer:organism" }
  - name: flow
    shader: flow_out.hlsl
    target: cs_5_0
    format: RGBA8
    inputs:
      - { slot: 0, source: "buffer:organism" }

outputs:
  - { name: "Source", pass: source }
  - { name: "Field", pass: field }
  - { name: "Flow", pass: flow }
