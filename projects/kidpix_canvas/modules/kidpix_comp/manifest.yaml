name: "KidPix Comp"
version: "0.1"
mode: generator
resolution: [1200, 960]

# Kid Pix canvas compositor: opaque white base + 7 premultiplied paint plates, all Over.
# Inlet order (back->front): 0 roil, 1 trail, 2 stroke, 3 scribble, 4 swarm, 5 cube, 6 ui.

inputs:
  - { name: "Roil",     slot: 0, required: false }
  - { name: "Trail",    slot: 1, required: false }
  - { name: "Stroke",   slot: 2, required: false }
  - { name: "Scribble", slot: 3, required: false }
  - { name: "Swarm",    slot: 4, required: false }
  - { name: "Cube",     slot: 5, required: false }
  - { name: "UI",       slot: 6, required: false }

parameters:
  - { name: canvas_gain,   display: "Canvas",   type: float, min: 0.0, max: 1.0, default: 1.0, group: "Comp" }
  - { name: roil_gain,     display: "Roil",     type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: trail_gain,    display: "Trail",    type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: stroke_gain,   display: "Stroke",   type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: scribble_gain, display: "Scribble", type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: swarm_gain,    display: "Swarm",    type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: cube_gain,     display: "Cube",     type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }
  - { name: ui_gain,       display: "UI",       type: float, min: 0.0, max: 2.0, default: 1.0, group: "Comp" }

passes:
  - name: comp
    shader: comp.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
      - { slot: 3, source: "input:3" }
      - { slot: 4, source: "input:4" }
      - { slot: 5, source: "input:5" }
      - { slot: 6, source: "input:6" }

outputs:
  - { name: "Comp", pass: comp }
