name: "PL Spawn"
version: "1.0"
mode: generator
resolution: [256, 64]
working_format: RGBA8

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

buffers:
  - name: nodes
    structured: true
    element_size: 48
    element_count: 256

parameters:
  - name: mode
    display: "Mode"
    type: enum
    options: [Passthrough, Jitter, Decimate, Branch]
    default: 1
    flags: button_grid
    group: "Spawn"
  - { name: amount, display: "Amount", type: float, min: 0.0, max: 0.4, default: 0.06, group: "Spawn" }
  - { name: keep_frac, display: "Keep Fraction", type: float, min: 0.0, max: 1.0, default: 0.7, group: "Spawn" }
  - { name: weight_jitter, display: "Weight Jitter", type: float, min: 0.0, max: 1.0, default: 0.4, group: "Spawn" }
  - { name: depth_jitter, display: "Depth Jitter", type: float, min: 0.0, max: 0.5, default: 0.1, group: "Spawn" }

passes:
  - name: compute
    shader: spawn.hlsl
    target: cs_5_0
    dispatch: [4, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    output: "buffer:nodes"
    inputs:
      - { slot: 0, source: "data:0" }
  - { name: preview, shader: preview.hlsl, target: cs_5_0, inputs: [ { slot: 0, source: "buffer:nodes" } ] }

outputs:
  - { name: "Preview", pass: preview }

data_outputs:
  - name: "Nodes"
    buffer: "nodes"
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }
