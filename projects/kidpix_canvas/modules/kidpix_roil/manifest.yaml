name: "KidPix Roil"
version: "0.1"
mode: generator
resolution: [1200, 960]

# Multicolor "wacky brush" roil mass (upper-left). Domain-warped orbiting color lobes, hard edges,
# seamless 6s loop. Premultiplied RGBA.

parameters:
  - { name: mass_cx,      display: "Mass X",     type: float, min: 0.0, max: 1.0, default: 0.30, group: "Place" }
  - { name: mass_cy,      display: "Mass Y",     type: float, min: 0.0, max: 1.0, default: 0.20, group: "Place" }
  - { name: mass_scale,   display: "Mass Scale", type: float, min: 0.1, max: 1.5, default: 0.60, group: "Place" }
  - { name: lobe_count,   display: "Lobes",      type: int,   min: 1,   max: 48,  default: 34,   group: "Look" }
  - { name: warp_amt,     display: "Warp",       type: float, min: 0.0, max: 1.5, default: 0.55, group: "Look" }
  - { name: intensity,    display: "Intensity",  type: float, min: 0.0, max: 1.5, default: 1.0,  group: "Look" }
  - { name: loop_seconds, display: "Loop (s)",   type: float, min: 1.0, max: 12.0, default: 6.0, group: "Motion" }

passes:
  - name: roil
    shader: roil.hlsl
    target: cs_5_0

outputs:
  - { name: "Roil", pass: roil }
