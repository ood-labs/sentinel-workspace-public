name: "KidPix Swarm"
version: "0.1"
mode: generator
resolution: [1200, 960]

# Stamps the Kid Pix icon atlas at each PNode placement with per-instance stepped jitter
# (buzzing rubber-stamps). data:0 = pl_spawn PNode stream, input:0 = kidpix_stamp_atlas.
# Premultiplied RGBA.

inputs:
  - { name: "Atlas", slot: 0, required: true }

data_inputs:
  - name: "Nodes"
    slot: 0
    schema:
      - { name: pos, type: float2 }
      - { name: dir, type: float2 }
      - { name: depth, type: float }
      - { name: u, type: float }
      - { name: v, type: float }
      - { name: weight, type: float }
      - { name: group, type: float }
      - { name: kind, type: float }
      - { name: seed, type: float }
      - { name: active, type: float }

parameters:
  - { name: place_scale,  display: "Place Scale",  type: float, min: 0.5, max: 1.5, default: 1.0,  group: "Place" }
  - { name: place_offset_x, display: "Place Off X", type: float, min: -0.5, max: 0.5, default: 0.0, group: "Place" }
  - { name: place_offset_y, display: "Place Off Y", type: float, min: -0.5, max: 0.5, default: 0.0, group: "Place" }
  - { name: stamp_size,   display: "Stamp Size",   type: float, min: 0.01, max: 0.08, default: 0.028, group: "Look" }
  - { name: size_var,     display: "Size Var",     type: float, min: 0.0, max: 1.0, default: 0.35, group: "Look" }
  - { name: intensity,    display: "Intensity",    type: float, min: 0.0, max: 1.5, default: 1.0,  group: "Look" }
  - { name: jitter_amt,   display: "Jitter Amt",   type: float, min: 0.0, max: 0.02, default: 0.004, group: "Motion" }
  - { name: jit_steps,    display: "Jitter Steps", type: float, min: 6.0, max: 120.0, default: 60.0, group: "Motion" }
  - { name: loop_seconds, display: "Loop (s)",     type: float, min: 1.0, max: 12.0, default: 6.0, group: "Motion" }

passes:
  - name: swarm
    shader: swarm.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "data:0" }

outputs:
  - { name: "Swarm", pass: swarm }
