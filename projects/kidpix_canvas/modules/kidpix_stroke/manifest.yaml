name: "KidPix Stroke"
version: "0.1"
mode: generator
resolution: [1200, 960]

# Thick black draw-on brush stroke (right). Round brush painting progressively along an authored
# hook/"7" bezier path, arc-length reveal + loop reset. Premultiplied RGBA, seamless loop.

parameters:
  - { name: stroke_x,     display: "Stroke X",   type: float, min: 0.0, max: 1.2, default: 0.62, group: "Place" }
  - { name: stroke_y,     display: "Stroke Y",   type: float, min: 0.0, max: 1.0, default: 0.30, group: "Place" }
  - { name: brush_width,  display: "Brush Width", type: float, min: 0.005, max: 0.06, default: 0.022, group: "Look" }
  - { name: draw_frac,    display: "Draw Fraction", type: float, min: 0.3, max: 1.0, default: 0.8, group: "Motion" }
  - { name: intensity,    display: "Intensity",  type: float, min: 0.0, max: 1.5, default: 1.0,  group: "Look" }
  - { name: loop_seconds, display: "Loop (s)",   type: float, min: 1.0, max: 12.0, default: 6.0, group: "Motion" }

passes:
  - name: stroke
    shader: stroke.hlsl
    target: cs_5_0

outputs:
  - { name: "Stroke", pass: stroke }
