name: "Dada Control"
version: "0.1"
mode: generator
resolution: [256, 128]

# Master macro node — drive the whole scene from one place. Wire its control outputs
# to dada_layout (spread/explode) and dada_render (melt/sag) with ref() expressions.

buffers:
  - name: ctrl
    structured: true
    element_size: 32
    element_count: 1

parameters:
  - { name: melt_macro,    display: "Melt",    type: float, min: 0.0, max: 1.0, default: 0.22, group: "Macros" }
  - { name: sag_macro,     display: "Sag",     type: float, min: 0.0, max: 1.0, default: 0.18, group: "Macros" }
  - { name: spread_macro,  display: "Spread",  type: float, min: 0.3, max: 2.2, default: 1.0, group: "Macros" }
  - { name: explode_macro, display: "Explode", type: float, min: 0.0, max: 3.0, default: 0.0, group: "Macros" }

passes:
  - name: compute
    shader: compute.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:ctrl"
  - name: display
    shader: display.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:ctrl" }

control_outputs:
  - { name: melt,    buffer: ctrl, element: 0, field_offset: 0,  description: "Melt macro 0-1" }
  - { name: sag,     buffer: ctrl, element: 0, field_offset: 4,  description: "Sag macro 0-1" }
  - { name: spread,  buffer: ctrl, element: 0, field_offset: 8,  description: "Spread 0.3-2.2" }
  - { name: explode, buffer: ctrl, element: 0, field_offset: 12, description: "Explode 0-3" }

outputs:
  - { name: "Control", pass: display }
