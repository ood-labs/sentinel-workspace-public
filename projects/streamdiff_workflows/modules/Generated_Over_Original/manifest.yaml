name: "Generated Over Original"
version: "1.0"
mode: filter
resolution_source: "match:input"

inputs:
  - { name: "Original Footage", slot: 0, required: true }
  - { name: "Generated Image", slot: 1, required: true }
  - { name: "Original Matte", slot: 2, required: true }

viewport:
  hint: "Original-video matte cuts the generated dancer, then places it over the untouched clip."

parameters:
  - { name: foreground_opacity, display: "Generated Foreground", type: float, min: 0.0, max: 1.0, default: 1.0, group: "Composite" }
  - { name: edge_grow, display: "Edge Grow / Shrink", type: float, min: -12.0, max: 12.0, default: 0.0, group: "Matte Refinement" }
  - { name: edge_feather, display: "Edge Feather", type: float, min: 0.0, max: 12.0, default: 1.0, group: "Matte Refinement" }
  - { name: matte_gamma, display: "Edge Contrast", type: float, min: 0.25, max: 4.0, default: 1.0, group: "Matte Refinement" }

passes:
  - name: composite
    shader: composite.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "input:1" }
      - { slot: 2, source: "input:2" }
    output: output

outputs:
  - { name: "Composite", pass: composite }
