name: "Variant Switcher UI"
version: "1.0"
mode: filter
resolution: [1280, 720]
# IBM Plex Sans Condensed + IBM Plex Mono, SIL OFL 1.1 (_shared/type/IBM_PLEX_OFL.txt)
assets:
  - { name: type, type: texture, file: ../_shared/type/il_type.png, srgb: false }

panel:
  mode: canvas
  output: UI
  resolution: follow_panel

inputs:
  - { name: "Mux Program", slot: 0, required: true }

parameters:
  - { name: auto_mode, display: "Auto Cycle", type: bool, default: true, flags: button, group: "Switcher" }
  - { name: cycle_seconds, display: "Cycle Seconds", type: float, min: 1.0, max: 12.0, default: 4.0, group: "Switcher" }
  - { name: select_1, display: "Select 1", type: button, hidden: true }
  - { name: select_2, display: "Select 2", type: button, hidden: true }
  - { name: select_3, display: "Select 3", type: button, hidden: true }

buffers:
  - name: switcher_state
    structured: true
    element_size: 32
    element_count: 1
    persistent: true
  - { name: dl, structured: true, element_size: 16, element_count: 24577 }   # il_draw IL_DL_SIZE

state_buffers:
  - name: switcher_state
    max_elements: 1
    schema:
      - { name: selected, type: float }
      - { name: elapsed, type: float }
      - { name: auto_latch, type: float }
      - { name: one_latch, type: float }
      - { name: two_latch, type: float }
      - { name: three_latch, type: float }
      - { name: cycle_pulse, type: float }
      - { name: reserved, type: float }

viewport:
  hint: "AUTO cycles the three Mux inputs. Click 1, 2, or 3 for a direct selection."
  controls:
    - { id: auto_mode, kind: toggle, param: auto_mode, rect: [0.55, 0.025, 0.68, 0.105], label: "AUTO" }
    - { id: select_1, kind: button, param: select_1, rect: [0.70, 0.025, 0.78, 0.105], label: "1" }
    - { id: select_2, kind: button, param: select_2, rect: [0.80, 0.025, 0.88, 0.105], label: "2" }
    - { id: select_3, kind: button, param: select_3, rect: [0.90, 0.025, 0.98, 0.105], label: "3" }

passes:
  - name: update
    shader: state.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 1
    thread_group_y: 1
    output: "buffer:switcher_state"

  - name: render
    shader: render.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "input:0" }
      - { slot: 1, source: "buffer:switcher_state" }

  - name: layout
    shader: layout.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - {slot: 0, source: 'input:0'}
      - {slot: 1, source: 'buffer:switcher_state'}
    output: buffer:dl

  - name: ui
    shader: ui.hlsl
    target: cs_5_0
    thread_group_x: 16
    thread_group_y: 16
    inputs:
      - {slot: 0, source: buffer:dl}
      - {slot: 1, source: 'asset:type'}
      - {slot: 2, source: 'pass:render'}

outputs:
  - { name: "UI", pass: ui }

control_outputs:
  - { name: selected, buffer: switcher_state, element: 0, field_offset: 0, description: "Active Mux input, 0 through 2" }
  - { name: auto_active, buffer: switcher_state, element: 0, field_offset: 8, description: "1 while automatic cycling is active" }
