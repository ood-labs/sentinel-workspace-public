name: PHAGE / Program
version: '1.0'
mode: generator
resolution: [1920, 1080]
features: [camera]
viewport:
  hint: RMB look, WASD move, wheel speed
  interactions: [camera]
inputs:
  - {name: LED RGB, slot: 0}
data_inputs:
  - name: Pose
    slot: 0
    schema:
      - {name: position, type: float3}
      - {name: fixture_id, type: float}
      - {name: up, type: float3}
      - {name: pan, type: float}
      - {name: fwd, type: float3}
      - {name: tilt, type: float}
      - {name: target_pan, type: float}
      - {name: target_tilt, type: float}
      - {name: scale, type: float}
      - {name: active, type: float}
  - name: Optics
    slot: 1
    schema:
      - {name: position, type: float3}
      - {name: fixture_id, type: float}
      - {name: normal, type: float3}
      - {name: local_id, type: float}
      - {name: colour, type: float3}
      - {name: intensity, type: float}
      - {name: beam_tangent, type: float}
      - {name: field_tangent, type: float}
      - {name: reach, type: float}
      - {name: active, type: float}
      - {name: frost, type: float}
      - {name: padding, type: float3}
  - name: Bar Pieces
    slot: 2
    schema:
      - {name: a, type: float4}
      - {name: b, type: float4}
      - {name: n, type: float4}
      - {name: w, type: float4}
  - name: Structure
    slot: 3
    schema:
      - {name: a, type: float4}
      - {name: b, type: float4}
      - {name: c, type: float4}
      - {name: d, type: float4}
  - name: Venue
    slot: 4
    schema:
      - {name: value, type: float4}
  - name: Show State
    slot: 5
    schema:
      - {name: value, type: float4}
parameters:
  - {name: worklight, type: float, default: 0.15, min: 0, max: 4}
  - {name: exposure, type: float, default: 1.0, min: 0.1, max: 4}
  - {name: haze, type: float, default: 0.03, min: 0, max: 1}
  - {name: beam_gain, type: float, default: 10.000000, min: 0, max: 20}
  - {name: led_gain, type: float, default: 3.0, min: 0, max: 20}
  - {name: bloom, type: float, default: 0.12, min: 0, max: 1}
  - {name: sensor_white_start, type: float, default: 2.0, min: 0, max: 10}
  - {name: sensor_response, type: float, default: 0.16, min: 0, max: 1}
  - {name: streak_strength, type: float, default: 0.005, min: 0, max: 1}
  - {name: streak_length, type: float, default: 0.08, min: 0.01, max: 0.3}
  - {name: strobe_gain, type: float, default: 4.0, min: 0, max: 20}
  - {name: strobe_haze, label: Strobe haze scatter, type: float, default: 0.5, min: 0, max: 5}
  - {name: emitter_gain, type: float, default: 3.0, min: 0, max: 20}
  - {name: bar_glow, type: float, default: 1.0, min: 0, max: 10}
  - {name: glow_range, label: Bar glow range (m), type: float, default: 10.0, min: 3, max: 60}
  - {name: beam_falloff, label: Beam shaft falloff (1 = inverse square), type: float, default: 0.45, min: 0.2, max: 1}
  - {name: ring_haze, label: Mover ring haze, type: float, default: 0.35, min: 0, max: 2}
  - {name: crowd_bob, type: float, default: 1.0, min: 0, max: 3}
  - {name: volume_samples, type: int, default: 8, min: 4, max: 32}
buffers:
  - {name: sources, structured: true, element_size: 80, element_count: 352}
  - {name: lightgrid, structured: true, element_size: 4, element_count: 1044480}
passes:
  - name: sources
    shader: sources.hlsl
    target: cs_5_0
    dispatch: [6, 1, 1]
    inputs:
      - {slot: 0, source: 'data:1'}
    output: buffer:sources
  - name: lightgrid
    shader: lightgrid.hlsl
    target: cs_5_0
    dispatch: [120, 1, 1]
    inputs:
      - {slot: 0, source: 'buffer:sources'}
      - {slot: 1, source: 'data:4'}
    output: buffer:lightgrid
  - name: movers
    shader: movers.hlsl
    target: draw
    vertex_count: 1408512
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'data:0'}
      - {slot: 1, source: 'data:1'}
  - name: structure
    shader: structure.hlsl
    target: draw
    vertex_count: 953856
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'data:3'}
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: solids
    shader: solids.hlsl
    target: draw
    vertex_count: 13824
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'data:3'}
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: emitters
    shader: emitters.hlsl
    target: draw
    vertex_count: 36288
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'data:1'}
      - {slot: 1, source: 'data:2'}
      - {slot: 2, source: 'input:0'}
  - name: crowd
    shader: crowd.hlsl
    target: draw
    vertex_count: 552960
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 4, source: 'data:5'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: venue
    shader: venue.hlsl
    target: draw
    vertex_count: 9216
    topology: trianglelist
    depth: true
    depth_write: true
    cull: none
    format: RGBA16F
    inputs:
      - {slot: 1, source: 'buffer:sources'}
      - {slot: 2, source: 'data:4'}
      - {slot: 3, source: 'buffer:lightgrid'}
  - name: nearest
    shader: nearest.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'pass:movers'}
      - {slot: 1, source: 'pass:structure'}
      - {slot: 2, source: 'pass:solids'}
      - {slot: 3, source: 'pass:emitters'}
      - {slot: 4, source: 'pass:crowd'}
      - {slot: 5, source: 'pass:venue'}
  - name: volume
    shader: volume.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.5
    inputs:
      - {slot: 0, source: 'buffer:sources'}
      - {slot: 1, source: 'pass:nearest'}
      - {slot: 2, source: 'data:4'}
  - name: floor_reflections
    shader: floor_reflections.hlsl
    target: cs_5_0
    format: RGBA16F
    inputs:
      - {slot: 0, source: 'pass:nearest'}
      - {slot: 1, source: 'data:4'}
  - name: hdr_scene
    shader: hdr_scene.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 1
    inputs:
      - {slot: 0, source: 'pass:nearest'}
      - {slot: 1, source: 'pass:volume'}
      - {slot: 2, source: 'pass:floor_reflections'}
  - name: bloom_d0
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.5
    inputs:
      - {slot: 0, source: 'pass:hdr_scene'}
  - name: bloom_d1
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:bloom_d0'}
  - name: bloom_d2
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.125
    inputs:
      - {slot: 0, source: 'pass:bloom_d1'}
  - name: bloom_d3
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.0625
    inputs:
      - {slot: 0, source: 'pass:bloom_d2'}
  - name: bloom_d4
    shader: bloom_down.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.03125
    inputs:
      - {slot: 0, source: 'pass:bloom_d3'}
  - name: bloom_u3
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.0625
    inputs:
      - {slot: 0, source: 'pass:bloom_d4'}
      - {slot: 1, source: 'pass:bloom_d3'}
  - name: bloom_u2
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.125
    inputs:
      - {slot: 0, source: 'pass:bloom_u3'}
      - {slot: 1, source: 'pass:bloom_d2'}
  - name: bloom_u1
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:bloom_u2'}
      - {slot: 1, source: 'pass:bloom_d1'}
  - name: bloom_u0
    shader: bloom_up.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.5
    inputs:
      - {slot: 0, source: 'pass:bloom_u1'}
      - {slot: 1, source: 'pass:bloom_d0'}
  - name: streak_seed
    shader: streak_seed.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:bloom_d1'}
  - name: streaks
    shader: streaks.hlsl
    target: cs_5_0
    format: RGBA16F
    resolution_scale: 0.25
    inputs:
      - {slot: 0, source: 'pass:streak_seed'}
  - name: present
    shader: present.hlsl
    inputs:
      - {slot: 0, source: 'pass:hdr_scene'}
      - {slot: 1, source: 'pass:bloom_u0'}
      - {slot: 2, source: 'pass:streaks'}
outputs:
  - name: Program
    pass: present
data_outputs:
  - name: Atmosphere Sources
    buffer: sources
    schema:
      - {name: position, type: float3}
      - {name: fixture_id, type: float}
      - {name: normal, type: float3}
      - {name: local_id, type: float}
      - {name: colour, type: float3}
      - {name: intensity, type: float}
      - {name: beam_tangent, type: float}
      - {name: field_tangent, type: float}
      - {name: reach, type: float}
      - {name: active, type: float}
      - {name: frost, type: float}
      - {name: padding, type: float3}
