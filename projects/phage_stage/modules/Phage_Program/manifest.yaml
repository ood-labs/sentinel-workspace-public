  - {name: program, structured: true, element_size: 96, element_count: 616, persistent: true}
  - {name: dl, structured: true, element_size: 16, element_count: 24577}   # il_draw IL_DL_SIZE
passes:
  - name: program
    shader: program.hlsl
    target: cs_5_0
    dispatch: [616, 1, 1]
    output: buffer:program
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - {slot: 0, source: buffer:program}
  - name: layout
    shader: layout.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - {slot: 0, source: 'buffer:program'}
    output: buffer:dl
  - name: ui
    shader: ui.hlsl
    target: cs_5_0
    thread_group_x: 16
    thread_group_y: 16
    inputs:
      - {slot: 0, source: buffer:dl}
      - {slot: 1, source: 'asset:type'}
      - {slot: 2, source: 'pass:preview'}
data_outputs:
  - name: Fixture Program
    buffer: program
    schema:
      - {name: aim, type: float4}
      - {name: routing, type: float4}
      - {name: movement, type: float4}
      - {name: timing, type: float4}
      - {name: meta, type: float4}
      - {name: extra, type: float4}
outputs:
  - name: Programmer Sheet
    pass: ui
