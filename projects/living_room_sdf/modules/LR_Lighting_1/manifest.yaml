name: "Living Room Lighting Extractor"
version: "1.0"
mode: generator
resolution: [480, 270]

data_inputs:
  - name: "Architecture PNodes"
    slot: 0
    element_size: 48
    element_count: 96
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float }
      - { name: kind_id, type: float }
      - { name: seed, type: float }
      - { name: yaw, type: float }
      - { name: height, type: float }
      - { name: width, type: float }
      - { name: depth, type: float }
      - { name: dir, type: float, count: 2 }
  - name: "Furnishings PNodes"
    slot: 1
    element_size: 48
    element_count: 96
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float }
      - { name: kind_id, type: float }
      - { name: seed, type: float }
      - { name: yaw, type: float }
      - { name: height, type: float }
      - { name: width, type: float }
      - { name: depth, type: float }
      - { name: dir, type: float, count: 2 }

parameters:
  - { name: daylight_intensity, display: "Window Daylight", type: float, min: 0.0, max: 3.0, default: 1.35, group: "Environment" }
  - { name: practical_intensity, display: "Practical Lamps", type: float, min: 0.0, max: 4.0, default: 1.55, group: "Practical Lights" }
  - { name: ambient_fill, display: "Ambient Fill", type: float, min: 0.0, max: 1.5, default: 0.42, group: "Environment" }
  - { name: shadow_softness, display: "Shadow Softness", type: float, min: 0.02, max: 1.0, default: 0.32, group: "Shadows" }

buffers:
  - name: lights
    structured: true
    element_size: 64
    element_count: 6

passes:
  - name: emit
    shader: emit_lights.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 8
    thread_group_y: 1
    output: "buffer:lights"
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:lights" }

outputs:
  - { name: "Lighting Preview", pass: preview }

data_outputs:
  - name: "Light Records"
    buffer: lights
    schema:
      - { name: position, type: float, count: 3 }
      - { name: type_id, type: float }
      - { name: direction, type: float, count: 3 }
      - { name: range, type: float }
      - { name: color, type: float, count: 3 }
      - { name: intensity, type: float }
      - { name: size, type: float, count: 2 }
      - { name: softness, type: float }
      - { name: enabled, type: float }
