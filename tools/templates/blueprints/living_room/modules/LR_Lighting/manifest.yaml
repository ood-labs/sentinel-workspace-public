name: "Living Room Lighting Desk"
version: "2.0"
mode: generator
resolution: [960, 540]
# IBM Plex Sans Condensed + IBM Plex Mono, SIL OFL 1.1 (_shared/type/IBM_PLEX_OFL.txt)
assets:
  - { name: type, type: texture, file: ../_shared/type/il_type.png, srgb: false }

panel:
  mode: canvas
  output: "Lighting Preview"
  resolution: follow_panel

data_inputs:
  - name: "Architecture PNodes"
    slot: 0
    element_size: 48
    element_count: 96
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float }
      - { name: kind_id, type: float }
      - { name: seed, type: float }
      - { name: yaw, type: float }
      - { name: height, type: float }
      - { name: width, type: float }
      - { name: depth, type: float }
      - { name: dir, type: float, count: 2 }
  - name: "Furnishings PNodes"
    slot: 1
    element_size: 48
    element_count: 96
    schema:
      - { name: position, type: float, count: 3 }
      - { name: scale, type: float }
      - { name: kind_id, type: float }
      - { name: seed, type: float }
      - { name: yaw, type: float }
      - { name: height, type: float }
      - { name: width, type: float }
      - { name: depth, type: float }
      - { name: dir, type: float, count: 2 }

parameters:
  - { name: daylight_intensity, display: "Window Daylight", type: float, min: 0.0, max: 3.0, default: 1.10, group: "Environment" }
  - { name: practical_intensity, display: "Practical Lamps", type: float, min: 0.0, max: 4.0, default: 1.25, group: "Practical Lights" }
  - { name: ambient_fill, display: "Ambient Fill", type: float, min: 0.0, max: 1.5, default: 0.55, group: "Environment" }
  - { name: shadow_softness, display: "Shadow Softness", type: float, min: 0.02, max: 1.0, default: 0.32, group: "Shadows" }

viewport:
  hint: "Lighting desk with live architecture/furnishing context and direct daylight, practical, ambient, and shadow controls. Hover a light to inspect it. No pan or zoom."
  interactions: [events]
  input:
    pointer: [left]
  controls:
    - { id: daylight, kind: slider, param: daylight_intensity, rect: [0.692, 0.320, 0.948, 0.385], label: "Window Daylight" }
    - { id: practical, kind: slider, param: practical_intensity, rect: [0.692, 0.460, 0.948, 0.525], label: "Practical Lamps" }
    - { id: ambient, kind: slider, param: ambient_fill, rect: [0.692, 0.600, 0.948, 0.665], label: "Ambient Fill" }
    - { id: softness, kind: slider, param: shadow_softness, rect: [0.692, 0.740, 0.948, 0.805], label: "Shadow Softness" }

buffers:
  - name: lights
    structured: true
    element_size: 64
    element_count: 6
  - { name: dl, structured: true, element_size: 16, element_count: 24577 }   # il_draw IL_DL_SIZE

passes:
  - name: emit
    shader: emit_lights.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 8
    thread_group_y: 1
    output: "buffer:lights"
    inputs:
      - { slot: 0, source: "data:0" }
      - { slot: 1, source: "data:1" }
  - name: preview
    shader: preview.hlsl
    target: cs_5_0
    inputs:
      - { slot: 0, source: "buffer:lights" }
      - { slot: 1, source: "data:0" }
      - { slot: 2, source: "data:1" }
  - name: layout
    shader: layout.hlsl
    target: cs_5_0
    dispatch: [1, 1, 1]
    thread_group_x: 64
    thread_group_y: 1
    inputs:
      - { slot: 0, source: "buffer:lights" }
      - { slot: 1, source: "data:0" }
      - { slot: 2, source: "data:1" }
    output: "buffer:dl"
  - name: ui
    shader: ui.hlsl
    target: cs_5_0
    thread_group_x: 16
    thread_group_y: 16
    inputs:
      - { slot: 0, source: "buffer:dl" }
      - { slot: 1, source: "asset:type" }
      - { slot: 2, source: "pass:preview" }

outputs:
  - { name: "Lighting Preview", pass: ui }

data_outputs:
  - name: "Light Records"
    buffer: lights
    schema:
      - { name: position, type: float, count: 3 }
      - { name: type_id, type: float }
      - { name: direction, type: float, count: 3 }
      - { name: range, type: float }
      - { name: color, type: float, count: 3 }
      - { name: intensity, type: float }
      - { name: size, type: float, count: 2 }
      - { name: softness, type: float }
      - { name: enabled, type: float }
